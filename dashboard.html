<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · Discovery Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
/* ----------- ESTILOS PREMIUM DISCOVERY PETS ----------- */
:root{
  --bg1:#f6fbff;
  --bg2:#eaf7ff;
  --card:#ffffff;
  --accent:#00bcd4;
  --muted:#64748b;
  --radius:16px;
  --shadow-lg:0 10px 30px rgba(0,188,212,0.15);
  --shadow-md:0 6px 18px rgba(0,188,212,0.1);
}

*{box-sizing:border-box;font-family:'Inter',system-ui,Segoe UI,Roboto,Arial,sans-serif}
html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#0f172a}

.app{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:28px;
  padding:32px;
  min-height:100vh;
  align-items:start;
}

.sidebar{
  position:sticky;
  top:32px;
  padding:20px;
  border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.7));
  box-shadow:var(--shadow-lg);
  backdrop-filter:blur(6px);
}

.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px;}
.logo{
  width:48px;height:48px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#5dd8e6);
  box-shadow:0 8px 20px rgba(0,188,212,0.25);
  display:flex;align-items:center;justify-content:center;
  color:white;font-weight:800;font-size:18px;
}
.brand h1{font-size:16px;margin:0}
.muted{color:var(--muted);font-size:13px}

.nav{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
.menu-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;
  border:none;background:transparent;color:#0f172a;
  cursor:pointer;transition:all .18s ease;
}
.menu-btn:hover{transform:translateY(-3px)}
.menu-btn.activo{
  background:linear-gradient(90deg, rgba(0,188,212,0.12), rgba(0,188,212,0.06));
  box-shadow:var(--shadow-md);
  border-left:3px solid var(--accent);
}

.logout{
  margin-top:18px;padding:10px;
  border-radius:12px;
  background:transparent;
  border:1px solid rgba(15,23,42,0.08);
  cursor:pointer;
}

.main{
  padding:28px;border-radius:20px;
  background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.82));
  box-shadow:var(--shadow-lg);
  backdrop-filter:blur(4px);
}

.header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
}
.header h2{margin:0;font-weight:700;color:#04263f}

.search-box{display:flex;gap:10px;align-items:center;}
input[type="search"]{
  padding:10px 14px;border-radius:12px;
  border:1px solid rgba(10,20,30,0.06);
  min-width:280px;box-shadow:var(--shadow-md);
}

.btn{
  padding:8px 12px;border-radius:10px;border:none;
  cursor:pointer;background:var(--accent);
  color:white;font-weight:600;
  box-shadow:0 6px 18px rgba(0,188,212,0.15);
}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid rgba(0,188,212,0.25)}

@media(max-width:980px){
  .app{grid-template-columns:1fr;padding:18px}
}

/* ----------- FORMULARIOS Y TABLAS ----------- */
.seccion-activa{display:block;}
section{display:none;}
h3{margin-bottom:14px;color:#04263f;font-size:18px}

.formulario{
  display:flex;flex-direction:column;gap:10px;
  background:rgba(255,255,255,0.8);
  border-radius:16px;padding:16px;
  box-shadow:var(--shadow-md);
  margin-bottom:20px;
}

.form-row{display:flex;gap:10px;flex-wrap:wrap}
.form-row input{
  flex:1;padding:10px 12px;border-radius:10px;
  border:1px solid rgba(0,0,0,0.1);
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.05);
}

.tabla-container{overflow-x:auto;background:rgba(255,255,255,0.85);
  border-radius:16px;padding:10px;box-shadow:var(--shadow-md);
}

table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid rgba(0,0,0,0.05)}
th{color:#0f172a;font-weight:700}
td button{margin-right:6px;padding:4px 8px;border-radius:6px;border:none;cursor:pointer}
.btn-editar{background:#00bcd4;color:white}
.btn-eliminar{background:#e53935;color:white}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">DP</div>
      <div>
        <h1>Discovery Pets</h1>
        <div class="muted">Panel administrativo</div>
      </div>
    </div>

    <nav class="nav">
      <button class="menu-btn activo" data-target="seccion-proveedores">🏢 Proveedores</button>
      <button class="menu-btn" data-target="seccion-productos">📦 Productos</button>
      <button class="menu-btn" data-target="seccion-facturas">🧾 Facturas</button>
    </nav>

    <button id="logoutBtn" class="logout">Cerrar sesión</button>
  </aside>

  <main class="main">
    <div class="header">
      <h2>Dashboard · Discovery Pets</h2>
      <div class="search-box">
        <input id="buscadorFactura" type="search" placeholder="Buscar facturas por producto o proveedor (Enter)">
        <button class="btn secondary" id="btnRefresh">Restablecer</button>
      </div>
    </div>

    <!-- =================== PROVEEDORES =================== -->
    <section id="seccion-proveedores" class="seccion-activa">
      <h3>Registro de Proveedores</h3>
      <form id="formProveedor" class="formulario">
        <div class="form-row">
          <input type="text" id="provNombre" placeholder="Nombre del proveedor" required>
          <input type="text" id="provRuc" placeholder="RUC" maxlength="11" required>
        </div>
        <div class="form-row">
          <input type="text" id="provDireccion" placeholder="Dirección" required>
          <input type="tel" id="provTelefono" placeholder="Teléfono (opcional)">
        </div>
        <div class="form-row">
          <input type="text" id="provNumero" placeholder="Número adicional (opcional)">
          <button type="submit" class="btn">Registrar proveedor</button>
        </div>
      </form>

      <div class="tabla-container">
        <table id="tablaProveedores">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>RUC</th>
              <th>Dirección</th>
              <th>Teléfono</th>
              <th>Número opcional</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- =================== PRODUCTOS =================== -->
    <section id="seccion-productos">
      <h3>Gestión de Productos</h3>
      <form id="formProducto" class="formulario">
        <div class="form-row">
          <input type="text" id="prodNombre" placeholder="Nombre del producto" required>
          <input type="number" id="prodPrecio" placeholder="Precio (S/.)" step="0.01" required>
        </div>
        <div class="form-row">
          <input type="number" id="prodCantidad" placeholder="Cantidad" required>
          <input type="text" id="prodDescripcion" placeholder="Descripción (opcional)">
          <button type="submit" class="btn">Registrar producto</button>
        </div>
      </form>

      <div class="tabla-container">
        <table id="tablaProductos">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Cantidad</th>
              <th>Descripción</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- =================== FACTURAS =================== -->
    <section id="seccion-facturas">
      <h3>Registro de Facturas</h3>
      <form id="formFactura" class="formulario">
        <div class="form-row">
          <input type="text" id="factProveedor" placeholder="Proveedor" required>
          <input type="text" id="factProducto" placeholder="Producto" required>
        </div>
        <div class="form-row">
          <input type="number" id="factCantidad" placeholder="Cantidad" required>
          <input type="number" id="factTotal" placeholder="Total (S/.)" step="0.01" required>
          <button type="submit" class="btn">Registrar factura</button>
        </div>
      </form>

      <div class="tabla-container">
        <table id="tablaFacturas">
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Total (S/.)</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="dashboard.js"></script>
</body>
</html>
