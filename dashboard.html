<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Dashboard</title>
<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="min-height:100vh; background: linear-gradient(145deg, #ff6fcf, #ff87d6); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

<header class="d-flex justify-content-between align-items-center p-3 text-white" style="background-color:#d91db1; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
    <h1>🐾 Discovery Pets</h1>
    <button id="logoutBtn" class="btn btn-danger">Cerrar sesión</button>
</header>

<div class="d-flex flex-wrap" style="min-height:90vh;">
    <nav class="d-flex flex-column p-3" style="width:220px; background-color:#b60fa0; color:white;">
        <button class="btn btn-outline-light mb-2 nav-btn active" data-section="proveedores">🏪 Proveedores</button>
        <button class="btn btn-outline-light mb-2 nav-btn" data-section="facturas">📑 Facturas</button>
        <button class="btn btn-outline-light mb-2 nav-btn" data-section="gastos">💰 Gastos</button>
        <button class="btn btn-outline-light mb-2 nav-btn" data-section="servicios">🛠 Servicios</button>
    </nav>

    <main class="flex-grow-1 p-4 overflow-auto">
        <!-- Proveedores -->
        <section id="proveedores" class="content-section active">
            <h2 class="text-white">Registro de Proveedores</h2>
            <form id="formProveedor" class="mb-3 p-3 rounded" style="background:white;">
                <input id="rucProv" class="form-control mb-2" placeholder="RUC" required>
                <input id="nombreProv" class="form-control mb-2" placeholder="Nombre" required>
                <input id="productoProv" class="form-control mb-2" placeholder="Producto" required>
                <input id="direccionProv" class="form-control mb-2" placeholder="Dirección" required>
                <button type="submit" class="btn btn-primary w-100">Agregar</button>
            </form>
            <table class="table table-hover table-striped">
                <thead class="table-dark">
                    <tr><th>RUC</th><th>Nombre</th><th>Producto</th><th>Dirección</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaProveedores"></tbody>
            </table>
        </section>

        <!-- Facturas -->
        <section id="facturas" class="content-section">
            <h2 class="text-white">Registro de Facturas</h2>
            <form id="formFactura" class="mb-3 p-3 rounded" style="background:white;">
                <input id="proveedorFactura" class="form-control mb-2" placeholder="Proveedor" required>
                <input id="tipoFactura" class="form-control mb-2" placeholder="Tipo de factura" required>
                <input id="montoFactura" class="form-control mb-2" type="number" placeholder="Monto" required>
                <input id="monedaFactura" class="form-control mb-2" value="S/." required>
                <input id="fechaFactura" class="form-control mb-2" type="date" required>
                <input id="descFactura" class="form-control mb-2" placeholder="Descripción">
                <button type="submit" class="btn btn-primary w-100">Agregar</button>
            </form>
            <table class="table table-hover table-striped">
                <thead class="table-dark">
                    <tr><th>Proveedor</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Descripción</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaFacturas"></tbody>
            </table>
        </section>

        <!-- Gastos -->
        <section id="gastos" class="content-section">
            <h2 class="text-white">Registro de Gastos</h2>
            <form id="formGasto" class="mb-3 p-3 rounded" style="background:white;">
                <input id="nombreGasto" class="form-control mb-2" placeholder="Nombre" required>
                <input id="tipoGasto" class="form-control mb-2" placeholder="Tipo" required>
                <input id="montoGasto" class="form-control mb-2" type="number" placeholder="Monto" required>
                <input id="fechaGasto" class="form-control mb-2" type="date" required>
                <button type="submit" class="btn btn-primary w-100">Agregar</button>
            </form>
            <table class="table table-hover table-striped">
                <thead class="table-dark">
                    <tr><th>Nombre</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaGastos"></tbody>
            </table>
        </section>

        <!-- Servicios -->
        <section id="servicios" class="content-section">
            <h2 class="text-white">Registro de Servicios</h2>
            <form id="formServicio" class="mb-3 p-3 rounded" style="background:white;">
                <input id="nombreServ" class="form-control mb-2" placeholder="Nombre" required>
                <input id="precioServ" class="form-control mb-2" type="number" placeholder="Precio" required>
                <input id="fechaServ" class="form-control mb-2" type="date" required>
                <input id="descServ" class="form-control mb-2" placeholder="Descripción">
                <button type="submit" class="btn btn-primary w-100">Agregar</button>
            </form>
            <table class="table table-hover table-striped">
                <thead class="table-dark">
                    <tr><th>Nombre</th><th>Precio</th><th>Fecha</th><th>Descripción</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaServicios"></tbody>
            </table>
        </section>
    </main>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
