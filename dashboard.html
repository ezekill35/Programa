<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="firebase.js"></script>
  <script src="dashboard.js" defer></script>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <h2>🐶 Discovery Pets</h2>
    </div>
    <nav id="dashboard-menu">
      <button class="nav-link active" onclick="showSection('home')">🏠 Dashboard</button>
      <button class="nav-link" onclick="showSection('products')">📦 Productos</button>
      <button class="nav-link" onclick="showSection('providers')">👥 Proveedores</button>
      <button class="nav-link" onclick="showSection('invoices')">🛒 Compras</button>
      <button class="nav-link" onclick="showSection('sales')">💰 Ventas</button>
      <button class="nav-link" onclick="showSection('expenses')">📄 Gastos</button>
      <button class="nav-link logout-btn" onclick="logout()">🔓 Cerrar sesión</button>
    </nav>
  </aside>

  <main id="main-content">
    <!-- Dashboard Home -->
    <section id="home-section" class="content-section active">
      <h2>Resumen Rápido</h2>
      <div class="cards-grid">
        <div class="card"><h3>Total Productos</h3><p id="total-products">0</p></div>
        <div class="card"><h3>Stock Bajo (&lt; 10)</h3><p id="low-stock">0</p></div>
        <div class="card"><h3>Total Proveedores</h3><p id="total-providers">0</p></div>
        <div class="card"><h3>Ventas del Mes</h3><p id="monthly-sales">S/ 0.00</p></div>
      </div>
    </section>

    <!-- Productos -->
    <section id="products-section" class="content-section">
      <h2>📦 Productos</h2>
      <form id="add-product-form" onsubmit="event.preventDefault(); addProduct();">
        <input type="text" id="product-sku" placeholder="Código / SKU *" required>
        <input type="text" id="product-name" placeholder="Nombre del producto">
        <input type="text" id="product-brand" placeholder="Marca">
        <input type="number" id="product-price" placeholder="Precio Venta S/ *" required>
        <input type="number" id="product-stock" placeholder="Stock Inicial *" required>
        <button class="primary-btn" type="submit">Agregar Producto</button>
      </form>
      <div id="products-list"></div>
    </section>

    <!-- Proveedores -->
    <section id="providers-section" class="content-section">
      <h2>👥 Proveedores</h2>
      <form id="add-provider-form" onsubmit="event.preventDefault(); addProvider();">
        <input type="text" id="provider-contact" placeholder="Nombre del Contacto *" required>
        <input type="text" id="provider-name" placeholder="Nombre Comercial *" required>
        <input type="text" id="provider-phone" placeholder="Teléfono *" required>
        <input type="text" id="provider-fax" placeholder="Fax (Opcional)">
        <input type="text" id="provider-products" placeholder="Tipo de Producto">
        <button class="primary-btn" type="submit">Agregar Proveedor</button>
      </form>
      <div id="providers-list"></div>
    </section>

    <!-- Facturas / Compras -->
    <section id="invoices-section" class="content-section">
      <h2>🛒 Registrar Factura de Compra</h2>
      <form id="add-invoice-form" onsubmit="event.preventDefault(); addInvoice();">
        <input type="text" id="invoice-ruc" placeholder="RUC Factura *" required>
        <input type="text" id="invoice-number" placeholder="Número de Factura *" required>
        <select id="invoice-provider" required>
          <option value="">Seleccione un proveedor</option>
        </select>
        <input type="date" id="invoice-date" required>
        <input type="number" id="invoice-total" placeholder="Total S/ *" required>
        <button class="primary-btn" type="submit">Registrar Factura</button>
      </form>
      <div id="invoices-list"></div>
    </section>

    <!-- Ventas -->
    <section id="sales-section" class="content-section">
      <h2>💰 Registrar Venta</h2>
      <form id="add-sale-form" onsubmit="event.preventDefault(); addSale();">
        <input type="text" id="sale-client" placeholder="Cliente *" required>
        <input type="number" id="sale-total" placeholder="Total Venta S/ *" required>
        <button class="primary-btn" type="submit">Registrar Venta</button>
      </form>
      <div id="sales-list"></div>
    </section>

    <!-- Gastos -->
    <section id="expenses-section" class="content-section">
      <h2>📄 Registrar Gasto</h2>
      <form id="add-expense-form" onsubmit="event.preventDefault(); addExpense();">
        <input type="text" id="expense-description" placeholder="Descripción *" required>
        <input type="number" id="expense-amount" placeholder="Monto S/ *" required>
        <input type="date" id="expense-date" required>
        <button class="primary-btn" type="submit">Registrar Gasto</button>
      </form>
      <div id="expenses-list"></div>
    </section>
  </main>
</body>
</html>
