<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets · Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{font-family: 'Inter', sans-serif; background:#f5f6fa; color:#2f3640;}
.navbar{background:#0f4c75; color:white;}
.navbar a{color:white; margin-right:15px; text-decoration:none;}
.navbar a.activo{font-weight:bold; border-bottom:2px solid #00b7c2;}
.seccion{display:none; padding:20px; background:white; margin:20px; border-radius:10px; box-shadow:0 4px 6px rgba(0,0,0,0.1);}
.seccion.activa{display:block;}
.table td, .table th{vertical-align:middle;}
.btn-accion{margin:0 2px; cursor:pointer;}
.link-info{color:#0f4c75; cursor:pointer; text-decoration:underline;}
.modal{position:fixed; top:0; left:0; width:100%; height:100%; display:none; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;}
.modal[open]{display:flex;}
.modal-content{background:white; padding:20px; border-radius:10px; width:90%; max-width:500px; max-height:90%; overflow:auto;}
.resultado-item{padding:5px 10px; cursor:pointer; border-bottom:1px solid #ccc;}
.resultado-item:hover{background:#f0f0f0;}
</style>
</head>
<body>

<nav class="navbar d-flex align-items-center p-3">
  <a href="#" class="nav-btn activo" data-target="proveedores">Proveedores</a>
  <a href="#" class="nav-btn" data-target="productos">Productos</a>
  <a href="#" class="nav-btn" data-target="facturas">Facturas</a>
  <button class="btn btn-danger ms-auto" id="btnCerrarSesion">Cerrar sesión</button>
</nav>

<div class="seccion activa" id="proveedores">
  <h3>Registrar Proveedor</h3>
  <form id="formProveedor" class="mb-3">
    <div class="d-flex gap-2 mb-2">
      <select id="tipoDocumentoProveedor" class="form-control" required>
        <option value="">Tipo de Documento</option>
        <option value="RUC">RUC</option>
        <option value="DNI">DNI</option>
        <option value="Pasaporte">Pasaporte</option>
      </select>
      <input type="text" id="numeroDocumentoProveedor" placeholder="Número de documento" class="form-control" required>
    </div>
    <input type="text" id="nombreProveedor" placeholder="Nombre" class="form-control mb-2" required>
    <input type="text" id="direccionProveedor" placeholder="Dirección" class="form-control mb-2">
    <input type="text" id="telefonoProveedor" placeholder="Teléfono" class="form-control mb-2">
    <button class="btn btn-primary">Registrar</button>
  </form>

  <h4>Lista de Proveedores (<span id="countProveedores">0</span>)</h4>
  <table class="table table-striped">
    <thead>
      <tr><th>Documento</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr>
    </thead>
    <tbody id="tablaProveedores"></tbody>
  </table>
</div>

<div class="seccion" id="productos">
  <h3>Registrar Producto</h3>
  <form id="formProducto" class="mb-3">
    <input type="text" id="nombreProducto" placeholder="Nombre" class="form-control mb-2" required>
    <input type="number" id="cantidadPresentacion" placeholder="Cantidad" class="form-control mb-2" required>
    <input type="number" step="0.01" id="precioProducto" placeholder="Precio" class="form-control mb-2" required>
    <select id="tipoMoneda" class="form-control mb-2">
      <option value="soles">Soles</option>
      <option value="dolares">Dólares</option>
    </select>
    <input type="text" id="descripcionProducto" placeholder="Descripción" class="form-control mb-2">
    <button class="btn btn-primary">Registrar</button>
  </form>

  <h4>Lista de Productos (<span id="countProductos">0</span>)</h4>
  <table class="table table-striped">
    <thead>
      <tr><th>Nombre</th><th>Cantidad</th><th>Precio</th><th>Descripción</th><th>Acciones</th></tr>
    </thead>
    <tbody id="tablaProductos"></tbody>
  </table>
</div>

<div class="seccion" id="facturas">
  <h3>Registrar Factura</h3>
  <input type="text" id="searchInput" placeholder="Buscar por producto..." class="form-control mb-2">
  <div id="searchResults" class="mb-2"></div>

  <form id="formFactura" class="mb-3">
    <input type="text" id="idFactura" placeholder="ID Factura" class="form-control mb-2" required>
    <input type="date" id="fechaFactura" class="form-control mb-2" required>
    <select id="proveedorFactura" class="form-control mb-2" required></select>
    <select id="productoFactura" class="form-control mb-2" required></select>
    <input type="number" step="0.01" id="montoFactura" placeholder="Monto" class="form-control mb-2" required>
    <select id="tipoFactura" class="form-control mb-2">
      <option value="contado">Contado</option>
      <option value="credito">Crédito</option>
    </select>
    <button class="btn btn-primary">Registrar</button>
  </form>

  <h4>Lista de Facturas (<span id="countFacturas">0</span>)</h4>
  <table class="table table-striped">
    <thead>
      <tr><th>ID</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Acciones</th></tr>
    </thead>
    <tbody id="tablaFacturas"></tbody>
  </table>
</div>

<!-- MODALES -->
<dialog class="modal" id="modalFactura">
  <div class="modal-content">
    <button class="btn btn-secondary btn-sm mb-2" id="cerrarModalFactura">Cerrar</button>
    <div id="modalFacturaBody"></div>
  </div>
</dialog>

<dialog class="modal" id="modalExtra">
  <div class="modal-content">
    <button class="btn btn-secondary btn-sm mb-2" id="cerrarModalExtra">Cerrar</button>
    <div id="modalExtraBody"></div>
  </div>
</dialog>

<dialog class="modal" id="modalEditar">
  <div class="modal-content">
    <button class="btn btn-secondary btn-sm mb-2" id="cerrarModalEditar">Cerrar</button>
    <div id="modalEditarBody"></div>
  </div>
</dialog>

<script type="module" src="dashboard.js"></script>
</body>
</html>
