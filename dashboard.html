<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo"><i>🐶</i> Discovery Pets</div>
      <ul>
        <li id="menuProveedor" class="active">Proveedor</li>
        <li id="menuFactura">Factura</li>
        <li id="menuGastos">Gastos</li>
        <li id="menuServicio">Servicio</li>
      </ul>
      <button id="btnLogout">Cerrar Sesión</button>
    </div>

    <!-- Contenido -->
    <div class="content">
      <h1 id="tituloSeccion">Proveedor</h1>
      <div id="contenidoSeccion">

        <!-- Formulario y tabla Proveedor -->
        <div id="seccionProveedor">
          <div class="formulario">
            <input type="text" id="provRuc" placeholder="RUC">
            <input type="text" id="provNombre" placeholder="Nombre">
            <input type="text" id="provDireccion" placeholder="Dirección">
            <button id="btnAgregarProveedor">Agregar</button>
          </div>
          <input type="text" id="buscarProveedor" placeholder="Buscar proveedor por RUC o Nombre">
          <table>
            <thead>
              <tr>
                <th>RUC</th>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tablaProveedor"></tbody>
          </table>
        </div>

        <!-- Formulario y tabla Factura -->
        <div id="seccionFactura" class="hidden">
          <div class="formulario">
            <input type="text" id="factRuc" placeholder="RUC Proveedor">
            <input type="text" id="factDescripcion" placeholder="Descripción">
            <input type="date" id="factFecha">
            <button id="btnAgregarFactura">Agregar</button>
          </div>
          <input type="text" id="buscarFactura" placeholder="Buscar factura por RUC o descripción">
          <table>
            <thead>
              <tr>
                <th>RUC</th>
                <th>Descripción</th>
                <th>Fecha</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tablaFactura"></tbody>
          </table>
        </div>

        <!-- Formulario y tabla Gastos -->
        <div id="seccionGastos" class="hidden">
          <div class="formulario">
            <input type="text" id="gastoDescripcion" placeholder="Descripción Gasto">
            <input type="number" id="gastoMonto" placeholder="Monto">
            <input type="date" id="gastoFecha">
            <button id="btnAgregarGasto">Agregar</button>
          </div>
          <input type="text" id="buscarGasto" placeholder="Buscar gasto por descripción">
          <table>
            <thead>
              <tr>
                <th>Descripción</th>
                <th>Monto</th>
                <th>Fecha</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tablaGastos"></tbody>
          </table>
        </div>

        <!-- Formulario y tabla Servicio -->
        <div id="seccionServicio" class="hidden">
          <div class="formulario">
            <input type="text" id="servDescripcion" placeholder="Descripción Servicio">
            <input type="date" id="servFecha">
            <button id="btnAgregarServicio">Agregar</button>
          </div>
          <input type="text" id="buscarServicio" placeholder="Buscar servicio por descripción">
          <table>
            <thead>
              <tr>
                <th>Descripción</th>
                <th>Fecha</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tablaServicio"></tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
