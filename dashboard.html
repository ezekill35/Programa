<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐶 Discovery Pets - Dashboard</title>
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<header class="dashboard-header">
  <h1>🐶 Discovery Pets</h1>
  <p>Gestión integral de tu tienda de mascotas 🐾</p>
  <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
</header>

<nav class="dashboard-nav">
  <button onclick="showSection('productos')">📦 Productos</button>
  <button onclick="showSection('proveedores')">👥 Proveedores</button>
  <button onclick="showSection('compras')">🛒 Facturas</button>
  <button onclick="showSection('ventas')">💰 Ventas</button>
  <button onclick="showSection('gastos')">📄 Gastos</button>
</nav>

<main class="dashboard-main">

  <!-- Productos -->
  <section id="productos-section" class="content-section active productos-color">
    <h2>📦 Productos</h2>
    <div class="dashboard-grid">
      <div class="card form-card">
        <h3>➕ Agregar Nuevo Producto</h3>
        <form id="form-producto" onsubmit="event.preventDefault(); agregarProducto();">
          <div class="form-group"><label>Código / SKU (*)</label><input type="text" id="producto-sku" required></div>
          <div class="form-group"><label>Nombre (*)</label><input type="text" id="producto-nombre" required></div>
          <div class="form-group"><label>Marca</label><input type="text" id="producto-marca"></div>
          <div class="form-group"><label>Precio S/ (*)</label><input type="number" id="producto-precio" step="0.01" required></div>
          <div class="form-group"><label>Stock Inicial (*)</label><input type="number" id="producto-stock" required></div>
          <div class="form-group"><label>Categoría</label><input type="text" id="producto-categoria"></div>
          <button type="submit" class="primary-btn">Agregar Producto</button>
        </form>
      </div>
      <div class="card list-card">
        <h3>🔍 Productos Registrados</h3>
        <div id="lista-productos" class="list-items"></div>
      </div>
    </div>
  </section>

  <!-- Proveedores -->
  <section id="proveedores-section" class="content-section proveedores-color">
    <h2>👥 Proveedores</h2>
    <div class="dashboard-grid">
      <div class="card form-card">
        <h3>➕ Agregar Nuevo Proveedor</h3>
        <form id="form-proveedor" onsubmit="event.preventDefault(); agregarProveedor();">
          <div class="form-group"><label>RUC (*)</label><input type="text" id="proveedor-ruc" required></div>
          <div class="form-group"><label>Nombre Comercial (*)</label><input type="text" id="proveedor-nombre" required></div>
          <div class="form-group"><label>Contacto (*)</label><input type="text" id="proveedor-contacto" required></div>
          <div class="form-group"><label>Teléfono (*)</label><input type="text" id="proveedor-telefono" required></div>
          <div class="form-group"><label>Fax</label><input type="text" id="proveedor-fax"></div>
          <div class="form-group"><label>Dirección</label><input type="text" id="proveedor-direccion"></div>
          <div class="form-group"><label>Tipo de Producto</label><input type="text" id="proveedor-productos" placeholder="Ej: Alimento Seco, Juguetes"></div>
          <button type="submit" class="primary-btn">Agregar Proveedor</button>
        </form>
      </div>
      <div class="card list-card">
        <h3>👥 Proveedores Registrados</h3>
        <div id="lista-proveedores" class="list-items"></div>
      </div>
    </div>
  </section>

  <!-- Compras / Facturas -->
  <section id="compras-section" class="content-section compras-color">
    <h2>🛒 Facturas</h2>
    <div class="dashboard-grid">
      <div class="card form-card">
        <h3>➕ Registrar Factura</h3>
        <form id="form-factura" onsubmit="event.preventDefault(); agregarFactura();">
          <div class="form-group"><label>RUC Proveedor (*)</label>
            <select id="factura-ruc" required></select>
          </div>
          <div class="form-group"><label>Nombre del Producto (*)</label><input type="text" id="factura-producto" required></div>
          <div class="form-group"><label>Desea registrarlo?</label>
            <select id="factura-desea" required>
              <option value="">Seleccione</option>
              <option value="si">Sí</option>
              <option value="no">No</option>
            </select>
          </div>
          <div class="form-group"><label>Cantidad (*)</label><input type="number" id="factura-cantidad" required></div>
          <div class="form-group"><label>Precio S/ (*)</label><input type="number" id="factura-precio" step="0.01" required></div>
          <div class="form-group"><label>Fecha (*)</label><input type="date" id="factura-fecha" required></div>
          <button type="submit" class="primary-btn">Registrar Factura</button>
        </form>
      </div>
      <div class="card list-card">
        <h3>📄 Facturas Registradas</h3>
        <div id="lista-facturas" class="list-items"></div>
      </div>
    </div>
  </section>

  <!-- Ventas -->
  <section id="ventas-section" class="content-section ventas-color">
    <h2>💰 Ventas</h2>
    <div class="list-card">
      <div id="lista-ventas" class="list-items"></div>
    </div>
  </section>

  <!-- Gastos -->
  <section id="gastos-section" class="content-section gastos-color">
    <h2>📄 Gastos</h2>
    <div class="list-card">
      <div id="lista-gastos" class="list-items"></div>
    </div>
  </section>

</main>

<script src="firebase.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
