<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo">
        <i>🐾</i> Discovery Pets
      </div>
      <ul>
        <li id="menuProveedor" class="active">Proveedor</li>
        <li id="menuFactura">Factura</li>
        <li id="menuGastos">Gastos</li>
        <li id="menuServicio">Servicio</li>
      </ul>
      <button id="btnLogout">Cerrar Sesión</button>
    </div>

    <!-- CONTENIDO -->
    <div class="content">
      <h1 id="tituloSeccion">Proveedor</h1>
      <p class="subtitle">Gestiona los registros de tu negocio 🐶</p>

      <!-- FORMULARIO DINÁMICO -->
      <div class="card" id="formCard">
        <!-- Proveedor -->
        <div id="formProveedor">
          <input type="text" id="provRUC" placeholder="RUC">
          <input type="text" id="provNombre" placeholder="Nombre">
          <input type="text" id="provDireccion" placeholder="Dirección">
          <button id="btnAgregarProveedor">Agregar</button>
          <input type="text" id="buscarProveedor" placeholder="Buscar proveedor por RUC o Nombre">
        </div>

        <!-- Factura -->
        <div id="formFactura" class="hidden">
          <input type="text" id="factRUC" placeholder="RUC Proveedor">
          <input type="text" id="factTipo" placeholder="Tipo de factura">
          <input type="text" id="factDescripcion" placeholder="Descripción">
          <input type="date" id="factFecha">
          <button id="btnAgregarFactura">Agregar</button>
          <input type="text" id="buscarFactura" placeholder="Buscar factura por RUC o descripción">
        </div>

        <!-- Gastos -->
        <div id="formGastos" class="hidden">
          <input type="text" id="gastoDescripcion" placeholder="Descripción del gasto">
          <input type="number" id="gastoMonto" placeholder="Monto">
          <input type="date" id="gastoFecha">
          <button id="btnAgregarGasto">Agregar</button>
          <input type="text" id="buscarGasto" placeholder="Buscar gasto por descripción">
        </div>

        <!-- Servicio -->
        <div id="formServicio" class="hidden">
          <input type="text" id="servDescripcion" placeholder="Descripción del servicio">
          <input type="number" id="servCosto" placeholder="Costo">
          <input type="date" id="servFecha">
          <button id="btnAgregarServicio">Agregar</button>
          <input type="text" id="buscarServicio" placeholder="Buscar servicio por descripción">
        </div>
      </div>

      <!-- TABLA -->
      <div class="card">
        <table id="tablaDatos">
          <thead>
            <tr id="tablaHeader">
              <th>Campo1</th>
              <th>Campo2</th>
              <th>Campo3</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaBody">
            <!-- Los datos se cargarán aquí -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
