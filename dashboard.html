<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sidebar">
  <h2>🐾 Discovery Pets</h2>
  <ul>
    <li id="menu-reportes" class="active">📊 Reportes</li>
    <li id="menu-proveedores">🏪 Proveedores</li>
    <li id="menu-facturas">📑 Facturas</li>
    <li id="menu-gastos">💰 Gastos</li>
    <li id="menu-servicios">🛠 Servicios</li>
    <li id="menu-logout">🚪 Cerrar Sesión</li>
  </ul>
</div>

<div class="section active" id="reportes">
  <h2>Reportes</h2>
  <div class="row g-3">
    <div class="col-md-3">
      <div class="card text-center">
        <h3 id="total-proveedores">0</h3>
        <p>Proveedores</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center">
        <h3 id="total-facturas">0</h3>
        <p>Facturas</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center">
        <h3 id="total-gastos">0</h3>
        <p>Gastos</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-center">
        <h3 id="total-servicios">0</h3>
        <p>Servicios</p>
      </div>
    </div>
  </div>
</div>

<div class="section" id="proveedores">
  <h2>Proveedores</h2>
  <form id="formProveedor" class="row g-3 mb-3">
    <div class="col-md-2">
      <input type="text" class="form-control" id="provRuc" placeholder="RUC">
    </div>
    <div class="col-md-3">
      <input type="text" class="form-control" id="provNombre" placeholder="Nombre">
    </div>
    <div class="col-md-3">
      <input type="text" class="form-control" id="provDireccion" placeholder="Dirección">
    </div>
    <div class="col-md-2">
      <input type="text" class="form-control" id="provTelefono" placeholder="Teléfono">
    </div>
    <div class="col-md-2">
      <input type="text" class="form-control" id="provProducto" placeholder="Producto">
    </div>
    <div class="col-12">
      <button type="button" id="btnAgregarProveedor" class="btn btn-custom">Agregar Proveedor</button>
    </div>
  </form>
  <table class="table">
    <thead>
      <tr>
        <th>RUC</th>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Teléfono</th>
        <th>Producto</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="listaProveedores"></tbody>
  </table>
</div>

<!-- Aquí irían secciones de facturas, gastos y servicios con mismo estilo -->

<script type="module" src="dashboard.js"></script>
</body>
</html>
