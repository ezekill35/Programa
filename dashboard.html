<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(145deg, #e6e9f0, #eef1f5);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .sidebar {
      width: 240px;
      background: linear-gradient(145deg, #1565c0, #0d47a1);
      color: white;
      padding: 20px;
      border-radius: 0 12px 12px 0;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.2);
    }
    .sidebar h4 {
      text-align: center;
      font-weight: bold;
      margin-bottom: 30px;
    }
    .sidebar button {
      width: 100%;
      margin-bottom: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: white;
      padding: 10px;
      transition: 0.3s;
    }
    .sidebar button:hover, .sidebar button.active {
      background: white;
      color: #1565c0;
      transform: translateX(5px);
    }
    .content {
      flex: 1;
      padding: 30px;
    }
    .search-bar {
      position: fixed;
      top: 15px;
      right: 30px;
      width: 250px;
      z-index: 1000;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
      padding: 20px;
      background: white;
      margin-bottom: 20px;
      transform: perspective(1000px) rotateX(0deg);
      transition: transform 0.3s ease-in-out;
    }
    .card:hover {
      transform: perspective(1000px) rotateX(3deg);
    }
    #modalEdicion {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-contenido {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 400px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      transform: scale(0.9);
      transition: transform 0.3s ease-in-out;
    }
    #modalEdicion.show .modal-contenido {
      transform: scale(1);
    }
  </style>
</head>
<body class="d-flex">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h4>🐾 Discovery Pets</h4>
    <button onclick="mostrarSeccion('seccionProveedor')" class="active">Proveedores</button>
    <button onclick="mostrarSeccion('seccionProducto')">Productos</button>
    <button onclick="mostrarSeccion('seccionFactura')">Facturas</button>
    <button onclick="mostrarSeccion('seccionReporte')">Reportes</button>
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="content container">
    <input id="buscadorGlobal" class="form-control search-bar" type="text" placeholder="🔍 Buscar factura, producto o proveedor...">

    <!-- SECCIÓN PROVEEDORES -->
    <div id="seccionProveedor" class="seccion">
      <div class="card">
        <h5>Registrar Proveedor</h5>
        <form id="formProveedor">
          <input type="text" id="nombreProveedor" class="form-control mb-2" placeholder="Nombre del proveedor" required>
          <input type="text" id="rucProveedor" class="form-control mb-2" placeholder="RUC" maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required>
          <input type="text" id="telefonoProveedor" class="form-control mb-2" placeholder="Teléfono" maxlength="9" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required>
          <button class="btn btn-primary w-100">Guardar Proveedor</button>
        </form>
      </div>
      <div class="card">
        <h5>Lista de Proveedores</h5>
        <div id="listaProveedores"></div>
      </div>
    </div>

    <!-- SECCIÓN PRODUCTOS -->
    <div id="seccionProducto" class="seccion" style="display:none;">
      <div class="card">
        <h5>Registrar Producto</h5>
        <form id="formProducto">
          <input type="text" id="nombreProducto" class="form-control mb-2" placeholder="Nombre del producto" required>
          <textarea id="descripcionProducto" class="form-control mb-2" placeholder="Descripción" required></textarea>
          <div class="row">
            <div class="col-md-4"><input type="number" id="cantidadProducto" class="form-control mb-2" placeholder="Cantidad" required></div>
            <div class="col-md-4"><input type="text" id="unidadProducto" class="form-control mb-2" placeholder="Unidad" required></div>
            <div class="col-md-4"><input type="number" step="0.01" id="valorUnitario" class="form-control mb-2" placeholder="Valor unitario" required></div>
          </div>
          <button class="btn btn-success w-100">Guardar Producto</button>
        </form>
      </div>
      <div class="card">
        <h5>Lista de Productos</h5>
        <div id="listaProductos"></div>
      </div>
    </div>

    <!-- SECCIÓN FACTURAS -->
    <div id="seccionFactura" class="seccion" style="display:none;">
      <div class="card">
        <h5>Registrar Factura</h5>
        <form id="formFactura">
          <input type="text" id="numeroFactura" class="form-control mb-2" placeholder="Número de factura" required>
          <select id="proveedorFactura" class="form-select mb-2"></select>
          <select id="productoFactura" class="form-select mb-2"></select>
          <div class="row">
            <div class="col-md-8">
              <input type="number" step="0.01" id="montoFactura" class="form-control mb-2" placeholder="Monto" required>
            </div>
            <div class="col-md-4">
              <select id="tipoMoneda" class="form-select mb-2">
                <option>S/ Soles</option>
                <option>$ Dólares</option>
              </select>
            </div>
          </div>
          <select id="tipoFactura" class="form-select mb-2">
            <option>Factura Electrónica</option>
            <option>Boleta</option>
          </select>
          <button class="btn btn-warning w-100">Guardar Factura</button>
        </form>
      </div>
      <div class="card">
        <h5>Lista de Facturas</h5>
        <div id="listaFacturas"></div>
      </div>
    </div>

    <!-- SECCIÓN REPORTE -->
    <div id="seccionReporte" class="seccion" style="display:none;">
      <div class="card">
        <h5>Generar Reporte</h5>
        <button class="btn btn-danger w-100 mb-3" onclick="generarReporte()">Generar</button>
        <div id="contenidoReporte"></div>
      </div>
    </div>
  </div>

  <!-- MODAL EDICIÓN -->
  <div id="modalEdicion">
    <div class="modal-contenido">
      <h5>Editar Factura</h5>
      <input id="editarNumero" class="form-control mb-2" readonly>
      <input id="editarMonto" type="number" class="form-control mb-2" placeholder="Nuevo monto">
      <button class="btn btn-success w-100 mb-2" onclick="guardarEdicion()">Guardar cambios</button>
      <button class="btn btn-secondary w-100" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
