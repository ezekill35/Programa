<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Dashboard Discovery Pets</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <div class="sidebar">
      <div class="logo">🐾 Discovery Pets</div>
      <ul>
        <li id="menuProveedor" class="active">Proveedor</li>
        <li id="menuFactura">Factura</li>
        <li id="menuGastos">Gastos</li>
        <li id="menuServicio">Servicio</li>
      </ul>
      <button id="btnLogout">Cerrar Sesión</button>
    </div>

    <div class="content">
      <div id="seccionProveedor" class="card">
        <h2>📦 Proveedores</h2>
        <form id="formProveedor" class="formulario">
          <input type="text" id="provRUC" placeholder="RUC">
          <input type="text" id="provNombre" placeholder="Nombre del proveedor">
          <input type="text" id="provDireccion" placeholder="Dirección">
          <button type="button" id="btnAddProveedor">Agregar</button>
        </form>
        <input type="text" id="buscarProveedor" placeholder="Buscar proveedor...">
        <table id="tablaProveedor">
          <thead>
            <tr><th>RUC</th><th>Nombre</th><th>Dirección</th><th>Acciones</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="seccionFactura" class="card hidden">
        <h2>🧾 Facturas</h2>
        <form id="formFactura" class="formulario">
          <input type="text" id="factRUC" placeholder="RUC del proveedor">
          <select id="factTipo">
            <option value="">Tipo de factura</option>
            <option value="Factura A">Factura A</option>
            <option value="Factura B">Factura B</option>
          </select>
          <input type="text" id="factDescripcion" placeholder="Descripción">
          <input type="date" id="factFecha">
          <button type="button" id="btnAddFactura">Agregar</button>
        </form>
        <input type="text" id="buscarFactura" placeholder="Buscar factura...">
        <table id="tablaFactura">
          <thead>
            <tr><th>RUC</th><th>Tipo</th><th>Descripción</th><th>Fecha</th><th>Acciones</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="seccionGastos" class="card hidden">
        <h2>💸 Gastos</h2>
        <form id="formGastos" class="formulario">
          <input type="text" id="gastoDescripcion" placeholder="Descripción">
          <input type="number" id="gastoMonto" placeholder="Monto">
          <button type="button" id="btnAddGasto">Agregar</button>
        </form>
        <input type="text" id="buscarGasto" placeholder="Buscar gasto...">
        <table id="tablaGasto">
          <thead>
            <tr><th>Descripción</th><th>Monto</th><th>Acciones</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="seccionServicio" class="card hidden">
        <h2>🛠 Servicio</h2>
        <form id="formServicio" class="formulario">
          <input type="text" id="servDescripcion" placeholder="Descripción">
          <input type="number" id="servMonto" placeholder="Monto">
          <button type="button" id="btnAddServicio">Agregar</button>
        </form>
        <input type="text" id="buscarServicio" placeholder="Buscar servicio...">
        <table id="tablaServicio">
          <thead>
            <tr><th>Descripción</th><th>Monto</th><th>Acciones</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
  <script type="module" src="firebase.js"></script>
</body>
</html>
