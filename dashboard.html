<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Discovery Pets</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

  <header class="dashboard-header">
    <h1>🐶 Discovery Pets</h1>
    <button onclick="logout()">Cerrar Sesión</button>
  </header>

  <nav class="dashboard-nav">
    <button onclick="showSection('products')">Productos</button>
    <button onclick="showSection('providers')">Proveedores</button>
    <button onclick="showSection('invoices')">Compras</button>
    <button onclick="showSection('sales')">Ventas</button>
    <button onclick="showSection('expenses')">Gastos</button>
  </nav>

  <div class="dashboard-content">

    <!-- Resumen rápido -->
    <div class="summary-cards">
      <div class="summary-card">
        <h3>Total de Productos</h3>
        <p id="total-products">0</p>
      </div>
      <div class="summary-card">
        <h3>Stock Bajo (&lt; 10 unid.)</h3>
        <p id="low-stock">0</p>
      </div>
      <div class="summary-card">
        <h3>Total de Proveedores</h3>
        <p id="total-providers">0</p>
      </div>
      <div class="summary-card">
        <h3>Ventas del Mes</h3>
        <p id="monthly-sales">S/ 0.00</p>
      </div>
    </div>

    <!-- Secciones -->
    <section id="products-section" class="content-section active"></section>
    <section id="providers-section" class="content-section"></section>
    <section id="invoices-section" class="content-section"></section>
    <section id="sales-section" class="content-section"></section>
    <section id="expenses-section" class="content-section"></section>

  </div>

  <script src="firebase.js"></script>
  <script src="script.js"></script>
  <script>
    function showSection(section) {
      document.querySelectorAll(".content-section").forEach(s => s.classList.remove("active"));
      document.getElementById(section + "-section").classList.add("active");
    }
  </script>
</body>
</html>
