<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">🐶 Discovery Pets</div>
      <ul>
        <li id="menuProveedor">Proveedor</li>
        <li id="menuFactura">Factura</li>
        <li id="menuGasto">Gastos</li>
        <li id="menuServicio">Servicio</li>
      </ul>
      <button id="btnLogout">Cerrar Sesión</button>
    </div>

    <!-- Contenido -->
    <div class="content">
      <!-- Proveedor -->
      <div id="seccionProveedor" class="card">
        <h2>Proveedor</h2>
        <div class="formulario">
          <input type="text" id="provRUC" placeholder="RUC">
          <input type="text" id="provNombre" placeholder="Nombre">
          <input type="text" id="provDireccion" placeholder="Dirección">
          <button id="agregarProveedor">Agregar</button>
        </div>
        <input type="text" id="buscarProveedor" placeholder="Buscar proveedor por RUC o Nombre">
        <table>
          <thead>
            <tr>
              <th>RUC</th>
              <th>Nombre</th>
              <th>Dirección</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaProveedor"></tbody>
        </table>
      </div>

      <!-- Factura -->
      <div id="seccionFactura" class="card hidden">
        <h2>Factura</h2>
        <div class="formulario">
          <input type="text" id="factRUC" placeholder="RUC proveedor">
          <select id="factProveedor"></select>
          <input type="text" id="factDescripcion" placeholder="Descripción">
          <input type="date" id="factFecha">
          <button id="agregarFactura">Agregar</button>
        </div>
        <input type="text" id="buscarFactura" placeholder="Buscar factura por RUC o descripción">
        <table>
          <thead>
            <tr>
              <th>RUC</th>
              <th>Proveedor</th>
              <th>Descripción</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaFactura"></tbody>
        </table>
      </div>

      <!-- Gastos -->
      <div id="seccionGasto" class="card hidden">
        <h2>Gastos</h2>
        <div class="formulario">
          <input type="text" id="gastoDescripcion" placeholder="Descripción">
          <input type="number" id="gastoMonto" placeholder="Monto">
          <input type="date" id="gastoFecha">
          <button id="agregarGasto">Agregar</button>
        </div>
        <input type="text" id="buscarGasto" placeholder="Buscar gasto por descripción">
        <table>
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Monto</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaGasto"></tbody>
        </table>
      </div>

      <!-- Servicio -->
      <div id="seccionServicio" class="card hidden">
        <h2>Servicio</h2>
        <div class="formulario">
          <input type="text" id="servDescripcion" placeholder="Descripción">
          <input type="number" id="servCosto" placeholder="Costo">
          <input type="date" id="servFecha">
          <button id="agregarServicio">Agregar</button>
        </div>
        <input type="text" id="buscarServicio" placeholder="Buscar servicio por descripción">
        <table>
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Costo</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaServicio"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
