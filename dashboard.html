<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discovery Pets · Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #fff5fa, #ffd6e8);
      min-height: 100vh;
    }

    header {
      background-color: #ff66b2;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .menu-btn {
      background-color: #fff;
      border: 2px solid #ff66b2;
      color: #ff66b2;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .menu-btn:hover, .menu-btn.activo {
      background-color: #ff66b2;
      color: #fff;
      transform: scale(1.05);
    }

    .contenido {
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .seccion {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .seccion.activa {
      display: block;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    form {
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    form input, form select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    form button {
      background-color: #ff66b2;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
    }

    form button:hover {
      background-color: #ff85c1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      text-align: center;
    }

    th {
      background-color: #ff66b2;
      color: white;
    }

    .btn-edit, .btn-delete {
      cursor: pointer;
      border: none;
      background: none;
      font-size: 1.1rem;
    }

    .btn-edit:hover { color: #00b894; }
    .btn-delete:hover { color: #d63031; }

    #logoutBtn {
      position: fixed;
      right: 20px;
      top: 20px;
      background-color: #fff;
      color: #ff66b2;
      border: 2px solid #ff66b2;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    #logoutBtn:hover {
      background-color: #ff66b2;
      color: #fff;
    }

    /* Modal */
    #modalDetalle {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #modalContenido {
      background: white;
      padding: 30px;
      border-radius: 16px;
      width: 350px;
      max-width: 90%;
      text-align: center;
    }

    #cerrarModal {
      margin-top: 15px;
      background-color: #ff66b2;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Buscador */
    .buscador {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      justify-content: center;
    }

    .buscador input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      flex: 1;
    }

    .buscador button {
      background-color: #ff66b2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
    }

    .buscador button:hover {
      background-color: #ff85c1;
    }
  </style>
</head>
<body>
  <header>🐾 Discovery Pets · Panel</header>
  <button id="logoutBtn">Cerrar sesión</button>

  <nav>
    <button class="menu-btn activo" data-target="proveedores">Proveedores</button>
    <button class="menu-btn" data-target="productos">Productos</button>
    <button class="menu-btn" data-target="facturas">Facturas</button>
  </nav>

  <div class="contenido">

    <!-- ==================== PROVEEDORES ==================== -->
    <section id="proveedores" class="seccion activa">
      <h2>Proveedores</h2>
      <form id="proveedorForm">
        <input id="rucProveedor" type="text" placeholder="RUC" required />
        <input id="nombreProveedor" type="text" placeholder="Nombre" required />
        <input id="direccionProveedor" type="text" placeholder="Dirección (opcional)" />
        <button type="submit">Registrar proveedor</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>RUC</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaProveedores"></tbody>
      </table>
    </section>

    <!-- ==================== PRODUCTOS ==================== -->
    <section id="productos" class="seccion">
      <h2>Productos</h2>
      <form id="productoForm">
        <input id="nombreProducto" type="text" placeholder="Nombre del producto" required />
        <input id="cantidadProducto" type="number" placeholder="Cantidad" required />
        <input id="unidadProducto" type="text" placeholder="Unidad (opcional)" />
        <input id="valorUnitarioProducto" type="number" step="0.01" placeholder="Precio unitario" required />
        <button type="submit">Registrar producto</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cantidad</th>
            <th>Unidad</th>
            <th>Precio</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaProductos"></tbody>
      </table>
    </section>

    <!-- ==================== FACTURAS ==================== -->
    <section id="facturas" class="seccion">
      <h2>Facturas</h2>
      <form id="facturaForm">
        <input id="numeroFactura" type="text" placeholder="Número de factura (opcional)" />
        <input id="fechaEmisionFactura" type="date" />
        <select id="proveedorFactura" required></select>
        <select id="productoFactura" required></select>
        <input id="montoFactura" type="number" step="0.01" placeholder="Monto" required />
        <select id="monedaFactura">
          <option value="S/">S/ (Soles)</option>
          <option value="$">$ (Dólares)</option>
        </select>
        <select id="tipoFactura">
          <option value="FACTURA">FACTURA</option>
          <option value="BOLETA">BOLETA</option>
        </select>
        <button type="submit">Registrar factura</button>
      </form>

      <div class="buscador">
        <input id="buscadorFactura" type="text" placeholder="Buscar factura por producto..." />
        <button id="btnRefresh">Restablecer</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Proveedor</th>
            <th>Producto</th>
            <th>Monto</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaFacturas"></tbody>
      </table>
    </section>
  </div>

  <!-- ==================== MODAL DETALLE ==================== -->
  <div id="modalDetalle">
    <div id="modalContenido">
      <p>Cargando...</p>
      <button id="cerrarModal">Cerrar</button>
    </div>
  </div>

  <!-- Script principal -->
  <script type="module" src="./dashboard.js"></script>
</body>
</html>
