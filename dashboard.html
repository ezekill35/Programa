<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 Discovery Pets - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body">

<nav class="navbar navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">🐶 Discovery Pets</span>
    <button class="btn btn-outline-light" onclick="logout()">Cerrar Sesión</button>
  </div>
</nav>

<div class="container-fluid mt-3">
  <div class="row">
    <div class="col-md-2">
      <ul class="nav flex-column nav-pills">
        <li class="nav-item"><a class="nav-link active" onclick="showSection('productos')">Productos</a></li>
        <li class="nav-item"><a class="nav-link" onclick="showSection('proveedores')">Proveedores</a></li>
        <li class="nav-item"><a class="nav-link" onclick="showSection('compras')">Compras</a></li>
        <li class="nav-item"><a class="nav-link" onclick="showSection('ventas')">Ventas</a></li>
        <li class="nav-item"><a class="nav-link" onclick="showSection('gastos')">Gastos</a></li>
      </ul>
    </div>
    <div class="col-md-10">
      <!-- Productos -->
      <section id="productos-section" class="content-section active">
        <h3>➕ Agregar Nuevo Producto</h3>
        <form id="add-product-form" onsubmit="event.preventDefault(); addProducto();">
          <input type="text" id="prod-sku" placeholder="Código / SKU" class="form-control mb-2" required>
          <input type="text" id="prod-nombre" placeholder="Nombre" class="form-control mb-2">
          <input type="text" id="prod-marca" placeholder="Marca" class="form-control mb-2">
          <input type="number" id="prod-precio" placeholder="Precio Venta S/" class="form-control mb-2" required>
          <input type="number" id="prod-stock" placeholder="Stock Inicial" class="form-control mb-2" required>
          <input type="text" id="prod-categoria" placeholder="Categoría" class="form-control mb-2">
          <button class="btn btn-success">Agregar Producto</button>
        </form>
        <hr>
        <div id="productos-list"></div>
      </section>

      <!-- Proveedores -->
      <section id="proveedores-section" class="content-section">
        <h3>➕ Agregar Nuevo Proveedor</h3>
        <form id="add-proveedor-form" onsubmit="event.preventDefault(); addProveedor();">
          <input type="text" id="prov-nombre" placeholder="Nombre Comercial" class="form-control mb-2" required>
          <input type="text" id="prov-contacto" placeholder="Nombre del Contacto" class="form-control mb-2" required>
          <input type="text" id="prov-telefono" placeholder="Teléfono" class="form-control mb-2" required>
          <input type="text" id="prov-fax" placeholder="Fax (Opcional)" class="form-control mb-2">
          <input type="text" id="prov-productos" placeholder="Tipo de Producto" class="form-control mb-2">
          <button class="btn btn-success">Agregar Proveedor</button>
        </form>
        <hr>
        <div id="proveedores-list"></div>
      </section>

      <!-- Compras / Facturas -->
      <section id="compras-section" class="content-section">
        <h3>➕ Registrar Factura de Compra</h3>
        <form id="add-compra-form" onsubmit="event.preventDefault(); addCompra();">
          <select id="comp-proveedor" class="form-control mb-2" required></select>
          <input type="text" id="comp-factura" placeholder="Número de Factura" class="form-control mb-2" required>
          <input type="text" id="comp-ruc" placeholder="RUC" class="form-control mb-2" required>
          <input type="number" id="comp-total" placeholder="Monto Total" class="form-control mb-2" required>
          <input type="date" id="comp-fecha" class="form-control mb-2" required>
          <button class="btn btn-success">Registrar Compra</button>
        </form>
        <hr>
        <div id="compras-list"></div>
      </section>

      <!-- Ventas -->
      <section id="ventas-section" class="content-section">
        <h3>Registrar Venta</h3>
        <p>Próximamente...</p>
      </section>

      <!-- Gastos -->
      <section id="gastos-section" class="content-section">
        <h3>Registrar Gasto</h3>
        <p>Próximamente...</p>
      </section>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
