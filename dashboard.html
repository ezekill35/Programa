<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo">
        <i>🐾</i>
        <span>Discovery Pets</span>
      </div>
      <ul>
        <li id="opProveedor" class="active" onclick="mostrarSeccion('proveedor', this)">Proveedor</li>
        <li id="opFactura" onclick="mostrarSeccion('factura', this)">Factura</li>
        <li id="opGastos" onclick="mostrarSeccion('gastos', this)">Gastos</li>
        <li id="opServicio" onclick="mostrarSeccion('servicio', this)">Servicio</li>
      </ul>
      <button onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <!-- CONTENIDO -->
    <div class="content">
      <!-- PROVEEDOR -->
      <div id="proveedor" class="seccion">
        <h1>Proveedor</h1>
        <form class="formulario" id="formProveedor">
          <input type="text" id="rutProveedor" placeholder="RUT">
          <input type="text" id="nombreProveedor" placeholder="Nombre del proveedor">
          <input type="text" id="direccionProveedor" placeholder="Dirección">
          <button type="button" id="btnRegistrarProveedor">Registrar Proveedor</button>
        </form>
      </div>

      <!-- FACTURA -->
      <div id="factura" class="seccion hidden">
        <h1>Factura</h1>
        <form class="formulario" id="formFactura">
          <input type="text" id="rutFactura" placeholder="RUT">
          <select id="selectProveedor">
            <option value="">Seleccionar proveedor</option>
          </select>
          <input type="text" id="tipoFactura" placeholder="Tipo de factura">
          <input type="date" id="fechaFactura" placeholder="Fecha de emisión">
          <input type="text" id="descripcionFactura" placeholder="Descripción">
          <button type="button" id="btnRegistrarFactura">Registrar Factura</button>
        </form>
      </div>

      <!-- GASTOS -->
      <div id="gastos" class="seccion hidden">
        <h1>Gastos</h1>
        <form class="formulario" id="formGastos">
          <input type="text" id="descripcionGasto" placeholder="Descripción">
          <input type="number" id="montoGasto" placeholder="Monto">
          <input type="date" id="fechaGasto">
          <button type="button" id="btnRegistrarGasto">Registrar Gasto</button>
        </form>
      </div>

      <!-- SERVICIO -->
      <div id="servicio" class="seccion hidden">
        <h1>Servicio</h1>
        <form class="formulario" id="formServicio">
          <input type="text" id="descripcionServicio" placeholder="Descripción">
          <input type="number" id="montoServicio" placeholder="Monto">
          <input type="date" id="fechaServicio">
          <button type="button" id="btnRegistrarServicio">Registrar Servicio</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
