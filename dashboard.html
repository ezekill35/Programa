<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Discovery Pets</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>📊 Dashboard - Discovery Pets</h1>

  <nav>
    <ul>
      <li onclick="mostrarSeccion('proveedores')">Proveedores</li>
      <li onclick="mostrarSeccion('facturas')">Facturas</li>
      <li onclick="mostrarSeccion('gastos')">Gastos</li>
      <li onclick="mostrarSeccion('servicios')">Servicios</li>
    </ul>
  </nav>

  <!-- SECCION PROVEEDORES -->
  <section id="proveedores">
    <h2>🧾 Proveedores</h2>
    <form id="proveedorForm">
      <input type="text" id="nombreProveedor" placeholder="Nombre">
      <input type="text" id="rucProveedorInput" placeholder="RUC">
      <input type="text" id="direccionProveedor" placeholder="Dirección">
      <button type="submit">Registrar Proveedor</button>
    </form>
    <div id="listaProveedores"></div>
  </section>

  <!-- SECCION FACTURAS -->
  <section id="facturas" class="hidden">
    <h2>📋 Facturas</h2>
    <form id="facturaForm">
      <label>Proveedor:</label>
      <select id="selectProveedorFactura"></select>

      <label>Descripción:</label>
      <input type="text" id="descripcionFactura" placeholder="Descripción">

      <label>Dirección:</label>
      <input type="text" id="direccionFactura" placeholder="Dirección">

      <button type="submit">Guardar Factura</button>
    </form>
    <div id="listaFacturas"></div>
  </section>

  <!-- SECCION GASTOS -->
  <section id="gastos" class="hidden">
    <h2>💸 Gastos</h2>
    <form id="gastoForm">
      <input type="text" id="gastoDescripcion" placeholder="Descripción">
      <input type="number" id="gastoMonto" placeholder="Monto">
      <button type="submit">Registrar Gasto</button>
    </form>
    <div id="listaGastos"></div>
  </section>

  <!-- SECCION SERVICIOS -->
  <section id="servicios" class="hidden">
    <h2>🛠️ Servicios</h2>
    <form id="servicioForm">
      <input type="text" id="servicioNombre" placeholder="Nombre del servicio">
      <input type="number" id="servicioCosto" placeholder="Costo">
      <button type="submit">Registrar Servicio</button>
    </form>
    <div id="listaServicios"></div>
  </section>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
