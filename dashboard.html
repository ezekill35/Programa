<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets · Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffe0f0, #ffd1e8);
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #ff66b2;
      color: white;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 22px;
      margin: 0;
    }

    header button {
      background: white;
      border: none;
      color: #ff3399;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    header button:hover {
      background: #ffe6f3;
      transform: scale(1.05);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      padding: 25px;
    }

    section {
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      padding: 20px;
      overflow-y: auto;
    }

    h2 {
      color: #ff3399;
      margin-bottom: 15px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #ff66cc;
      box-shadow: 0 0 5px rgba(255,102,204,0.3);
    }

    button.primary {
      width: 100%;
      padding: 12px;
      background: #ff3399;
      border: none;
      color: white;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    button.primary:hover {
      background: #ff66cc;
      transform: scale(1.03);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      color: #ff3399;
      background: #fff0f8;
    }

    tr:hover {
      background: #fff6fb;
    }

    .acciones button {
      margin-right: 5px;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .acciones .editar {
      background: #ffd6e9;
      color: #ff3399;
    }

    .acciones .eliminar {
      background: #ffeaea;
      color: #d11a2a;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #fff;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🐾 Discovery Pets Dashboard</h1>
    <button id="btnLogout">Cerrar sesión</button>
  </header>

  <main>
    <!-- Panel izquierdo: Formularios -->
    <section>
      <h2>Registrar nuevo proveedor</h2>
      <input id="nombreProv" placeholder="Nombre del proveedor">
      <input id="telefonoProv" placeholder="Teléfono">
      <input id="emailProv" type="email" placeholder="Correo electrónico">
      <button id="btnRegistrarProv" class="primary">Guardar proveedor</button>

      <h2 style="margin-top:25px;">Registrar nuevo producto</h2>
      <input id="nombreProd" placeholder="Nombre del producto">
      <input id="precioProd" type="number" placeholder="Precio">
      <input id="cantidadProd" type="number" placeholder="Cantidad">
      <textarea id="descProd" placeholder="Descripción (opcional)"></textarea>
      <button id="btnRegistrarProd" class="primary">Guardar producto</button>
    </section>

    <!-- Panel derecho: Listado -->
    <section>
      <h2>Inventario y proveedores</h2>
      <input id="buscador" placeholder="🔍 Buscar por nombre...">

      <table id="tablaDatos">
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Nombre</th>
            <th>Detalles</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyDatos"></tbody>
      </table>
    </section>
  </main>

  <footer>
    Discovery Pets © 2025 — Todos los derechos reservados.
  </footer>

  <!-- Firebase -->
  <script type="module" src="firebase.js"></script>
  <!-- Lógica principal -->
  <script type="module" src="dashboard.js"></script>

</body>
</html>
