<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo">🐾 Discovery Pets</div>
      <ul>
        <li onclick="mostrarSeccion('proveedor')">Proveedor</li>
        <li onclick="mostrarSeccion('factura')">Factura</li>
        <li onclick="mostrarSeccion('gastos')">Gastos</li>
        <li onclick="mostrarSeccion('servicio')">Servicio</li>
      </ul>
      <button id="btnCerrarSesion">Cerrar Sesión</button>
    </div>

    <!-- CONTENIDO -->
    <div class="content">
      <!-- PROVEEDORES -->
      <div id="proveedor" class="card seccion">
        <h2>Proveedor</h2>
        <form id="formProveedor" class="formulario">
          <input type="text" id="nombreProveedor" placeholder="Nombre del proveedor" required>
          <input type="text" id="direccionProveedor" placeholder="Dirección del proveedor" required>
          <button type="button" id="btnAgregarProveedor">Registrar Proveedor</button>
        </form>
        <table id="tablaProveedores">
          <thead>
            <tr><th>Nombre</th><th>Dirección</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- FACTURAS -->
      <div id="factura" class="card seccion hidden">
        <h2>Factura</h2>
        <form id="formFactura" class="formulario">
          <input type="text" id="rucFactura" placeholder="RUC" required>
          <select id="selectProveedorFactura">
            <option value="">Selecciona un proveedor</option>
          </select>
          <input type="text" id="descripcionFactura" placeholder="Descripción" required>
          <input type="date" id="fechaFactura" required>
          <button type="button" id="btnAgregarFactura">Registrar Factura</button>
        </form>
        <table id="tablaFacturas">
          <thead>
            <tr><th>RUC</th><th>Proveedor</th><th>Descripción</th><th>Fecha</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- GASTOS -->
      <div id="gastos" class="card seccion hidden">
        <h2>Gastos</h2>
        <form id="formGastos" class="formulario">
          <input type="text" id="descripcionGasto" placeholder="Descripción" required>
          <input type="number" id="montoGasto" placeholder="Monto" required>
          <input type="date" id="fechaGasto" required>
          <button type="button" id="btnAgregarGasto">Registrar Gasto</button>
        </form>
        <table id="tablaGastos">
          <thead>
            <tr><th>Descripción</th><th>Monto</th><th>Fecha</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- SERVICIO -->
      <div id="servicio" class="card seccion hidden">
        <h2>Servicio</h2>
        <form id="formServicio" class="formulario">
          <input type="text" id="nombreServicio" placeholder="Nombre del servicio" required>
          <input type="text" id="detalleServicio" placeholder="Detalle" required>
          <input type="date" id="fechaServicio" required>
          <button type="button" id="btnAgregarServicio">Registrar Servicio</button>
        </form>
        <table id="tablaServicios">
          <thead>
            <tr><th>Servicio</th><th>Detalle</th><th>Fecha</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
