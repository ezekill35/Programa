<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Discovery Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <!-- Sidebar -->
  <div class="d-flex">
    <div class="bg-dark text-white p-3 vh-100" style="width:250px;">
      <h4 class="text-center mb-4">🐾 Discovery Pets</h4>
      <input type="text" id="buscadorGlobal" class="form-control mb-3" placeholder="Buscar producto...">
      <button class="menu-btn btn btn-outline-light w-100 mb-2 activo" data-target="proveedores">Proveedores</button>
      <button class="menu-btn btn btn-outline-light w-100 mb-2" data-target="productos">Productos</button>
      <button class="menu-btn btn btn-outline-light w-100 mb-2" data-target="facturas">Facturas</button>
      <button id="logoutBtn" class="btn btn-danger w-100 mt-4">Cerrar Sesión</button>
    </div>

    <!-- Contenido principal -->
    <div class="flex-grow-1 p-4">

      <!-- Sección Proveedores -->
      <section id="proveedores" class="seccion">
        <h3 class="mb-3">Registro de Proveedores</h3>
        <form id="proveedorForm" class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label">RUC</label>
            <input type="text" id="rucProveedor" class="form-control" maxlength="11" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Nombre</label>
            <input type="text" id="nombreProveedor" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Dirección</label>
            <input type="text" id="direccionProveedor" class="form-control" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-success">Guardar Proveedor</button>
          </div>
        </form>

        <table class="table table-hover">
          <thead class="table-dark">
            <tr>
              <th>RUC</th>
              <th>Nombre</th>
              <th>Dirección</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProveedores"></tbody>
        </table>
      </section>

      <!-- Sección Productos -->
      <section id="productos" class="seccion" style="display:none;">
        <h3 class="mb-3">Registro de Productos</h3>
        <form id="productoForm" class="row g-3 mb-4">
          <div class="col-md-3">
            <label class="form-label">Nombre</label>
            <input type="text" id="nombreProducto" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Cantidad</label>
            <input type="number" id="cantidadProducto" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Unidad</label>
            <input type="text" id="unidadProducto" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Valor Unitario</label>
            <input type="number" id="valorUnitarioProducto" class="form-control" step="0.01" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-success">Guardar Producto</button>
          </div>
        </form>

        <table class="table table-hover">
          <thead class="table-dark">
            <tr>
              <th>Nombre</th>
              <th>Cantidad</th>
              <th>Unidad</th>
              <th>Valor</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </section>

      <!-- Sección Facturas -->
      <section id="facturas" class="seccion" style="display:none;">
        <h3 class="mb-3">Registro de Facturas</h3>
        <form id="facturaForm" class="row g-3 mb-4">
          <div class="col-md-3">
            <label class="form-label">N° Factura</label>
            <input type="text" id="numeroFactura" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Proveedor</label>
            <select id="proveedorFactura" class="form-select" required>
              <option value="" disabled selected>Seleccione proveedor</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Producto</label>
            <select id="productoFactura" class="form-select" required>
              <option value="" disabled selected>Seleccione producto</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Monto</label>
            <input type="number" id="montoFactura" class="form-control" step="0.01" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Tipo</label>
            <select id="tipoFactura" class="form-select">
              <option value="Factura Electrónica">Factura Electrónica</option>
              <option value="Boleta">Boleta</option>
              <option value="Recibo">Recibo</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Moneda</label>
            <select id="monedaFactura" class="form-select">
              <option value="S/">Soles</option>
              <option value="$">Dólares</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Fecha de Emisión</label>
            <input type="date" id="fechaEmisionFactura" class="form-control" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-success">Guardar Factura</button>
          </div>
        </form>

        <table class="table table-hover">
          <thead class="table-dark">
            <tr>
              <th>N°</th>
              <th>Proveedor</th>
              <th>Producto</th>
              <th>Monto</th>
              <th>Tipo</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaFacturas"></tbody>
        </table>
      </section>

    </div>
  </div>

  <!-- Modal Detalles -->
  <div id="detalleModal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:1000;">
    <div class="bg-white p-4 rounded shadow" style="width:600px;max-width:90%;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 id="tituloModal" class="m-0 fw-bold"></h5>
        <button id="cerrarModal" class="btn btn-sm btn-danger">X</button>
      </div>
      <div id="contenidoModal"></div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
