<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐶 Discovery Pets - Dashboard</title>
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<header class="dashboard-header">
  <h1>🐶 Discovery Pets</h1>
  <p>Gestión integral de tu tienda de mascotas 🐾</p>
  <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
</header>

<nav class="dashboard-nav">
  <button onclick="showSection('productos')">📦 Productos</button>
  <button onclick="showSection('proveedores')">👥 Proveedores</button>
  <button onclick="showSection('compras')">🛒 Compras</button>
  <button onclick="showSection('ventas')">💰 Ventas</button>
  <button onclick="showSection('gastos')">📄 Gastos</button>
</nav>

<main class="dashboard-main">

  <!-- Productos -->
  <section id="productos-section" class="content-section active">
    <h2>📦 Productos</h2>
    <div class="dashboard-grid">
      <div class="card form-card">
        <h3>➕ Agregar Nuevo Producto</h3>
        <form id="form-producto" onsubmit="event.preventDefault(); agregarProducto();">
          <input type="text" id="producto-sku" placeholder="Código / SKU" required>
          <input type="text" id="producto-nombre" placeholder="Nombre" required>
          <input type="text" id="producto-marca" placeholder="Marca">
          <input type="number" id="producto-precio" placeholder="Precio S/" step="0.01" required>
          <input type="number" id="producto-stock" placeholder="Stock Inicial" required>
          <input type="text" id="producto-categoria" placeholder="Categoría">
          <button type="submit" class="primary-btn">Agregar Producto</button>
        </form>
      </div>
      <div class="card list-card">
        <h3>🔍 Productos Registrados</h3>
        <div id="lista-productos" class="list-items"></div>
      </div>
    </div>
  </section>

  <!-- Proveedores -->
  <section id="proveedores-section" class="content-section">
    <h2>👥 Proveedores</h2>
    <div class="dashboard-grid">
      <div class="card form-card">
        <h3>➕ Agregar Nuevo Proveedor</h3>
        <form id="form-proveedor" onsubmit="event.preventDefault(); agregarProveedor();">
          <input type="text" id="proveedor-nombre" placeholder="Nombre Comercial" required>
          <input type="text" id="proveedor-contacto" placeholder="Contacto" required>
          <input type="text" id="proveedor-telefono" placeholder="Teléfono" required>
          <input type="text" id="proveedor-fax" placeholder="Fax">
          <input type="text" id="proveedor-direccion" placeholder="Dirección">
          <input type="text" id="proveedor-productos" placeholder="Tipo de Producto">
          <button type="submit" class="primary-btn">Agregar Proveedor</button>
        </form>
      </div>
      <div class="card list-card">
        <h3>👥 Proveedores Registrados</h3>
        <div id="lista-proveedores" class="list-items"></div>
      </div>
    </div>
  </section>

  <!-- Compras -->
  <section id="compras-section" class="content-section">
    <h2>🛒 Compras / Facturas</h2>
    <div class="dashboard-grid">
      <div class="card form-card">
        <h3>➕ Registrar Factura</h3>
        <form id="form-factura" onsubmit="event.preventDefault(); agregarFactura();">
          <input type="text" id="factura-ruc" placeholder="RUC" required>
          <input type="text" id="factura-numero" placeholder="Número Factura" required>
          <select id="factura-proveedor" required></select>
          <input type="text" id="factura-producto" placeholder="Producto" required>
          <input type="number" id="factura-cantidad" placeholder="Cantidad" required>
          <input type="number" id="factura-precio" placeholder="Precio S/" step="0.01" required>
          <input type="date" id="factura-fecha" required>
          <button type="submit" class="primary-btn">Registrar Factura</button>
        </form>
      </div>
      <div class="card list-card">
        <h3>📄 Facturas Registradas</h3>
        <div id="lista-facturas" class="list-items"></div>
      </div>
    </div>
  </section>

  <!-- Ventas -->
  <section id="ventas-section" class="content-section">
    <h2>💰 Ventas</h2>
    <div class="list-card">
      <div id="lista-ventas" class="list-items"></div>
    </div>
  </section>

  <!-- Gastos -->
  <section id="gastos-section" class="content-section">
    <h2>📄 Gastos</h2>
    <div class="list-card">
      <div id="lista-gastos" class="list-items"></div>
    </div>
  </section>

</main>

<script src="firebase.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
