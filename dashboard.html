<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Dashboard 3D</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg,#ff00ff,#ff66ff);
    display: flex;
}
.sidebar {
    width: 250px;
    background: linear-gradient(180deg,#1abc9c,#16a085);
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-shadow: 4px 0 15px rgba(0,0,0,0.3);
    border-radius: 0 20px 20px 0;
    visibility:hidden;
}
.sidebar h2 {
    text-align:center;
    margin-bottom:30px;
    font-size:26px;
    text-shadow:2px 2px 5px rgba(0,0,0,0.3);
}
.nav-btn {
    padding: 12px;
    margin: 8px 0;
    border-radius: 12px;
    cursor: pointer;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}
.nav-btn:hover,
.nav-btn.active {
    background: rgba(255,255,255,0.3);
    transform: translateX(5px);
}
.logout-btn {
    margin-top: auto;
    padding: 12px;
    background:#e74c3c;
    text-align:center;
    border-radius: 12px;
    cursor:pointer;
    font-weight: bold;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}
.logout-btn:hover { background:#c0392b; transform: translateY(-2px); }

.main-content {
    flex:1;
    padding: 25px;
    overflow-y:auto;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(8px);
    visibility:hidden;
}
.content-section { display:none; }
.content-section.active { display:block; }

/* Formularios */
form {
    background:#fff;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}
form input, form select {
    width:100%;
    padding:10px;
    margin-bottom:12px;
    border-radius:8px;
    border:1px solid #ccc;
}
form button {
    padding:10px 20px;
    background:#1abc9c;
    color:#fff;
    border:none;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
form button:hover { background:#16a085; transform: translateY(-2px); }

/* Tablas */
table {
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}
table th, table td { padding:12px; text-align:left; border-bottom:1px solid #eee; }
table th { background:#1abc9c; color:#fff; }
button.edit-btn { background:#3498db;color:#fff;padding:5px 10px;border:none;border-radius:8px;cursor:pointer; }
button.delete-btn { background:#e74c3c;color:#fff;padding:5px 10px;border:none;border-radius:8px;cursor:pointer; }
button.edit-btn:hover, button.delete-btn:hover { opacity:0.8; transform: translateY(-2px); }

/* Responsive */
@media(max-width:900px){
    .sidebar { width:100%; flex-direction:row; overflow-x:auto; border-radius:0; }
    .nav-btn { flex:1; margin:0 5px; text-align:center; }
    .logout-btn { margin:0 5px; }
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <h2>🐾 Discovery Pets</h2>
    <button class="nav-btn active" data-section="proveedores">Proveedores</button>
    <button class="nav-btn" data-section="facturas">Facturas</button>
    <button class="nav-btn" data-section="gastos">Gastos</button>
    <button class="nav-btn" data-section="servicios">Servicios</button>
    <button class="nav-btn" data-section="reportes">Reportes</button>
    <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
</div>

<main class="main-content" id="mainContent">

    <!-- Proveedores -->
    <section id="proveedores" class="content-section active">
        <h2>Registro de Proveedores</h2>
        <form id="formProveedor">
            <input id="rucProv" placeholder="RUC" required>
            <input id="nombreProv" placeholder="Nombre" required>
            <input id="productoProv" placeholder="Producto" required>
            <input id="direccionProv" placeholder="Dirección" required>
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead><tr><th>RUC</th><th>Nombre</th><th>Producto</th><th>Dirección</th><th>Acciones</th></tr></thead>
            <tbody id="tablaProveedores"></tbody>
        </table>
    </section>

    <!-- Facturas -->
    <section id="facturas" class="content-section">
        <h2>Registro de Facturas</h2>
        <form id="formFactura">
            <input id="proveedorFactura" placeholder="Proveedor" required>
            <input id="tipoFactura" placeholder="Tipo de factura" required>
            <input id="montoFactura" type="number" placeholder="Monto" required>
            <input id="monedaFactura" placeholder="Moneda" value="S/." required>
            <input id="fechaFactura" type="date" required>
            <input id="descFactura" placeholder="Descripción">
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead><tr><th>Proveedor</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Descripción</th><th>Acciones</th></tr></thead>
            <tbody id="tablaFacturas"></tbody>
        </table>
    </section>

    <!-- Gastos -->
    <section id="gastos" class="content-section">
        <h2>Registro de Gastos</h2>
        <form id="formGasto">
            <input id="nombreGasto" placeholder="Nombre" required>
            <input id="tipoGasto" placeholder="Tipo" required>
            <input id="montoGasto" type="number" placeholder="Monto" required>
            <input id="fechaGasto" type="date" required>
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead><tr><th>Nombre</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Acciones</th></tr></thead>
            <tbody id="tablaGastos"></tbody>
        </table>
    </section>

    <!-- Servicios -->
    <section id="servicios" class="content-section">
        <h2>Registro de Servicios</h2>
        <form id="formServicio">
            <input id="nombreServ" placeholder="Nombre" required>
            <input id="precioServ" type="number" placeholder="Precio" required>
            <input id="fechaServ" type="date" required>
            <input id="descServ" placeholder="Descripción">
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead><tr><th>Nombre</th><th>Precio</th><th>Fecha</th><th>Descripción</th><th>Acciones</th></tr></thead>
            <tbody id="tablaServicios"></tbody>
        </table>
    </section>

    <!-- Reportes -->
    <section id="reportes" class="content-section">
        <h2>Reportes</h2>
        <button id="btnGenerarReporte" class="btn btn-primary">Generar Resumen</button>
        <div id="reporteContenido" style="margin-top:15px;"></div>
    </section>

</main>

<script type="module" src="script.js"></script>
<script type="module">
import { auth } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const sidebar = document.getElementById("sidebar");
const mainContent = document.getElementById("mainContent");

onAuthStateChanged(auth,user=>{
    if(user){
        sidebar.style.visibility = "visible";
        mainContent.style.visibility = "visible";
    }else{
        window.location.href="index.html";
    }
});

// Navegación
const navBtns = document.querySelectorAll(".nav-btn");
const sections = document.querySelectorAll(".content-section");
navBtns.forEach(btn=>{
    btn.addEventListener("click",()=>{
        navBtns.forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        const sec = btn.dataset.section;
        sections.forEach(s=>s.classList.remove("active"));
        document.getElementById(sec)?.classList.add("active");
    });
});
</script>

</body>
</html>
