<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discovery Pets · Dashboard</title>
  <link rel="icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #10bcd4;
      --bg: #f8fcfe;
      --card-bg: #ffffff;
      --shadow: 0 4px 20px rgba(0,0,0,0.05);
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }
    body {
      margin: 0;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: white;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      position: fixed;
      height: 100%;
    }
    .sidebar .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 2rem;
      text-align: center;
    }
    .sidebar a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      display: block;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 14px rgba(16,188,212,0.3);
    }

    /* Main content */
    .main {
      flex: 1;
      margin-left: 250px;
      padding: 2rem;
      background: var(--bg);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .top-bar h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-box input {
      border: 1px solid #dbe3eb;
      border-radius: 12px;
      padding: 8px 12px;
      width: 250px;
      font-size: 14px;
    }
    .search-box button {
      background: var(--primary);
      border: none;
      color: white;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      transition: all .2s ease;
    }
    .search-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(16,188,212,0.3);
    }

    /* Dashboard cards */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .card-stat {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      text-align: center;
      transition: all .3s ease;
    }
    .card-stat:hover { transform: translateY(-4px); }
    .card-stat h2 {
      font-size: 2rem;
      margin: 0;
      color: var(--primary);
    }
    .card-stat p { color: var(--text-muted); margin: 0; }

    /* Factura resultados */
    #facturaResults {
      display: grid;
      gap: 1rem;
    }
    .factura-card {
      background: white;
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 1rem 1.2rem;
      transition: all .2s ease;
    }
    .factura-card:hover { transform: scale(1.01); }
    .factura-card strong { color: var(--primary); }

    /* Modal */
    .modal-content {
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    .modal-header {
      border-bottom: none;
    }
    .modal-footer button {
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">🐾 Discovery Pets</div>
    <a href="#" class="active">Dashboard</a>
    <a href="#">Proveedores</a>
    <a href="#">Productos</a>
    <a href="#">Facturas</a>
    <a href="#" id="logoutBtn">Cerrar sesión</a>
  </aside>

  <!-- Main content -->
  <main class="main">
    <div class="top-bar">
      <h1>Panel de Control</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar producto relacionado...">
        <button id="btnBuscar">Buscar</button>
      </div>
    </div>

    <!-- Dashboard stats -->
    <div class="stats">
      <div class="card-stat">
        <h2 id="totalFacturas">0</h2>
        <p>Facturas</p>
      </div>
      <div class="card-stat">
        <h2 id="totalProveedores">0</h2>
        <p>Proveedores</p>
      </div>
      <div class="card-stat">
        <h2 id="totalProductos">0</h2>
        <p>Productos</p>
      </div>
    </div>

    <!-- Factura search results -->
    <div id="facturaResults"></div>
  </main>

  <!-- Modal de factura -->
  <div class="modal fade" id="facturaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detalle de Factura</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="facturaDetalle"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
