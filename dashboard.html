<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Dashboard</title>

<style>
/* --------------------- RESET --------------------- */
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif; }

/* --------------------- BODY --------------------- */
body {
  min-height:100vh;
  display:flex;
  background: linear-gradient(135deg,#fce4ec,#e1f5fe);
  overflow-x:hidden;
}

/* --------------------- SIDEBAR --------------------- */
.sidebar {
  width:250px;
  background: linear-gradient(180deg,#f50057,#ff4081);
  color:white;
  display:flex;
  flex-direction:column;
  padding-top:20px;
  position:fixed;
  height:100%;
  box-shadow: 4px 0 20px rgba(0,0,0,0.3);
  border-right: 1px solid rgba(255,255,255,0.2);
}
.sidebar h3 {
  text-align:center;
  margin-bottom:20px;
  font-size:20px;
  font-weight:bold;
  color:#fff;
  text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
}
.menu-btn {
  background:none;
  border:none;
  color:white;
  text-align:left;
  padding:15px 20px;
  font-size:16px;
  cursor:pointer;
  transition: all 0.3s ease;
}
.menu-btn:hover, .menu-btn.activo {
  background: rgba(255,255,255,0.2);
  box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
}
.menu-btn:last-child {
  margin-top:auto;
  border-top: 1px solid rgba(255,255,255,0.3);
}

/* --------------------- MAIN CONTENT --------------------- */
.main-content {
  margin-left:260px;
  padding:25px;
  flex:1;
  animation: fadeIn 0.5s ease;
}
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

/* --------------------- HEADER --------------------- */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}
#buscadorGlobal {
  width:280px;
  border-radius:10px;
  padding:8px 12px;
  border:1px solid #ccc;
  box-shadow: inset 1px 1px 5px rgba(0,0,0,0.1);
}

/* --------------------- CARDS --------------------- */
.card {
  background: linear-gradient(145deg,#ffffff,#ffe6f0);
  border-radius:15px;
  padding:25px;
  margin-bottom:25px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.15);
  transition: all 0.3s ease;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

/* --------------------- BUTTONS --------------------- */
.btn-primary {
  background: linear-gradient(145deg,#f50057,#ff4081);
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  padding:10px 18px;
  cursor:pointer;
  transition: all 0.3s ease;
  box-shadow: 0 5px 10px rgba(0,0,0,0.2);
}
.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 15px rgba(0,0,0,0.3);
}
.btn-delete {
  background: linear-gradient(145deg,#d32f2f,#f44336);
  border:none;
  color:white;
  font-weight:bold;
  border-radius:5px;
  padding:5px 12px;
  cursor:pointer;
  transition: all 0.3s ease;
}
.btn-delete:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

/* --------------------- TABLE --------------------- */
table {
  width:100%;
  border-collapse: collapse;
  margin-top:15px;
}
th, td {
  padding:12px 10px;
  text-align:left;
}
th {
  background:#ff4081;
  color:white;
  border-radius:5px;
}
tr:nth-child(even){ background: #ffe6f0; }

/* --------------------- MODAL --------------------- */
.modal-overlay {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1000;
  display:none;
}
.modal-card {
  background: linear-gradient(145deg,#ffffff,#ffe6f0);
  border-radius:20px;
  padding:25px;
  width:400px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  position:relative;
}
.cerrar {
  position:absolute;
  top:10px;
  right:15px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  color:#ff4081;
}
#contenidoModal { margin-top:15px; white-space: pre-wrap; font-size:14px; }
</style>
</head>
<body>

<div class="sidebar">
  <h3>🐾 Discovery Pets</h3>
  <button class="menu-btn activo" data-target="proveedores">🏢 Proveedores</button>
  <button class="menu-btn" data-target="productos">🛒 Productos</button>
  <button class="menu-btn" data-target="facturas">📄 Facturas</button>
  <button id="logoutBtn" class="menu-btn">🚪 Cerrar Sesión</button>
</div>

<div class="main-content">
  <header>
    <h2>Panel de Control 🐶</h2>
    <input type="text" id="buscadorGlobal" placeholder="🔍 Buscar producto o factura...">
  </header>

  <!-- -------------------- PROVEEDORES -------------------- -->
  <section id="proveedores" class="seccion">
    <div class="card">
      <h4>Registrar Proveedor</h4>
      <form id="proveedorForm" class="row g-3">
        <div class="col-md-4"><label class="form-label">RUC</label><input type="text" id="rucProveedor" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Nombre</label><input type="text" id="nombreProveedor" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Dirección</label><input type="text" id="direccionProveedor" class="form-control" required></div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Guardar</button></div>
      </form>
    </div>

    <div class="card">
      <h4>Proveedores Registrados</h4>
      <table class="table table-proveedores">
        <thead><tr><th>RUC</th><th>Nombre</th><th>Dirección</th><th>Acciones</th></tr></thead>
        <tbody id="tablaProveedores"></tbody>
      </table>
    </div>
  </section>

  <!-- -------------------- PRODUCTOS -------------------- -->
  <section id="productos" class="seccion" style="display:none;">
    <div class="card">
      <h4>Registrar Producto</h4>
      <form id="productoForm" class="row g-3">
        <div class="col-md-3"><label class="form-label">Nombre</label><input type="text" id="nombreProducto" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Descripción</label><input type="text" id="descripcionProducto" class="form-control"></div>
        <div class="col-md-2"><label class="form-label">Cantidad</label><input type="number" id="cantidadProducto" class="form-control"></div>
        <div class="col-md-2"><label class="form-label">Unidad</label><input type="text" id="unidadProducto" class="form-control"></div>
        <div class="col-md-2"><label class="form-label">Valor Unitario</label><input type="number" id="valorUnitarioProducto" class="form-control" step="0.01"></div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Guardar</button></div>
      </form>
    </div>

    <div class="card">
      <h4>Productos Registrados</h4>
      <table class="table table-striped">
        <thead><tr><th>Nombre</th><th>Descripción</th><th>Cantidad</th><th>Unidad</th><th>Valor</th><th>Acciones</th></tr></thead>
        <tbody id="tablaProductos"></tbody>
      </table>
    </div>
  </section>

  <!-- -------------------- FACTURAS -------------------- -->
  <section id="facturas" class="seccion" style="display:none;">
    <div class="card">
      <h4>Registrar Factura</h4>
      <form id="facturaForm" class="row g-3">
        <div class="col-md-3"><label class="form-label">N° Factura</label><input type="text" id="numeroFactura" class="form-control" required></div>
        <div class="col-md-3"><label class="form-label">Proveedor</label><select id="proveedorFactura" class="form-select" required></select></div>
        <div class="col-md-3"><label class="form-label">Producto</label><select id="productoFactura" class="form-select" required></select></div>
        <div class="col-md-2"><label class="form-label">Monto</label><div class="input-group"><select id="monedaFactura" class="form-select" style="max-width:90px;"><option value="S/">S/</option><option value="$">$</option></select><input type="number" id="montoFactura" class="form-control" step="0.01" required></div></div>
        <div class="col-md-2"><label class="form-label">Tipo</label><select id="tipoFactura" class="form-select"><option value="Factura Electrónica">Factura Electrónica</option><option value="Boleta">Boleta</option></select></div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Guardar</button></div>
      </form>
    </div>

    <div class="card">
      <h4>Facturas Registradas</h4>
      <table class="table table-striped">
        <thead><tr><th>N°</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Acciones</th></tr></thead>
        <tbody id="tablaFacturas"></tbody>
      </table>
    </div>
  </section>

  <!-- -------------------- MODAL -------------------- -->
  <div id="detalleModal" class="modal-overlay">
    <div class="modal-card">
      <span id="cerrarModal" class="cerrar">&times;</span>
      <h4 id="tituloModal"></h4>
      <pre id="contenidoModal"></pre>
    </div>
  </div>

</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
