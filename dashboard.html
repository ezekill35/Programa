<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discovery Pets — Facturas</title>

  <!-- Fuente y estilos base -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #21c1d6;
      --azul-claro: #bff5fb;
      --gris-claro: #f5f9fa;
      --gris: #e0e6e8;
      --sombra: 0 6px 18px rgba(0,0,0,0.1);
    }

    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e9f9fb, #fefefe);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      color: #333;
      overflow-x: hidden;
    }

    h2 {
      text-align: center;
      font-weight: 600;
      color: var(--azul);
      margin-top: 20px;
    }

    /* ----------- Contenedor principal ----------- */
    .container {
      width: 95%;
      max-width: 1200px;
      margin: 30px auto;
      background: rgba(255,255,255,0.8);
      border-radius: 20px;
      box-shadow: var(--sombra);
      padding: 25px 30px;
      backdrop-filter: blur(10px);
      position: relative;
    }

    /* ----------- Formulario ----------- */
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--gris);
      border-radius: 10px;
      outline: none;
      transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px var(--azul-claro);
    }

    textarea {
      resize: vertical;
      min-height: 50px;
    }

    button {
      background: var(--azul);
      color: #fff;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #1ba8bb;
    }

    /* ----------- Tabla ----------- */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    thead {
      background: var(--azul);
      color: #fff;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }

    .editable {
      background: #fff7e6;
    }

    .btn-edit, .btn-delete {
      border: none;
      cursor: pointer;
      background: none;
      font-size: 18px;
      color: var(--azul);
      transition: 0.2s;
    }

    .btn-delete:hover { color: crimson; }
    .btn-edit:hover { color: #1ba8bb; }

    /* ----------- Buscador ----------- */
    .search-box {
      text-align: center;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 50%;
      padding: 10px;
      border-radius: 15px;
      border: 1px solid var(--gris);
      box-shadow: var(--sombra);
    }

    /* ----------- Modal general ----------- */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    .modal.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: rgba(255,255,255,0.9);
      border-radius: 20px;
      padding: 25px;
      width: 90%;
      max-width: 500px;
      box-shadow: var(--sombra);
      transform: scale(0.95);
      animation: popin 0.3s forwards;
    }

    @keyframes popin {
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .close {
      cursor: pointer;
      font-size: 22px;
      color: #666;
      transition: color 0.2s;
    }

    .close:hover {
      color: var(--azul);
    }

    .fact-card {
      background: white;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 12px;
      box-shadow: var(--sombra);
      cursor: pointer;
      transition: 0.2s;
    }

    .fact-card:hover {
      transform: translateY(-3px);
      background: #f1fdff;
    }

    .factura-detail .label {
      font-weight: 600;
      color: var(--azul);
    }

    .factura-detail .value {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <h2>📜 Gestión de Facturas - Discovery Pets</h2>
  <div class="container">

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="🔍 Buscar por producto (Enter para buscar)" />
    </div>

    <form id="facturaForm">
      <input id="codigo" placeholder="Código" required />
      <input id="numeroFactura" placeholder="N° de Factura" required />
      <select id="proveedor" required></select>
      <textarea id="producto" placeholder="Producto o Descripción" required></textarea>
      <input id="monto" type="number" placeholder="Monto" required />
      <select id="moneda">
        <option>S/</option>
        <option>$</option>
      </select>
      <select id="tipo">
        <option>Compra</option>
        <option>Venta</option>
        <option>Servicio</option>
      </select>
      <input id="fecha" type="date" required />
      <button type="submit">Registrar</button>
    </form>

    <table id="facturasTable">
      <thead>
        <tr>
          <th>Código</th>
          <th>N° Factura</th>
          <th>Proveedor</th>
          <th>Producto / Descripción</th>
          <th>Monto</th>
          <th>Moneda</th>
          <th>Tipo</th>
          <th>Fecha</th>
          <th>✏️</th>
          <th>🗑️</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Modal resultados -->
  <div class="modal" id="modalResultados">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="resultTitle">Resultados</h3>
        <span class="close" onclick="closeResultados()">✖</span>
      </div>
      <p id="resultSub"></p>
      <div id="resultsContainer"></div>
    </div>
  </div>

  <!-- Modal detalle factura -->
  <div class="modal" id="modalFactura">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="facturaTitle"></h3>
        <span class="close" onclick="closeFactura()">✖</span>
      </div>
      <div id="modalFacturaContenido"></div>
    </div>
  </div>

  <!-- Modal edición descripción -->
  <div class="modal" id="modalEditDesc">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="editDescTitle"></h3>
        <span class="close" onclick="closeEditDesc()">✖</span>
      </div>
      <textarea id="editDescTextarea"></textarea>
      <button id="saveDescBtn">Guardar cambios</button>
    </div>
  </div>

  <!-- ================= SCRIPT PRINCIPAL ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, onSnapshot,
      deleteDoc, doc, updateDoc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIo7CBX5jzAGlDFBu0mMb6BFfUsecaf7I",
      authDomain: "discovery-pets.firebaseapp.com",
      projectId: "discovery-pets",
      storageBucket: "discovery-pets.appspot.com",
      messagingSenderId: "481355972999",
      appId: "1:481355972999:web:1234567890abcdef"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ================= CARGAR PROVEEDORES =================
    const proveedorSelect = document.getElementById("proveedor");
    const cargarProveedores = () => {
      onSnapshot(collection(db, "proveedores"), (snap) => {
        proveedorSelect.innerHTML = "<option value=''>Seleccione proveedor</option>";
        snap.forEach((d) => {
          const data = d.data();
          proveedorSelect.innerHTML += `<option value="${data.nombre}">${data.nombre}</option>`;
        });
      });
    };
    cargarProveedores();

    // ================= REGISTRAR FACTURA =================
    const facturaForm = document.getElementById("facturaForm");
    facturaForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nuevaFactura = {
        codigo: codigo.value,
        numero: numeroFactura.value,
        proveedor: proveedor.value,
        producto: producto.value,
        monto: monto.value,
        moneda: moneda.value,
        tipo: tipo.value,
        fecha: fecha.value
      };
      await addDoc(collection(db, "facturas"), nuevaFactura);
      facturaForm.reset();
    });

    // ================= MOSTRAR FACTURAS =================
    const tbody = document.querySelector("#facturasTable tbody");
    onSnapshot(collection(db, "facturas"), (snap) => {
      tbody.innerHTML = "";
      snap.forEach((docu) => {
        const d = docu.data();
        const tr = document.createElement("tr");
        tr.dataset.id = docu.id;
        tr.dataset.tipo = "facturas";
        tr.innerHTML = `
          <td contenteditable="true" class="editable" data-field="codigo">${d.codigo || ""}</td>
          <td contenteditable="true" class="editable" data-field="numero">${d.numero || ""}</td>
          <td contenteditable="true" class="editable" data-field="proveedor">${d.proveedor || ""}</td>
          <td contenteditable="true" class="editable" data-field="producto">${d.producto || ""}</td>
          <td contenteditable="true" class="editable" data-field="monto">${d.monto || ""}</td>
          <td contenteditable="true" class="editable" data-field="moneda">${d.moneda || ""}</td>
          <td contenteditable="true" class="editable" data-field="tipo">${d.tipo || ""}</td>
          <td contenteditable="true" class="editable" data-field="fecha">${d.fecha || ""}</td>
          <td><button class="btn-edit-desc" data-id="${docu.id}" data-tipo="facturas">✏️</button></td>
          <td><button class="btn-delete" data-id="${docu.id}" data-tipo="facturas">🗑️</button></td>
        `;
        tbody.appendChild(tr);
      });
    });

    // ================= ELIMINAR / EDITAR =================
    document.addEventListener("click", async (e) => {
      if (e.target.classList.contains("btn-delete")) {
        const id = e.target.dataset.id;
        if (confirm("¿Deseas eliminar esta factura?")) {
          await deleteDoc(doc(db, "facturas", id));
        }
      }

      if (e.target.classList.contains("btn-edit-desc")) {
        descEditId = e.target.dataset.id;
        descEditTipo = e.target.dataset.tipo;
        const docSnap = await getDoc(doc(db, descEditTipo, descEditId));
        if (docSnap.exists()) {
          editDescTextarea.value = docSnap.data().producto || "";
          document.getElementById("editDescTitle").textContent = "Editar descripción del producto";
          modalEditDesc.classList.add("show");
        }
      }
    });

    saveDescBtn.addEventListener("click", async () => {
      if (!descEditId) return;
      const texto = editDescTextarea.value.trim();
      await updateDoc(doc(db, "facturas", descEditId), { producto: texto });
      closeEditDesc();
    });

    function closeEditDesc() { modalEditDesc.classList.remove("show"); }

    // ================= EDITAR EN LINEA =================
    document.addEventListener("blur", async (e) => {
      if (e.target.classList.contains("editable")) {
        const celda = e.target;
        const valor = celda.textContent.trim();
        const campo = celda.dataset.field;
        const id = celda.closest("tr").dataset.id;
        if (id && campo) await updateDoc(doc(db, "facturas", id), { [campo]: valor });
      }
    }, true);

    // ================= BUSCADOR =================
    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("keypress", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const valor = searchInput.value.toLowerCase();
        const querySnap = await onSnapshot(collection(db, "facturas"), (snap) => {
          const resultados = [];
          snap.forEach((d) => {
            const data = d.data();
            if ((data.producto || "").toLowerCase().includes(valor)) resultados.push(data);
          });
          mostrarResultadosModal(valor, resultados);
        });
      }
    });

    const modalResultados = document.getElementById("modalResultados");
    const resultsContainer = document.getElementById("resultsContainer");
    const resultTitle = document.getElementById("resultTitle");
    const resultSub = document.getElementById("resultSub");

    function mostrarResultadosModal(valor, resultados) {
      modalResultados.classList.add("show");
      resultTitle.textContent = `Resultados para "${valor}"`;
      resultSub.textContent = `${resultados.length} coincidencia(s) encontradas`;
      resultsContainer.innerHTML = "";
      if (!resultados.length) {
        resultsContainer.innerHTML = "<p>No se encontraron resultados.</p>";
        return;
      }
      resultados.forEach((f) => {
        const card = document.createElement("div");
        card.className = "fact-card";
        card.innerHTML = `
          <h4>${f.codigo || "Sin código"}</h4>
          <div>${f.proveedor || ""}</div>
          <div>${f.producto || ""}</div>
          <div class="meta">
            <span>${f.moneda || ""}${f.monto || ""}</span>
            <span>${f.fecha || ""}</span>
          </div>`;
        card.addEventListener("click", () => mostrarFacturaDetalle(f));
        resultsContainer.appendChild(card);
      });
    }
    function closeResultados() { modalResultados.classList.remove("show"); }

    // ================= MODAL DETALLE =================
    const modalFactura = document.getElementById("modalFactura");
    const modalFacturaContenido = document.getElementById("modalFacturaContenido");

    function mostrarFacturaDetalle(f) {
      modalFactura.classList.add("show");
      document.getElementById("facturaTitle").textContent = `Factura ${f.codigo}`;
      modalFacturaContenido.innerHTML = `
        <div class="factura-detail">
          <div class="label">Proveedor</div><div class="value">${f.proveedor}</div>
          <div class="label">Producto / Descripción</div><div class="value">${f.producto}</div>
          <div class="label">Monto</div><div class="value">${f.moneda}${f.monto}</div>
          <div class="label">Tipo</div><div class="value">${f.tipo}</div>
          <div class="label">Fecha</div><div class="value">${f.fecha}</div>
        </div>`;
    }
    function closeFactura() { modalFactura.classList.remove("show"); }

    // Cierre por tecla Escape
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        [modalResultados, modalFactura, modalEditDesc].forEach(m => m.classList.remove("show"));
      }
    });
  </script>
</body>
</html>
