<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets · Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f5f5f5; }
    .nav { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .nav-btn { cursor: pointer; padding: 0.5rem 1rem; border-radius: 5px; background: #fff; border: 1px solid #ddd; }
    .nav-btn.activo { background: #0d6efd; color: #fff; border-color: #0d6efd; }
    .seccion { display: none; }
    .seccion.activa { display: block; }
    .btn-accion { margin: 0 2px; cursor: pointer; border: none; background: none; }
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-dialog { background: #fff; padding: 2rem; border-radius: 10px; max-width: 600px; width: 100%; }
    #campoAdicional { display: none; margin-top: 0.5rem; }
    table { background: #fff; border-radius: 8px; overflow: hidden; }
    table th, table td { padding: 0.5rem; text-align: center; border-bottom: 1px solid #ddd; }
    #searchResults { position: absolute; background: #fff; border: 1px solid #ccc; width: 90%; max-width: 400px; z-index: 1000; }
    .resultado-item { padding: 0.5rem; border-bottom: 1px solid #eee; cursor: pointer; }
    .resultado-item:hover { background: #f0f0f0; }
    .form-row { display: flex; gap: 0.5rem; align-items: center; }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <div class="nav mb-4">
    <div class="nav-btn activo" data-target="seccionProveedores">Proveedores</div>
    <div class="nav-btn" data-target="seccionProductos">Productos</div>
    <div class="nav-btn" data-target="seccionFacturas">Facturas</div>
  </div>

  <!-- SEARCH -->
  <div class="mb-3 position-relative">
    <input type="text" id="searchInput" class="form-control" placeholder="Buscar productos o facturas...">
    <div id="searchResults"></div>
  </div>

  <!-- SECCIÓN PROVEEDORES -->
  <div class="seccion activa" id="seccionProveedores">
    <h3>Proveedores</h3>
    <form id="formProveedor" class="mb-3">
      <div class="form-row">
        <select id="tipoDocumentoProveedor" class="form-select" required>
          <option value="">Tipo Documento</option>
          <option value="DNI">DNI</option>
          <option value="RUC">RUC</option>
          <option value="Pasaporte">Pasaporte</option>
        </select>
        <input type="text" id="numeroDocumentoProveedor" class="form-control" placeholder="Número Documento" required>
      </div>
      <input type="text" id="nombreProveedor" class="form-control mt-2" placeholder="Nombre" required>
      <input type="text" id="direccionProveedor" class="form-control mt-2" placeholder="Dirección">
      <input type="text" id="telefonoProveedor" class="form-control mt-2" placeholder="Teléfono">
      <button type="submit" class="btn btn-primary mt-2">Guardar Proveedor</button>
    </form>
    <table class="table" id="tablaProveedores">
      <thead>
        <tr>
          <th>Documento</th>
          <th>Nombre</th>
          <th>Dirección</th>
          <th>Teléfono</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- SECCIÓN PRODUCTOS -->
  <div class="seccion" id="seccionProductos">
    <h3>Productos</h3>
    <form id="formProducto" class="mb-3">
      <input type="text" id="nombreProducto" class="form-control mb-2" placeholder="Nombre Producto" required>
      <div class="form-row">
        <input type="text" id="presentacionProducto" class="form-control" placeholder="Presentación">
        <input type="number" id="cantidadPresentacion" class="form-control" placeholder="Cantidad">
      </div>
      <div class="form-row mt-2">
        <input type="number" id="precioProducto" class="form-control" placeholder="Precio">
        <select id="tipoMoneda" class="form-select">
          <option value="S/." selected>S/.</option>
          <option value="$">$</option>
        </select>
      </div>
      <textarea id="descripcionProducto" class="form-control mt-2" placeholder="Descripción"></textarea>
      <button type="submit" class="btn btn-primary mt-2">Guardar Producto</button>
    </form>
    <table class="table" id="tablaProductos">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Presentación</th>
          <th>Precio</th>
          <th>Descripción</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- SECCIÓN FACTURAS -->
  <div class="seccion" id="seccionFacturas">
    <h3>Facturas</h3>
    <form id="formFactura" class="mb-3">
      <input type="date" id="fechaFactura" class="form-control mb-2" required>
      <select id="tipoFactura" class="form-select mb-2" required>
        <option value="">Tipo Factura</option>
        <option value="Factura">Factura</option>
        <option value="Nota de Crédito">Nota de Crédito</option>
      </select>
      <div id="campoAdicional">
        <input type="text" id="detalleAdicional" class="form-control" placeholder="Detalle adicional">
      </div>
      <select id="proveedorFactura" class="form-select mb-2" required></select>
      <select id="productoFactura" class="form-select mb-2" required></select>
      <input type="number" id="montoFactura" class="form-control mb-2" placeholder="Monto" required>
      <input type="number" id="igvFactura" class="form-control mb-2" placeholder="IGV" readonly>
      <input type="number" id="totalFactura" class="form-control mb-2" placeholder="Total" readonly>
      <button type="submit" class="btn btn-primary">Guardar Factura</button>
    </form>
    <table class="table" id="tablaFacturas">
      <thead>
        <tr>
          <th>ID</th>
          <th>Fecha</th>
          <th>Proveedor</th>
          <th>Producto</th>
          <th>Subtotal</th>
          <th>IGV</th>
          <th>Total</th>
          <th>Tipo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- MODAL FACTURA -->
  <dialog class="modal" id="modalFactura">
    <div class="modal-dialog">
      <h5>Detalle Factura</h5>
      <div id="modalFacturaBody"></div>
      <button class="btn btn-secondary mt-2" id="cerrarModalFactura">Cerrar</button>
    </div>
  </dialog>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
