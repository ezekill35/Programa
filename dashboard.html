<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets · Dashboard 3D</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/616/616408.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#e0f7fa 0%,#80deea 100%);min-height:100vh;overflow-x:hidden;position:relative;}
    .floating-shapes{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
    .shape{position:absolute;opacity:0.15;animation:float 20s infinite ease-in-out;}
    .shape:nth-child(1){top:10%;left:10%;font-size:80px;animation-delay:0s;}
    .shape:nth-child(2){top:60%;left:70%;font-size:100px;animation-delay:3s;}
    .shape:nth-child(3){top:80%;left:20%;font-size:70px;animation-delay:6s;}
    .shape:nth-child(4){top:30%;left:80%;font-size:90px;animation-delay:9s;}
    @keyframes float{0%,100%{transform:translateY(0) rotate(0deg);}25%{transform:translateY(-30px) rotate(5deg);}50%{transform:translateY(-60px) rotate(-5deg);}75%{transform:translateY(-30px) rotate(3deg);}}

    /* Sidebar */
    .sidebar{width:250px;background:linear-gradient(180deg,#14b8a6 0%,#0284c7 100%);color:white;height:100vh;position:fixed;padding:1.5rem 1rem;border-radius:0 20px 20px 0;box-shadow:4px 0 20px rgba(0,0,0,0.2);transition:all 0.3s;transform-style:preserve-3d;z-index:1000;}
    .sidebar h3{text-align:center;font-weight:700;margin-bottom:1.5rem;text-shadow:1px 1px 2px rgba(0,0,0,0.3);}
    .nav-btn{display:block;width:100%;background:transparent;color:white;border:none;text-align:left;padding:0.75rem 1rem;border-radius:12px;margin-bottom:0.5rem;font-weight:600;font-size:15px;transition:all 0.3s;cursor:pointer;transform-style:preserve-3d;}
    .nav-btn:hover,.nav-btn.activo{background:rgba(255,255,255,0.2);transform:translateX(5px) translateZ(10px) scale(1.05);box-shadow:0 10px 20px rgba(0,0,0,0.15);}
    #btnCerrarSesion{margin-top:2rem;background:linear-gradient(135deg,#f56565 0%,#e53e3e 100%);color:white;font-weight:700;}
    #btnCerrarSesion:hover{background:linear-gradient(135deg,#e53e3e 0%,#c53030 100%);box-shadow:0 10px 25px rgba(229,62,62,0.5);}

    /* Main content */
    main{margin-left:270px;padding:2.5rem;position:relative;z-index:1;min-height:100vh;}
    .header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;background:rgba(255,255,255,0.95);backdrop-filter:blur(15px);padding:1rem 2rem;border-radius:25px;box-shadow:0 10px 25px rgba(0,0,0,0.15);}
    .header-bar h2{font-weight:800;font-size:1.8rem;color:#0284c7;margin:0;}
    #searchInput{width:100%;max-width:350px;border-radius:12px;border:2px solid rgba(0,0,0,0.1);padding:0.5rem 1rem;}

    /* Cards / tablas */
    .tabla-container{background:white;border-radius:20px;padding:1.5rem;margin-bottom:2rem;box-shadow:0 10px 30px rgba(0,0,0,0.1);transition:transform 0.2s;transform-style:preserve-3d;}
    .tabla-container:hover{transform:translateY(-5px);}
    .tabla-container h4{margin-bottom:1rem;font-weight:700;color:#0284c7;}
    .form-control,.form-select,textarea{border-radius:10px;border:2px solid rgba(2,132,199,0.3);padding:0.5rem 1rem;margin-bottom:1rem;}
    .btn{border-radius:12px;font-weight:600;transition:all 0.3s;}
    .btn-success{background:linear-gradient(135deg,#14b8a6 0%,#0284c7 100%);border:none;color:white;}
    .btn-success:hover{transform:scale(1.05);box-shadow:0 8px 25px rgba(0,0,0,0.2);}
    .btn-secondary:hover{transform:scale(1.05);}
    .btn-accion{background:transparent;border:none;font-size:1rem;margin-right:5px;cursor:pointer;transition:transform 0.2s;}
    .btn-accion:hover{transform:scale(1.2);}
    .resultado-item{background:#e0f2fe;border-radius:10px;padding:0.75rem;margin-bottom:5px;cursor:pointer;transition:background 0.2s;}
    .resultado-item:hover{background:#bae6fd;}

    /* Modales */
    dialog{border:none;border-radius:15px;padding:1.5rem;max-width:450px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,0.3);}
    dialog::backdrop{background:rgba(0,0,0,0.4);}

    /* Secciones */
    .seccion{display:none;}
    .seccion.activa{display:block;}

    @media (max-width:768px){
      main{margin-left:0;padding:1rem;}
      .sidebar{width:100%;height:auto;border-radius:0;position:relative;display:flex;flex-wrap:wrap;justify-content:center;}
      .nav-btn{margin:0.2rem;flex:1 1 45%;}
    }
  </style>
</head>
<body>
  <div class="floating-shapes">
    <div class="shape">🐶</div>
    <div class="shape">🐱</div>
    <div class="shape">🦜</div>
    <div class="shape">🐾</div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <h3>Discovery Pets</h3>
    <button class="nav-btn activo" data-target="dashboard">📊 Dashboard</button>
    <button class="nav-btn" data-target="proveedores">🏢 Proveedores</button>
    <button class="nav-btn" data-target="productos">📦 Productos</button>
    <button class="nav-btn" data-target="facturas">🧾 Facturas</button>
    <button id="btnCerrarSesion" class="nav-btn mt-4">🚪 Cerrar sesión</button>
  </aside>

  <main>
    <div class="header-bar">
      <h2 class="fw-bold text-primary">Panel General</h2>
      <input type="text" id="searchInput" class="form-control" placeholder="Buscar producto o factura...">
    </div>
    <div id="searchResults" class="mb-4"></div>

    <!-- Dashboard principal -->
    <section id="dashboard" class="seccion activa">
      <div class="row g-4">
        <div class="col-md-4"><div class="tabla-container text-center"><h5 class="text-secondary">Total Facturas</h5><h3 id="countFacturas">0</h3></div></div>
        <div class="col-md-4"><div class="tabla-container text-center"><h5 class="text-secondary">Total Proveedores</h5><h3 id="countProveedores">0</h3></div></div>
        <div class="col-md-4"><div class="tabla-container text-center"><h5 class="text-secondary">Total Productos</h5><h3 id="countProductos">0</h3></div></div>
      </div>
    </section>

    <!-- Proveedores -->
    <section id="proveedores" class="seccion">
      <div class="tabla-container">
        <h4>Registrar Proveedor</h4>
        <form id="formProveedor" class="row g-3">
          <div class="col-md-3">
            <select id="tipoDocumentoProveedor" class="form-select" required>
              <option value="">Tipo de documento</option>
              <option>RUC</option>
              <option>DNI</option>
              <option>Pasaporte</option>
              <option>CE</option>
              <option>Otros</option>
            </select>
          </div>
          <div class="col-md-3">
            <input type="text" id="numeroDocumentoProveedor" class="form-control" placeholder="Número de documento" required>
          </div>
          <div class="col-md-6">
            <input type="text" id="nombreProveedor" class="form-control" placeholder="Nombre o Razón Social" required>
          </div>
          <div class="col-md-6"><input type="text" id="direccionProveedor" class="form-control" placeholder="Dirección"></div>
          <div class="col-md-6"><input type="text" id="telefonoProveedor" class="form-control" placeholder="Teléfono"></div>
          <div class="col-12"><button class="btn btn-success">Registrar</button></div>
        </form>
      </div>

      <div class="tabla-container">
        <h4>Lista de Proveedores</h4>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Tipo Documento</th>
              <th>Número</th>
              <th>Nombre</th>
              <th>Dirección</th>
              <th>Teléfono</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProveedores"></tbody>
        </table>
      </div>
    </section>

    <!-- Modal flotante para editar proveedor -->
    <dialog id="modalEditarProveedor">
      <h4>Editar Proveedor</h4>
      <form id="formEditarProveedor" class="row g-2">
        <div class="col-md-6">
          <label>Tipo Documento</label>
          <input type="text" id="editTipoDoc" class="form-control mb-1">
        </div>
        <div class="col-md-6">
          <label>Número Documento</label>
          <input type="text" id="editNumDoc" class="form-control mb-1">
        </div>
        <div class="col-12">
          <label>Nombre</label>
          <input type="text" id="editNombre" class="form-control mb-1">
        </div>
        <div class="col-md-6">
          <label>Dirección</label>
          <input type="text" id="editDir" class="form-control mb-1">
        </div>
        <div class="col-md-6">
          <label>Teléfono</label>
          <input type="text" id="editTel" class="form-control mb-1">
        </div>
        <div class="col-12 d-flex justify-content-end gap-2 mt-2">
          <button type="button" id="cerrarModalEditarProveedor" class="btn btn-secondary">Cerrar</button>
          <button type="submit" class="btn btn-success">Guardar Cambios</button>
        </div>
      </form>
    </dialog>

  </main>

  <!-- Conectar JS externo -->
  <script type="module" src="dashboard.js"></script>
</body>
</html>
