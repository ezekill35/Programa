<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- MENÚ LATERAL -->
    <aside class="sidebar">
      <h2>🐾 Discovery Pets</h2>
      <ul class="menu">
        <li class="menu-item active" data-target="seccionProveedor">Proveedor</li>
        <li class="menu-item" data-target="seccionFactura">Factura</li>
        <li class="menu-item" data-target="seccionGastos">Gastos</li>
        <li class="menu-item" data-target="seccionServicio">Servicio</li>
        <li class="menu-item logout" id="btnLogout">Cerrar Sesión</li>
      </ul>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <!-- SECCION PROVEEDORES -->
      <section id="seccionProveedor" class="section">
        <h3>Proveedor</h3>
        <div class="formulario">
          <input type="text" id="provRUC" placeholder="RUC">
          <input type="text" id="provNombre" placeholder="Nombre">
          <input type="text" id="provDireccion" placeholder="Dirección">
          <button id="btnAgregarProveedor">Agregar</button>
        </div>
        <div class="formulario">
          <input type="text" id="buscarProveedor" placeholder="Buscar proveedor por RUC o Nombre">
          <button id="btnBuscarProveedor">Buscar</button>
        </div>
        <table id="tablaProveedores">
          <thead>
            <tr><th>RUC</th><th>Nombre</th><th>Dirección</th><th>Acción</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- SECCION FACTURAS -->
      <section id="seccionFactura" class="section hidden">
        <h3>Factura</h3>
        <div class="formulario">
          <input type="text" id="facRUC" placeholder="RUC">
          <input type="text" id="facProveedor" placeholder="Proveedor">
          <input type="text" id="facTipo" placeholder="Tipo de Factura">
          <input type="text" id="facDescripcion" placeholder="Descripción">
          <input type="date" id="facFecha">
          <button id="btnAgregarFactura">Agregar</button>
        </div>
        <table id="tablaFacturas">
          <thead>
            <tr><th>RUC</th><th>Proveedor</th><th>Tipo</th><th>Descripción</th><th>Fecha</th><th>Acción</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- SECCION GASTOS -->
      <section id="seccionGastos" class="section hidden">
        <h3>Gastos</h3>
        <div class="formulario">
          <input type="text" id="gastoDescripcion" placeholder="Descripción">
          <input type="number" id="gastoMonto" placeholder="Monto">
          <button id="btnAgregarGasto">Agregar</button>
        </div>
        <table id="tablaGastos">
          <thead>
            <tr><th>Descripción</th><th>Monto</th><th>Acción</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- SECCION SERVICIOS -->
      <section id="seccionServicio" class="section hidden">
        <h3>Servicio</h3>
        <div class="formulario">
          <input type="text" id="servDescripcion" placeholder="Descripción">
          <input type="date" id="servFecha">
          <button id="btnAgregarServicio">Agregar</button>
        </div>
        <table id="tablaServicios">
          <thead>
            <tr><th>Descripción</th><th>Fecha</th><th>Acción</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
