<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Discovery Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1: #f7fbff; --bg2: #eef9ff; --card: #ffffff; --accent: #10bcd4; --muted: #6b7280;
  --shadow-lg: 0 10px 30px rgba(16,188,212,0.12); --shadow-md: 0 6px 18px rgba(16,188,212,0.08);
  --radius: 16px;
}
*{box-sizing:border-box;font-family:'Inter',system-ui,Segoe UI,Roboto,Arial,sans-serif}
html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#0f172a}
.app{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:32px;min-height:100vh;align-items:start;}
.sidebar{position:sticky;top:32px;padding:20px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.7));box-shadow:var(--shadow-lg);backdrop-filter:blur(6px);}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px;}
.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#55d1e2);box-shadow:0 8px 20px rgba(16,188,212,0.2);display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:18px;}
.brand h1{font-size:16px;margin:0}
.nav{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
.menu-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:none;background:transparent;color:#0f172a;cursor:pointer;transition:all .18s ease;}
.menu-btn:hover{transform:translateY(-3px)}
.menu-btn.activo, .menu-btn:focus{background:linear-gradient(90deg,rgba(16,188,212,0.12),rgba(16,188,212,0.06));box-shadow:var(--shadow-md);border-left:3px solid var(--accent);}
.menu-btn .ico{width:18px;height:18px;display:inline-block;opacity:0.9}
.logout{margin-top:18px;padding:10px;border-radius:12px;background:transparent;border:1px solid rgba(15,23,42,0.06);cursor:pointer;}
.main{padding:28px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.82));box-shadow:var(--shadow-lg);backdrop-filter:blur(4px);}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.header h2{margin:0;font-weight:700;color:#07203a}
.search-box{display:flex;gap:10px;align-items:center;}
input[type="search"]{padding:10px 14px;border-radius:12px;border:1px solid rgba(10,20,30,0.06);min-width:280px;box-shadow:var(--shadow-md);}
.tabs{display:flex;gap:12px;margin-bottom:18px;}
.seccion{display:none;}
.seccion.activa{display:block;animation:fadeIn .28s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 420px;gap:18px;}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow-md);border:1px solid rgba(15,23,42,0.03);}
.card h3{margin:0 0 8px 0;font-size:15px}
form .row{display:flex;gap:8px;margin-bottom:10px} 
form input, form select{padding:10px;border-radius:10px;border:1px solid rgba(10,20,30,0.06);flex:1}
table{width:100%;border-collapse:collapse}
table th, table td{padding:10px;text-align:left;border-bottom:1px dashed rgba(10,20,30,0.04);font-size:14px}
.table-scroll{max-height:420px;overflow:auto;padding-right:6px}
.btn{padding:8px 12px;border-radius:10px;border:none;cursor:pointer;background:var(--accent);color:white;font-weight:600;box-shadow:0 6px 18px rgba(16,188,212,0.12)}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid rgba(16,188,212,0.12)}
.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand"><div class="logo">DP</div><div><h1>Discovery Pets</h1><div class="muted">Panel administrativo</div></div></div>
    <nav class="nav">
      <button class="menu-btn activo" data-target="seccion-proveedores">🏢 Proveedores</button>
      <button class="menu-btn" data-target="seccion-productos">📦 Productos</button>
      <button class="menu-btn" data-target="seccion-facturas">🧾 Facturas</button>
    </nav>
    <button id="logoutBtn" class="logout">Cerrar sesión</button>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="header">
      <h2>Dashboard · Discovery Pets</h2>
      <div class="search-box">
        <input id="buscadorFactura" type="search" placeholder="Buscar factura por producto">
        <button class="btn secondary" id="btnRefresh">Restablecer</button>
      </div>
    </div>

    <div class="grid">
      <div>
        <!-- Proveedores -->
        <section id="seccion-proveedores" class="seccion activa">
          <div class="card">
            <h3>Registrar proveedor</h3>
            <form id="proveedorForm">
              <div class="row">
                <input id="nombreProveedor" placeholder="Nombre" required>
                <input id="rucProveedor" placeholder="RUC" required>
              </div>
              <div class="row">
                <input id="telefonoProveedor" placeholder="Teléfono">
                <input id="numeroOpcionalProveedor" placeholder="Número opcional">
              </div>
              <div class="row">
                <input id="direccionProveedor" placeholder="Dirección">
                <button class="btn" type="submit">Añadir proveedor</button>
              </div>
            </form>
          </div>
          <div class="card" style="margin-top:12px">
            <h3>Proveedores registrados</h3>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr><th>Nombre</th><th>RUC</th><th>Teléfono</th><th>Opc.</th><th>Dirección</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaProveedores"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

// --------------------- CONFIG FIREBASE ---------------------
const firebaseConfig = {
  apiKey: "AIzaSyCIo7CBX5jzAGlDFBu0mMb6BFfUsecaf7I",
  authDomain: "discovery-pets.firebaseapp.com",
  projectId: "discovery-pets",
  storageBucket: "discovery-pets.appspot.com",
  messagingSenderId: "481355972999",
  appId: "1:481355972999:web:5f5fa07f75b3fc9f4c5322"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// --------------------- ELEMENTOS ---------------------
const proveedorForm = document.getElementById("proveedorForm");
const tablaProveedores = document.getElementById("tablaProveedores");

// --------------------- FUNCIONES ---------------------
const resetFormProveedor = () => proveedorForm.reset();

// Añadir proveedor
proveedorForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const nombre = document.getElementById("nombreProveedor").value;
  const ruc = document.getElementById("rucProveedor").value;
  const telefono = document.getElementById("telefonoProveedor").value;
  const opc = document.getElementById("numeroOpcionalProveedor").value;
  const direccion = document.getElementById("direccionProveedor").value;

  await addDoc(collection(db, "proveedores"), { nombre, ruc, telefono, opc, direccion });
  resetFormProveedor();
});

// Borrar proveedor
window.borrarProveedor = async (id) => {
  if (confirm("¿Desea eliminar este proveedor?")) {
    await deleteDoc(doc(db, "proveedores", id));
  }
};

// Editar proveedor (simple prompt)
window.editarProveedor = async (id, data) => {
  const nombre = prompt("Nombre:", data.nombre);
  const ruc = prompt("RUC:", data.ruc);
  const telefono = prompt("Teléfono:", data.telefono);
  const opc = prompt("Número opcional:", data.opc);
  const direccion = prompt("Dirección:", data.direccion);

  if (nombre && ruc) { // requeridos
    await updateDoc(doc(db, "proveedores", id), { nombre, ruc, telefono, opc, direccion });
  }
};

// Listar proveedores en tiempo real
onSnapshot(collection(db, "proveedores"), (snapshot) => {
  tablaProveedores.innerHTML = "";
  snapshot.forEach(docu => {
    const d = docu.data();
    tablaProveedores.innerHTML += `<tr>
      <td>${d.nombre}</td>
      <td>${d.ruc}</td>
      <td>${d.telefono}</td>
      <td>${d.opc}</td>
      <td>${d.direccion}</td>
      <td>
        <button onclick="editarProveedor('${docu.id}', ${JSON.stringify(d).replace(/"/g,'&quot;')})">✏️</button>
        <button onclick="borrarProveedor('${docu.id}')">❌</button>
      </td>
    </tr>`;
  });
});
</script>
<script type="module">
// --------------------- ELEMENTOS ---------------------
const productoForm = document.getElementById("productoForm");
const tablaProductos = document.getElementById("tablaProductos");
const productoSelect = document.getElementById("productoFactura");

const facturaForm = document.getElementById("facturaForm");
const tablaFacturas = document.getElementById("tablaFacturas");
const proveedorSelect = document.getElementById("proveedorFactura");

// --------------------- CRUD PRODUCTOS ---------------------
productoForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const nombre = document.getElementById("nombreProducto").value;
  const precio = document.getElementById("precioProducto").value;
  const cantidad = document.getElementById("cantidadProducto").value;
  const descripcion = document.getElementById("descripcionProducto").value;

  await addDoc(collection(db, "productos"), { nombre, precio, cantidad, descripcion });
  productoForm.reset();
});

window.borrarProducto = async (id) => {
  if (confirm("¿Desea eliminar este producto?")) {
    await deleteDoc(doc(db, "productos", id));
  }
};

window.editarProducto = async (id, data) => {
  const nombre = prompt("Nombre:", data.nombre);
  const precio = prompt("Precio:", data.precio);
  const cantidad = prompt("Cantidad:", data.cantidad);
  const descripcion = prompt("Descripción:", data.descripcion);

  if (nombre) await updateDoc(doc(db, "productos", id), { nombre, precio, cantidad, descripcion });
};

// Listar productos en tiempo real
onSnapshot(collection(db, "productos"), snapshot => {
  tablaProductos.innerHTML = "";
  productoSelect.innerHTML = '<option value="">Seleccione producto</option>';
  snapshot.forEach(docu => {
    const d = docu.data();
    tablaProductos.innerHTML += `<tr>
      <td>${d.nombre}</td>
      <td>${d.precio}</td>
      <td>${d.cantidad}</td>
      <td>${d.descripcion}</td>
      <td>
        <button onclick="editarProducto('${docu.id}', ${JSON.stringify(d).replace(/"/g,'&quot;')})">✏️</button>
        <button onclick="borrarProducto('${docu.id}')">❌</button>
      </td>
    </tr>`;
    productoSelect.innerHTML += `<option value="${d.nombre}">${d.nombre}</option>`;
  });
});

// --------------------- CRUD FACTURAS ---------------------
facturaForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const idF = document.getElementById("idFactura").value;
  const fecha = document.getElementById("fechaFactura").value;
  const proveedor = proveedorSelect.value;
  const producto = productoSelect.value;
  const monto = document.getElementById("montoFactura").value;
  const moneda = document.getElementById("monedaFactura").value;
  const tipo = document.getElementById("tipoFactura").value;

  await addDoc(collection(db, "facturas"), { id: idF, fecha, proveedor, producto, monto, moneda, tipo });
  facturaForm.reset();
});

window.borrarFactura = async (id) => {
  if (confirm("¿Desea eliminar esta factura?")) {
    await deleteDoc(doc(db, "facturas", id));
  }
};

window.editarFactura = async (id, data) => {
  const idF = prompt("ID factura:", data.id);
  const fecha = prompt("Fecha:", data.fecha);
  const proveedor = prompt("Proveedor:", data.proveedor);
  const producto = prompt("Producto:", data.producto);
  const monto = prompt("Monto:", data.monto);
  const moneda = prompt("Moneda:", data.moneda);
  const tipo = prompt("Tipo (FACTURA/BOLETA):", data.tipo);

  if (idF) await updateDoc(doc(db, "facturas", id), { id: idF, fecha, proveedor, producto, monto, moneda, tipo });
};

// Listar facturas en tiempo real
onSnapshot(collection(db, "facturas"), snapshot => {
  tablaFacturas.innerHTML = "";
  snapshot.forEach(docu => {
    const d = docu.data();
    tablaFacturas.innerHTML += `<tr>
      <td>${d.id}</td>
      <td>${d.fecha}</td>
      <td>${d.proveedor}</td>
      <td>${d.producto}</td>
      <td>${d.moneda}</td>
      <td>${d.monto}</td>
      <td>${d.tipo}</td>
      <td>
        <button onclick="editarFactura('${docu.id}', ${JSON.stringify(d).replace(/"/g,'&quot;')})">✏️</button>
        <button onclick="borrarFactura('${docu.id}')">❌</button>
      </td>
    </tr>`;
  });
});

// --------------------- BUSCADOR FACTURAS POR PRODUCTO ---------------------
const buscadorFactura = document.getElementById("buscadorFactura");
buscadorFactura.addEventListener("input", () => {
  const filtro = buscadorFactura.value.toLowerCase();
  const filas = tablaFacturas.querySelectorAll("tr");
  filas.forEach(fila => {
    const producto = fila.children[3].textContent.toLowerCase();
    fila.style.display = producto.includes(filtro) ? "" : "none";
  });
});

// --------------------- LOGOUT SIMPLIFICADO ---------------------
document.getElementById("logoutBtn").addEventListener("click", () => {
  alert("Sesión cerrada correctamente"); 
  location.reload();
});
</script>
