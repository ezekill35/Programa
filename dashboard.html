<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Dashboard</title>
<!-- Bootstrap CDN para 3D y estilos rápidos -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
/* ----------------- Body ----------------- */
body.dashboard-body {
    display: flex;
    min-height: 100vh;
    background: linear-gradient(145deg, #f500a0, #ff69b4);
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* ----------------- Sidebar ----------------- */
.sidebar {
    width: 220px;
    background-color: #a00070;
    display: flex;
    flex-direction: column;
    padding: 20px;
    border-radius: 0 20px 20px 0;
    box-shadow: 5px 0 15px rgba(0,0,0,0.3);
}
.sidebar h2 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 24px;
}
.nav-btn {
    padding: 12px;
    margin: 5px 0;
    border-radius: 8px;
    background: #ff69b4;
    border: none;
    cursor: pointer;
    transition: all 0.3s;
}
.nav-btn:hover, .nav-btn.active {
    background: #f500a0;
    transform: translateX(5px);
}
.logout-btn {
    margin-top: auto;
    padding: 12px;
    background-color: #ff1744;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
}
.logout-btn:hover {
    background-color: #d50000;
}

/* ----------------- Main ----------------- */
.main-content {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
}

/* ----------------- Sections ----------------- */
.content-section {
    display: none;
}
.content-section.active {
    display: block;
}
.content-section h2 {
    margin-bottom: 15px;
    color: #fff;
}

/* ----------------- Forms ----------------- */
form {
    background-color: rgba(255,255,255,0.2);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
form input, form select, form button {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
}
form button {
    background-color: #ff69b4;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
}
form button:hover {
    background-color: #f500a0;
}

/* ----------------- Tables ----------------- */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    backdrop-filter: blur(5px);
}
table th, table td {
    padding: 12px;
    text-align: left;
    color: #fff;
}
table th {
    background: #ff69b4;
}
table tr:hover {
    background: rgba(255,255,255,0.1);
}
button.edit-btn {
    background-color: #00bcd4;
    color: #fff;
}
button.delete-btn {
    background-color: #ff1744;
    color: #fff;
}
</style>
</head>
<body class="dashboard-body">

<div class="sidebar">
    <h2>🐾 Discovery Pets</h2>
    <button class="nav-btn active" data-section="proveedores">🏪 Proveedores</button>
    <button class="nav-btn" data-section="facturas">📑 Facturas</button>
    <button class="nav-btn" data-section="gastos">💰 Gastos</button>
    <button class="nav-btn" data-section="servicios">🛠 Servicios</button>
    <button id="logoutBtn" class="logout-btn mt-3">Cerrar sesión</button>
</div>

<main class="main-content">
    <!-- Proveedores -->
    <section id="proveedores" class="content-section active">
        <h2>Registro de Proveedores</h2>
        <form id="formProveedor">
            <input id="rucProv" placeholder="RUC" required>
            <input id="nombreProv" placeholder="Nombre" required>
            <input id="productoProv" placeholder="Producto" required>
            <input id="direccionProv" placeholder="Dirección" required>
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead>
                <tr><th>RUC</th><th>Nombre</th><th>Producto</th><th>Dirección</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaProveedores"></tbody>
        </table>
    </section>

    <!-- Facturas -->
    <section id="facturas" class="content-section">
        <h2>Registro de Facturas</h2>
        <form id="formFactura">
            <input id="proveedorFactura" placeholder="Proveedor" required>
            <input id="tipoFactura" placeholder="Tipo de factura" required>
            <input id="montoFactura" type="number" placeholder="Monto" required>
            <input id="monedaFactura" placeholder="Moneda" value="S/." required>
            <input id="fechaFactura" type="date" required>
            <input id="descFactura" placeholder="Descripción">
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead>
                <tr><th>Proveedor</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Descripción</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaFacturas"></tbody>
        </table>
    </section>

    <!-- Gastos -->
    <section id="gastos" class="content-section">
        <h2>Registro de Gastos</h2>
        <form id="formGasto">
            <input id="nombreGasto" placeholder="Nombre" required>
            <input id="tipoGasto" placeholder="Tipo" required>
            <input id="montoGasto" type="number" placeholder="Monto" required>
            <input id="fechaGasto" type="date" required>
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead>
                <tr><th>Nombre</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaGastos"></tbody>
        </table>
    </section>

    <!-- Servicios -->
    <section id="servicios" class="content-section">
        <h2>Registro de Servicios</h2>
        <form id="formServicio">
            <input id="nombreServ" placeholder="Nombre" required>
            <input id="precioServ" type="number" placeholder="Precio" required>
            <input id="fechaServ" type="date" required>
            <input id="descServ" placeholder="Descripción">
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead>
                <tr><th>Nombre</th><th>Precio</th><th>Fecha</th><th>Descripción</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaServicios"></tbody>
        </table>
    </section>
</main>

<!-- JS -->
<script type="module" src="script.js"></script>
<script>
const navBtns = document.querySelectorAll(".nav-btn");
const sections = document.querySelectorAll(".content-section");

navBtns.forEach(btn => {
    btn.addEventListener("click", ()=>{
        navBtns.forEach(b=>b.classList.remove("active"));
        sections.forEach(s=>s.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.section).classList.add("active");
    });
});
</script>

</body>
</html>
