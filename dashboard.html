<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Discovery Pets</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">🐶 Discovery Pets</a>
      <button class="btn btn-outline-light" onclick="logout()">Cerrar Sesión</button>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Resumen rápido -->
    <div class="row text-center mb-4" id="summary-cards">
      <div class="col-md-3 mb-3"><div class="card p-3">Total Productos<br><span id="total-products">0</span></div></div>
      <div class="col-md-3 mb-3"><div class="card p-3">Stock Bajo<br><span id="low-stock">0</span></div></div>
      <div class="col-md-3 mb-3"><div class="card p-3">Total Proveedores<br><span id="total-providers">0</span></div></div>
      <div class="col-md-3 mb-3"><div class="card p-3">Ventas del Mes<br>S/ <span id="sales-month">0.00</span></div></div>
    </div>

    <!-- Menú -->
    <ul class="nav nav-tabs mb-4" id="dashboard-menu">
      <li class="nav-item"><a class="nav-link active" href="#" onclick="showSection('products')">Productos</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('providers')">Proveedores</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('purchases')">Compras</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('sales')">Ventas</a></li>
      <li class="nav-item"><a class="nav-link" href="#" onclick="showSection('expenses')">Gastos</a></li>
    </ul>

    <!-- Contenido -->
    <div id="dashboard-content">
      <div id="products-section" class="content-section active"></div>
      <div id="providers-section" class="content-section"></div>
      <div id="purchases-section" class="content-section"></div>
      <div id="sales-section" class="content-section"></div>
      <div id="expenses-section" class="content-section"></div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
  <script type="module" src="firebase.js"></script>
</body>
</html>
