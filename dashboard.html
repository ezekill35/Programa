<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard · Discovery Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #333;
    }
    .sidebar {
      width: 250px;
      min-height: 100vh;
      background: linear-gradient(180deg, #004aad, #007bff);
      color: white;
      padding-top: 20px;
      position: fixed;
    }
    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .menu-btn {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      border: none;
      width: 100%;
      text-align: left;
      background: none;
      transition: 0.3s;
    }
    .menu-btn:hover, .menu-btn.activo {
      background: rgba(255,255,255,0.15);
    }
    main {
      margin-left: 260px;
      padding: 20px;
    }
    section {
      display: none;
      animation: fadeIn .4s ease;
    }
    .seccion-activa {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    table td, table th {
      vertical-align: middle;
    }
    .btn-eliminar, .btn-detalles {
      border: none;
      background: #ff4d4d;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-detalles {
      background: #0d6efd;
      margin-right: 5px;
    }
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <h2>🐾 Discovery Pets</h2>
    <button class="menu-btn activo" data-target="secProveedores">Proveedores</button>
    <button class="menu-btn" data-target="secProductos">Productos</button>
    <button class="menu-btn" data-target="secFacturas">Facturas</button>
  </aside>

  <main class="container-fluid">
    <!-- PROVEEDORES -->
    <section id="secProveedores" class="seccion-activa">
      <h3>📦 Proveedores</h3>
      <form id="formProveedor" class="row g-3 mt-2">
        <div class="col-md-4"><input id="provNombre" class="form-control" placeholder="Nombre" required></div>
        <div class="col-md-3"><input id="provRuc" class="form-control" placeholder="RUC" required></div>
        <div class="col-md-5"><input id="provDireccion" class="form-control" placeholder="Dirección"></div>
        <div class="col-md-3"><input id="provTelefono" class="form-control" placeholder="Teléfono"></div>
        <div class="col-md-3"><input id="provNumero" class="form-control" placeholder="N° Registro"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100">Guardar</button></div>
      </form>

      <table class="table table-striped mt-3">
        <thead><tr><th>Nombre</th><th>RUC</th><th>Dirección</th><th>Teléfono</th><th>N°</th><th>Acción</th></tr></thead>
        <tbody id="tablaProveedores"></tbody>
      </table>
    </section>

    <!-- PRODUCTOS -->
    <section id="secProductos">
      <h3>🧴 Productos</h3>
      <form id="formProducto" class="row g-3 mt-2">
        <div class="col-md-4"><input id="prodNombre" class="form-control" placeholder="Nombre" required></div>
        <div class="col-md-2"><input id="prodPrecio" type="number" class="form-control" placeholder="Precio" required></div>
        <div class="col-md-2"><input id="prodCantidad" type="number" class="form-control" placeholder="Cantidad" required></div>
        <div class="col-md-4"><input id="prodDescripcion" class="form-control" placeholder="Descripción"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100">Guardar</button></div>
      </form>

      <table class="table table-striped mt-3">
        <thead><tr><th>Nombre</th><th>Precio</th><th>Cantidad</th><th>Descripción</th><th>Acción</th></tr></thead>
        <tbody id="tablaProductos"></tbody>
      </table>
    </section>

    <!-- FACTURAS -->
    <section id="secFacturas">
      <h3>📑 Facturas</h3>
      <form id="formFactura" class="row g-3 mt-2">
        <div class="col-md-3">
          <select id="factProveedor" class="form-select" required>
            <option value="">Seleccionar proveedor</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="factProducto" class="form-select" required>
            <option value="">Seleccionar producto</option>
          </select>
        </div>
        <div class="col-md-2"><input id="factCantidad" type="number" class="form-control" placeholder="Cantidad" required></div>
        <div class="col-md-2"><input id="factTotal" type="number" class="form-control" placeholder="Total" required></div>
        <div class="col-md-2"><button class="btn btn-primary w-100">Registrar</button></div>
      </form>

      <div class="search-bar mt-3">
        <input id="buscadorFactura" class="form-control" placeholder="Buscar producto (Enter para filtrar)">
        <button id="btnRefresh" class="btn btn-secondary">Restablecer</button>
      </div>

      <table class="table table-striped mt-3">
        <thead><tr><th>Proveedor</th><th>Producto</th><th>Cantidad</th><th>Total</th><th>Acción</th></tr></thead>
        <tbody id="tablaFacturas"></tbody>
      </table>
    </section>
  </main>

  <!-- FIREBASE + DASHBOARD JS -->
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
