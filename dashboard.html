<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Discovery Pets</title>
<style>
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  background: #f8f9fa;
}
nav {
  background: #ff3399;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
}
nav h1 { margin: 0; font-size: 1.3rem; }
nav button {
  background: #fff;
  color: #ff3399;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
}
nav button:hover { background: #ff66cc; color: #fff; }

.container { padding: 30px; max-width: 1100px; margin: auto; }
section { background: #fff; padding: 25px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }

h2 { color: #ff3399; margin-top: 0; }

input, select {
  width: 100%; padding: 10px; margin: 8px 0;
  border: 1px solid #ccc; border-radius: 6px;
}
button.add {
  background: #ff3399; color: #fff; border: none;
  padding: 10px 20px; border-radius: 6px;
  cursor: pointer; transition: 0.3s;
}
button.add:hover { background: #ff66cc; }

table {
  width: 100%; border-collapse: collapse; margin-top: 10px;
}
th, td {
  padding: 10px; border-bottom: 1px solid #ddd; text-align: left;
}
th { background: #ffe0f0; }
.actions button {
  border: none; background: #ff3399; color: white;
  padding: 5px 10px; margin: 2px; border-radius: 6px; cursor: pointer;
}
.actions button:hover { background: #ff66cc; }

/* Buscador */
#buscadorContainer {
  display: flex; gap: 10px; margin-bottom: 20px;
}
#buscarProducto {
  flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px;
}
#btnBuscar, #btnReset {
  padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;
}
#btnBuscar { background: #ff3399; color: white; }
#btnReset { background: #ccc; }

/* Modal */
.modal {
  display: none; position: fixed; top: 0; left: 0;
  width: 100%; height: 100%; background: rgba(0,0,0,0.6);
  justify-content: center; align-items: center;
}
.modal-content {
  background: #fff; padding: 30px; border-radius: 10px;
  width: 400px; text-align: center;
}
</style>
</head>
<body>
<nav>
  <h1>Discovery Pets · Dashboard</h1>
  <button id="btnLogout">Cerrar sesión</button>
</nav>

<div class="container">
  <!-- 🔍 Buscador -->
  <div id="buscadorContainer">
    <input type="text" id="buscarProducto" placeholder="Buscar factura por producto...">
    <button id="btnBuscar">Buscar</button>
    <button id="btnReset">Restablecer</button>
  </div>

  <!-- 🧾 Sección Proveedores -->
  <section id="proveedoresSection">
    <h2>Registrar Proveedor</h2>
    <input type="text" id="provNombre" placeholder="Nombre">
    <input type="text" id="provRuc" placeholder="RUC">
    <input type="text" id="provTelefono" placeholder="Teléfono o Celular (opcional)">
    <input type="text" id="provDireccion" placeholder="Dirección">
    <button class="add" id="btnAddProveedor">Añadir Proveedor</button>
    <h3>Proveedores registrados</h3>
    <table id="tablaProveedores">
      <thead><tr><th>Nombre</th><th>RUC</th><th>Teléfono</th><th>Dirección</th><th>Acciones</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- 📦 Sección Productos -->
  <section id="productosSection">
    <h2>Registrar Producto</h2>
    <input type="text" id="prodNombre" placeholder="Nombre del producto">
    <input type="number" id="prodCantidad" placeholder="Cantidad">
    <input type="number" id="prodPrecio" placeholder="Precio">
    <input type="text" id="prodDescripcion" placeholder="Descripción (opcional)">
    <button class="add" id="btnAddProducto">Añadir Producto</button>
    <h3>Productos registrados</h3>
    <table id="tablaProductos">
      <thead><tr><th>Nombre</th><th>Cantidad</th><th>Precio</th><th>Descripción</th><th>Acciones</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- 💳 Sección Facturas -->
  <section id="facturasSection">
    <h2>Registrar Factura</h2>
    <input type="text" id="factId" placeholder="ID de factura">
    <input type="date" id="factFecha">
    <select id="factProveedor"><option value="">Seleccione proveedor</option></select>
    <select id="factProducto"><option value="">Seleccione producto</option></select>
    <input type="number" id="factMonto" placeholder="Monto (S/)">
    <select id="factTipo">
      <option value="">Seleccione tipo</option>
      <option value="FACTURA">FACTURA</option>
      <option value="BOLETA">BOLETA</option>
    </select>
    <button class="add" id="btnAddFactura">Guardar Factura</button>
    <h3>Facturas registradas</h3>
    <table id="tablaFacturas">
      <thead><tr><th>ID</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Acciones</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</div>

<!-- Modal Detalle -->
<div class="modal" id="modalDetalle">
  <div class="modal-content">
    <h3>Detalle de Factura</h3>
    <p id="detalleContenido"></p>
    <button onclick="document.getElementById('modalDetalle').style.display='none'">Cerrar</button>
  </div>
</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
