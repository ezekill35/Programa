<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐶 Discovery Pets - Dashboard</title>
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body class="dashboard-container">

<div class="navbar">
  <button onclick="showSection('productos')">📦 Productos</button>
  <button onclick="showSection('proveedores')">👥 Proveedores</button>
  <button onclick="showSection('facturas')">🛒 Compras</button>
  <button onclick="showSection('ventas')">💰 Ventas</button>
  <button onclick="showSection('gastos')">📄 Gastos</button>
  <button onclick="logout()">Cerrar Sesión</button>
</div>

<div id="productos-section" class="content-section active">
  <h3>Productos</h3>
  <form onsubmit="event.preventDefault(); agregarProducto();">
    <input id="producto-sku" placeholder="Código / SKU" required>
    <input id="producto-nombre" placeholder="Nombre" required>
    <input id="producto-marca" placeholder="Marca">
    <input id="producto-precio" type="number" placeholder="Precio S/" required>
    <input id="producto-stock" type="number" placeholder="Stock Inicial" required>
    <input id="producto-categoria" placeholder="Categoría">
    <button class="primary-btn" type="submit">Agregar Producto</button>
  </form>
  <div class="card-list" id="lista-productos"></div>
</div>

<div id="proveedores-section" class="content-section">
  <h3>Proveedores</h3>
  <form onsubmit="event.preventDefault(); agregarProveedor();">
    <input id="proveedor-nombre" placeholder="Nombre Comercial" required>
    <input id="proveedor-contacto" placeholder="Nombre del Contacto" required>
    <input id="proveedor-telefono" placeholder="Teléfono" required>
    <input id="proveedor-fax" placeholder="Fax">
    <input id="proveedor-direccion" placeholder="Dirección">
    <input id="proveedor-productos" placeholder="Tipo de Producto">
    <button class="primary-btn" type="submit">Agregar Proveedor</button>
  </form>
  <div class="card-list" id="lista-proveedores"></div>
</div>

<div id="facturas-section" class="content-section">
  <h3>Compras / Facturas</h3>
  <form onsubmit="event.preventDefault(); agregarFactura();">
    <input id="factura-ruc" placeholder="RUC" required>
    <input id="factura-numero" placeholder="Número de Factura" required>
    <select id="factura-proveedor" required></select>
    <input id="factura-producto" placeholder="Producto" required>
    <input id="factura-cantidad" type="number" placeholder="Cantidad" required>
    <input id="factura-precio" type="number" placeholder="Precio S/" required>
    <input id="factura-fecha" type="date" required>
    <button class="primary-btn" type="submit">Registrar Factura</button>
  </form>
  <div class="card-list" id="lista-facturas"></div>
</div>

<div id="ventas-section" class="content-section">
  <h3>Ventas</h3>
  <p>Próximamente...</p>
</div>

<div id="gastos-section" class="content-section">
  <h3>Gastos</h3>
  <p>Próximamente...</p>
</div>

<script src="firebase.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
