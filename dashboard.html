<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>🐶 Discovery Pets</h2>
      <ul>
        <li data-section="productos" class="active">📦 Productos</li>
        <li data-section="proveedores">👥 Proveedores</li>
        <li data-section="facturas">📄 Facturas</li>
        <li data-section="ventas">💰 Ventas</li>
        <li data-section="gastos">📊 Gastos</li>
        <li id="logout">🚪 Cerrar Sesión</li>
      </ul>
    </aside>

    <!-- Contenido principal -->
    <main class="content">
      <h1>Gestión integral de tu tienda de mascotas 🐾</h1>

      <!-- Sección Productos -->
      <section id="productos" class="section active">
        <h2>Productos</h2>
        <form>
          <input type="text" placeholder="Nombre del producto" required>
          <input type="number" placeholder="Precio" required>
          <button type="submit">Agregar Producto</button>
        </form>
      </section>

      <!-- Sección Proveedores -->
      <section id="proveedores" class="section">
        <h2>Proveedores</h2>
        <form>
          <input type="text" id="ruc" placeholder="RUC del proveedor" required>
          <input type="text" id="nombre" placeholder="Nombre del proveedor" required>
          <button type="submit">Registrar Proveedor</button>
        </form>
      </section>

      <!-- Sección Facturas -->
      <section id="facturas" class="section">
        <h2>Facturas</h2>
        <form>
          <input type="text" id="factura-ruc" placeholder="RUC del proveedor" required>
          <input type="text" id="proveedor" placeholder="Nombre del proveedor" required>
          <input type="text" id="numero" placeholder="Número de factura" required>
          <button type="submit">Registrar Factura</button>
        </form>
      </section>

      <!-- Sección Ventas -->
      <section id="ventas" class="section">
        <h2>Ventas</h2>
        <form>
          <input type="text" placeholder="Producto vendido" required>
          <input type="number" placeholder="Cantidad" required>
          <button type="submit">Registrar Venta</button>
        </form>
      </section>

      <!-- Sección Gastos -->
      <section id="gastos" class="section">
        <h2>Gastos</h2>
        <form>
          <input type="text" placeholder="Descripción del gasto" required>
          <input type="number" placeholder="Monto" required>
          <button type="submit">Registrar Gasto</button>
        </form>
      </section>
    </main>
  </div>

  <!-- Conexión a Firebase / Firestore -->
  <script type="module" src="dashboard.js"></script>
</body>
</html>
