<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard · Discovery Pets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#f7fbff; --bg2:#eef9ff; --accent:#10bcd4; --muted:#64748b;
    }
    *{box-sizing:border-box;font-family:'Inter',system-ui,Segoe UI,Roboto,Arial,sans-serif}
    body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#07203a;padding:28px}
    .container{max-width:1200px;margin:0 auto}
    h1{margin:0 0 18px 0;font-size:20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 8px 30px rgba(2,6,23,0.06);border:1px solid rgba(2,6,23,0.04)}
    .form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    input, select, button{padding:10px;border-radius:8px;border:1px solid rgba(2,6,23,0.06);font-size:14px}
    button{cursor:pointer}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:8px;text-align:left;border-bottom:1px dashed rgba(2,6,23,0.06);font-size:13px}
    .search-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    .btn{background:var(--accent);color:#fff;border:none}
    .btn.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent)}
    .small{padding:6px 8px;font-size:13px;border-radius:8px}
    /* Modal buscador - glass */
    .modal-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:1200;padding:20px}
    .modal-backdrop.show{display:flex}
    .modal-card{width:100%;max-width:900px;background:linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.55));backdrop-filter:blur(6px);border-radius:14px;padding:18px;box-shadow:0 30px 60px rgba(16,185,196,0.08);border:1px solid rgba(16,185,196,0.08)}
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
    .fact-card{background:#fff;border-radius:12px;padding:12px;border:1px solid rgba(2,6,23,0.04);box-shadow:0 8px 20px rgba(2,6,23,0.04)}
    .close-x{position:absolute;right:18px;top:14px;background:transparent;border:none;font-size:18px;cursor:pointer}
    /* detalle modal */
    .modal-detail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:1300;padding:20px}
    .modal-detail.show{display:flex}
    .detail-card{width:100%;max-width:700px;background:#fff;border-radius:12px;padding:18px;box-shadow:0 30px 60px rgba(2,6,23,0.08)}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <h1>Dashboard · Discovery Pets</h1>

    <!-- Buscador -->
    <div class="card" style="margin-bottom:14px">
      <div class="search-row">
        <input id="buscadorFactura" placeholder="Buscar facturas por producto (ej. 'tela camisera')">
        <button id="btnBuscarFactura" class="small">Buscar</button>
        <button id="btnReset" class="small secondary">Restablecer</button>
      </div>
    </div>

    <div class="grid">
      <!-- Proveedores -->
      <div class="card">
        <h3>Proveedores</h3>
        <form id="proveedorForm">
          <div class="form-row">
            <input id="nombreProveedor" placeholder="Nombre proveedor" required>
            <input id="rucProveedor" placeholder="RUC" required>
          </div>
          <div class="form-row">
            <input id="telefonoProveedor" placeholder="Teléfono">
            <input id="direccionProveedor" placeholder="Dirección">
            <button class="btn small" type="submit">Añadir proveedor</button>
          </div>
        </form>

        <div style="max-height:260px;overflow:auto">
          <table>
            <thead><tr><th>Nombre</th><th>RUC</th><th>Tel</th><th>Dirección</th><th>Acción</th></tr></thead>
            <tbody id="tablaProveedores"></tbody>
          </table>
        </div>
      </div>

      <!-- Productos -->
      <div class="card">
        <h3>Productos</h3>
        <form id="productoForm">
          <div class="form-row">
            <input id="nombreProducto" placeholder="Nombre producto" required>
            <input id="unidadProducto" placeholder="Unidad (kg, und)">
          </div>
          <div class="form-row">
            <input id="maquinaria" placeholder="Maquinaria">
            <input id="productoOf" placeholder="Producto OF">
          </div>
          <div class="form-row">
            <input id="insumosExtra" placeholder="Insumos extra">
            <input id="descripcionProducto" placeholder="Descripción">
            <button class="btn small" type="submit">Añadir producto</button>
          </div>
        </form>

        <div style="max-height:260px;overflow:auto">
          <table>
            <thead><tr><th>Nombre</th><th>Unidad</th><th>Maquinaria</th><th>Producto OF</th><th>Insumos</th><th>Descripción</th><th>Acción</th></tr></thead>
            <tbody id="tablaProductos"></tbody>
          </table>
        </div>
      </div>

      <!-- Facturas -->
      <div class="card" style="grid-column:1 / -1">
        <h3>Facturas</h3>
        <form id="facturaForm">
          <div class="form-row">
            <input id="numeroFactura" placeholder="Número de factura" required>
            <select id="proveedorFactura"><option value="">Seleccionar proveedor</option></select>
            <select id="productoFactura"><option value="">Seleccionar producto</option></select>
          </div>
          <div class="form-row">
            <input id="cantidadFactura" type="number" placeholder="Cantidad">
            <input id="montoFactura" type="number" step="0.01" placeholder="Monto">
            <select id="monedaFactura"><option value="S/">S/</option><option value="$">US$</option></select>
            <select id="tipoFactura"><option value="FACTURA">FACTURA</option><option value="BOLETA DE VENTA">BOLETA</option></select>
            <input id="fechaFactura" type="date">
            <button class="btn small" type="submit">Añadir factura</button>
          </div>
        </form>

        <div style="max-height:360px;overflow:auto">
          <table>
            <thead><tr><th>N°</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Fecha</th><th>Acción</th></tr></thead>
            <tbody id="tablaFacturas"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal buscador (glass) -->
  <div class="modal-backdrop" id="modalBuscador">
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="close-x" id="cerrarModalBuscador">&times;</button>
      <h3>Resultados de búsqueda</h3>
      <div id="resultadoBusqueda" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- Modal detalle -->
  <div class="modal-detail" id="modalDetalle">
    <div class="detail-card" role="dialog" aria-modal="true">
      <button class="close-x" id="cerrarDetalle">&times;</button>
      <div id="detalleContenido"></div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
