<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Discovery Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; margin:0; padding:0;}
    header { background:#0ea5e9; color:white; padding:1rem; display:flex; justify-content:space-between; align-items:center;}
    .nav-btn { background:none; border:none; color:white; font-weight:bold; margin-right:1rem; cursor:pointer;}
    .nav-btn.activo { text-decoration:underline;}
    main { padding:1rem; }
    .seccion { display:none; }
    .seccion.activa { display:block; }
    table { width:100%; }
    th, td { padding:0.5rem; }
    .btn-accion { border:none; background:none; cursor:pointer; font-size:1.2rem; margin-right:0.2rem;}
    #searchResults { margin-top:0.5rem; }
    .resultado-item { padding:0.5rem; margin:0.2rem 0; cursor:pointer; border-radius:5px;}
    dialog { border:none; border-radius:10px; padding:1rem; max-width:400px; width:90%; }
    .form-control, .btn { margin-bottom:0.5rem; }
    @media(max-width:768px){ table, thead, tbody, tr, td, th { display:block; } td { padding-left:50%; position:relative; } td::before { content: attr(data-label); position:absolute; left:10px; font-weight:bold;} }
  </style>
</head>
<body>

<header>
  <h2>Dashboard Discovery Pets</h2>
  <div>
    <button class="nav-btn activo" data-target="proveedores">Proveedores</button>
    <button class="nav-btn" data-target="productos">Productos</button>
    <button class="nav-btn" data-target="facturas">Facturas</button>
    <button id="btnCerrarSesion">Cerrar sesión</button>
  </div>
</header>

<main>
  <input type="text" id="searchInput" class="form-control mb-3" placeholder="Buscar producto..." style="display:none;">
  <div id="searchResults"></div>

  <!-- PROVEEDORES -->
  <section class="seccion activa" id="proveedores">
    <h3>Proveedores <span id="countProveedores"></span></h3>
    <form id="formProveedor">
      <input type="text" id="rucProveedor" class="form-control" placeholder="RUC" required>
      <input type="text" id="nombreProveedor" class="form-control" placeholder="Nombre" required>
      <input type="text" id="direccionProveedor" class="form-control" placeholder="Dirección">
      <input type="text" id="telefonoProveedor" class="form-control" placeholder="Teléfono">
      <button class="btn btn-primary">Agregar Proveedor</button>
    </form>
    <table class="table table-striped mt-3">
      <thead><tr><th>RUC</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr></thead>
      <tbody id="tablaProveedores"></tbody>
    </table>
  </section>

  <!-- PRODUCTOS -->
  <section class="seccion" id="productos">
    <h3>Productos <span id="countProductos"></span></h3>
    <form id="formProducto">
      <input type="text" id="nombreProducto" class="form-control" placeholder="Nombre" required>
      <input type="number" id="cantidadProducto" class="form-control" placeholder="Cantidad" required>
      <input type="number" step="0.01" id="precioProducto" class="form-control" placeholder="Precio" required>
      <textarea id="descripcionProducto" class="form-control" placeholder="Descripción"></textarea>
      <button class="btn btn-primary">Agregar Producto</button>
    </form>
    <table class="table table-striped mt-3">
      <thead><tr><th>Nombre</th><th>Cantidad</th><th>Precio</th><th>Descripción</th><th>Acciones</th></tr></thead>
      <tbody id="tablaProductos"></tbody>
    </table>
  </section>

  <!-- FACTURAS -->
  <section class="seccion" id="facturas">
    <h3>Facturas <span id="countFacturas"></span></h3>
    <form id="formFactura">
      <input type="text" id="idFactura" class="form-control" placeholder="ID Factura" required>
      <input type="date" id="fechaFactura" class="form-control" required>
      <select id="proveedorFactura" class="form-control" required></select>
      <select id="productoFactura" class="form-control" required></select>
      <input type="number" step="0.01" id="montoFactura" class="form-control" placeholder="Monto" required>
      <input type="text" id="tipoFactura" class="form-control" placeholder="Tipo">
      <button class="btn btn-primary">Agregar Factura</button>
    </form>
    <table class="table table-striped mt-3">
      <thead><tr><th>ID</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Acciones</th></tr></thead>
      <tbody id="tablaFacturas"></tbody>
    </table>
  </section>
</main>

<!-- MODAL FACTURA -->
<dialog id="modalFactura">
  <div id="modalFacturaBody"></div>
  <button class="btn btn-secondary mt-2" id="cerrarModalFactura">Cerrar</button>
</dialog>

<!-- MODAL PROVEEDOR/PRODUCTO -->
<dialog id="modalExtra">
  <div id="modalExtraBody"></div>
  <button class="btn btn-secondary mt-2" id="cerrarModalExtra">Cerrar</button>
</dialog>

<!-- MODAL EDITAR -->
<dialog id="modalEditar">
  <div id="modalEditarBody"></div>
  <button class="btn btn-secondary mt-2" id="cerrarModalEditar">Cerrar</button>
</dialog>

<script type="module" src="dashboard.js"></script>
</body>
</html>
