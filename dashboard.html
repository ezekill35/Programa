<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets · Dashboard</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/616/616408.png" type="image/png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { font-family:"Inter", sans-serif; background:#f8fafc; margin:0; padding:0; }
.sidebar { width:250px; background:linear-gradient(180deg,#14b8a6 0%,#0284c7 100%); color:white; height:100vh; position:fixed; padding:1.5rem 1rem; border-radius:0 20px 20px 0; box-shadow:4px 0 15px rgba(0,0,0,0.1);}
.sidebar h3 { font-weight:700; text-align:center; margin-bottom:1.5rem; }
.nav-btn { display:block; width:100%; background:transparent; color:#fff; border:none; text-align:left; padding:.75rem 1rem; border-radius:10px; margin-bottom:.5rem; font-size:15px; transition:.3s; }
.nav-btn:hover, .nav-btn.activo { background: rgba(255,255,255,0.2);}
main { margin-left:270px; padding:2rem; }
.header-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; flex-wrap:wrap; gap:10px;}
#searchInput { max-width:300px; flex:1;}
.tabla-container { background:white; border-radius:15px; padding:1.5rem; box-shadow:0 4px 10px rgba(0,0,0,0.05); margin-bottom:2rem; overflow-x:auto; }
.btn-accion { background:transparent; border:none; cursor:pointer; font-size:1rem; margin-right:5px; transition:.2s;}
.btn-accion:hover { transform: scale(1.2);}
.resultado-item { background:#e0f2fe; border-radius:10px; padding:.75rem; margin-bottom:5px; cursor:pointer; transition:.2s; }
.resultado-item:hover { background:#bae6fd;}
dialog { border:none; border-radius:15px; padding:1.5rem; max-width:400px; box-shadow:0 5px 25px rgba(0,0,0,0.3); }
dialog::backdrop { background: rgba(0,0,0,0.4);}
.link-info { cursor:pointer; text-decoration: underline; color:#0284c7;}
.seccion { display:none; }
.seccion.activa { display:block; }
@media (max-width:768px){ main { margin-left:0; padding:1rem; } .sidebar{ width:100%; height:auto; border-radius:0 0 20px 20px; position:relative;} }
</style>
</head>
<body>

<aside class="sidebar">
  <h3>Discovery Pets</h3>
  <button class="nav-btn activo" data-target="dashboard">📊 Dashboard</button>
  <button class="nav-btn" data-target="proveedores">🏢 Proveedores</button>
  <button class="nav-btn" data-target="productos">📦 Productos</button>
  <button class="nav-btn" data-target="facturas">🧾 Facturas</button>
  <button id="btnCerrarSesion" class="nav-btn mt-4">🚪 Cerrar sesión</button>
</aside>

<main>
  <div class="header-bar">
    <h2 class="fw-bold text-primary">Panel General</h2>
    <input type="text" id="searchInput" class="form-control" placeholder="Buscar producto...">
  </div>
  <div id="searchResults" class="mb-4"></div>

  <section id="dashboard" class="seccion activa">
    <div class="row g-4">
      <div class="col-md-4"><div class="tabla-container text-center"><h5 class="text-secondary">Total Facturas</h5><h3 id="countFacturas">0</h3></div></div>
      <div class="col-md-4"><div class="tabla-container text-center"><h5 class="text-secondary">Total Proveedores</h5><h3 id="countProveedores">0</h3></div></div>
      <div class="col-md-4"><div class="tabla-container text-center"><h5 class="text-secondary">Total Productos</h5><h3 id="countProductos">0</h3></div></div>
    </div>
  </section>

  <!-- Secciones Proveedores, Productos, Facturas como antes (formularios y tablas) -->
  <section id="proveedores" class="seccion"></section>
  <section id="productos" class="seccion"></section>
  <section id="facturas" class="seccion"></section>
</main>

<!-- Modales -->
<dialog id="modalFactura"><h4>Detalle de Factura</h4><div id="modalFacturaBody"></div><button id="cerrarModalFactura" class="btn btn-secondary mt-3">Cerrar</button></dialog>
<dialog id="modalExtra"><div id="modalExtraBody"></div><button id="cerrarModalExtra" class="btn btn-secondary mt-3">Cerrar</button></dialog>

<script type="module" src="dashboard.js"></script>
</body>
</html>
