<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Discovery Pets · Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primario: #00b4d8;
      --color-secundario: #caf0f8;
      --color-oscuro: #023e8a;
      --color-fondo: #f5fbff;
      --color-blanco: #ffffff;
    }

    * { font-family: 'Poppins', sans-serif; box-sizing: border-box; }

    body {
      display: flex;
      margin: 0;
      min-height: 100vh;
      background: var(--color-fondo);
      overflow-x: hidden;
    }

    /* 🧭 BARRA LATERAL */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, var(--color-primario), #0096c7);
      color: var(--color-blanco);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
      padding: 1.5rem 1rem;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .menu-lateral button {
      display: block;
      width: 100%;
      border: none;
      background: transparent;
      color: #fff;
      text-align: left;
      padding: 0.8rem 1.2rem;
      font-size: 15px;
      border-radius: 12px;
      margin-bottom: 0.5rem;
      transition: all 0.3s;
    }

    .menu-lateral button:hover,
    .menu-lateral button.activo {
      background: var(--color-blanco);
      color: var(--color-oscuro);
      transform: translateX(6px);
      font-weight: 600;
    }

    #logoutBtn {
      border: none;
      border-radius: 12px;
      background: #fff;
      color: var(--color-primario);
      font-weight: 600;
      padding: 0.6rem;
      transition: all 0.3s;
      width: 100%;
    }

    #logoutBtn:hover {
      background: var(--color-oscuro);
      color: #fff;
    }

    /* 📊 CONTENIDO PRINCIPAL */
    main {
      margin-left: 260px;
      flex: 1;
      padding: 2rem;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      background: var(--color-blanco);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-oscuro);
    }

    /* 🔍 BUSCADOR */
    #buscadorFactura {
      border-radius: 10px 0 0 10px;
      border: 1px solid var(--color-primario);
    }

    #btnBuscar, #btnRefresh {
      border: none;
      background: var(--color-primario);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 0 10px 10px 0;
      transition: all 0.3s;
    }

    #btnBuscar:hover, #btnRefresh:hover {
      background: var(--color-oscuro);
    }

    #panelFacturas {
      background: #f1faff;
      border: 2px solid #90e0ef;
      border-radius: 15px;
      padding: 1rem;
      margin-top: 1rem;
      max-height: 250px;
      overflow-y: auto;
    }

    #panelFacturas div {
      padding: 0.5rem;
      border-bottom: 1px dashed #90e0ef;
      cursor: pointer;
      transition: background 0.2s;
    }

    #panelFacturas div:hover {
      background: #caf0f8;
    }

    .seccion {
      display: none;
    }

    .seccion.activa {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    table {
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
      text-align: center;
    }

    th {
      background: var(--color-primario);
      color: #fff;
    }

    tr:nth-child(even) { background: #f8f9fa; }

    .btn-sm {
      border: none;
      border-radius: 10px;
      font-weight: 500;
      padding: 0.25rem 0.7rem;
      transition: all 0.3s;
    }

    .btn-sm:hover { transform: scale(1.05); }

    .eliminar { background: #ff6b6b; color: white; }
    .editar { background: #ffd166; color: #000; }
    .ver-info { background: #06d6a0; color: white; }

    footer {
      text-align: center;
      padding: 1rem;
      color: #555;
      font-size: 0.9rem;
      margin-top: 2rem;
    }

    /* MODALES */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-contenido {
      background: #ffffff;
      border-radius: 20px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      animation: aparecer 0.3s ease;
    }

    @keyframes aparecer {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal h3 {
      color: var(--color-primario);
      font-weight: 700;
    }
  </style>
</head>

<body>

  <!-- 🧭 SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="logo">🐾 Discovery Pets</div>
      <div class="menu-lateral">
        <button class="activo" data-target="secProveedores">Proveedores</button>
        <button data-target="secProductos">Productos</button>
        <button data-target="secFacturas">Facturas</button>
      </div>
    </div>
    <button id="logoutBtn">Cerrar sesión</button>
  </aside>

  <!-- 📊 CONTENIDO -->
  <main>
    <header>
      <h1>Panel Administrativo</h1>
    </header>

    <!-- 🔍 BUSCADOR -->
    <div class="mb-4 text-center">
      <div class="d-flex justify-content-center">
        <input id="buscadorFactura" class="form-control w-50" placeholder="Buscar producto relacionado a factura...">
        <button id="btnBuscar">Buscar</button>
        <button id="btnRefresh" title="Limpiar">↻</button>
      </div>
      <div id="panelFacturas" class="mt-3"></div>
    </div>

    <!-- 🧍 SECCIONES -->
    <section id="secProveedores" class="seccion activa">
      <h3 class="mb-3 text-primary fw-bold">Registro de Proveedores</h3>
      <form id="proveedorForm" class="row g-3 mb-4">
        <div class="col-md-3"><input id="rucProveedor" class="form-control" placeholder="RUC"></div>
        <div class="col-md-3"><input id="nombreProveedor" class="form-control" placeholder="Nombre"></div>
        <div class="col-md-3"><input id="direccionProveedor" class="form-control" placeholder="Dirección"></div>
        <div class="col-md-2"><input id="telefonoProveedor" class="form-control" placeholder="Teléfono"></div>
        <div class="col-md-1"><button class="btn btn-success w-100">➕</button></div>
      </form>
      <table class="table table-hover">
        <thead><tr><th>RUC</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr></thead>
        <tbody id="tablaProveedores"></tbody>
      </table>
    </section>

    <section id="secProductos" class="seccion">
      <h3 class="mb-3 text-primary fw-bold">Registro de Productos</h3>
      <form id="productoForm" class="row g-3 mb-4">
        <div class="col-md-3"><input id="nombreProducto" class="form-control" placeholder="Nombre"></div>
        <div class="col-md-2"><input id="cantidadProducto" class="form-control" type="number" placeholder="Cantidad"></div>
        <div class="col-md-2"><input id="precioProducto" class="form-control" type="number" step="0.000001" placeholder="Precio (S/.)"></div>
        <div class="col-md-3"><input id="descripcionProducto" class="form-control" placeholder="Descripción"></div>
        <div class="col-md-2"><button class="btn btn-success w-100">➕</button></div>
      </form>
      <table class="table table-hover">
        <thead><tr><th>Nombre</th><th>Cantidad</th><th>Precio</th><th>Descripción</th><th>Acciones</th></tr></thead>
        <tbody id="tablaProductos"></tbody>
      </table>
    </section>

    <section id="secFacturas" class="seccion">
      <h3 class="mb-3 text-primary fw-bold">Registro de Facturas</h3>
      <form id="facturaForm" class="row g-3 mb-4">
        <div class="col-md-2"><input id="idFactura" class="form-control" placeholder="ID Factura"></div>
        <div class="col-md-2"><input id="fechaFactura" class="form-control" type="date"></div>
        <div class="col-md-2"><select id="proveedorFactura" class="form-control"></select></div>
        <div class="col-md-2"><select id="productoFactura" class="form-control"></select></div>
        <div class="col-md-2"><input id="montoFactura" class="form-control" type="number" step="0.000001" placeholder="Monto (S/.)"></div>
        <div class="col-md-1"><input id="tipoFactura" class="form-control" placeholder="Tipo"></div>
        <div class="col-md-1"><button class="btn btn-success w-100">➕</button></div>
      </form>
      <table class="table table-hover">
        <thead><tr><th>ID</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Acción</th></tr></thead>
        <tbody id="tablaFacturas"></tbody>
      </table>
    </section>

    <footer>© 2025 Discovery Pets — Sistema de Gestión 🐾</footer>
  </main>

  <!-- 🔵 MODALES -->
  <div id="modalFactura" class="modal">
    <div class="modal-contenido">
      <span id="cerrarModalFactura" style="float:right;cursor:pointer;">❌</span>
      <div id="contenidoModalFactura"></div>
    </div>
  </div>

  <div id="modalDetalleExtra" class="modal">
    <div class="modal-contenido">
      <span id="cerrarModalDetalle" style="float:right;cursor:pointer;">❌</span>
      <div id="contenidoDetalleExtra"></div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
