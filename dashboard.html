<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discovery Pets · Facturas</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/616/616408.png" type="image/png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: "Inter", sans-serif;
      background: #f7f9fc;
      padding: 20px;
    }
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    .modal-content {
      border-radius: 16px;
    }
    .btn-primary {
      background: #4e73df;
      border: none;
    }
    .btn-primary:hover {
      background: #2e59d9;
    }
    .btn-editar, .btn-eliminar {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1.2rem;
    }
    .btn-editar:hover { color: #007bff; }
    .btn-eliminar:hover { color: #dc3545; }
    .table thead {
      background: #4e73df;
      color: #fff;
    }
    .form-control:focus {
      border-color: #4e73df;
      box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
    }
  </style>
</head>
<body>

  <div class="container mt-4">
    <h2 class="fw-bold text-center mb-4">📄 Registro de Facturas · Discovery Pets</h2>

    <!-- =================== FORMULARIO =================== -->
    <div class="card p-4 mb-4">
      <form id="formFactura">
        <div class="row g-3">

          <div class="col-md-3">
            <label class="form-label">ID Automático</label>
            <input id="idFacturaAuto" type="text" class="form-control" readonly />
          </div>

          <div class="col-md-3">
            <label class="form-label">Proveedor</label>
            <input id="proveedor" type="text" class="form-control" placeholder="Proveedor" required />
          </div>

          <div class="col-md-3">
            <label class="form-label">Tipo de Documento</label>
            <select id="tipoDocumento" class="form-select" required>
              <option value="">Seleccionar...</option>
              <option value="Factura">Factura</option>
              <option value="Boleta">Boleta</option>
              <option value="Nota de crédito">Nota de crédito</option>
              <option value="Nota de débito">Nota de débito</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">N° Documento</label>
            <input id="numeroDocumento" type="text" class="form-control" placeholder="0001-000123" required />
          </div>

          <div class="col-md-3">
            <label class="form-label">Total (S/)</label>
            <input id="total" type="number" step="0.01" class="form-control" required />
          </div>

        </div>
        <div class="mt-4 text-end">
          <button type="submit" class="btn btn-primary px-4">💾 Registrar Factura</button>
        </div>
      </form>
    </div>

    <!-- =================== BUSCADOR =================== -->
    <div class="input-group mb-3">
      <span class="input-group-text">🔍</span>
      <input id="buscarFactura" type="text" class="form-control" placeholder="Buscar factura, proveedor o documento...">
    </div>

    <!-- =================== TABLA =================== -->
    <div class="card p-3">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>ID Factura</th>
              <th>Proveedor</th>
              <th>Tipo Documento</th>
              <th>N° Documento</th>
              <th>Total (S/)</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaFacturas"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- =================== MODAL EDICIÓN =================== -->
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-4">
        <h5 class="modal-title fw-bold mb-3">✏️ Editar Factura</h5>
        <form id="formEditarFactura">
          <input type="hidden" id="editId" />
          <div class="mb-3">
            <label class="form-label">Proveedor</label>
            <input id="editProveedor" type="text" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Tipo Documento</label>
            <select id="editTipoDocumento" class="form-select" required>
              <option value="Factura">Factura</option>
              <option value="Boleta">Boleta</option>
              <option value="Nota de crédito">Nota de crédito</option>
              <option value="Nota de débito">Nota de débito</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">N° Documento</label>
            <input id="editNumeroDocumento" type="text" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Total (S/)</label>
            <input id="editTotal" type="number" step="0.01" class="form-control" required />
          </div>
          <div class="text-end">
            <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="./dashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
