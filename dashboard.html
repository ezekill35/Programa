<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      font-family: 'Poppins', sans-serif;
    }
    .sidebar {
      width: 250px;
      background: linear-gradient(180deg, #0d47a1, #1976d2);
      color: white;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 10px rgba(0,0,0,0.2);
      position: fixed;
      height: 100%;
    }
    .sidebar h3 {
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .menu-btn {
      background: none;
      border: none;
      color: white;
      text-align: left;
      padding: 12px 20px;
      font-size: 16px;
      transition: 0.3s;
      cursor: pointer;
    }
    .menu-btn:hover, .menu-btn.activo {
      background: rgba(255,255,255,0.2);
    }
    .main-content {
      margin-left: 260px;
      padding: 25px;
      flex: 1;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    #buscadorGlobal {
      width: 280px;
      border-radius: 8px;
      padding: 8px 12px;
      border: 1px solid #ccc;
    }
    .card {
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      transform: perspective(1000px) rotateX(3deg);
      transition: 0.3s;
    }
    .card:hover {
      transform: perspective(1000px) rotateX(0deg) scale(1.02);
    }
    table {
      width: 100%;
    }
    .btn-primary {
      background: #1976d2;
      border: none;
    }
    .btn-primary:hover {
      background: #0d47a1;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h3>🐾 Discovery Pets</h3>
    <button class="menu-btn activo" data-target="facturas">📄 Facturas</button>
    <button class="menu-btn" data-target="proveedores">🏢 Proveedores</button>
    <button class="menu-btn" data-target="productos">🛒 Productos</button>
    <button class="menu-btn" data-target="gastos">💰 Gastos</button>
    <button class="menu-btn" data-target="reportes">📊 Reportes</button>
    <hr>
    <button id="logoutBtn" class="menu-btn text-danger">🚪 Cerrar Sesión</button>
  </div>

  <div class="main-content">
    <header>
      <h2>Panel de Control</h2>
      <input type="text" id="buscadorGlobal" placeholder="🔍 Buscar factura, proveedor o producto...">
    </header>

    <!-- Sección Facturas -->
    <section id="facturas" class="seccion">
      <div class="card">
        <h4>Registrar Factura</h4>
        <form id="facturaForm" class="row g-3">
          <div class="col-md-3">
            <label class="form-label">N° Factura</label>
            <input type="text" id="numeroFactura" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Proveedor</label>
            <input type="text" id="proveedorFactura" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Producto</label>
            <input type="text" id="productoFactura" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label">Monto</label>
            <div class="input-group">
              <select id="monedaFactura" class="form-select" style="max-width:90px;">
                <option value="S/">S/</option>
                <option value="$">$</option>
              </select>
              <input type="number" id="montoFactura" class="form-control" step="0.01" required>
            </div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Tipo</label>
            <select id="tipoFactura" class="form-select">
              <option value="Factura Electrónica">Factura Electrónica</option>
              <option value="Boleta">Boleta</option>
            </select>
          </div>
          <div class="col-12">
            <button class="btn btn-primary mt-2">Guardar</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h4>Facturas Registradas</h4>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>N°</th>
              <th>Proveedor</th>
              <th>Producto</th>
              <th>Monto</th>
              <th>Tipo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaFacturas"></tbody>
        </table>
      </div>
    </section>

    <!-- Sección Proveedores -->
<section id="proveedores" class="seccion" style="display:none;">
  <div class="card">
    <h4>Registrar Proveedor</h4>
    <form id="proveedorForm" class="row g-3">
      <div class="col-md-4">
        <label class="form-label">RUC</label>
        <input type="number" id="rucProveedor" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Nombre</label>
        <input type="text" id="nombreProveedor" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Teléfono</label>
        <input type="number" id="telefonoProveedor" class="form-control" required>
      </div>
      <div class="col-12">
        <button class="btn btn-primary mt-2">Guardar</button>
      </div>
    </form>
  </div>
</section>

    <!-- Sección Productos -->
    <section id="productos" class="seccion" style="display:none;">
      <div class="card">
        <h4>Registrar Producto</h4>
        <form id="productoForm" class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Nombre</label>
            <input type="text" id="nombreProducto" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Descripción</label>
            <input type="text" id="descripcionProducto" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label">Cantidad</label>
            <input type="number" id="cantidadProducto" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label">Unidad</label>
            <input type="text" id="unidadProducto" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label">Valor Unitario</label>
            <input type="number" id="valorUnitarioProducto" class="form-control" step="0.01">
          </div>
          <div class="col-12">
            <button class="btn btn-primary mt-2">Guardar</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Sección Gastos -->
    <section id="gastos" class="seccion" style="display:none;">
      <div class="card">
        <h4>Registrar Gasto</h4>
        <form class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Descripción</label>
            <input type="text" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Monto</label>
            <input type="number" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Fecha</label>
            <input type="date" class="form-control">
          </div>
          <div class="col-12">
            <button class="btn btn-primary mt-2">Guardar</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Sección Reportes -->
    <section id="reportes" class="seccion" style="display:none;">
      <div class="card text-center">
        <h4>Generar Reporte</h4>
        <p class="text-muted">Seleccione un rango de fechas y genere su reporte en PDF.</p>
        <form class="row g-3 justify-content-center">
          <div class="col-md-3">
            <input type="date" class="form-control">
          </div>
          <div class="col-md-3">
            <input type="date" class="form-control">
          </div>
          <div class="col-md-2">
            <button class="btn btn-success">Generar PDF</button>
          </div>
        </form>
      </div>
    </section>

  </div>

  <script src="dashboard.js"></script>
</body>
</html>
