<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <div class="sidebar">
      <div class="logo">
        <i>🐾</i>
        <span>Discovery Pets</span>
      </div>
      <ul>
        <li id="opProveedor" class="active" onclick="mostrarSeccion('proveedor', this)">Proveedor</li>
        <li id="opFactura" onclick="mostrarSeccion('factura', this)">Factura</li>
        <li id="opGastos" onclick="mostrarSeccion('gastos', this)">Gastos</li>
        <li id="opServicio" onclick="mostrarSeccion('servicio', this)">Servicio</li>
      </ul>
      <button onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <div class="content">
      <div id="proveedor" class="seccion">
        <h1>Proveedor</h1>
        <form class="formulario">
          <input type="text" placeholder="RUT">
          <input type="text" placeholder="Nombre del proveedor">
          <input type="text" placeholder="Dirección">
          <button>Registrar Proveedor</button>
        </form>
      </div>

      <div id="factura" class="seccion hidden">
        <h1>Factura</h1>
        <form class="formulario">
          <input type="text" placeholder="RUT">
          <select>
            <option value="">Seleccionar proveedor</option>
            <option value="prov1">Proveedor 1</option>
            <option value="prov2">Proveedor 2</option>
            <option value="nuevo">¿Desea registrar proveedor?</option>
          </select>
          <input type="text" placeholder="Tipo de factura">
          <input type="date" placeholder="Fecha de emisión">
          <input type="text" placeholder="Descripción">
          <button>Registrar Factura</button>
        </form>
      </div>

      <div id="gastos" class="seccion hidden">
        <h1>Gastos</h1>
        <form class="formulario">
          <input type="text" placeholder="Descripción">
          <input type="number" placeholder="Monto">
          <input type="date" placeholder="Fecha">
          <button>Registrar Gasto</button>
        </form>
      </div>

      <div id="servicio" class="seccion hidden">
        <h1>Servicio</h1>
        <form class="formulario">
          <input type="text" placeholder="Descripción">
          <input type="number" placeholder="Monto">
          <input type="date" placeholder="Fecha">
          <button>Registrar Servicio</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
