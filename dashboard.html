<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discovery Pets · Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f5f7fb;
      --sidebar-bg: #ffffff;
      --accent: #8e7cff;
      --accent-light: #d6cdff;
      --text-dark: #2a2a2a;
      --text-light: #6f6f6f;
      --card-bg: #ffffff;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-main);
      display: flex;
      margin: 0;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: var(--sidebar-bg);
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 0;
      position: fixed;
      height: 100%;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.05);
    }

    .sidebar .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .sidebar .logo img {
      width: 100px;
      border-radius: 50%;
    }

    .sidebar .menu a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-dark);
      padding: 12px 20px;
      text-decoration: none;
      transition: all 0.3s;
      border-radius: 8px;
      margin: 5px 10px;
      font-weight: 500;
    }

    .sidebar .menu a:hover,
    .sidebar .menu a.active {
      background-color: var(--accent);
      color: white;
      transform: translateX(5px);
    }

    .sidebar .footer {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-light);
    }

    /* Main content */
    .main {
      margin-left: 260px;
      padding: 30px;
      width: calc(100% - 260px);
      overflow-y: auto;
    }

    .main h1 {
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 20px;
    }

    /* Cards */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card-stat {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.3s ease;
    }

    .card-stat:hover {
      transform: translateY(-5px);
    }

    .card-stat i {
      font-size: 2.5rem;
      color: var(--accent);
    }

    .card-stat h3 {
      font-size: 1.2rem;
      color: var(--text-dark);
      margin: 0;
    }

    .card-stat p {
      color: var(--text-light);
      margin: 0;
    }

    /* Table */
    .table-container {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background-color: var(--accent-light);
      color: var(--text-dark);
    }

    th, td {
      padding: 12px;
      text-align: left;
    }

    tbody tr:hover {
      background-color: #f4f2ff;
      cursor: pointer;
    }

    /* Button */
    .btn-primary {
      background-color: var(--accent);
      border: none;
      border-radius: 10px;
    }

    .btn-primary:hover {
      background-color: #7b6cf8;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .fade-in {
      animation: fadeInUp 0.5s ease;
    }

  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div>
      <div class="logo">
        <img src="https://static.vecteezy.com/system/resources/previews/017/181/296/non_2x/paw-icon-free-png.png" alt="Discovery Pets Logo">
        <h5 class="mt-2">Discovery Pets</h5>
      </div>
      <div class="menu">
        <a href="#" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="#"><i class="bi bi-receipt"></i> Facturas</a>
        <a href="#"><i class="bi bi-truck"></i> Proveedores</a>
        <a href="#"><i class="bi bi-bag"></i> Productos</a>
        <a href="#"><i class="bi bi-box"></i> Servicios</a>
      </div>
    </div>
    <div class="footer">
      <p>© 2025 Discovery Pets</p>
    </div>
  </div>

  <!-- Main -->
  <div class="main fade-in">
    <h1><i class="bi bi-speedometer2"></i> Dashboard</h1>

    <!-- Stats -->
    <div class="stats">
      <div class="card-stat">
        <div>
          <h3 id="facturasCount">0</h3>
          <p>Facturas</p>
        </div>
        <i class="bi bi-receipt"></i>
      </div>
      <div class="card-stat">
        <div>
          <h3 id="proveedoresCount">0</h3>
          <p>Proveedores</p>
        </div>
        <i class="bi bi-truck"></i>
      </div>
      <div class="card-stat">
        <div>
          <h3 id="productosCount">0</h3>
          <p>Productos</p>
        </div>
        <i class="bi bi-bag"></i>
      </div>
    </div>

    <!-- Table of facturas -->
    <div class="table-container">
      <h4 class="mb-3">Listado de Facturas</h4>
      <table id="facturasTable" class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Proveedor</th>
            <th>Producto</th>
            <th>Monto</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody>
          <!-- Se rellena dinámicamente con JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
