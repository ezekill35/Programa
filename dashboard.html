<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="dashboard.js"></script>
</head>

<body>
  <!-- ================= Sidebar ================= -->
  <aside class="sidebar">
    <h2>🐾 Discovery Pets</h2>
    <nav>
      <button class="menu-opcion" data-seccion="facturas">📄 Facturas</button>
      <button class="menu-opcion" data-seccion="proveedores">🏢 Proveedores</button>
      <button class="menu-opcion" data-seccion="productos">📦 Productos</button>
      <button class="menu-opcion" data-seccion="gastos">💸 Gastos</button>
      <button class="menu-opcion" data-seccion="reportes">📊 Reportes</button>
    </nav>
    <button id="cerrarSesion" class="cerrar-sesion">Cerrar Sesión</button>
  </aside>

  <!-- ================= Contenido Principal ================= -->
  <main class="main-content">
    <header>
      <input type="text" id="buscador" placeholder="🔍 Buscar factura, proveedor o producto...">
    </header>

    <!-- ========== FACTURAS ========== -->
    <section id="facturas" class="seccion">
      <h2>Facturas</h2>
      <form id="formFactura">
        <input name="numero" placeholder="Número de Factura" required>
        <input name="proveedor" placeholder="Proveedor" required>
        <input name="producto" placeholder="Producto" required>
        <input name="monto" type="number" step="0.01" placeholder="Monto" required>
        <select name="moneda">
          <option value="S/.">S/.</option>
          <option value="$">$</option>
        </select>
        <select name="tipo">
          <option value="Compra">Compra</option>
          <option value="Servicio">Servicio</option>
        </select>
        <button type="submit">Agregar</button>
      </form>

      <table class="tabla-facturas">
        <thead>
          <tr>
            <th>Número</th>
            <th>Proveedor</th>
            <th>Producto</th>
            <th>Monto</th>
            <th>Tipo</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- ========== PROVEEDORES ========== -->
    <section id="proveedores" class="seccion" style="display:none;">
      <h2>Proveedores</h2>
      <form id="formProveedor">
        <input name="nombre" placeholder="Nombre" required>
        <input name="ruc" placeholder="RUC" required>
        <input name="telefono" placeholder="Teléfono" required>
        <button type="submit">Agregar</button>
      </form>

      <table class="tabla-proveedores">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>RUC</th>
            <th>Teléfono</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- ========== PRODUCTOS ========== -->
    <section id="productos" class="seccion" style="display:none;">
      <h2>Productos</h2>
      <form id="formProducto">
        <input name="nombre" placeholder="Nombre" required>
        <input name="descripcion" placeholder="Descripción" required>
        <input name="cantidad" type="number" placeholder="Cantidad" required>
        <input name="unidad" placeholder="Unidad de medida" required>
        <input name="valor" type="number" step="0.01" placeholder="Valor Unitario" required>
        <button type="submit">Agregar</button>
      </form>

      <table class="tabla-productos">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Cantidad</th>
            <th>Unidad</th>
            <th>Valor</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- ========== GASTOS ========== -->
    <section id="gastos" class="seccion" style="display:none;">
      <h2>Gastos</h2>
      <form id="formGasto">
        <input name="descripcion" placeholder="Descripción del Gasto" required>
        <input name="monto" type="number" step="0.01" placeholder="Monto" required>
        <button type="submit">Agregar</button>
      </form>

      <table class="tabla-gastos">
        <thead>
          <tr>
            <th>Descripción</th>
            <th>Monto</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- ========== REPORTES ========== -->
    <section id="reportes" class="seccion" style="display:none;">
      <h2>Reportes</h2>
      <button id="generarReporte">Generar Reporte</button>
    </section>
  </main>
</body>
</html>
