<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
/* ------------------- Estilo 3D y profesional ------------------- */
body.dashboard-body {
    min-height: 100vh;
    display: flex;
    background: linear-gradient(145deg, #ff66cc, #ff3399);
    color: #333;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.sidebar {
    width: 250px;
    background: #fff;
    border-radius: 20px;
    margin: 20px;
    padding: 20px;
    box-shadow: 10px 10px 30px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #ff3399;
}

.nav-btn {
    margin: 5px 0;
    padding: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: #ff66cc;
    color: #fff;
    font-weight: 600;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
}
.nav-btn.active, .nav-btn:hover { background: #ff3399; }

.logout-btn {
    margin-top: auto;
    padding: 12px;
    border-radius: 12px;
    background: #ff0033;
    color: #fff;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}
.logout-btn:hover { background: #cc0029; }

.main-content {
    flex: 1;
    margin: 20px;
    padding: 20px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 10px 10px 30px rgba(0,0,0,0.2);
    overflow-y: auto;
}

h2 { color: #ff3399; margin-bottom: 15px; }

/* Formularios */
form { 
    margin-bottom: 25px;
    padding: 15px;
    border-radius: 15px;
    background: #ffe6f2;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
}
form input, form select, form button {
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid #ff3399;
    padding: 8px;
    width: 100%;
    font-size: 14px;
}
form button {
    background: #ff3399;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
}
form button:hover { background: #ff66cc; }

/* Tablas */
table { 
    width: 100%;
    border-collapse: collapse;
    border-radius: 15px;
    overflow: hidden;
}
table th, table td { padding: 12px; text-align: left; }
table th { background: #ff66cc; color: #fff; }
table tr:hover { background: #ffe6f2; }
button.edit-btn { background: #3399ff; color: #fff; }
button.delete-btn { background: #ff0033; color: #fff; }

/* Reporte */
#reporteContenido {
    padding: 15px;
    background: #ffe6f2;
    border-radius: 15px;
    box-shadow: inset 3px 3px 10px rgba(0,0,0,0.1);
}

</style>
</head>
<body class="dashboard-body">

<div class="sidebar">
    <h2>Discovery Pets</h2>
    <button class="nav-btn active" data-section="proveedores">🏪 Proveedores</button>
    <button class="nav-btn" data-section="facturas">📑 Facturas</button>
    <button class="nav-btn" data-section="gastos">💰 Gastos</button>
    <button class="nav-btn" data-section="servicios">🛠 Servicios</button>
    <button class="nav-btn" data-section="reportes">📊 Reportes</button>
    <div class="logout-btn" id="logoutBtn">Cerrar sesión</div>
</div>

<div class="main-content">

    <!-- Proveedores -->
    <section id="proveedores" class="content-section active">
        <h2>Registro de Proveedores</h2>
        <form id="formProveedor">
            <input id="rucProv" placeholder="RUC (solo números)" required>
            <input id="nombreProv" placeholder="Nombre" required>
            <input id="productoProv" placeholder="Producto" required>
            <input id="direccionProv" placeholder="Dirección" required>
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead>
                <tr><th>RUC</th><th>Nombre</th><th>Producto</th><th>Dirección</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaProveedores"></tbody>
        </table>
    </section>

    <!-- Facturas -->
    <section id="facturas" class="content-section">
        <h2>Registro de Facturas</h2>
        <form id="formFactura">
            <select id="proveedorFactura" required>
                <option value="">Seleccione proveedor</option>
            </select>
            <select id="tipoFactura" required>
                <option value="">Seleccione tipo</option>
                <option value="Factura electrónica">Factura electrónica</option>
                <option value="Boleta">Boleta</option>
            </select>
            <input id="montoFactura" type="number" step="0.01" placeholder="Monto (0.00)" required>
            <select id="monedaFactura" required>
                <option value="S/.">Soles (S/.)</option>
                <option value="USD">Dólares (USD)</option>
            </select>
            <input id="fechaFactura" type="date" required>
            <input id="descFactura" placeholder="Descripción">
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Proveedor</th><th>Tipo</th><th>Monto</th><th>Moneda</th>
                    <th>Fecha</th><th>Descripción</th><th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaFacturas"></tbody>
        </table>
    </section>

    <!-- Gastos -->
    <section id="gastos" class="content-section">
        <h2>Registro de Gastos</h2>
        <form id="formGasto">
            <input id="nombreGasto" placeholder="Nombre" required>
            <input id="tipoGasto" placeholder="Tipo" required>
            <input id="montoGasto" type="number" step="0.01" placeholder="Monto" required>
            <input id="fechaGasto" type="date" required>
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead>
                <tr><th>Nombre</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaGastos"></tbody>
        </table>
    </section>

    <!-- Servicios -->
    <section id="servicios" class="content-section">
        <h2>Registro de Servicios</h2>
        <form id="formServicio">
            <input id="nombreServ" placeholder="Nombre" required>
            <input id="precioServ" type="number" step="0.01" placeholder="Precio" required>
            <input id="fechaServ" type="date" required>
            <input id="descServ" placeholder="Descripción">
            <button type="submit">Agregar</button>
        </form>
        <table>
            <thead>
                <tr><th>Nombre</th><th>Precio</th><th>Fecha</th><th>Descripción</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaServicios"></tbody>
        </table>
    </section>

    <!-- Reportes -->
    <section id="reportes" class="content-section">
        <h2>Generar Reporte</h2>
        <button class="btn btn-primary mb-3" id="btnGenerarReporte">Generar Resumen</button>
        <div id="reporteContenido"></div>
    </section>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
