<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Discovery Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1: #f7fbff; --bg2: #eef9ff; --card: #ffffff; --accent: #10bcd4; --muted: #6b7280;
  --shadow-lg: 0 10px 30px rgba(16,188,212,0.12); --shadow-md: 0 6px 18px rgba(16,188,212,0.08);
  --radius: 16px;
}
*{box-sizing:border-box;font-family:'Inter',system-ui,Segoe UI,Roboto,Arial,sans-serif}
html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#0f172a}
.app{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:32px;min-height:100vh;align-items:start;}
.sidebar{position:sticky;top:32px;padding:20px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.7));box-shadow:var(--shadow-lg);backdrop-filter:blur(6px);}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px;}
.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#55d1e2);box-shadow:0 8px 20px rgba(16,188,212,0.2);display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:18px;}
.brand h1{font-size:16px;margin:0}
.nav{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
.menu-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:none;background:transparent;color:#0f172a;cursor:pointer;transition:all .18s ease;}
.menu-btn:hover{transform:translateY(-3px)}
.menu-btn.activo, .menu-btn:focus{background:linear-gradient(90deg,rgba(16,188,212,0.12),rgba(16,188,212,0.06));box-shadow:var(--shadow-md);border-left:3px solid var(--accent);}
.menu-btn .ico{width:18px;height:18px;display:inline-block;opacity:0.9}
.logout{margin-top:18px;padding:10px;border-radius:12px;background:transparent;border:1px solid rgba(15,23,42,0.06);cursor:pointer;}
.main{padding:28px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.82));box-shadow:var(--shadow-lg);backdrop-filter:blur(4px);}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.header h2{margin:0;font-weight:700;color:#07203a}
.search-box{display:flex;gap:10px;align-items:center;}
input[type="search"]{padding:10px 14px;border-radius:12px;border:1px solid rgba(10,20,30,0.06);min-width:280px;box-shadow:var(--shadow-md);}
.tabs{display:flex;gap:12px;margin-bottom:18px;}
.seccion{display:none;}
.seccion.activa{display:block;animation:fadeIn .28s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 420px;gap:18px;}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow-md);border:1px solid rgba(15,23,42,0.03);}
.card h3{margin:0 0 8px 0;font-size:15px}
form .row{display:flex;gap:8px;margin-bottom:10px} 
form input, form select{padding:10px;border-radius:10px;border:1px solid rgba(10,20,30,0.06);flex:1}
table{width:100%;border-collapse:collapse}
table th, table td{padding:10px;text-align:left;border-bottom:1px dashed rgba(10,20,30,0.04);font-size:14px}
.table-scroll{max-height:420px;overflow:auto;padding-right:6px}
.btn{padding:8px 12px;border-radius:10px;border:none;cursor:pointer;background:var(--accent);color:white;font-weight:600;box-shadow:0 6px 18px rgba(16,188,212,0.12)}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid rgba(16,188,212,0.12)}
.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand"><div class="logo">DP</div><div><h1>Discovery Pets</h1><div class="muted">Panel administrativo</div></div></div>
    <nav class="nav">
      <button class="menu-btn activo" data-target="seccion-proveedores">🏢 Proveedores</button>
      <button class="menu-btn" data-target="seccion-productos">📦 Productos</button>
      <button class="menu-btn" data-target="seccion-facturas">🧾 Facturas</button>
    </nav>
    <button id="logoutBtn" class="logout">Cerrar sesión</button>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="header">
      <h2>Dashboard · Discovery Pets</h2>
      <div class="search-box">
        <input id="buscadorFactura" type="search" placeholder="Buscar factura por producto">
        <button class="btn secondary" id="btnRefresh">Restablecer</button>
      </div>
    </div>

    <div class="grid">
      <div>
        <!-- Proveedores -->
        <section id="seccion-proveedores" class="seccion activa">
          <div class="card">
            <h3 id="tituloProveedor">Registrar proveedor</h3>
            <form id="proveedorForm">
              <div class="row">
                <input id="nombreProveedor" placeholder="Nombre" required>
                <input id="rucProveedor" placeholder="RUC" required>
              </div>
              <div class="row">
                <input id="telefonoProveedor" placeholder="Teléfono">
                <input id="numeroOpcionalProveedor" placeholder="Número opcional">
              </div>
              <div class="row">
                <input id="direccionProveedor" placeholder="Dirección">
                <button class="btn" type="submit">Añadir proveedor</button>
                <button type="button" class="btn secondary" id="cancelarProveedor" style="display:none;">Cancelar</button>
              </div>
            </form>
          </div>
          <div class="card" style="margin-top:12px">
            <h3>Proveedores registrados</h3>
            <div class="table-scroll">
              <table>
                <thead><tr><th>Nombre</th><th>RUC</th><th>Teléfono</th><th>Opc.</th><th>Dirección</th><th></th></tr></thead>
                <tbody id="tablaProveedores"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- Productos -->
        <section id="seccion-productos" class="seccion">
          <div class="card">
            <h3 id="tituloProducto">Registrar producto</h3>
            <form id="productoForm">
              <div class="row">
                <input id="nombreProducto" placeholder="Nombre producto" required>
                <input id="precioProducto" placeholder="Precio" inputmode="decimal">
              </div>
              <div class="row">
                <input id="cantidadProducto" placeholder="Cantidad" inputmode="numeric">
                <input id="descripcionProducto" placeholder="Descripción opcional">
                <button class="btn" type="submit">Añadir producto</button>
                <button type="button" class="btn secondary" id="cancelarProducto" style="display:none;">Cancelar</button>
              </div>
            </form>
          </div>
          <div class="card" style="margin-top:12px">
            <h3>Productos registrados</h3>
            <div class="table-scroll">
              <table>
                <thead><tr><th>Nombre</th><th>Precio</th><th>Cant.</th><th>Desc.</th><th></th></tr></thead>
                <tbody id="tablaProductos"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- Facturas -->
        <section id="seccion-facturas" class="seccion">
          <div class="card">
            <h3 id="tituloFactura">Registrar factura</h3>
            <form id="facturaForm">
              <div class="row">
                <input id="idFactura" placeholder="ID de factura" required>
                <input id="fechaFactura" type="date">
              </div>
              <div class="row">
                <select id="proveedorFactura"><option value="">Seleccione proveedor</option></select>
                <select id="productoFactura"><option value="">Seleccione producto</option></select>
              </div>
              <div class="row">
                <input id="montoFactura" placeholder="Monto" inputmode="decimal">
                <select id="monedaFactura"><option value="S/">S/</option><option value="$">$</option></select>
                <select id="tipoFactura"><option value="Compra">Compra</option><option value="Gasto">Gasto</option></select>
                <button class="btn" type="submit">Guardar factura</button>
                <button type="button" class="btn secondary" id="cancelarFactura" style="display:none;">Cancelar</button>
              </div>
            </form>
          </div>
          <div class="card" style="margin-top:12px">
            <h3>Facturas</h3>
            <div class="table-scroll">
              <table>
                <thead><tr><th>ID</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Moneda</th><th>Monto</th><th>Tipo</th><th></th></tr></thead>
                <tbody id="tablaFacturas"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<!-- Firebase CDN -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCIo7CBX5jzAGlDFBu0mMb6BFfUsecaf7I",
    authDomain: "discovery-pets.firebaseapp.com",
    databaseURL: "https://discovery-pets-default-rtdb.firebaseio.com",
    projectId: "discovery-pets",
    storageBucket: "discovery-pets.firebasestorage.app",
    messagingSenderId: "481355972999",
    appId: "1:481355972999:web:5f5fa07f75b3fc9f4c5322",
    measurementId: "G-0WMLRY8FGM"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// --------------------- Helpers ---------------------
let editProveedorId = null, editProductoId = null, editFacturaId = null;

// --------------------- Proveedores ---------------------
const proveedorForm = document.getElementById("proveedorForm");
const tablaProveedores = document.getElementById("tablaProveedores");
const proveedorSelect = document.getElementById("proveedorFactura");
const cancelarProveedor = document.getElementById("cancelarProveedor");
const tituloProveedor = document.getElementById("tituloProveedor");

proveedorForm.addEventListener("submit", async e=>{
  e.preventDefault();
  const data = {
    nombre: document.getElementById("nombreProveedor").value,
    ruc: document.getElementById("rucProveedor").value,
    telefono: document.getElementById("telefonoProveedor").value,
    opc: document.getElementById("numeroOpcionalProveedor").value,
    direccion: document.getElementById("direccionProveedor").value
  };
  if(editProveedorId){
    await updateDoc(doc(db,"proveedores",editProveedorId), data);
    editProveedorId=null;
    cancelarProveedor.style.display='none';
    tituloProveedor.textContent='Registrar proveedor';
  } else {
    await addDoc(collection(db,"proveedores"), data);
  }
  proveedorForm.reset();
});

cancelarProveedor.addEventListener('click', ()=>{
  proveedorForm.reset();
  editProveedorId=null;
  tituloProveedor.textContent='Registrar proveedor';
  cancelarProveedor.style.display='none';
});

onSnapshot(collection(db,"proveedores"), snapshot=>{
  tablaProveedores.innerHTML='';
  proveedorSelect.innerHTML='<option value="">Seleccione proveedor</option>';
  snapshot.forEach(docu=>{
    const d = docu.data();
    tablaProveedores.innerHTML += `<tr>
      <td>${d.nombre}</td>
      <td>${d.ruc}</td>
      <td>${d.telefono}</td>
      <td>${d.opc}</td>
      <td>${d.direccion}</td>
      <td>
        <button onclick="editarProveedor('${docu.id}','${d.nombre}','${d.ruc}','${d.telefono}','${d.opc}','${d.direccion}')">✏️</button>
        <button onclick="borrar('proveedores','${docu.id}')">❌</button>
      </td>
    </tr>`;
    proveedorSelect.innerHTML += `<option value="${d.nombre}">${d.nombre}</option>`;
  });
});

window.editarProveedor = (id,nombre,ruc,telefono,opc,direccion)=>{
  document.getElementById("nombreProveedor").value=nombre;
  document.getElementById("rucProveedor").value=ruc;
  document.getElementById("telefonoProveedor").value=telefono;
  document.getElementById("numeroOpcionalProveedor").value=opc;
  document.getElementById("direccionProveedor").value=direccion;
  editProveedorId=id;
  cancelarProveedor.style.display='inline-block';
  tituloProveedor.textContent='Editar proveedor';
};

// --------------------- Productos ---------------------
const productoForm = document.getElementById("productoForm");
const tablaProductos = document.getElementById("tablaProductos");
const productoSelect = document.getElementById("productoFactura");
const cancelarProducto = document.getElementById("cancelarProducto");
const tituloProducto = document.getElementById("tituloProducto");

productoForm.addEventListener("submit", async e=>{
  e.preventDefault();
  const data = {
    nombre: document.getElementById("nombreProducto").value,
    precio: document.getElementById("precioProducto").value,
    cantidad: document.getElementById("cantidadProducto").value,
    descripcion: document.getElementById("descripcionProducto").value
  };
  if(editProductoId){
    await updateDoc(doc(db,"productos",editProductoId), data);
    editProductoId=null;
    cancelarProducto.style.display='none';
    tituloProducto.textContent='Registrar producto';
  } else {
    await addDoc(collection(db,"productos"), data);
  }
  productoForm.reset();
});

cancelarProducto.addEventListener('click', ()=>{
  productoForm.reset();
  editProductoId=null;
  tituloProducto.textContent='Registrar producto';
  cancelarProducto.style.display='none';
});

onSnapshot(collection(db,"productos"), snapshot=>{
  tablaProductos.innerHTML='';
  productoSelect.innerHTML='<option value="">Seleccione producto</option>';
  snapshot.forEach(docu=>{
    const d = docu.data();
    tablaProductos.innerHTML += `<tr>
      <td>${d.nombre}</td>
      <td>${d.precio}</td>
      <td>${d.cantidad}</td>
      <td>${d.descripcion}</td>
      <td>
        <button onclick="editarProducto('${docu.id}','${d.nombre}','${d.precio}','${d.cantidad}','${d.descripcion}')">✏️</button>
        <button onclick="borrar('productos','${docu.id}')">❌</button>
      </td>
    </tr>`;
    productoSelect.innerHTML += `<option value="${d.nombre}">${d.nombre}</option>`;
  });
});

window.editarProducto=(id,nombre,precio,cantidad,descripcion)=>{
  document.getElementById("nombreProducto").value=nombre;
  document.getElementById("precioProducto").value=precio;
  document.getElementById("cantidadProducto").value=cantidad;
  document.getElementById("descripcionProducto").value=descripcion;
  editProductoId=id;
  cancelarProducto.style.display='inline-block';
  tituloProducto.textContent='Editar producto';
};

// --------------------- Facturas ---------------------
const facturaForm = document.getElementById("facturaForm");
const tablaFacturas = document.getElementById("tablaFacturas");
const cancelarFactura = document.getElementById("cancelarFactura");
const tituloFactura = document.getElementById("tituloFactura");
const buscadorFactura = document.getElementById("buscadorFactura");
const btnRefresh = document.getElementById("btnRefresh");

facturaForm.addEventListener("submit", async e=>{
  e.preventDefault();
  const data = {
    id: document.getElementById("idFactura").value,
    fecha: document.getElementById("fechaFactura").value,
    proveedor: document.getElementById("proveedorFactura").value,
    producto: document.getElementById("productoFactura").value,
    monto: document.getElementById("montoFactura").value,
    moneda: document.getElementById("monedaFactura").value,
    tipo: document.getElementById("tipoFactura").value
  };
  if(editFacturaId){
    await updateDoc(doc(db,"facturas",editFacturaId), data);
    editFacturaId=null;
    cancelarFactura.style.display='none';
    tituloFactura.textContent='Registrar factura';
  } else {
    await addDoc(collection(db,"facturas"), data);
  }
  facturaForm.reset();
});

cancelarFactura.addEventListener('click', ()=>{
  facturaForm.reset();
  editFacturaId=null;
  tituloFactura.textContent='Registrar factura';
  cancelarFactura.style.display='none';
});

onSnapshot(collection(db,"facturas"), snapshot=>{
  mostrarFacturas(snapshot.docs);
});

function mostrarFacturas(docs){
  tablaFacturas.innerHTML='';
  docs.forEach(docu=>{
    const d=docu.data();
    tablaFacturas.innerHTML += `<tr>
      <td>${d.id}</td>
      <td>${d.fecha}</td>
      <td>${d.proveedor}</td>
      <td>${d.producto}</td>
      <td>${d.moneda}</td>
      <td>${d.monto}</td>
      <td>${d.tipo}</td>
      <td>
        <button onclick="editarFactura('${docu.id}','${d.id}','${d.fecha}','${d.proveedor}','${d.producto}','${d.monto}','${d.moneda}','${d.tipo}')">✏️</button>
        <button onclick="borrar('facturas','${docu.id}')">❌</button>
      </td>
    </tr>`;
  });
}

window.editarFactura=(id,factId,fecha,proveedor,producto,monto,moneda,tipo)=>{
  document.getElementById("idFactura").value=factId;
  document.getElementById("fechaFactura").value=fecha;
  document.getElementById("proveedorFactura").value=proveedor;
  document.getElementById("productoFactura").value=producto;
  document.getElementById("montoFactura").value=monto;
  document.getElementById("monedaFactura").value=moneda;
  document.getElementById("tipoFactura").value=tipo;
  editFacturaId=id;
  cancelarFactura.style.display='inline-block';
  tituloFactura.textContent='Editar factura';
};

// --------------------- Buscador ---------------------
buscadorFactura.addEventListener('input', async ()=>{
  const query = buscadorFactura.value.toLowerCase();
  const snapshot = await collection(db,"facturas");
  onSnapshot(collection(db,"facturas"), snap=>{
    const filtered = snap.docs.filter(d=>d.data().producto.toLowerCase().includes(query));
    mostrarFacturas(filtered);
  });
});
btnRefresh.addEventListener('click', ()=>{ buscadorFactura.value=''; });

// --------------------- Sidebar ---------------------
document.querySelectorAll('.menu-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('activo'));
    btn.classList.add('activo');
    document.querySelectorAll('.seccion').forEach(sec=>sec.classList.remove('activa'));
    document.getElementById(btn.dataset.target).classList.add('activa');
  });
});

// --------------------- Borrar ---------------------
window.borrar = async (col,id)=> await deleteDoc(doc(db,col,id));

// --------------------- Logout ---------------------
document.getElementById("logoutBtn").addEventListener('click', ()=>{
  alert("Sesión cerrada."); 
  window.location.href="index.html"; 
});
</script>
</body>
</html>
