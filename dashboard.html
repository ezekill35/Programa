<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🐾 Discovery Pets</h1>
  </header>

  <nav class="menu">
    <button class="menu-btn active" data-section="sectionProveedor" id="btnProveedor">Proveedor</button>
    <button class="menu-btn" data-section="sectionFactura" id="btnFactura">Factura</button>
    <button class="menu-btn" data-section="sectionGastos" id="btnGastos">Gastos</button>
    <button class="menu-btn" data-section="sectionServicio" id="btnServicio">Servicio</button>
    <button class="menu-btn logout" id="btnLogout">Cerrar Sesión</button>
  </nav>

  <main>
    <!-- Sección Proveedor -->
    <section class="section active" id="sectionProveedor">
      <h2>Proveedor</h2>
      <input type="text" id="provRUC" placeholder="RUC">
      <input type="text" id="provNombre" placeholder="Nombre">
      <input type="text" id="provDireccion" placeholder="Dirección">
      <button id="btnAddProveedor">Agregar</button>
      <input type="text" id="searchProveedor" placeholder="Buscar proveedor por RUC o Nombre">
      <button id="btnSearchProveedor">Buscar</button>
      <table>
        <thead>
          <tr>
            <th>RUC</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaProveedor"></tbody>
      </table>
    </section>

    <!-- Sección Factura -->
    <section class="section" id="sectionFactura">
      <h2>Factura</h2>
      <input type="text" id="factRUC" placeholder="RUC del proveedor">
      <input type="text" id="factDescripcion" placeholder="Descripción">
      <input type="date" id="factFecha">
      <button id="btnAddFactura">Agregar Factura</button>
      <input type="text" id="searchFactura" placeholder="Buscar factura por RUC">
      <button id="btnSearchFactura">Buscar</button>
      <table>
        <thead>
          <tr>
            <th>RUC</th>
            <th>Descripción</th>
            <th>Fecha</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaFactura"></tbody>
      </table>
    </section>

    <!-- Sección Gastos -->
    <section class="section" id="sectionGastos">
      <h2>Gastos</h2>
      <input type="text" id="gastoDescripcion" placeholder="Descripción">
      <input type="number" id="gastoMonto" placeholder="Monto">
      <button id="btnAddGasto">Agregar Gasto</button>
      <input type="text" id="searchGasto" placeholder="Buscar gasto por descripción">
      <button id="btnSearchGasto">Buscar</button>
      <table>
        <thead>
          <tr>
            <th>Descripción</th>
            <th>Monto</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaGasto"></tbody>
      </table>
    </section>

    <!-- Sección Servicio -->
    <section class="section" id="sectionServicio">
      <h2>Servicio</h2>
      <input type="text" id="servDescripcion" placeholder="Descripción">
      <input type="number" id="servMonto" placeholder="Monto">
      <button id="btnAddServicio">Agregar Servicio</button>
      <input type="text" id="searchServicio" placeholder="Buscar servicio por descripción">
      <button id="btnSearchServicio">Buscar</button>
      <table>
        <thead>
          <tr>
            <th>Descripción</th>
            <th>Monto</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaServicio"></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
