<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discovery Pets · Acceso</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Inter', sans-serif; 
  }
  
  body, html { 
    width:100%; 
    height:100%; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    position: relative;
    overflow: hidden;
  }
  
  /* Elementos decorativos de fondo */
  .floating-element {
    position: absolute;
    font-size: 2.5rem;
    z-index: 0;
    opacity: 0.08;
    animation: floatElement 8s ease-in-out infinite;
  }
  
  .element-1 { top: 12%; left: 7%; animation-delay: 0s; }
  .element-2 { top: 22%; right: 9%; animation-delay: 2s; }
  .element-3 { bottom: 28%; left: 10%; animation-delay: 4s; }
  .element-4 { bottom: 12%; right: 7%; animation-delay: 6s; }
  
  @keyframes floatElement {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
  }
  
  .login-wrapper { 
    width:90%; 
    max-width:1100px; 
    background:#fff; 
    border-radius:24px; 
    box-shadow:0 25px 50px rgba(0,0,0,0.15); 
    display:flex; 
    min-height:600px; 
    overflow:hidden; 
    position: relative;
    z-index: 10;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  
  .login-wrapper:hover {
    transform: translateY(-5px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.2);
  }
  
  .login-form { 
    flex:1; 
    padding:60px 50px; 
    display:flex; 
    flex-direction:column; 
    justify-content:center; 
    gap:20px; 
    background: #fff;
  }
  
  .logo { 
    font-size:42px; 
    font-weight:800; 
    color:#10bcd4; 
    text-align:center; 
    margin-bottom:15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  
  .logo-icon {
    font-size: 48px;
    animation: bounce 2s infinite;
  }
  
  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
    40% {transform: translateY(-10px);}
    60% {transform: translateY(-5px);}
  }
  
  h2 { 
    font-size:32px; 
    color:#111827; 
    text-align:center; 
    margin-bottom:8px; 
    font-weight: 700;
  }
  
  .subtitle { 
    color:#6b7280; 
    font-size:16px; 
    text-align:center; 
    margin-bottom:30px; 
    line-height: 1.6;
  }
  
  .input-group { 
    position:relative; 
    width:100%; 
    margin-bottom: 15px;
  }
  
  input { 
    width:100%; 
    padding:18px 20px; 
    border:2px solid #e6e9ee; 
    border-radius:14px; 
    font-size:16px; 
    background:#fafafa; 
    transition:all 0.3s ease; 
  }
  
  input:focus { 
    outline:none; 
    border-color:#10bcd4; 
    box-shadow:0 0 0 4px rgba(16, 188, 212, 0.15); 
    background:#fff; 
  }
  
  .toggle-password { 
    position:absolute; 
    right:18px; 
    top:50%; 
    transform:translateY(-50%); 
    cursor:pointer; 
    font-size:18px; 
    color:#6b7280; 
    transition: all 0.3s ease;
    padding: 5px;
    border-radius: 50%;
  }
  
  .toggle-password:hover { 
    color:#10bcd4; 
    background: rgba(16, 188, 212, 0.1);
  }
  
  .actions { 
    display:flex; 
    align-items:center; 
    justify-content:space-between; 
    font-size:14px; 
    color:#6b7280; 
    margin:8px 0 20px; 
  }
  
  .checkbox-container {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  
  .checkbox-container:hover {
    color: #10bcd4;
  }
  
  .checkbox-container input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #10bcd4;
    cursor: pointer;
  }
  
  .btn-login { 
    padding:18px; 
    border:none; 
    border-radius:14px; 
    background:linear-gradient(90deg, #10bcd4, #38bdf8); 
    color:white; 
    font-size:16px; 
    font-weight:600; 
    cursor:pointer; 
    transition:all 0.3s ease; 
    position: relative;
    overflow: hidden;
  }
  
  .btn-login:hover { 
    transform:translateY(-3px); 
    box-shadow:0 12px 30px rgba(16, 188, 212, 0.25); 
  }
  
  .btn-login:active {
    transform: translateY(-1px);
  }
  
  .btn-login::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: rgba(255, 255, 255, 0.5);
    opacity: 0;
    border-radius: 100%;
    transform: scale(1, 1) translate(-50%);
    transform-origin: 50% 50%;
  }
  
  .btn-login:focus:not(:active)::after {
    animation: ripple 1s ease-out;
  }
  
  @keyframes ripple {
    0% {
      transform: scale(0, 0);
      opacity: 0.5;
    }
    100% {
      transform: scale(40, 40);
      opacity: 0;
    }
  }
  
  .helper { 
    margin-top:20px; 
    font-size:14px; 
    color:#6b7280; 
    text-align:center; 
    line-height: 1.5;
  }
  
  .login-image { 
    flex:1; 
    position:relative; 
    background:url('https://images.pexels.com/photos/416160/pexels-photo-416160.jpeg') center/cover no-repeat; 
    overflow: hidden;
  }
  
  .login-image::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
    z-index: 1;
  }
  
  .login-image::after { 
    content:""; 
    position:absolute; 
    inset:0; 
    background:linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 100%); 
    z-index: 2;
  }
  
  .login-image .text-overlay { 
    position:absolute; 
    bottom:50px; 
    left:40px; 
    color:white; 
    font-size:28px; 
    font-weight:700; 
    line-height:1.3; 
    z-index:3; 
    max-width:400px; 
    text-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  
  /* Animación de entrada para elementos del formulario */
  .form-element {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.6s ease forwards;
  }
  
  .form-element:nth-child(1) { animation-delay: 0.1s; }
  .form-element:nth-child(2) { animation-delay: 0.2s; }
  .form-element:nth-child(3) { animation-delay: 0.3s; }
  .form-element:nth-child(4) { animation-delay: 0.4s; }
  .form-element:nth-child(5) { animation-delay: 0.5s; }
  .form-element:nth-child(6) { animation-delay: 0.6s; }
  .form-element:nth-child(7) { animation-delay: 0.7s; }
  
  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  /* Sistema de seguridad */
  .attempts-counter {
    text-align: center;
    font-size: 14px;
    color: #6b7280;
    margin: 8px 0;
    padding: 10px;
    background: rgba(255,255,255,0.7);
    border-radius: 10px;
    display: none;
  }
  
  .attempts-warning {
    color: #e74c3c;
    font-weight: 600;
  }
  
  /* Loading animation */
  .loading {
    display: none;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
    margin: 0 auto;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  /* Mensajes del sistema */
  .error-message {
    color: #e74c3c;
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
    display: none;
    padding: 12px;
    background: rgba(231, 76, 60, 0.1);
    border-radius: 10px;
    border-left: 4px solid #e74c3c;
  }
  
  .success-message {
    color: #2ecc71;
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
    display: none;
    padding: 12px;
    background: rgba(46, 204, 113, 0.1);
    border-radius: 10px;
    border-left: 4px solid #2ecc71;
  }
  
  /* Responsive */
  @media (max-width: 900px){ 
    .login-wrapper { 
      flex-direction:column; 
      max-width:600px; 
      min-height: auto;
    } 
    
    .login-image { 
      height:200px; 
    } 
    
    .login-form { 
      padding:40px 30px; 
    } 
    
    .logo { 
      font-size:36px; 
    }
    
    h2 {
      font-size: 26px;
    }
    
    .floating-element {
      display: none;
    }
  }
  
  @media (max-width: 480px) {
    .login-form {
      padding: 30px 20px;
    }
    
    .logo {
      font-size: 32px;
    }
    
    h2 {
      font-size: 22px;
    }
    
    .subtitle {
      font-size: 14px;
    }
    
    .login-image .text-overlay {
      font-size: 22px;
      bottom: 30px;
      left: 25px;
    }
  }
</style>
</head>
<body>
  <!-- Elementos decorativos -->
  <div class="floating-element element-1">🐶</div>
  <div class="floating-element element-2">🐱</div>
  <div class="floating-element element-3">🐾</div>
  <div class="floating-element element-4">🐕</div>

  <div class="login-wrapper">
    <div class="login-form" role="main" aria-labelledby="login-title">
      <div class="logo form-element">
        <span class="logo-icon">🐾</span> Discovery Pets
      </div>
      <h2 id="login-title" class="form-element">Bienvenido de nuevo</h2>
      <div class="subtitle form-element">Accede al panel administrativo</div>
      
      <div class="input-group form-element">
        <input id="email" type="email" placeholder="Correo electrónico" autocomplete="username" required>
      </div>
      
      <div class="input-group form-element">
        <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
        <span id="togglePassword" class="toggle-password">👁️</span>
      </div>
      
      <div id="attemptsCounter" class="attempts-counter"></div>
      
      <div class="actions form-element">
        <label class="checkbox-container">
          <input id="keepLogged" type="checkbox"> 
          <span>Mantener sesión activa</span>
        </label>
      </div>
      
      <button id="btnLogin" class="btn-login form-element">
        <span id="btnText">Iniciar sesión</span>
        <div id="btnLoading" class="loading"></div>
      </button>
      
      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>
      
      <p class="helper form-element">Si no tienes acceso, contacta al administrador del sistema.</p>
    </div>
    
    <div class="login-image" role="presentation">
      <div class="text-overlay">Tu tienda de confianza para mascotas</div>
    </div>
  </div>

<script type="module">
  // Importar Firebase
  import { auth } from "./firebase.js";
  import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Elementos del DOM
  const btnLogin = document.getElementById("btnLogin");
  const togglePassword = document.getElementById("togglePassword");
  const passwordInput = document.getElementById("password");
  const btnText = document.getElementById("btnText");
  const btnLoading = document.getElementById("btnLoading");
  const errorMessage = document.getElementById("errorMessage");
  const successMessage = document.getElementById("successMessage");
  const attemptsCounter = document.getElementById("attemptsCounter");

  // Configuración de seguridad
  const MAX_ATTEMPTS = 4;
  let failedAttempts = 0;

  // Inicializar sistema de seguridad
  function initializeSecurity() {
    const savedAttempts = localStorage.getItem('failedAttempts');
    if (savedAttempts) {
      failedAttempts = parseInt(savedAttempts);
    }
    updateAttemptsDisplay();
  }

  // Actualizar contador de intentos
  function updateAttemptsDisplay() {
    if (failedAttempts > 0) {
      const remainingAttempts = MAX_ATTEMPTS - failedAttempts;
      if (remainingAttempts > 0) {
        attemptsCounter.innerHTML = `Intentos fallidos: <span class="attempts-warning">${failedAttempts}/${MAX_ATTEMPTS}</span> (${remainingAttempts} ${remainingAttempts === 1 ? 'intento' : 'intentos'} restantes)`;
      } else {
        attemptsCounter.innerHTML = `Intentos fallidos: <span class="attempts-warning">${failedAttempts}/${MAX_ATTEMPTS}</span>`;
      }
      attemptsCounter.style.display = 'block';
    } else {
      attemptsCounter.style.display = 'none';
    }
  }

  // Mostrar/ocultar contraseña
  togglePassword.addEventListener("click", () => {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
    togglePassword.textContent = isHidden ? "🙈" : "👁️";
  });

  // Redirección si ya está logueado
  onAuthStateChanged(auth, (user) => {
    if(user) window.location.href = "dashboard.html";
  });

  // Función de login
  btnLogin.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value.trim();
    const keepLogged = document.getElementById("keepLogged").checked;
    
    if (!email || !password) {
      showMessage(errorMessage, "Por favor completa correo y contraseña.");
      return;
    }
    
    // Mostrar estado de carga
    btnText.style.display = "none";
    btnLoading.style.display = "block";
    btnLogin.disabled = true;
    hideMessage(errorMessage);
    hideMessage(successMessage);
    
    try {
      await signInWithEmailAndPassword(auth, email, password);
      
      // Reiniciar seguridad en login exitoso
      failedAttempts = 0;
      localStorage.removeItem('failedAttempts');
      updateAttemptsDisplay();
      
      if(keepLogged) localStorage.setItem("keepLogged","true");
      else localStorage.removeItem("keepLogged");
      
      showMessage(successMessage, "¡Inicio de sesión exitoso! Redirigiendo...");
      
      // Redirección después de login exitoso
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1500);
      
    } catch(err) { 
      // Incrementar intentos fallidos
      failedAttempts++;
      localStorage.setItem('failedAttempts', failedAttempts.toString());
      updateAttemptsDisplay();
      
      showMessage(errorMessage, "Error al iniciar sesión: " + getErrorMessage(err.code));
    } finally {
      // Reiniciar estado del botón
      btnText.style.display = "block";
      btnLoading.style.display = "none";
      btnLogin.disabled = false;
    }
  });

  // Funciones auxiliares
  function showMessage(element, message) {
    element.innerHTML = message;
    element.style.display = "block";
  }
  
  function hideMessage(element) {
    element.style.display = "none";
  }
  
  function getErrorMessage(errorCode) {
    const errorMessages = {
      "auth/invalid-email": "El formato del correo electrónico no es válido.",
      "auth/user-disabled": "Esta cuenta ha sido deshabilitada.",
      "auth/user-not-found": "No existe una cuenta con este correo electrónico.",
      "auth/wrong-password": "La contraseña es incorrecta.",
      "auth/too-many-requests": "Demasiados intentos fallidos. Intenta más tarde."
    };
    
    return errorMessages[errorCode] || "Error desconocido. Intenta nuevamente.";
  }

  // Permitir envío del formulario con Enter
  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      btnLogin.click();
    }
  });

  // Inicializar sistema de seguridad
  initializeSecurity();
</script>
</body>
</html>
