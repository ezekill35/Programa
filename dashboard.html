<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar p-3 bg-gradient">
      <h2 class="text-white mb-4">🐾 Discovery Pets</h2>
      <ul class="list-unstyled">
        <li id="menu-reportes">📊 Reportes</li>
        <li id="menu-proveedores">🏪 Proveedores</li>
        <li id="menu-facturas">📑 Facturas</li>
        <li id="menu-gastos">💰 Gastos</li>
        <li id="menu-servicios">🛠 Servicios</li>
        <li id="menu-logout">🚪 Cerrar Sesión</li>
      </ul>
    </div>

    <!-- Contenido -->
    <div class="p-4 flex-grow-1">
      <!-- Reportes -->
      <div class="section" id="reportes">
        <h2>📊 Reportes</h2>
        <div class="row g-3">
          <div class="col-md-3">
            <div class="card shadow p-3">
              <h3 id="total-proveedores">0</h3>
              <p>Proveedores</p>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card shadow p-3">
              <h3 id="total-facturas">0</h3>
              <p>Facturas</p>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card shadow p-3">
              <h3 id="total-gastos">0</h3>
              <p>Gastos</p>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card shadow p-3">
              <h3 id="total-servicios">0</h3>
              <p>Servicios</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Aquí van las secciones de Proveedores, Facturas, Gastos, Servicios -->
      <!-- Cada sección tendrá un formulario y tabla -->
      <div class="section d-none" id="proveedores">
        <h2>🏪 Proveedores</h2>
        <form id="formProveedor" class="mb-3">
          <input type="text" id="provRuc" placeholder="RUC" class="form-control mb-2">
          <input type="text" id="provNombre" placeholder="Nombre" class="form-control mb-2">
          <input type="text" id="provDireccion" placeholder="Dirección" class="form-control mb-2">
          <input type="text" id="provTelefono" placeholder="Teléfono" class="form-control mb-2">
          <input type="text" id="provProducto" placeholder="Producto" class="form-control mb-2">
          <button type="button" id="btnAgregarProveedor" class="btn btn-pink">Agregar Proveedor</button>
        </form>
        <table class="table table-hover">
          <thead class="table-dark">
            <tr>
              <th>RUC</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Producto</th><th>Acción</th>
            </tr>
          </thead>
          <tbody id="listaProveedores"></tbody>
        </table>
      </div>
      
      <!-- Facturas, Gastos y Servicios se agregan de manera similar -->
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
