<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Discovery Pets</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background: #f8fafc; margin:0; }
.navbar { background:#2563eb; color:white; padding:10px; display:flex; justify-content:space-between; align-items:center; }
.navbar .nav-btn { color:white; background:none; border:none; margin-right:10px; cursor:pointer; font-weight:bold; }
.navbar .nav-btn.activo { text-decoration:underline; }
.container { padding:20px; }
.seccion { display:none; }
.seccion.activa { display:block; }
table { width:100%; }
table th, table td { padding:5px; text-align:left; }
.btn-accion { margin-right:5px; }
#searchInput { margin-bottom:10px; width:100%; padding:5px; border-radius:5px; border:1px solid #ccc; }
.resultado-item:hover { background:#bae6fd; }
.link-info { cursor:pointer; text-decoration:underline; }
modal { border:none; border-radius:8px; padding:20px; background:white; box-shadow:0 0 15px rgba(0,0,0,0.3);}
</style>
</head>
<body>

<div class="navbar">
  <div>
    <button class="nav-btn activo" data-target="proveedores">Proveedores</button>
    <button class="nav-btn" data-target="productos">Productos</button>
    <button class="nav-btn" data-target="facturas">Facturas</button>
  </div>
  <button id="btnCerrarSesion">Cerrar Sesión</button>
</div>

<div class="container">
  <!-- PROVEEDORES -->
  <div class="seccion activa" id="proveedores">
    <h3>Registrar Proveedor</h3>
    <form id="formProveedor">
      <input type="text" id="rucProveedor" placeholder="RUC" class="form-control mb-2" required>
      <input type="text" id="nombreProveedor" placeholder="Nombre" class="form-control mb-2" required>
      <input type="text" id="direccionProveedor" placeholder="Dirección" class="form-control mb-2">
      <input type="text" id="telefonoProveedor" placeholder="Teléfono" class="form-control mb-2">
      <button class="btn btn-primary">Agregar Proveedor</button>
    </form>
    <h4>Lista de Proveedores (<span id="countProveedores">0</span>)</h4>
    <table class="table table-bordered"><thead><tr><th>RUC</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr></thead><tbody id="tablaProveedores"></tbody></table>
  </div>

  <!-- PRODUCTOS -->
  <div class="seccion" id="productos">
    <h3>Registrar Producto</h3>
    <form id="formProducto">
      <input type="text" id="nombreProducto" placeholder="Nombre" class="form-control mb-2" required>
      <input type="number" id="cantidadProducto" placeholder="Cantidad" class="form-control mb-2" required>
      <input type="number" id="precioProducto" placeholder="Precio" class="form-control mb-2" step="0.01" required>
      <textarea id="descripcionProducto" placeholder="Descripción" class="form-control mb-2"></textarea>
      <button class="btn btn-primary">Agregar Producto</button>
    </form>
    <h4>Lista de Productos (<span id="countProductos">0</span>)</h4>
    <table class="table table-bordered"><thead><tr><th>Nombre</th><th>Cantidad</th><th>Precio</th><th>Descripción</th><th>Acciones</th></tr></thead><tbody id="tablaProductos"></tbody></table>
  </div>

  <!-- FACTURAS -->
  <div class="seccion" id="facturas">
    <h3>Registrar Factura</h3>
    <form id="formFactura">
      <input type="text" id="idFactura" placeholder="ID Factura" class="form-control mb-2" required>
      <input type="date" id="fechaFactura" class="form-control mb-2" required>
      <select id="proveedorFactura" class="form-control mb-2" required></select>
      <select id="productoFactura" class="form-control mb-2" required></select>
      <input type="number" id="montoFactura" placeholder="Monto" class="form-control mb-2" step="0.01" required>
      <input type="text" id="tipoFactura" placeholder="Tipo" class="form-control mb-2" required>
      <button class="btn btn-primary">Agregar Factura</button>
    </form>
    <input type="text" id="searchInput" placeholder="Buscar producto..." class="form-control">
    <div id="searchResults"></div>
    <h4>Lista de Facturas (<span id="countFacturas">0</span>)</h4>
    <table class="table table-bordered"><thead><tr><th>ID Factura</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Acciones</th></tr></thead><tbody id="tablaFacturas"></tbody></table>
  </div>
</div>

<!-- MODAL EDITAR -->
<modal id="modalEditar">
  <div id="modalEditarBody"></div>
  <button id="cerrarModalEditar" class="btn btn-secondary mt-2">Cerrar</button>
</modal>

<!-- MODAL FACTURA -->
<modal id="modalFactura">
  <div id="modalFacturaBody"></div>
  <button id="cerrarModalFactura" class="btn btn-secondary mt-2">Cerrar</button>
</modal>

<!-- MODAL EXTRA (Proveedor / Producto) -->
<modal id="modalExtra">
  <div id="modalExtraBody"></div>
  <button id="cerrarModalExtra" class="btn btn-secondary mt-2">Cerrar</button>
</modal>

<script type="module" src="dashboard.js"></script>
</body>
</html>
