<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo">
        <i>🐾</i>
        <span>Discovery Pets</span>
      </div>
      <ul>
        <li id="menuProveedor" class="active">Proveedor</li>
        <li id="menuFactura">Factura</li>
        <li id="menuGastos">Gastos</li>
        <li id="menuServicio">Servicio</li>
      </ul>
      <button id="btnLogout">Cerrar Sesión</button>
    </div>

    <!-- CONTENIDO -->
    <div class="content">
      <!-- PROVEEDOR -->
      <div id="sectionProveedor" class="section">
        <h2>Proveedor</h2>
        <div class="formulario">
          <input type="text" id="provRUC" placeholder="RUC">
          <input type="text" id="provNombre" placeholder="Nombre">
          <input type="text" id="provDireccion" placeholder="Dirección">
          <button id="btnAddProveedor">Agregar</button>
        </div>
        <input type="text" id="searchProveedor" placeholder="Buscar proveedor por RUC o Nombre">
        <table>
          <thead>
            <tr>
              <th>RUC</th>
              <th>Nombre</th>
              <th>Dirección</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaProveedor"></tbody>
        </table>
      </div>

      <!-- FACTURA -->
      <div id="sectionFactura" class="section hidden">
        <h2>Factura</h2>
        <div class="formulario">
          <input type="text" id="factRUC" placeholder="RUC del Proveedor">
          <input type="text" id="factDescripcion" placeholder="Descripción">
          <input type="date" id="factFecha">
          <button id="btnAddFactura">Agregar</button>
        </div>
        <input type="text" id="searchFactura" placeholder="Buscar factura por RUC o descripción">
        <table>
          <thead>
            <tr>
              <th>RUC</th>
              <th>Descripción</th>
              <th>Fecha de emisión</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaFactura"></tbody>
        </table>
      </div>

      <!-- GASTOS -->
      <div id="sectionGastos" class="section hidden">
        <h2>Gastos</h2>
        <div class="formulario">
          <input type="text" id="gastoDescripcion" placeholder="Descripción">
          <input type="number" id="gastoMonto" placeholder="Monto">
          <input type="date" id="gastoFecha">
          <button id="btnAddGasto">Agregar</button>
        </div>
        <input type="text" id="searchGasto" placeholder="Buscar gasto por descripción">
        <table>
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Monto</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaGasto"></tbody>
        </table>
      </div>

      <!-- SERVICIO -->
      <div id="sectionServicio" class="section hidden">
        <h2>Servicio</h2>
        <div class="formulario">
          <input type="text" id="servDescripcion" placeholder="Descripción">
          <input type="date" id="servFecha">
          <button id="btnAddServicio">Agregar</button>
        </div>
        <input type="text" id="searchServicio" placeholder="Buscar servicio por descripción">
        <table>
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaServicio"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
