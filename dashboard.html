<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Dashboard</title>
<style>
  body { min-height:100vh; display:flex; background: linear-gradient(135deg,#ff0080,#ff8c00); color:#333; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
  .dashboard-body { display:flex; width:100%; }
  .sidebar { width:220px; background:#ff0080; color:#fff; display:flex; flex-direction:column; padding:20px; border-radius:0 20px 20px 0; transform: perspective(1000px) rotateY(2deg); }
  .sidebar h2 { text-align:center; margin-bottom:30px; font-size:22px; }
  .nav-btn { padding:12px; margin:5px 0; border-radius:10px; cursor:pointer; transition:0.3s; }
  .nav-btn:hover, .nav-btn.active { background:#e60073; }
  #logoutBtn { margin-top:auto; padding:12px; background:#fff; color:#ff0080; border:none; border-radius:10px; cursor:pointer; transition:0.3s; }
  #logoutBtn:hover { background:#ffe6f0; }
  .main-content { flex:1; padding:25px; overflow-y:auto; }
  .main-content h2 { color:#ff0080; margin-bottom:15px; }
  .content-section { display:none; }
  .content-section.active { display:block; }
  form { background:#fff; padding:20px; border-radius:15px; margin-bottom:25px; box-shadow:0 8px 25px rgba(0,0,0,0.15); }
  form input, form select { width:100%; padding:10px; margin-bottom:12px; border-radius:6px; border:1px solid #ccc; font-size:14px; }
  form button { padding:10px 20px; background:#ff0080; color:#fff; border:none; border-radius:6px; cursor:pointer; transition:0.3s; }
  form button:hover { background:#e60073; }
  table { width:100%; border-collapse:collapse; margin-top:15px; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 8px 25px rgba(0,0,0,0.1); }
  table th, table td { padding:12px; text-align:left; border-bottom:1px solid #eee; }
  table th { background:#ff0080; color:#fff; }
  table tr:hover { background:#ffe6f0; }
  table button { padding:6px 10px; border-radius:6px; border:none; cursor:pointer; margin:0 2px; font-size:13px; }
  table button.edit-btn { background:#3498db; color:#fff; }
  table button.delete-btn { background:#e74c3c; color:#fff; }
  @media(max-width:900px){ .dashboard-body{flex-direction:column;} .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:10px;} .nav-btn{flex:1;margin:0 5px;text-align:center;} #logoutBtn{margin:0 5px;} }
</style>
</head>
<body class="dashboard-body">

  <nav class="sidebar">
    <h2>🐾 Discovery Pets</h2>
    <button class="nav-btn active" data-section="proveedores">Proveedores</button>
    <button class="nav-btn" data-section="facturas">Facturas</button>
    <button class="nav-btn" data-section="gastos">Gastos</button>
    <button class="nav-btn" data-section="servicios">Servicios</button>
    <button id="logoutBtn">Cerrar sesión</button>
  </nav>

  <main class="main-content">
    <!-- Proveedores -->
    <section id="proveedores" class="content-section active">
      <h2>Registro de Proveedores</h2>
      <form id="formProveedor">
        <input id="rucProv" placeholder="RUC" required>
        <input id="nombreProv" placeholder="Nombre" required>
        <input id="productoProv" placeholder="Producto" required>
        <input id="direccionProv" placeholder="Dirección" required>
        <button type="submit">Agregar</button>
      </form>
      <table>
        <thead>
          <tr><th>RUC</th><th>Nombre</th><th>Producto</th><th>Dirección</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaProveedores"></tbody>
      </table>
    </section>

    <!-- Facturas -->
    <section id="facturas" class="content-section">
      <h2>Registro de Facturas</h2>
      <form id="formFactura">
        <select id="proveedorFactura" required></select>
        <input id="tipoFactura" placeholder="Tipo de factura" required>
        <input id="montoFactura" type="number" placeholder="Monto" required>
        <input id="monedaFactura" placeholder="Moneda" value="S/." required>
        <input id="fechaFactura" type="date" required>
        <input id="descFactura" placeholder="Descripción">
        <button type="submit">Agregar</button>
      </form>
      <table>
        <thead>
          <tr><th>Proveedor</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Descripción</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaFacturas"></tbody>
      </table>
    </section>

    <!-- Gastos -->
    <section id="gastos" class="content-section">
      <h2>Registro de Gastos</h2>
      <form id="formGasto">
        <input id="nombreGasto" placeholder="Nombre" required>
        <input id="tipoGasto" placeholder="Tipo" required>
        <input id="montoGasto" type="number" placeholder="Monto" required>
        <input id="fechaGasto" type="date" required>
        <button type="submit">Agregar</button>
      </form>
      <table>
        <thead>
          <tr><th>Nombre</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaGastos"></tbody>
      </table>
    </section>
  </main>

<script type="module" src="dashboard.js"></script>
</body>
</html>
