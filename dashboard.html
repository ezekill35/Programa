<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐾 Discovery Pets</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex">

  <!-- Sidebar -->
  <div class="bg-gradient sidebar p-3 shadow-lg" style="width: 220px;">
    <h2 class="text-center text-white mb-4">🐾 Discovery Pets</h2>
    <ul class="nav flex-column">
      <li class="nav-item mb-2"><a class="nav-link text-white" href="#" id="menu-reportes">📊 Reportes</a></li>
      <li class="nav-item mb-2"><a class="nav-link text-white" href="#" id="menu-proveedores">🏪 Proveedores</a></li>
      <li class="nav-item mb-2"><a class="nav-link text-white" href="#" id="menu-facturas">📑 Facturas</a></li>
      <li class="nav-item mb-2"><a class="nav-link text-white" href="#" id="menu-gastos">💰 Gastos</a></li>
      <li class="nav-item mb-2"><a class="nav-link text-white" href="#" id="menu-servicios">🛠 Servicios</a></li>
      <li class="nav-item mt-3"><a class="nav-link text-white" href="#" id="menu-logout">🚪 Cerrar Sesión</a></li>
    </ul>
  </div>

  <!-- Main -->
  <div class="flex-grow-1 p-4">

    <!-- Reportes -->
    <div id="reportes" class="section active">
      <h2>📊 Reportes</h2>
      <div class="row g-3">
        <div class="col-md-3">
          <div class="card shadow-sm text-center p-3">
            <h3 id="total-proveedores">0</h3>
            <p>Proveedores</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card shadow-sm text-center p-3">
            <h3 id="total-facturas">0</h3>
            <p>Facturas</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card shadow-sm text-center p-3">
            <h3 id="total-gastos">0</h3>
            <p>Gastos</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card shadow-sm text-center p-3">
            <h3 id="total-servicios">0</h3>
            <p>Servicios</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Proveedores -->
    <div id="proveedores" class="section">
      <h2>🏪 Proveedores</h2>
      <form id="formProveedor" class="mb-3 bg-white p-3 shadow rounded">
        <div class="row g-2">
          <div class="col-md-2"><input class="form-control" type="text" placeholder="RUC" id="provRuc"></div>
          <div class="col-md-3"><input class="form-control" type="text" placeholder="Nombre" id="provNombre"></div>
          <div class="col-md-3"><input class="form-control" type="text" placeholder="Dirección" id="provDireccion"></div>
          <div class="col-md-2"><input class="form-control" type="text" placeholder="Teléfono" id="provTelefono"></div>
          <div class="col-md-2"><input class="form-control" type="text" placeholder="Producto" id="provProducto"></div>
        </div>
        <button type="button" class="btn btn-primary mt-2" id="btnAgregarProveedor">Agregar Proveedor</button>
      </form>

      <table class="table table-hover shadow rounded bg-light">
        <thead class="table-primary">
          <tr>
            <th>RUC</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Producto</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="listaProveedores"></tbody>
      </table>
    </div>

    <!-- Facturas, Gastos y Servicios se agregarían igual -->
    
  </div>
</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
