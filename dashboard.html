<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Discovery Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-gradient shadow-3d">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold fs-3 text-glow" href="#">🐾 Discovery Pets</a>
      <button class="btn btn-outline-light shadow-3d" id="btnCerrarSesion">Cerrar sesión</button>
    </div>
  </nav>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="container-fluid py-4">
    <div class="row">
      <!-- SIDEBAR -->
      <aside class="col-md-3 col-lg-2 p-3 bg-white rounded-4 shadow-3d me-3">
        <h5 class="fw-bold mb-4 text-center text-primary">Panel de Control</h5>
        <button class="nav-btn activo w-100 mb-2 btn-3d" data-target="facturas">💼 Facturas</button>
        <button class="nav-btn w-100 mb-2 btn-3d" data-target="proveedores">🏪 Proveedores</button>
        <button class="nav-btn w-100 mb-2 btn-3d" data-target="productos">📦 Productos</button>
      </aside>

      <!-- CONTENIDO -->
      <main class="col p-4 rounded-4 shadow-3d bg-white">

        <!-- FACTURAS -->
        <section id="facturas" class="seccion activa">
          <h3 class="fw-bold mb-3 text-gradient">Facturas</h3>
          <form id="formFactura" class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Proveedor</label>
              <select id="proveedorFactura" class="form-select shadow-inner" required>
                <option value="">Seleccionar proveedor</option>
              </select>
              <div class="mt-1">
                <a href="#" id="agregarProveedorFactura" class="link-premium">
                  ¿No encuentras el proveedor? Regístralo aquí
                </a>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Producto</label>
              <select id="productoFactura" class="form-select shadow-inner" required>
                <option value="">Seleccionar producto</option>
              </select>
              <div class="mt-1">
                <a href="#" id="agregarProductoFactura" class="link-premium">
                  ¿No encuentras el producto? Regístralo aquí
                </a>
              </div>
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Monto (S/)</label>
              <input type="number" id="montoFactura" class="form-control shadow-inner" step="0.01" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">IGV (18%)</label>
              <input type="text" id="igvFactura" class="form-control shadow-inner" readonly>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Total</label>
              <input type="text" id="totalFactura" class="form-control shadow-inner" readonly>
            </div>

            <div class="col-12 text-end">
              <button class="btn btn-success btn-3d px-4">Registrar</button>
            </div>
          </form>

          <div id="tablaFacturas" class="table-responsive shadow-3d rounded-4 p-3">
            <table class="table table-hover align-middle">
              <thead class="table-dark text-center">
                <tr>
                  <th>ID</th>
                  <th>Proveedor</th>
                  <th>Producto</th>
                  <th>Monto</th>
                  <th>IGV</th>
                  <th>Total</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tbodyFacturas"></tbody>
            </table>
          </div>
        </section>

        <!-- PROVEEDORES -->
        <section id="proveedores" class="seccion">
          <h3 class="fw-bold mb-3 text-gradient">Proveedores</h3>
          <form id="formProveedor" class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Nombre</label>
              <input type="text" id="nombreProveedor" class="form-control shadow-inner" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Teléfono</label>
              <input type="text" id="telefonoProveedor" class="form-control shadow-inner">
            </div>
            <div class="col-12 text-end">
              <button class="btn btn-primary btn-3d px-4">Registrar</button>
            </div>
          </form>

          <div id="tablaProveedores" class="table-responsive shadow-3d rounded-4 p-3"></div>
        </section>

        <!-- PRODUCTOS -->
        <section id="productos" class="seccion">
          <h3 class="fw-bold mb-3 text-gradient">Productos</h3>
          <form id="formProducto" class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Nombre</label>
              <input type="text" id="nombreProducto" class="form-control shadow-inner" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Precio</label>
              <input type="number" id="precioProducto" class="form-control shadow-inner" required step="0.01">
            </div>
            <div class="col-12 text-end">
              <button class="btn btn-warning btn-3d px-4">Registrar</button>
            </div>
          </form>

          <div id="tablaProductos" class="table-responsive shadow-3d rounded-4 p-3"></div>
        </section>

      </main>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
