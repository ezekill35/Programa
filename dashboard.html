<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <div class="sidebar">
      <div class="logo">
        <i>🐾</i> Discovery Pets
      </div>
      <ul>
        <li onclick="mostrarSeccion('proveedor')">Proveedor</li>
        <li onclick="mostrarSeccion('factura')">Factura</li>
        <li onclick="mostrarSeccion('gasto')">Gastos</li>
        <li onclick="mostrarSeccion('servicio')">Servicio</li>
      </ul>
    </div>

    <div class="content">
      <!-- PROVEEDOR -->
      <div id="proveedor" class="card seccion">
        <h2>Proveedor</h2>
        <form id="formProveedor" class="formulario">
          <input type="text" id="ruc" placeholder="RUC">
          <input type="text" id="nombreProveedor" placeholder="Nombre">
          <input type="text" id="direccionProveedor" placeholder="Dirección">
          <button type="button" id="btnAgregarProveedor">Agregar</button>
        </form>
        <table id="tablaProveedores">
          <thead>
            <tr><th>RUC</th><th>Nombre</th><th>Dirección</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- FACTURA -->
      <div id="factura" class="card seccion oculto">
        <h2>Factura</h2>
        <form id="formFactura" class="formulario">
          <select id="selectProveedor">
            <option value="">Selecciona un proveedor</option>
          </select>
          <input type="text" id="numFactura" placeholder="Número de factura">
          <input type="date" id="fechaFactura">
          <input type="text" id="descripcionFactura" placeholder="Descripción">
          <button type="button" id="btnAgregarFactura">Agregar</button>
        </form>
        <table id="tablaFacturas">
          <thead>
            <tr><th>Proveedor</th><th>N° Factura</th><th>Fecha</th><th>Descripción</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- GASTOS -->
      <div id="gasto" class="card seccion oculto">
        <h2>Gastos</h2>
        <form id="formGasto" class="formulario">
          <input type="text" id="nombreGasto" placeholder="Nombre del gasto">
          <input type="number" id="montoGasto" placeholder="Monto">
          <button type="button" id="btnAgregarGasto">Agregar</button>
        </form>
        <table id="tablaGastos">
          <thead>
            <tr><th>Nombre</th><th>Monto</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- SERVICIO -->
      <div id="servicio" class="card seccion oculto">
        <h2>Servicio</h2>
        <form id="formServicio" class="formulario">
          <input type="text" id="nombreServicio" placeholder="Nombre del servicio">
          <input type="text" id="descripcionServicio" placeholder="Descripción">
          <button type="button" id="btnAgregarServicio">Agregar</button>
        </form>
        <table id="tablaServicios">
          <thead>
            <tr><th>Nombre</th><th>Descripción</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
