<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard · Discovery Pets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f9fafc;
      color: #333;
      overflow-x: hidden;
    }
    header {
      background: #0096c7;
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    header h1 {
      font-weight: 700;
      font-size: 1.4rem;
      margin: 0;
    }
    #logoutBtn {
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    #logoutBtn:hover { background: #d63031; }

    .menu {
      background: white;
      display: flex;
      gap: 10px;
      padding: 12px;
      justify-content: center;
      border-bottom: 2px solid #eee;
    }
    .menu-btn {
      background: #e0f7fa;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .menu-btn.activo, .menu-btn:hover {
      background: #00b4d8;
      color: white;
    }

    .seccion {
      display: none;
      padding: 20px;
      animation: fadeIn 0.4s;
    }
    .seccion.activa { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    input, select, textarea {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 10px;
      width: 100%;
      margin-bottom: 8px;
    }
    button.btn-azul {
      background: #00b4d8;
      border: none;
      border-radius: 8px;
      color: white;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button.btn-azul:hover { background: #0096c7; }

    table {
      width: 100%;
      margin-top: 12px;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      border-bottom: 1px solid #eee;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #e3f2fd;
      color: #0277bd;
      font-weight: 700;
    }
    tr:hover { background: #f1faff; }

    .btn.eliminar {
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .buscador-container {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    #buscadorFactura {
      flex: 1;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #bbb;
    }
    #btnBuscar {
      background: #00b4d8;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 16px;
      cursor: pointer;
      font-weight: 600;
    }
    #panelFacturas {
      background: #f0f8ff;
      border-radius: 10px;
      padding: 6px;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.1);
    }
    #panelFacturas div:hover {
      background: #dff6ff;
    }

    /* === MODALES === */
    #modalFactura, #modalDetalleExtra {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      z-index: 1000;
      width: 400px;
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: fadeIn 0.3s;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header button {
      background: red;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .clickable {
      color: #0096c7;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header>
    <h1>Discovery Pets · Dashboard</h1>
    <button id="logoutBtn">Cerrar sesión</button>
  </header>

  <nav class="menu">
    <button class="menu-btn activo" data-target="proveedores">Proveedores</button>
    <button class="menu-btn" data-target="productos">Productos</button>
    <button class="menu-btn" data-target="facturas">Facturas</button>
  </nav>

  <!-- === SECCIÓN PROVEEDORES === -->
  <section id="proveedores" class="seccion activa">
    <h2>Registro de Proveedores</h2>
    <form id="proveedorForm">
      <input id="rucProveedor" placeholder="RUC" required>
      <input id="nombreProveedor" placeholder="Nombre del proveedor" required>
      <input id="direccionProveedor" placeholder="Dirección">
      <input id="telefonoProveedor" placeholder="Teléfono">
      <button class="btn-azul">Guardar proveedor</button>
    </form>
    <table>
      <thead><tr><th>RUC</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr></thead>
      <tbody id="tablaProveedores"></tbody>
    </table>
  </section>

  <!-- === SECCIÓN PRODUCTOS === -->
  <section id="productos" class="seccion">
    <h2>Registro de Productos</h2>
    <form id="productoForm">
      <input id="nombreProducto" placeholder="Nombre del producto" required>
      <input id="cantidadProducto" type="number" placeholder="Cantidad" required>
      <input id="precioProducto" type="number" step="0.01" min="0" placeholder="Precio (ej. 490.75)" required>
      <textarea id="descripcionProducto" placeholder="Descripción"></textarea>
      <button class="btn-azul">Guardar producto</button>
    </form>
    <table>
      <thead><tr><th>Nombre</th><th>Cantidad</th><th>Precio</th><th>Descripción</th><th>Acciones</th></tr></thead>
      <tbody id="tablaProductos"></tbody>
    </table>
  </section>

  <!-- === SECCIÓN FACTURAS === -->
  <section id="facturas" class="seccion">
    <h2>Gestión de Facturas</h2>

    <!-- BUSCADOR -->
    <div class="buscador-container">
      <input type="text" id="buscadorFactura" placeholder="Buscar factura por producto...">
      <button id="btnBuscar">Buscar</button>
      <button id="btnRefresh" class="btn-azul">Restablecer</button>
    </div>
    <div id="panelFacturas"></div>

    <!-- FORMULARIO FACTURAS -->
    <form id="facturaForm">
      <input id="idFactura" placeholder="ID de Factura" required>
      <input id="fechaFactura" type="date" required>
      <select id="proveedorFactura" required></select>
      <select id="productoFactura" required></select>
      <input id="montoFactura" type="number" step="0.01" min="0" placeholder="Monto total" required>
      <select id="tipoFactura" required>
        <option value="Compra">Compra</option>
        <option value="Venta">Venta</option>
      </select>
      <button class="btn-azul">Guardar factura</button>
    </form>

    <table>
      <thead><tr><th>ID</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Acciones</th></tr></thead>
      <tbody id="tablaFacturas"></tbody>
    </table>
  </section>

  <!-- === MODAL FACTURA === -->
  <div id="modalFactura">
    <div class="modal-header">
      <h5>Detalle de Factura</h5>
      <button id="cerrarModalFactura">✖</button>
    </div>
    <div id="contenidoModalFactura"></div>
  </div>

  <!-- === MODAL DETALLE EXTRA === -->
  <div id="modalDetalleExtra">
    <div class="modal-header">
      <h5>Información Detallada</h5>
      <button id="cerrarModalDetalle">✖</button>
    </div>
    <div id="contenidoDetalleExtra"></div>
  </div>

  <script type="module" src="./dashboard.js"></script>
</body>
</html>
