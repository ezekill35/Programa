<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐶 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      margin: 0;
      padding: 0;
    }
    header {
      background: #2c3e50;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    nav {
      background: #34495e;
      display: flex;
      justify-content: center;
      padding: 10px;
    }
    nav button {
      background: #1abc9c;
      border: none;
      color: white;
      margin: 5px;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 6px;
    }
    nav button:hover {
      background: #16a085;
    }
    .content {
      padding: 20px;
    }
    .section {
      display: none;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .section.active {
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #1abc9c;
      color: #fff;
    }
    form {
      margin-top: 15px;
      display: grid;
      gap: 10px;
    }
    form input, form select, form button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    form button {
      background: #1abc9c;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    form button:hover {
      background: #16a085;
    }
  </style>
</head>
<body>
  <header>
    <h1>🐾 Dashboard de Facturación - Discovery Pets</h1>
    <p id="userInfo">Cargando usuario...</p>
    <button id="btnLogout">Cerrar Sesión</button>
  </header>

  <nav>
    <button onclick="showSection('productos')">📦 Productos</button>
    <button onclick="showSection('proveedores')">👥 Proveedores</button>
    <button onclick="showSection('facturas')">🧾 Facturas</button>
    <button onclick="showSection('servicios')">🐕 Servicios</button>
  </nav>

  <div class="content">
    <!-- Productos -->
    <div id="productos" class="section active">
      <h2>📦 Gestión de Productos</h2>
      <form id="formProducto">
        <input type="text" id="prodNombre" placeholder="Nombre del producto" required>
        <input type="number" id="prodPrecio" placeholder="Precio (S/.)" required>
        <input type="number" id="prodStock" placeholder="Stock inicial" required>
        <input type="text" id="prodCategoria" placeholder="Categoría" required>
        <button type="submit">Agregar Producto</button>
      </form>
      <table>
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Categoría</th></tr>
        </thead>
        <tbody id="tablaProductos"></tbody>
      </table>
    </div>

    <!-- Proveedores -->
    <div id="proveedores" class="section">
      <h2>👥 Proveedores</h2>
      <form id="formProveedor">
        <input type="text" id="provNombre" placeholder="Nombre proveedor" required>
        <input type="text" id="provRuc" placeholder="RUC" required>
        <input type="text" id="provTelefono" placeholder="Teléfono">
        <button type="submit">Registrar Proveedor</button>
      </form>
      <table>
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>RUC</th><th>Teléfono</th></tr>
        </thead>
        <tbody id="tablaProveedores"></tbody>
      </table>
    </div>

    <!-- Facturas -->
    <div id="facturas" class="section">
      <h2>🧾 Facturas de Compra</h2>
      <form id="formFactura">
        <input type="text" id="facNumero" placeholder="Número de factura" required>
        <select id="facProveedor" required></select>
        <input type="date" id="facFecha" required>
        <input type="number" id="facTotal" placeholder="Total (S/.)" required>
        <button type="submit">Registrar Factura</button>
      </form>
      <table>
        <thead>
          <tr><th>N° Factura</th><th>Proveedor</th><th>Fecha</th><th>Total</th></tr>
        </thead>
        <tbody id="tablaFacturas"></tbody>
      </table>
    </div>

    <!-- Servicios -->
    <div id="servicios" class="section">
      <h2>🐕 Servicios</h2>
      <form id="formServicio">
        <input type="text" id="servNombre" placeholder="Nombre servicio" required>
        <input type="number" id="servPrecio" placeholder="Precio (S/.)" required>
        <input type="text" id="servDuracion" placeholder="Duración (ej: 30 min)" required>
        <button type="submit">Agregar Servicio</button>
      </form>
      <table>
        <thead>
          <tr><th>ID</th><th>Nombre Servicio</th><th>Precio</th><th>Duración</th></tr>
        </thead>
        <tbody id="tablaServicios"></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>

  <script>
    function showSection(id) {
      document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }
  </script>
</body>
</html>
