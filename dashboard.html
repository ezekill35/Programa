<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo"><i>🐾</i> Discovery Pets</div>
      <ul>
        <li id="menuProveedor" class="active">Proveedor</li>
        <li id="menuFactura">Factura</li>
        <li id="menuGastos">Gastos</li>
        <li id="menuServicio">Servicio</li>
      </ul>
      <button id="btnLogout">Cerrar Sesión</button>
    </div>

    <!-- CONTENIDO -->
    <div class="content">
      <!-- PROVEEDOR -->
      <div id="seccionProveedor" class="seccion">
        <h2>Proveedor</h2>
        <div class="formulario">
          <input type="text" id="provRuc" placeholder="RUC">
          <input type="text" id="provNombre" placeholder="Nombre">
          <input type="text" id="provDireccion" placeholder="Dirección">
          <button id="btnAgregarProveedor">Agregar</button>
        </div>
        <input type="text" id="buscarProveedor" placeholder="Buscar proveedor por RUC o Nombre">
        <table id="tablaProveedor">
          <thead>
            <tr>
              <th>RUC</th>
              <th>Nombre</th>
              <th>Dirección</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- FACTURA -->
      <div id="seccionFactura" class="seccion hidden">
        <h2>Factura</h2>
        <div class="formulario">
          <input type="text" id="facRuc" placeholder="RUC del Proveedor">
          <input type="text" id="facDescripcion" placeholder="Descripción">
          <input type="date" id="facFecha">
          <button id="btnAgregarFactura">Agregar</button>
        </div>
        <input type="text" id="buscarFactura" placeholder="Buscar factura por RUC o descripción">
        <table id="tablaFactura">
          <thead>
            <tr>
              <th>RUC</th>
              <th>Proveedor</th>
              <th>Descripción</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- GASTOS -->
      <div id="seccionGastos" class="seccion hidden">
        <h2>Gastos</h2>
        <div class="formulario">
          <input type="text" id="gastoDescripcion" placeholder="Descripción">
          <input type="number" id="gastoMonto" placeholder="Monto">
          <input type="date" id="gastoFecha">
          <button id="btnAgregarGasto">Agregar</button>
        </div>
        <input type="text" id="buscarGasto" placeholder="Buscar gastos por descripción">
        <table id="tablaGasto">
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Monto</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- SERVICIO -->
      <div id="seccionServicio" class="seccion hidden">
        <h2>Servicio</h2>
        <div class="formulario">
          <input type="text" id="servDescripcion" placeholder="Descripción">
          <input type="number" id="servPrecio" placeholder="Precio">
          <input type="date" id="servFecha">
          <button id="btnAgregarServicio">Agregar</button>
        </div>
        <input type="text" id="buscarServicio" placeholder="Buscar servicio por descripción">
        <table id="tablaServicio">
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Precio</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
