<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Discovery Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
    .nav-btn.activo { background-color: #0ea5e9; color: white; }
    .seccion { display: none; }
    .seccion.activa { display: block; }
    .btn-accion { border: none; background: none; cursor: pointer; }
    dialog { border: none; border-radius: 10px; padding: 20px; width: 400px; max-width: 90%; }
  </style>
</head>
<body class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold text-primary">Discovery Pets · Dashboard</h2>
    <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
  </div>

  <!-- NAV -->
  <div class="btn-group w-100 mb-4">
    <button class="btn nav-btn activo" data-target="proveedores">Proveedores</button>
    <button class="btn nav-btn" data-target="productos">Productos</button>
    <button class="btn nav-btn" data-target="facturas">Facturas</button>
  </div>

  <!-- ===================== PROVEEDORES ===================== -->
  <section id="proveedores" class="seccion activa">
    <h4 class="mb-3">Registro de Proveedores</h4>
    <form id="formProveedor" class="mb-3">
      <div class="row g-2">
        <div class="col-md-3">
          <select id="tipoDocumentoProveedor" class="form-select" required>
            <option value="">Tipo documento</option>
            <option value="RUC">RUC</option>
            <option value="DNI">DNI</option>
          </select>
        </div>
        <div class="col-md-3"><input id="nombreProveedor" type="text" class="form-control" placeholder="Nombre o razón social" required></div>
        <div class="col-md-3"><input id="direccionProveedor" type="text" class="form-control" placeholder="Dirección" required></div>
        <div class="col-md-2"><input id="telefonoProveedor" type="text" class="form-control" placeholder="Teléfono" required></div>
        <div class="col-md-1 d-grid"><button type="submit" class="btn btn-primary">➕</button></div>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead class="table-primary">
          <tr>
            <th>Documento</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaProveedores"></tbody>
      </table>
    </div>
    <p>Total proveedores: <span id="countProveedores">0</span></p>
  </section>

  <!-- ===================== PRODUCTOS ===================== -->
  <section id="productos" class="seccion">
    <h4>Registro de Productos</h4>
    <form id="formProducto" class="mb-3">
      <div class="row g-2">
        <div class="col-md-3"><input id="nombreProducto" class="form-control" placeholder="Nombre del producto" required></div>
        <div class="col-md-2"><input id="cantidadPresentacion" type="number" class="form-control" placeholder="Cantidad" required></div>
        <div class="col-md-2"><input id="presentacionProducto" class="form-control" placeholder="Presentación" required></div>
        <div class="col-md-2"><input id="precioProducto" type="number" step="0.01" class="form-control" placeholder="Precio" required></div>
        <div class="col-md-2">
          <select id="tipoMoneda" class="form-select" required>
            <option value="soles">Soles</option>
            <option value="dolares">Dólares</option>
          </select>
        </div>
        <div class="col-md-1 d-grid"><button type="submit" class="btn btn-primary">➕</button></div>
      </div>
      <textarea id="descripcionProducto" class="form-control mt-2" placeholder="Descripción"></textarea>
    </form>

    <table class="table table-striped table-bordered">
      <thead class="table-success">
        <tr><th>Nombre</th><th>Cantidad</th><th>Precio</th><th>Descripción</th><th>Acciones</th></tr>
      </thead>
      <tbody id="tablaProductos"></tbody>
    </table>
    <p>Total productos: <span id="countProductos">0</span></p>
  </section>

  <!-- ===================== FACTURAS ===================== -->
  <section id="facturas" class="seccion">
    <h4>Registro de Facturas</h4>
    <form id="formFactura" class="mb-3">
      <div class="row g-2">
        <div class="col-md-2"><input id="idFactura" class="form-control" placeholder="ID Factura" required></div>
        <div class="col-md-2"><input id="fechaFactura" type="date" class="form-control" required></div>
        <div class="col-md-2"><select id="proveedorFactura" class="form-select" required></select></div>
        <div class="col-md-2"><select id="productoFactura" class="form-select" required></select></div>
        <div class="col-md-2"><input id="montoFactura" type="number" step="0.01" class="form-control" placeholder="Monto" required></div>
        <div class="col-md-1"><select id="tipoFactura" class="form-select"><option value="compra">Compra</option><option value="venta">Venta</option></select></div>
        <div class="col-md-1 d-grid"><button type="submit" class="btn btn-primary">➕</button></div>
      </div>
    </form>

    <input type="text" id="searchInput" class="form-control mb-3" placeholder="Buscar factura por producto...">
    <div id="searchResults"></div>

    <table class="table table-striped table-bordered">
      <thead class="table-warning">
        <tr><th>ID</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Acciones</th></tr>
      </thead>
      <tbody id="tablaFacturas"></tbody>
    </table>
    <p>Total facturas: <span id="countFacturas">0</span></p>
  </section>

  <!-- ===================== MODALES ===================== -->
  <dialog id="modalFactura"><div id="modalFacturaBody"></div><button id="cerrarModalFactura" class="btn btn-secondary mt-2">Cerrar</button></dialog>
  <dialog id="modalExtra"><div id="modalExtraBody"></div><button id="cerrarModalExtra" class="btn btn-secondary mt-2">Cerrar</button></dialog>
  <dialog id="modalEditar"><div id="modalEditarBody"></div><button id="cerrarModalEditar" class="btn btn-secondary mt-2">Cerrar</button></dialog>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
