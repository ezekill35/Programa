<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #e0f7fa, #e1bee7);
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100%;
      width: 240px;
      background: #2a2d3e;
      color: #fff;
      padding-top: 20px;
      box-shadow: 5px 0 15px rgba(0,0,0,0.3);
      transform: translateZ(10px);
    }
    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .menu-item {
      padding: 12px 20px;
      cursor: pointer;
      border-left: 4px solid transparent;
      transition: all 0.3s ease;
    }
    .menu-item:hover, .menu-item.active {
      background: #3c3f58;
      border-left: 4px solid #00bcd4;
    }
    .content {
      margin-left: 260px;
      padding: 25px;
      transition: all 0.5s ease;
    }
    .navbar {
      background: #ffffffb0;
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 10px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar h3 {
      font-weight: bold;
      color: #333;
    }
    .navbar input {
      border-radius: 20px;
      padding: 6px 15px;
      border: 1px solid #ccc;
      width: 250px;
    }
    .section {
      display: none;
      animation: fadeIn 0.6s ease-in-out;
    }
    .section.active {
      display: block;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .formulario {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .formulario input, .formulario select {
      margin: 6px 0;
    }
    .overlay-3d {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .ventana-edicion {
      background: white;
      border-radius: 10px;
      padding: 25px;
      width: 380px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      transform: perspective(1000px) rotateY(5deg);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Discovery Pets</h2>
    <div class="menu-item active" data-target="facturas">📄 Facturas</div>
    <div class="menu-item" data-target="productos">📦 Productos</div>
    <div class="menu-item" data-target="proveedores">🏢 Proveedores</div>
    <div class="menu-item" data-target="reportes">📊 Reportes</div>
    <div class="menu-item" id="logoutBtn">🚪 Cerrar Sesión</div>
  </div>

  <!-- Contenido principal -->
  <div class="content">
    <div class="navbar">
      <h3>Panel de Control</h3>
      <input type="text" id="buscador" placeholder="Buscar factura, producto o proveedor...">
    </div>

    <!-- 🧾 FACTURAS -->
    <section id="facturas" class="section active">
      <h4>Registrar Factura</h4>
      <div class="formulario">
        <input type="text" id="numeroFactura" class="form-control" placeholder="Número de Factura">
        <input type="text" id="proveedorFactura" class="form-control" placeholder="Proveedor">
        <div class="row">
          <div class="col-md-6">
            <input type="number" id="montoFactura" class="form-control" placeholder="Monto (0.00)">
          </div>
          <div class="col-md-6">
            <select id="monedaFactura" class="form-select">
              <option value="PEN">Soles (PEN)</option>
              <option value="USD">Dólares (USD)</option>
            </select>
          </div>
        </div>
        <select id="tipoFactura" class="form-select mt-2">
          <option value="Factura Electrónica">Factura Electrónica</option>
          <option value="Boleta">Boleta</option>
        </select>
        <button class="btn btn-primary mt-3" id="btnGuardarFactura">Guardar Factura</button>
      </div>
      <div id="listaFacturas"></div>
    </section>

    <!-- 📦 PRODUCTOS -->
    <section id="productos" class="section">
      <h4>Registrar Producto</h4>
      <div class="formulario">
        <input type="text" id="nombreProducto" class="form-control" placeholder="Nombre del Producto">
        <input type="text" id="descripcionProducto" class="form-control" placeholder="Descripción">
        <div class="row">
          <div class="col-md-4">
            <input type="number" id="cantidadProducto" class="form-control" placeholder="Cantidad">
          </div>
          <div class="col-md-4">
            <input type="text" id="unidadMedida" class="form-control" placeholder="Unidad de Medida">
          </div>
          <div class="col-md-4">
            <input type="number" id="valorUnitario" class="form-control" placeholder="Valor Unitario">
          </div>
        </div>
        <button class="btn btn-success mt-3" id="btnGuardarProducto">Guardar Producto</button>
      </div>
    </section>

    <!-- 🏢 PROVEEDORES -->
    <section id="proveedores" class="section">
      <h4>Registrar Proveedor</h4>
      <div class="formulario">
        <input type="text" id="nombreProveedor" class="form-control" placeholder="Nombre del Proveedor">
        <input type="text" id="rucProveedor" class="form-control" placeholder="RUC (solo números)" maxlength="11">
        <input type="text" id="telefonoProveedor" class="form-control" placeholder="Teléfono">
        <button class="btn btn-warning mt-3" id="btnGuardarProveedor">Guardar Proveedor</button>
      </div>
    </section>

    <!-- 📊 REPORTES -->
    <section id="reportes" class="section">
      <h4>Generar Reporte</h4>
      <div class="formulario text-center">
        <p>Genera un reporte de facturas, productos y proveedores.</p>
        <button class="btn btn-dark">📈 Generar Reporte</button>
      </div>
    </section>
  </div>

  <script type="module" src="./dashboard.js"></script>
</body>
</html>
