<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Discovery Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body">

  <aside class="sidebar">
    <h2>🐾 Discovery Pets</h2>
    <nav>
      <button class="nav-btn active" data-section="reportes">📊 Reportes</button>
      <button class="nav-btn" data-section="proveedores">🏪 Proveedores</button>
      <button class="nav-btn" data-section="facturas">📑 Facturas</button>
    </nav>
    <button class="logout-btn btn btn-danger w-100 mt-3" id="logoutBtn">🚪 Cerrar sesión</button>
  </aside>

  <main class="main-content p-3">
    <!-- REPORTES -->
    <section id="reportes" class="content-section active">
      <h1>📊 Reportes Generales</h1>
      <div class="row">
        <div class="col-md-3"><div class="card text-white bg-primary mb-2 p-2 text-center"><h5>Proveedores</h5><p id="countProveedores">0</p></div></div>
        <div class="col-md-3"><div class="card text-white bg-success mb-2 p-2 text-center"><h5>Facturas</h5><p id="countFacturas">0</p></div></div>
      </div>
    </section>

    <!-- PROVEEDORES -->
    <section id="proveedores" class="content-section" style="display:none;">
      <h1>🏪 Registro de Proveedores</h1>
      <form id="formProveedor" class="mb-3">
        <input type="text" id="rucProv" placeholder="RUC" class="form-control mb-2" required>
        <input type="text" id="nombreProv" placeholder="Nombre" class="form-control mb-2" required>
        <input type="text" id="productoProv" placeholder="Producto" class="form-control mb-2" required>
        <input type="text" id="direccionProv" placeholder="Dirección" class="form-control mb-2" required>
        <button type="submit" class="btn btn-success">Agregar</button>
      </form>
      <table class="table table-hover">
        <thead class="thead-dark">
          <tr><th>RUC</th><th>Nombre</th><th>Producto</th><th>Dirección</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaProveedores"></tbody>
      </table>
    </section>

    <!-- FACTURAS -->
    <section id="facturas" class="content-section" style="display:none;">
      <h1>📑 Registro de Facturas</h1>
      <form id="formFactura" class="mb-3">
        <select id="proveedorFactura" class="form-control mb-2" required></select>
        <select id="tipoFactura" class="form-control mb-2" required>
          <option value="">Seleccione tipo de factura</option>
          <option value="Factura Electrónica">Factura Electrónica</option>
          <option value="Boleta">Boleta</option>
        </select>
        <div class="d-flex gap-2 mb-2">
          <input type="number" id="montoFactura" placeholder="Monto" class="form-control" required>
          <select id="monedaFactura" class="form-control" required>
            <option value="PEN">S/.</option>
            <option value="USD">USD</option>
          </select>
        </div>
        <input type="date" id="fechaFactura" class="form-control mb-2" required>
        <input type="text" id="descFactura" placeholder="Descripción" class="form-control mb-2" required>
        <button type="submit" class="btn btn-success">Agregar</button>
      </form>
      <table class="table table-hover">
        <thead class="thead-dark">
          <tr><th>Proveedor</th><th>Tipo</th><th>Monto</th><th>Fecha</th><th>Descripción</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaFacturas"></tbody>
      </table>
    </section>
  </main>

  <script src="firebase.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
