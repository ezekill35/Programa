<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard-container">

    <!-- Menú lateral -->
    <nav class="sidebar">
      <h2>🐾 Discovery Pets</h2>
      <ul>
        <li><button id="btnReportes" class="menu-btn active">Reportes</button></li>
        <li><button id="btnProveedor" class="menu-btn">Proveedor</button></li>
        <li><button id="btnFactura" class="menu-btn">Factura</button></li>
        <li><button id="btnGastos" class="menu-btn">Gastos</button></li>
        <li><button id="btnServicio" class="menu-btn">Servicio</button></li>
        <li><button id="btnLogout" class="menu-btn logout">Cerrar Sesión</button></li>
      </ul>
    </nav>

    <!-- Contenido principal -->
    <main class="main-content">

      <!-- Reportes -->
      <section id="sectionReportes" class="section active">
        <h2>📊 Reportes</h2>
        <p>Visualiza los reportes generales de ventas, gastos y servicios.</p>
      </section>

      <!-- Proveedor -->
      <section id="sectionProveedor" class="section">
        <h2>Proveedor</h2>
        <form id="formProveedor">
          <input type="text" id="provRUC" placeholder="RUC">
          <input type="text" id="provNombre" placeholder="Nombre">
          <input type="text" id="provDireccion" placeholder="Dirección">
          <input type="email" id="provCorreo" placeholder="Correo">
          <input type="tel" id="provTelefono" placeholder="Teléfono">
          <button type="button" id="addProveedor">Agregar</button>
        </form>
        <input type="text" id="searchProveedor" placeholder="Buscar proveedor por RUC o Nombre">
        <button type="button" id="btnSearchProveedor">Buscar</button>
        <table id="tableProveedor">
          <thead>
            <tr>
              <th>RUC</th>
              <th>Nombre</th>
              <th>Dirección</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Factura -->
      <section id="sectionFactura" class="section">
        <h2>Factura</h2>
        <form id="formFactura">
          <input type="text" id="factRUC" placeholder="RUC proveedor">
          <select id="factProveedor">
            <option value="">Seleccione proveedor</option>
          </select>
          <input type="text" id="factTipo" placeholder="Tipo de factura">
          <input type="text" id="factDescripcion" placeholder="Descripción">
          <input type="date" id="factFecha">
          <button type="button" id="addFactura">Agregar</button>
        </form>
        <input type="text" id="searchFactura" placeholder="Buscar factura por RUC o proveedor">
        <button type="button" id="btnSearchFactura">Buscar</button>
        <table id="tableFactura">
          <thead>
            <tr>
              <th>RUC</th>
              <th>Proveedor</th>
              <th>Tipo</th>
              <th>Descripción</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Gastos -->
      <section id="sectionGastos" class="section">
        <h2>Gastos</h2>
        <form id="formGastos">
          <input type="text" id="gastoConcepto" placeholder="Concepto">
          <input type="number" id="gastoMonto" placeholder="Monto">
          <button type="button" id="addGasto">Agregar</button>
        </form>
        <table id="tableGastos">
          <thead>
            <tr>
              <th>Concepto</th>
              <th>Monto</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Servicio -->
      <section id="sectionServicio" class="section">
        <h2>Servicio</h2>
        <form id="formServicio">
          <input type="text" id="servDescripcion" placeholder="Descripción">
          <input type="number" id="servCosto" placeholder="Costo">
          <button type="button" id="addServicio">Agregar</button>
        </form>
        <table id="tableServicio">
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Costo</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

    </main>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
