<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #ff00cc, #3333ff);
      min-height: 100vh;
      color: white;
      font-family: 'Poppins', sans-serif;
    }
    .sidebar {
      width: 250px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-right: 2px solid rgba(255, 255, 255, 0.2);
      min-height: 100vh;
      padding: 20px;
    }
    .sidebar button {
      width: 100%;
      margin-bottom: 10px;
      background: transparent;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      transition: 0.3s;
    }
    .sidebar button:hover {
      background: #ff66cc;
      transform: scale(1.05);
    }
    .content {
      flex: 1;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
    .search-bar {
      position: absolute;
      top: 20px;
      right: 30px;
      width: 300px;
    }
  </style>
</head>
<body class="d-flex">
  <div class="sidebar">
    <h4 class="mb-4">Discovery Pets</h4>
    <button id="btnProveedores">Proveedores</button>
    <button id="btnFacturas">Facturas</button>
    <button id="btnProductos">Productos</button>
    <button id="btnReportes">Reportes</button>
    <hr>
    <button id="btnLogout" class="btn btn-danger mt-3">Cerrar sesión</button>
  </div>

  <div class="content flex-grow-1 position-relative">
    <!-- 🔍 Buscador general -->
    <input type="text" id="globalSearch" class="form-control search-bar" placeholder="Buscar factura, proveedor o producto...">

    <!-- 🧾 Sección de Proveedores -->
    <div id="sectionProveedores" class="card d-none">
      <h3>Registrar Proveedor</h3>
      <form id="formProveedor" class="row g-2">
        <div class="col-md-4"><input type="text" id="provNombre" class="form-control" placeholder="Nombre del proveedor" required></div>
        <div class="col-md-4"><input type="text" id="provRuc" class="form-control" placeholder="RUC (solo números)" required></div>
        <div class="col-md-4"><input type="text" id="provTelefono" class="form-control" placeholder="Teléfono" required></div>
        <div class="col-md-12"><button class="btn btn-light mt-2">Guardar</button></div>
      </form>
      <ul id="listaProveedores" class="mt-3 list-group"></ul>
    </div>

    <!-- 💸 Sección de Facturas -->
    <div id="sectionFacturas" class="card d-none">
      <h3>Registrar Factura</h3>
      <form id="formFactura" class="row g-2">
        <div class="col-md-3"><input type="text" id="numFactura" class="form-control" placeholder="N° de factura" required></div>
        <div class="col-md-3">
          <select id="tipoFactura" class="form-select">
            <option value="Factura Electrónica">Factura Electrónica</option>
            <option value="Boleta">Boleta</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="number" id="montoFactura" class="form-control" placeholder="Monto" step="0.01" required>
        </div>
        <div class="col-md-3">
          <select id="monedaFactura" class="form-select">
            <option value="PEN">Soles (PEN)</option>
            <option value="USD">Dólares (USD)</option>
          </select>
        </div>
        <div class="col-md-6">
          <input type="text" id="provFactura" class="form-control" placeholder="Proveedor asociado">
        </div>
        <div class="col-md-6">
          <input type="text" id="prodFactura" class="form-control" placeholder="Producto asociado">
        </div>
        <div class="col-md-12"><button class="btn btn-light mt-2">Guardar</button></div>
      </form>
      <ul id="listaFacturas" class="mt-3 list-group"></ul>
    </div>

    <!-- 📦 Sección de Productos -->
    <div id="sectionProductos" class="card d-none">
      <h3>Registrar Producto</h3>
      <form id="formProducto" class="row g-2">
        <div class="col-md-3"><input type="text" id="prodNombre" class="form-control" placeholder="Nombre del producto" required></div>
        <div class="col-md-3"><input type="text" id="prodDesc" class="form-control" placeholder="Descripción" required></div>
        <div class="col-md-2"><input type="number" id="prodCant" class="form-control" placeholder="Cantidad" required></div>
        <div class="col-md-2"><input type="text" id="prodUnidad" class="form-control" placeholder="Unidad de medida" required></div>
        <div class="col-md-2"><input type="number" id="prodValor" class="form-control" placeholder="Valor unitario" step="0.01" required></div>
        <div class="col-md-12"><button class="btn btn-light mt-2">Guardar</button></div>
      </form>
      <ul id="listaProductos" class="mt-3 list-group"></ul>
    </div>

    <!-- 📊 Sección de Reportes -->
    <div id="sectionReportes" class="card d-none text-center">
      <h3>Generar Reporte</h3>
      <p>Selecciona los criterios y genera un reporte detallado.</p>
      <button class="btn btn-light">Generar</button>
    </div>
  </div>

  <script src="firebase.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
