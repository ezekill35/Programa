<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard · Discovery Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #c7f9ff, #e8f9ff, #ffffff);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(90deg, #0dcaf0, #00b4d8, #48cae4);
      color: #fff;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    header h1 {
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: 1px;
    }

    #logoutBtn {
      background: #fff;
      color: #00b4d8;
      border: none;
      font-weight: 600;
      border-radius: 12px;
      padding: 0.5rem 1rem;
      transition: all 0.3s;
    }

    #logoutBtn:hover {
      background: #023e8a;
      color: #fff;
    }

    .menu {
      background: #fff;
      padding: 1rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .menu-btn {
      border: none;
      background: #caf0f8;
      color: #023e8a;
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .menu-btn:hover, .menu-btn.activo {
      background: #00b4d8;
      color: #fff;
      transform: translateY(-2px);
    }

    .container {
      margin-top: 2rem;
      max-width: 1300px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.05);
      padding: 2rem;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .seccion {
      display: none;
    }

    .seccion.activa {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    table {
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
      text-align: center;
    }

    th {
      background: #00b4d8;
      color: #fff;
    }

    tr:nth-child(even) {
      background: #f8f9fa;
    }

    .btn-sm {
      border: none;
      border-radius: 10px;
      font-weight: 500;
      padding: 0.25rem 0.7rem;
      transition: all 0.3s;
    }

    .btn-sm:hover {
      transform: scale(1.05);
    }

    .eliminar {
      background: #ff6b6b;
      color: white;
    }

    .editar {
      background: #ffd166;
      color: #000;
    }

    .ver-info {
      background: #06d6a0;
      color: white;
    }

    .form-control {
      border-radius: 10px;
      border: 1px solid #ade8f4;
      box-shadow: none;
    }

    .form-control:focus {
      border-color: #00b4d8;
      box-shadow: 0 0 0 0.2rem rgba(0,180,216,0.25);
    }

    #buscadorFactura {
      border-radius: 10px 0 0 10px;
      border: 1px solid #00b4d8;
    }

    #btnBuscar, #btnRefresh {
      border-radius: 0 10px 10px 0;
      background: #00b4d8;
      color: #fff;
      border: none;
      padding: 0.5rem 1.2rem;
      transition: all 0.3s;
    }

    #btnBuscar:hover, #btnRefresh:hover {
      background: #0077b6;
    }

    #panelFacturas {
      background: #f1faff;
      border: 2px solid #90e0ef;
      border-radius: 15px;
      padding: 1rem;
      margin-top: 1rem;
      max-height: 250px;
      overflow-y: auto;
      transition: all 0.3s;
    }

    #panelFacturas div {
      padding: 0.5rem;
      border-bottom: 1px dashed #90e0ef;
      cursor: pointer;
      transition: background 0.2s;
    }

    #panelFacturas div:hover {
      background: #caf0f8;
    }

    /* MODALES */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-contenido {
      background: #ffffff;
      border-radius: 20px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      animation: aparecer 0.3s ease;
    }

    @keyframes aparecer {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal h3 {
      color: #00b4d8;
      font-weight: 700;
    }

    .link-info {
      cursor: pointer;
      font-weight: 600;
      transition: color 0.2s;
    }

    .link-info:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 1rem;
      color: #555;
      font-size: 0.9rem;
    }

  </style>
</head>
<body>

<header>
  <h1>🐾 Discovery Pets Dashboard</h1>
  <button id="logoutBtn">Cerrar sesión</button>
</header>

<nav class="menu">
  <button class="menu-btn activo" data-target="secProveedores">Proveedores</button>
  <button class="menu-btn" data-target="secProductos">Productos</button>
  <button class="menu-btn" data-target="secFacturas">Facturas</button>
</nav>

<main class="container">

  <!-- 🧾 BUSCADOR -->
  <div class="mb-4 text-center">
    <div class="d-flex justify-content-center">
      <input id="buscadorFactura" class="form-control w-50" placeholder="Buscar producto relacionado a factura...">
      <button id="btnBuscar">Buscar</button>
      <button id="btnRefresh" title="Limpiar">↻</button>
    </div>
    <div id="panelFacturas" class="mt-3"></div>
  </div>

  <!-- 🧍 SECCION PROVEEDORES -->
  <section id="secProveedores" class="seccion activa">
    <h3 class="mb-3 text-primary fw-bold">Registro de Proveedores</h3>
    <form id="proveedorForm" class="row g-3 mb-4">
      <div class="col-md-3"><input id="rucProveedor" class="form-control" placeholder="RUC"></div>
      <div class="col-md-3"><input id="nombreProveedor" class="form-control" placeholder="Nombre"></div>
      <div class="col-md-3"><input id="direccionProveedor" class="form-control" placeholder="Dirección"></div>
      <div class="col-md-2"><input id="telefonoProveedor" class="form-control" placeholder="Teléfono"></div>
      <div class="col-md-1"><button class="btn btn-success w-100">➕</button></div>
    </form>
    <table class="table table-hover">
      <thead><tr><th>RUC</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr></thead>
      <tbody id="tablaProveedores"></tbody>
    </table>
  </section>

  <!-- 📦 SECCION PRODUCTOS -->
  <section id="secProductos" class="seccion">
    <h3 class="mb-3 text-primary fw-bold">Registro de Productos</h3>
    <form id="productoForm" class="row g-3 mb-4">
      <div class="col-md-3"><input id="nombreProducto" class="form-control" placeholder="Nombre"></div>
      <div class="col-md-2"><input id="cantidadProducto" class="form-control" type="number" placeholder="Cantidad"></div>
      <div class="col-md-2"><input id="precioProducto" class="form-control" type="number" step="0.000001" placeholder="Precio (S/.)"></div>
      <div class="col-md-3"><input id="descripcionProducto" class="form-control" placeholder="Descripción"></div>
      <div class="col-md-2"><button class="btn btn-success w-100">➕</button></div>
    </form>
    <table class="table table-hover">
      <thead><tr><th>Nombre</th><th>Cantidad</th><th>Precio</th><th>Descripción</th><th>Acciones</th></tr></thead>
      <tbody id="tablaProductos"></tbody>
    </table>
  </section>

  <!-- 💰 SECCION FACTURAS -->
  <section id="secFacturas" class="seccion">
    <h3 class="mb-3 text-primary fw-bold">Registro de Facturas</h3>
    <form id="facturaForm" class="row g-3 mb-4">
      <div class="col-md-2"><input id="idFactura" class="form-control" placeholder="ID Factura"></div>
      <div class="col-md-2"><input id="fechaFactura" class="form-control" type="date"></div>
      <div class="col-md-2"><select id="proveedorFactura" class="form-control"></select></div>
      <div class="col-md-2"><select id="productoFactura" class="form-control"></select></div>
      <div class="col-md-2"><input id="montoFactura" class="form-control" type="number" step="0.000001" placeholder="Monto (S/.)"></div>
      <div class="col-md-1"><input id="tipoFactura" class="form-control" placeholder="Tipo"></div>
      <div class="col-md-1"><button class="btn btn-success w-100">➕</button></div>
    </form>
    <table class="table table-hover">
      <thead><tr><th>ID</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Acción</th></tr></thead>
      <tbody id="tablaFacturas"></tbody>
    </table>
  </section>
</main>

<!-- 🔵 MODAL FACTURA -->
<div id="modalFactura" class="modal">
  <div class="modal-contenido">
    <span id="cerrarModalFactura" style="float:right;cursor:pointer;">❌</span>
    <div id="contenidoModalFactura"></div>
  </div>
</div>

<!-- 🟢 MODAL DETALLE EXTRA -->
<div id="modalDetalleExtra" class="modal">
  <div class="modal-contenido">
    <span id="cerrarModalDetalle" style="float:right;cursor:pointer;">❌</span>
    <div id="contenidoDetalleExtra"></div>
  </div>
</div>

<footer>© 2025 Discovery Pets — Sistema de Gestión Avanzado 🐾</footer>

<script type="module" src="dashboard.js"></script>
</body>
</html>
