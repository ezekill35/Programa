<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <script type="module" src="firebase.js" defer></script>
  <script type="module" src="dashboard.js" defer></script>

  <style>
    body {
      background: linear-gradient(135deg, #ff00aa, #ff66cc, #ff99dd);
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Poppins", sans-serif;
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      color: white;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }

    .sidebar h3 {
      text-align: center;
      font-weight: 700;
      margin-bottom: 30px;
      color: #fff;
    }

    .sidebar button {
      width: 100%;
      margin-bottom: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      border-radius: 10px;
      padding: 12px;
      transition: 0.3s;
    }

    .sidebar button:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.03);
    }

    .main {
      margin-left: 270px;
      padding: 30px;
      color: #333;
    }

    .search-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .search-bar input {
      border-radius: 10px;
      border: none;
      padding: 10px 15px;
      width: 320px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    .card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 25px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .btn-primary {
      background: #ff00aa;
      border: none;
    }

    .btn-primary:hover {
      background: #e6008e;
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <h3>Discovery Pets</h3>
    <button id="btnProveedor"><i class="bi bi-person-lines-fill"></i> Proveedor</button>
    <button id="btnFactura"><i class="bi bi-receipt"></i> Factura</button>
    <button id="btnProducto"><i class="bi bi-box-seam"></i> Producto</button>
    <button id="btnGastos"><i class="bi bi-cash-stack"></i> Gastos</button>
    <button id="btnReporte"><i class="bi bi-graph-up"></i> Reporte</button>
    <button id="btnCerrarSesion" class="btn btn-light mt-3"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
  </div>

  <div class="main">
    <div class="search-bar">
      <input type="text" id="globalSearch" placeholder="Buscar factura, producto o proveedor...">
    </div>

    <div id="contenido">
      <!-- Contenido dinámico cargado desde dashboard.js -->
    </div>
  </div>

  <template id="tplProveedor">
    <div class="card">
      <h4>Registrar Proveedor</h4>
      <form id="formProveedor" class="row g-3 mt-2">
        <div class="col-md-6">
          <label class="form-label">Nombre del Proveedor</label>
          <input type="text" id="provNombre" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">RUC</label>
          <input type="number" id="provRuc" class="form-control" required>
        </div>
        <div class="col-md-12">
          <label class="form-label">Teléfono</label>
          <input type="number" id="provTelefono" class="form-control">
        </div>
        <div class="col-md-12">
          <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </template>

  <template id="tplFactura">
    <div class="card">
      <h4>Registrar Factura</h4>
      <form id="formFactura" class="row g-3 mt-2">
        <div class="col-md-6">
          <label class="form-label">Número de Factura</label>
          <input type="text" id="facturaNumero" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Proveedor</label>
          <select id="facturaProveedor" class="form-select"></select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Monto</label>
          <div class="input-group">
            <select id="tipoMoneda" class="form-select" style="max-width: 120px;">
              <option value="PEN">S/ (Soles)</option>
              <option value="USD">$ (Dólares)</option>
            </select>
            <input type="number" id="facturaMonto" class="form-control" step="0.01" placeholder="0.00">
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Tipo de Factura</label>
          <select id="tipoFactura" class="form-select">
            <option value="Factura Electrónica">Factura Electrónica</option>
            <option value="Boleta">Boleta</option>
          </select>
        </div>
        <div class="col-md-12">
          <button class="btn btn-primary" type="submit">Guardar Factura</button>
        </div>
      </form>
    </div>
  </template>

  <template id="tplProducto">
    <div class="card">
      <h4>Registrar Producto</h4>
      <form id="formProducto" class="row g-3 mt-2">
        <div class="col-md-4">
          <label class="form-label">Nombre del Producto</label>
          <input type="text" id="prodNombre" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Descripción</label>
          <input type="text" id="prodDescripcion" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Cantidad</label>
          <input type="number" id="prodCantidad" class="form-control" required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Unidad de Medida</label>
          <input type="text" id="prodUnidad" class="form-control" placeholder="kg, unidad, etc.">
        </div>
        <div class="col-md-3">
          <label class="form-label">Valor Unitario</label>
          <input type="number" id="prodValor" class="form-control" step="0.01" placeholder="0.00">
        </div>
        <div class="col-md-12">
          <button class="btn btn-primary" type="submit">Guardar Producto</button>
        </div>
      </form>
    </div>
  </template>

  <template id="tplGastos">
    <div class="card">
      <h4>Registrar Gasto</h4>
      <form id="formGasto" class="row g-3 mt-2">
        <div class="col-md-6">
          <label class="form-label">Descripción del Gasto</label>
          <input type="text" id="gastoDescripcion" class="form-control" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Monto</label>
          <input type="number" id="gastoMonto" class="form-control" step="0.01" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Fecha</label>
          <input type="date" id="gastoFecha" class="form-control">
        </div>
        <div class="col-md-12">
          <button class="btn btn-primary" type="submit">Guardar Gasto</button>
        </div>
      </form>
    </div>
  </template>

  <template id="tplReporte">
    <div class="card">
      <h4>Generar Reporte</h4>
      <p class="text-muted">Aquí podrás generar reportes de Facturas, Proveedores, Productos y Gastos.</p>
      <button class="btn btn-primary">Generar Reporte PDF</button>
    </div>
  </template>
</body>
</html>
