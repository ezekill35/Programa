<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard · Discovery Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #10bcd4;
      --bg1: #f7fbff;
      --bg2: #eef9ff;
      --card: #ffffff;
      --muted: #6b7280;
    }
    *{box-sizing:border-box;font-family:'Inter',system-ui,Segoe UI,Roboto,Arial,sans-serif;}
    body{
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      min-height:100vh;
    }
    .sidebar{
      background:white;
      border-radius:20px;
      box-shadow:0 8px 25px rgba(0,0,0,0.08);
      padding:20px;
    }
    .logo{
      width:50px;height:50px;border-radius:12px;
      background:linear-gradient(135deg,var(--accent),#55d1e2);
      display:flex;align-items:center;justify-content:center;
      font-weight:800;color:white;font-size:18px;
    }
    .menu-btn.active{
      background:rgba(16,188,212,0.1);
      border-left:4px solid var(--accent);
    }
    .btn-accent{
      background:var(--accent);
      color:white;
      border:none;
    }
    .btn-accent:hover{opacity:0.9;}
    .card{border:none;box-shadow:0 6px 18px rgba(16,188,212,0.08);}
    #resultadosBusqueda button{
      width:100%;margin-top:6px;
    }
    #modalDetalle,#modalInfo{
      position:fixed;top:50%;left:50%;
      transform:translate(-50%,-50%);
      background:white;padding:20px;border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.15);
      display:none;z-index:1000;width:420px;
    }
  </style>
</head>
<body>
<div class="container-fluid p-4">
  <div class="row">
    <!-- SIDEBAR -->
    <aside class="col-md-3 col-lg-2 sidebar">
      <div class="d-flex align-items-center mb-3">
        <div class="logo me-2">DP</div>
        <div>
          <h5 class="mb-0 fw-bold">Discovery Pets</h5>
          <small class="text-muted">Panel Administrativo</small>
        </div>
      </div>
      <nav class="nav flex-column">
        <button class="btn text-start menu-btn active mb-2" data-target="seccion-proveedores">🏢 Proveedores</button>
        <button class="btn text-start menu-btn mb-2" data-target="seccion-productos">📦 Productos</button>
        <button class="btn text-start menu-btn mb-2" data-target="seccion-facturas">🧾 Facturas</button>
      </nav>
      <button id="logoutBtn" class="btn w-100 mt-3 border">Cerrar sesión</button>
    </aside>

    <!-- MAIN -->
    <main class="col-md-9 col-lg-10">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Dashboard · Discovery Pets</h2>
        <div class="d-flex gap-2 align-items-center">
          <input id="buscadorFactura" type="search" class="form-control" placeholder="Buscar facturas por producto...">
          <button id="btnBuscar" class="btn btn-accent">Buscar</button>
          <button id="btnRefresh" class="btn btn-outline-secondary">Restablecer</button>
        </div>
      </div>

      <!-- Resultados debajo del buscador -->
      <div id="resultadosBusqueda" class="mb-4"></div>

      <!-- SECCIONES -->
      <section id="seccion-proveedores" class="seccion">
        <div class="card p-3 mb-3">
          <h5>Registrar proveedor</h5>
          <form id="proveedorForm" class="row g-2">
            <div class="col-md-6"><input id="rucProveedor" class="form-control" placeholder="RUC" required></div>
            <div class="col-md-6"><input id="nombreProveedor" class="form-control" placeholder="Nombre" required></div>
            <div class="col-md-6"><input id="direccionProveedor" class="form-control" placeholder="Dirección"></div>
            <div class="col-md-4"><input id="telefonoProveedor" class="form-control" placeholder="Teléfono (opcional)"></div>
            <div class="col-md-2 d-grid"><button class="btn btn-accent">Guardar</button></div>
          </form>
        </div>
        <div class="card p-3">
          <h5>Proveedores registrados</h5>
          <table class="table table-hover mt-2">
            <thead><tr><th>RUC</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th></th></tr></thead>
            <tbody id="tablaProveedores"></tbody>
          </table>
        </div>
      </section>

      <section id="seccion-productos" class="seccion d-none">
        <div class="card p-3 mb-3">
          <h5>Registrar producto</h5>
          <form id="productoForm" class="row g-2">
            <div class="col-md-6"><input id="nombreProducto" class="form-control" placeholder="Nombre" required></div>
            <div class="col-md-3"><input id="cantidadProducto" class="form-control" type="number" placeholder="Cantidad" required></div>
            <div class="col-md-3"><input id="precioProducto" class="form-control" type="number" step="0.01" placeholder="Precio (ej. 490.75)" required></div>
            <div class="col-md-10"><input id="descripcionProducto" class="form-control" placeholder="Descripción (opcional)"></div>
            <div class="col-md-2 d-grid"><button class="btn btn-accent">Guardar</button></div>
          </form>
        </div>
        <div class="card p-3">
          <h5>Productos registrados</h5>
          <table class="table table-hover mt-2">
            <thead><tr><th>Nombre</th><th>Cantidad</th><th>Precio</th><th>Descripción</th><th></th></tr></thead>
            <tbody id="tablaProductos"></tbody>
          </table>
        </div>
      </section>

      <section id="seccion-facturas" class="seccion d-none">
        <div class="card p-3 mb-3">
          <h5>Registrar factura</h5>
          <form id="facturaForm" class="row g-2">
            <div class="col-md-4"><input id="idFactura" class="form-control" placeholder="ID factura" required></div>
            <div class="col-md-4"><input id="fechaFactura" type="date" class="form-control" required></div>
            <div class="col-md-4"><input id="montoFactura" type="number" step="0.01" class="form-control" placeholder="Monto" required></div>
            <div class="col-md-6">
              <select id="proveedorFactura" class="form-select" required><option value="">Seleccionar proveedor</option></select>
            </div>
            <div class="col-md-6">
              <select id="productoFactura" class="form-select" required><option value="">Seleccionar producto</option></select>
            </div>
            <div class="col-md-10">
              <select id="tipoFactura" class="form-select">
                <option value="Factura">Factura</option>
                <option value="Boleta">Boleta</option>
              </select>
            </div>
            <div class="col-md-2 d-grid"><button class="btn btn-accent">Guardar</button></div>
          </form>
        </div>
        <div class="card p-3">
          <h5>Facturas registradas</h5>
          <table class="table table-hover mt-2">
            <thead><tr><th>ID</th><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th></th></tr></thead>
            <tbody id="tablaFacturas"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- MODALES -->
<div id="modalDetalle">
  <button id="cerrarModal" class="btn btn-danger btn-sm float-end">X</button>
  <div id="modalContenido"></div>
</div>

<div id="modalInfo">
  <button id="cerrarInfo" class="btn btn-danger btn-sm float-end">X</button>
  <div id="modalContenidoInfo"></div>
</div>

<script type="module" src="./dashboard.js"></script>
</body>
</html>
