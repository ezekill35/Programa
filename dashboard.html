<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Discovery Pets</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="dashboard-body">

  <div class="sidebar">
    <h2 style="text-align:center;">🐶 Discovery Pets</h2>
    <a href="#" onclick="showSection('products')">Productos</a>
    <a href="#" onclick="showSection('providers')">Proveedores</a>
    <a href="#" onclick="showSection('purchases')">Compras</a>
    <a href="#" onclick="showSection('sales')">Ventas</a>
    <a href="#" onclick="showSection('expenses')">Gastos</a>
    <a href="#" onclick="logout()">Cerrar Sesión</a>
  </div>

  <div class="main-content">
    <h1 id="dashboard-title">Bienvenido</h1>

    <!-- Productos -->
    <section id="products-section" class="content-section">
      <div class="card">
        <h3>➕ Agregar Nuevo Producto</h3>
        <form id="add-product-form" onsubmit="event.preventDefault(); addProduct();">
          <input type="text" id="product-sku" placeholder="Código / SKU *" required>
          <input type="text" id="product-name" placeholder="Descripción">
          <input type="text" id="product-brand" placeholder="Marca">
          <input type="number" id="product-price" placeholder="Precio Venta S/ *" required>
          <input type="number" id="product-stock" placeholder="Stock Inicial *" required>
          <input type="text" id="product-unit" placeholder="Unidad de Medida">
          <select id="product-category">
            <option value="">Categoría *</option>
            <option value="perros">Perros</option>
            <option value="gatos">Gatos</option>
            <option value="otros">Otros</option>
          </select>
          <button type="submit" class="primary-btn">Agregar Producto</button>
        </form>
      </div>
      <div class="card">
        <h3>🔍 Productos Registrados</h3>
        <div id="products-list"></div>
      </div>
    </section>

    <!-- Proveedores -->
    <section id="providers-section" class="content-section">
      <div class="card">
        <h3>➕ Agregar Nuevo Proveedor</h3>
        <form id="add-provider-form" onsubmit="event.preventDefault(); addProvider();">
          <input type="text" id="provider-name" placeholder="Nombre del Contacto *" required>
          <input type="text" id="provider-business" placeholder="Nombre Comercial *" required>
          <input type="text" id="provider-phone" placeholder="Teléfono *" required>
          <input type="text" id="provider-fax" placeholder="Fax (Opcional)">
          <input type="text" id="provider-address" placeholder="Dirección">
          <input type="text" id="provider-product-type" placeholder="Tipo de Producto">
          <button type="submit" class="primary-btn">Agregar Proveedor</button>
        </form>
      </div>
      <div class="card">
        <h3>👥 Proveedores Registrados</h3>
        <div id="providers-list"></div>
      </div>
    </section>

    <!-- Compras, Ventas, Gastos -->
    <section id="purchases-section" class="content-section"><div class="card"><h3>Registrar Compras</h3></div></section>
    <section id="sales-section" class="content-section"><div class="card"><h3>Registrar Ventas</h3></div></section>
    <section id="expenses-section" class="content-section"><div class="card"><h3>Registrar Gastos</h3></div></section>

  </div>

  <script src="firebase.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
