<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Discovery Pets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1: #f7fbff;
      --bg2: #eef9ff;
      --card: #ffffff;
      --accent: #10bcd4;
      --muted: #6b7280;
      --glass: rgba(255,255,255,0.7);
      --shadow-lg: 0 10px 30px rgba(16,188,212,0.12);
      --shadow-md: 0 6px 18px rgba(16,188,212,0.08);
      --radius: 16px;
    }
    *{box-sizing:border-box;font-family:'Inter',system-ui,Segoe UI,Roboto,Arial,sans-serif}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#0f172a}
    .app{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:32px;min-height:100vh;align-items:start;}
    
    /* SIDEBAR */
    .sidebar{position:sticky;top:32px;padding:20px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.7));box-shadow:var(--shadow-lg);backdrop-filter:blur(6px);}
    .sidebar .logo{font-weight:800;font-size:20px;color:var(--accent);margin-bottom:18px;}
    .menu-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:none;background:transparent;color:#0f172a;cursor:pointer;transition:all .18s ease;width:100%;text-align:left;}
    .menu-btn.activo{background: linear-gradient(90deg, rgba(16,188,212,0.12), rgba(16,188,212,0.06));border-left:3px solid var(--accent);}
    .logout{margin-top:18px;padding:10px;border-radius:12px;background:transparent;border:1px solid rgba(15,23,42,0.06);cursor:pointer;width:100%;}

    /* MAIN */
    .main{padding:28px;border-radius:20px;background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.82));box-shadow: var(--shadow-lg);backdrop-filter:blur(4px);}
    .seccion{display:none;} .seccion.activa{display:block;}
    form .row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
    form input, form select{padding:10px;border-radius:10px;border:1px solid rgba(10,20,30,0.06);flex:1;min-width:120px;}
    .btn{padding:8px 12px;border-radius:10px;border:none;cursor:pointer;background:var(--accent);color:white;font-weight:600;box-shadow:0 6px 18px rgba(16,188,212,0.12);}
    .btn.secondary{background:transparent;color:var(--accent);border:1px solid rgba(16,188,212,0.12);}
    table{width:100%;border-collapse:collapse}
    table th, table td{padding:10px;text-align:left;border-bottom:1px dashed rgba(10,20,30,0.04);font-size:14px}
    .table-scroll{max-height:420px;overflow:auto;padding-right:6px;}
    
    /* Modal */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:1800;padding:28px;}
    .modal.show{display:flex;}
    .modal-backdrop{position:absolute;inset:0;background:linear-gradient(180deg, rgba(2,6,23,0.28), rgba(2,6,23,0.18));backdrop-filter: blur(6px);}
    .modal-card{position:relative;z-index:2;max-width:1100px;width:100%;border-radius:18px;padding:18px;background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(250,255,255,0.95));box-shadow: 0 40px 80px rgba(10,20,30,0.12);transform: translateY(-6px);}
    .close-x{position:absolute; right:12px; top:12px; background:transparent;border:none;font-size:20px;cursor:pointer;color:#334155}
    .results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
    .fact-card{border-radius:14px;padding:14px;background:linear-gradient(180deg,#fff,#f8feff);box-shadow:0 16px 40px rgba(16,188,212,0.08);cursor:pointer;border:1px solid rgba(16,188,212,0.06);transition:transform .14s ease, box-shadow .14s;}
    .fact-card:hover{transform:translateY(-6px);box-shadow:0 28px 60px rgba(16,188,212,0.12);}
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">DP</div>
      <button class="menu-btn activo" data-target="seccionProveedores">Proveedores</button>
      <button class="menu-btn" data-target="seccionProductos">Productos</button>
      <button class="menu-btn" data-target="seccionFacturas">Facturas</button>
      <button id="logoutBtn" class="logout">Cerrar sesión</button>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <!-- PROVEEDORES -->
      <section id="seccionProveedores" class="seccion activa">
        <h3>Proveedores</h3>
        <form id="proveedorForm" class="mb-3">
          <div class="row">
            <input id="rucProveedor" placeholder="RUC" required />
            <input id="nombreProveedor" placeholder="Nombre" required />
          </div>
          <div class="row">
            <input id="direccionProveedor" placeholder="Dirección" required />
            <input id="telefonoProveedor" placeholder="Teléfono (opcional)" />
            <button class="btn" type="submit">Añadir proveedor</button>
          </div>
        </form>
        <div class="table-scroll">
          <table>
            <thead><tr><th>RUC</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acción</th></tr></thead>
            <tbody id="tablaProveedores"></tbody>
          </table>
        </div>
      </section>

      <!-- PRODUCTOS -->
      <section id="seccionProductos" class="seccion">
        <h3>Productos</h3>
        <form id="productoForm" class="mb-3">
          <div class="row">
            <input id="nombreProducto" placeholder="Nombre" required />
            <input id="unidadProducto" placeholder="Unidad (ej.: kg, und)" required />
          </div>
          <div class="row">
            <input id="materialP" placeholder="Material P" />
            <input id="maquinaria" placeholder="Maquinaria" />
            <input id="productoOf" placeholder="Producto Of." />
            <input id="insumosExtra" placeholder="Insumos Extra" />
            <button class="btn" type="submit">Añadir producto</button>
          </div>
        </form>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Nombre</th><th>Unidad</th><th>Material P</th><th>Maquinaria</th><th>Producto Of.</th><th>Insumos Extra</th><th>Acción</th></tr></thead>
            <tbody id="tablaProductos"></tbody>
          </table>
        </div>
      </section>

      <!-- FACTURAS -->
      <section id="seccionFacturas" class="seccion">
        <h3>Facturas</h3>
        <div class="mb-3">
          <input id="buscadorFactura" placeholder="Buscar facturas por producto..." />
          <button id="btnRefresh" class="btn secondary">Restablecer</button>
        </div>
        <form id="facturaForm" class="mb-3">
          <div class="row">
            <input id="numeroFactura" placeholder="Número automático" readonly />
            <input id="idFactura" placeholder="ID factura (ej.: F003-007598)" />
            <input id="fechaEmisionFactura" type="date" required />
          </div>
          <div class="row">
            <select id="proveedorFactura" required></select>
            <select id="productoFactura" required></select>
          </div>
          <div class="row">
            <input id="montoFactura" placeholder="Monto" required />
            <select id="monedaFactura"><option value="S/">S/</option><option value="$">$</option></select>
            <select id="tipoFactura"><option value="Compra">Compra</option><option value="Gasto">Gasto</option><option value="Servicio">Servicio</option></select>
            <button class="btn" type="submit">Guardar factura</button>
          </div>
        </form>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Número</th><th>Proveedor</th><th>Producto</th><th>Monto</th><th>Tipo</th><th>Fecha</th><th>ID</th><th>Acción</th></tr></thead>
            <tbody id="tablaFacturas"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- MODALES -->
  <div id="modalResultados" class="modal">
    <div class="modal-backdrop" onclick="closeResultados()"></div>
    <div class="modal-card">
      <button class="close-x" onclick="closeResultados()">✕</button>
      <h3 id="resultTitle"></h3>
      <p id="resultSub" class="muted"></p>
      <div id="resultsContainer" class="results-grid"></div>
    </div>
  </div>

  <div id="modalFactura" class="modal">
    <div class="modal-backdrop" onclick="closeFactura()"></div>
    <div class="modal-card">
      <button class="close-x" onclick="closeFactura()">✕</button>
      <h3 id="facturaTitle"></h3>
      <div id="modalFacturaContenido"></div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
