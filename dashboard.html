<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard 3D Aqua</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(145deg, #e3f2fd, #bbdefb);
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    .dashboard {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: linear-gradient(145deg, #2196f3, #1976d2);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
      box-shadow: 4px 0 12px rgba(0, 0, 0, 0.2);
      z-index: 10;
    }

    .sidebar h3 {
      margin-bottom: 30px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    .sidebar button {
      width: 85%;
      margin: 8px 0;
      padding: 10px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      transition: 0.3s;
      cursor: pointer;
    }

    .sidebar button:hover,
    .sidebar button.active {
      background: white;
      color: #1976d2;
      transform: scale(1.05);
    }

    .main {
      flex: 1;
      background: #f7f9fc;
      border-radius: 20px 0 0 20px;
      overflow-y: auto;
      padding: 30px;
      position: relative;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .topbar input {
      border-radius: 12px;
      padding: 10px;
      width: 50%;
      border: 1px solid #ccc;
    }

    .card {
      border-radius: 18px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
      background: white;
      padding: 20px;
    }

    .form-control, select {
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="sidebar">
      <h3>Lavandería AQUA</h3>
      <button id="btnProveedor">Proveedores</button>
      <button id="btnFactura">Facturas</button>
      <button id="btnProducto">Productos</button>
      <button id="btnGastos">Gastos</button>
      <button id="btnReporte">Reportes</button>
      <button id="btnCerrarSesion" class="mt-auto mb-3">Cerrar Sesión</button>
    </div>

    <div class="main">
      <div class="topbar">
        <input type="text" id="globalSearch" placeholder="Buscar factura o proveedor...">
      </div>
      <div id="contenido">
        <div class="card text-center p-5">
          <h4>Bienvenido al Panel AQUA 💧</h4>
          <p>Selecciona una opción del menú lateral para comenzar.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== -->
  <!-- TEMPLATES DINÁMICOS -->
  <!-- ===================== -->

  <template id="tplProveedor">
    <div class="card">
      <h4>Registro de Proveedores</h4>
      <form id="formProveedor" class="mt-3">
        <input id="provNombre" class="form-control mb-2" placeholder="Nombre del proveedor" required>
        <input id="provRuc" class="form-control mb-2" placeholder="RUC" pattern="[0-9]{11}" required>
        <input id="provTelefono" class="form-control mb-2" placeholder="Teléfono" pattern="[0-9]{9}" required>
        <button class="btn btn-primary w-100">Guardar</button>
      </form>
    </div>
  </template>

  <template id="tplFactura">
    <div class="card">
      <h4>Registro de Facturas</h4>
      <form id="formFactura" class="mt-3">
        <input id="facturaNumero" class="form-control mb-2" placeholder="Número de factura" required>
        <select id="facturaProveedor" class="form-control mb-2" required>
          <option value="">Cargando proveedores...</option>
        </select>
        <select id="tipoFactura" class="form-control mb-2">
          <option value="Compra">Compra</option>
          <option value="Venta">Venta</option>
        </select>
        <select id="tipoMoneda" class="form-control mb-2">
          <option value="PEN">Soles</option>
          <option value="USD">Dólares</option>
        </select>
        <input id="facturaMonto" type="number" step="0.01" class="form-control mb-2" placeholder="Monto total" required>
        <button class="btn btn-success w-100">Guardar Factura</button>
      </form>
    </div>
  </template>

  <template id="tplProducto">
    <div class="card">
      <h4>Registro de Productos</h4>
      <form id="formProducto" class="mt-3">
        <input id="prodNombre" class="form-control mb-2" placeholder="Nombre del producto" required>
        <input id="prodDescripcion" class="form-control mb-2" placeholder="Descripción">
        <input id="prodCantidad" type="number" class="form-control mb-2" placeholder="Cantidad" required>
        <select id="prodUnidad" class="form-control mb-2">
          <option value="unidad">Unidad</option>
          <option value="kg">Kilogramos</option>
        </select>
        <input id="prodValor" type="number" step="0.01" class="form-control mb-2" placeholder="Valor unitario" required>
        <button class="btn btn-success w-100">Guardar Producto</button>
      </form>
    </div>
  </template>

  <template id="tplGastos">
    <div class="card">
      <h4>Registro de Gastos</h4>
      <form id="formGasto" class="mt-3">
        <input id="gastoDescripcion" class="form-control mb-2" placeholder="Descripción del gasto" required>
        <input id="gastoMonto" type="number" step="0.01" class="form-control mb-2" placeholder="Monto" required>
        <input id="gastoFecha" type="date" class="form-control mb-2" required>
        <button class="btn btn-warning w-100">Guardar Gasto</button>
      </form>
    </div>
  </template>

  <template id="tplReporte">
    <div class="card text-center">
      <h4>Reporte General</h4>
      <p>Resumen financiero actualizado en tiempo real.</p>
    </div>
  </template>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
