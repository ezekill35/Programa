<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discovery Pets · Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(120deg, #f5f5f5, #e0f7fa);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: #004d40;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .container-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2rem;
    }
    .tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .tabs button {
      background: #00796b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      transition: all 0.3s;
      font-weight: 500;
    }
    .tabs button:hover, .tabs button.active {
      background: #004d40;
      transform: scale(1.05);
    }
    .content-section {
      display: none;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 2rem;
      width: 90%;
      max-width: 1100px;
      animation: fadeIn 0.4s ease-in-out;
    }
    .content-section.active {
      display: block;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
    table {
      width: 100%;
      margin-top: 1rem;
      border-collapse: collapse;
    }
    th, td {
      border-bottom: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #e0f2f1;
    }
    .form-control, select {
      margin-bottom: 10px;
    }
    .btn-custom {
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      transition: all 0.3s;
    }
    .btn-custom:hover {
      background-color: #004d40;
    }
    .search-box {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }
    .search-box input {
      width: 250px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #aaa;
    }
    /* Estilos del modal */
    .modal-header {
      background: #00796b;
      color: white;
    }
  </style>
</head>
<body>

  <header>Discovery Pets · Panel de Gestión</header>

  <div class="container-main">

    <div class="tabs">
      <button class="active" data-target="proveedores">Proveedores</button>
      <button data-target="productos">Productos</button>
      <button data-target="facturas">Facturas</button>
    </div>

    <!-- ==================== PROVEEDORES ==================== -->
    <div id="proveedores" class="content-section active">
      <h4>Registro de Proveedores</h4>
      <input type="text" id="provId" class="form-control" placeholder="ID del proveedor">
      <input type="text" id="provNombre" class="form-control" placeholder="Nombre del proveedor">
      <input type="text" id="provRuc" class="form-control" placeholder="RUC">
      <input type="text" id="provTelefono" class="form-control" placeholder="Teléfono">
      <input type="text" id="provNumero" class="form-control" placeholder="Número opcional">
      <input type="text" id="provDireccion" class="form-control" placeholder="Dirección">
      <button id="btnGuardarProveedor" class="btn-custom">Guardar Proveedor</button>

      <div class="search-box mt-3">
        <input type="text" id="buscarProveedor" placeholder="Buscar proveedor...">
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>RUC</th><th>Teléfono</th><th>Número</th><th>Dirección</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaProveedores"></tbody>
      </table>
    </div>

    <!-- ==================== PRODUCTOS ==================== -->
    <div id="productos" class="content-section">
      <h4>Registro de Productos</h4>
      <input type="text" id="prodId" class="form-control" placeholder="ID del producto">
      <input type="text" id="prodNombre" class="form-control" placeholder="Nombre del producto">
      <input type="number" id="prodPrecio" class="form-control" placeholder="Precio">
      <input type="number" id="prodCantidad" class="form-control" placeholder="Cantidad">
      <input type="text" id="prodDescripcion" class="form-control" placeholder="Descripción (opcional)">
      <button id="btnGuardarProducto" class="btn-custom">Guardar Producto</button>

      <div class="search-box mt-3">
        <input type="text" id="buscarProducto" placeholder="Buscar producto...">
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Cantidad</th><th>Descripción</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaProductos"></tbody>
      </table>
    </div>

    <!-- ==================== FACTURAS ==================== -->
    <div id="facturas" class="content-section">
      <h4>Registro de Facturas</h4>
      <input type="text" id="facturaId" class="form-control" placeholder="ID de factura">
      <select id="facturaProveedor" class="form-control"></select>
      <select id="facturaProducto" class="form-control"></select>
      <input type="number" id="facturaCantidad" class="form-control" placeholder="Cantidad">
      <input type="date" id="facturaFecha" class="form-control">
      <button id="btnGuardarFactura" class="btn-custom">Guardar Factura</button>

      <div class="search-box mt-3">
        <input type="text" id="buscarFactura" placeholder="Buscar factura o producto...">
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Proveedor</th><th>Producto</th><th>Cantidad</th><th>Fecha</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tablaFacturas"></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
