<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo"><i>🐾</i> Discovery Pets</div>
      <ul>
        <li id="opProveedor" class="active" onclick="mostrarSeccion('proveedor')">Proveedor</li>
        <li id="opFactura" onclick="mostrarSeccion('factura')">Factura</li>
        <li id="opGastos" onclick="mostrarSeccion('gastos')">Gastos</li>
        <li id="opServicio" onclick="mostrarSeccion('servicio')">Servicio</li>
      </ul>
      <button id="btnLogout">Cerrar Sesión</button>
    </div>

    <!-- CONTENIDO -->
    <div class="content">
      <h1 id="tituloSeccion">Proveedor</h1>
      <p class="subtitle">Administra tus registros 🐶</p>

      <!-- FORMULARIOS -->
      <div class="card">
        <h2>Registrar</h2>
        <form id="formProveedor" class="formulario">
          <input type="text" id="rutProveedor" placeholder="RUT">
          <input type="text" id="nombreProveedor" placeholder="Nombre">
          <input type="text" id="direccionProveedor" placeholder="Dirección">
          <button type="button" id="btnAddProveedor">Agregar Proveedor</button>
        </form>

        <form id="formFactura" class="formulario hidden">
          <input type="text" id="rucFactura" placeholder="RUC">
          <select id="selectProveedorFactura">
            <option value="">Selecciona un proveedor</option>
          </select>
          <input type="text" id="descripcionFactura" placeholder="Descripción">
          <input type="date" id="fechaFactura">
          <button type="button" id="btnAddFactura">Agregar Factura</button>
        </form>

        <form id="formGastos" class="formulario hidden">
          <input type="text" id="nombreGasto" placeholder="Nombre Gasto">
          <input type="number" id="montoGasto" placeholder="Monto">
          <input type="date" id="fechaGasto">
          <button type="button" id="btnAddGasto">Agregar Gasto</button>
        </form>

        <form id="formServicio" class="formulario hidden">
          <input type="text" id="nombreServicio" placeholder="Nombre Servicio">
          <input type="number" id="costoServicio" placeholder="Costo">
          <input type="date" id="fechaServicio">
          <button type="button" id="btnAddServicio">Agregar Servicio</button>
        </form>
      </div>

      <!-- BUSCADOR -->
      <input type="text" id="buscador" placeholder="Buscar por RUT o nombre...">

      <!-- TABLA DE DATOS -->
      <div class="card">
        <h2>Lista de Registros</h2>
        <table id="tablaDatos">
          <thead>
            <tr id="tablaHeader"></tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
