<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Discovery Pets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #ffe0f0, #ffb3d9);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    .sidebar {
      width: 250px;
      height: 100vh;
      background: #fff;
      position: fixed;
      left: 0;
      top: 0;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    .sidebar img {
      width: 120px;
      margin-bottom: 20px;
    }

    .sidebar h3 {
      color: #ff3399;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
    }

    .nav-link {
      display: block;
      color: #333;
      font-weight: 600;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      margin-bottom: 8px;
      transition: all 0.3s ease;
    }

    .nav-link:hover, .nav-link.active {
      background: #ff3399;
      color: #fff;
      transform: scale(1.03);
    }

    .logout-btn {
      background: #ff3399;
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .logout-btn:hover {
      background: #ff66cc;
      transform: scale(1.03);
    }

    .content {
      margin-left: 270px;
      padding: 40px;
      color: #333;
    }

    h2 {
      color: #ff3399;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-bar input {
      flex: 1;
      border-radius: 8px;
      border: 1px solid #ccc;
      padding: 10px;
    }

    .search-bar button {
      background: #ff3399;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    .search-bar button:hover {
      background: #ff66cc;
    }

    .card {
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 25px;
      margin-bottom: 30px;
      background: #fff;
    }

    .table th {
      background: #ffb3d9;
    }

    /* Ocultar secciones */
    .section { display: none; }
    .section.active { display: block; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <div class="text-center">
        <img src="https://static.wixstatic.com/media/ba54dd_7c82d35c6b0142b48d51bf0641564791~mv2.png/v1/fit/w_2500,h_1330,al_c/ba54dd_7c82d35c6b0142b48d51bf0641564791~mv2.png" alt="Logo">
      </div>
      <h3>Discovery Pets</h3>
      <a href="#" class="nav-link active" data-section="proveedores">Proveedores</a>
      <a href="#" class="nav-link" data-section="productos">Productos</a>
      <a href="#" class="nav-link" data-section="facturas">Facturas</a>
    </div>
    <button class="logout-btn" id="btnLogout">Cerrar Sesión</button>
  </div>

  <div class="content">
    <!-- 🔹 Proveedores -->
    <div id="proveedores" class="section active">
      <h2>Proveedores</h2>
      <div class="card">
        <form id="formProveedor" class="mb-3">
          <input type="text" id="rucProveedor" class="form-control mb-2" placeholder="RUC" required>
          <input type="text" id="nombreProveedor" class="form-control mb-2" placeholder="Nombre" required>
          <input type="text" id="direccionProveedor" class="form-control mb-2" placeholder="Dirección" required>
          <input type="tel" id="telefonoProveedor" class="form-control mb-2" placeholder="Teléfono o celular (opcional)">
          <button type="submit" class="btn btn-primary w-100">Guardar Proveedor</button>
        </form>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>RUC</th>
              <th>Nombre</th>
              <th>Dirección</th>
              <th>Teléfono</th>
            </tr>
          </thead>
          <tbody id="tablaProveedores"></tbody>
        </table>
      </div>
    </div>

    <!-- 🔹 Productos -->
    <div id="productos" class="section">
      <h2>Productos</h2>
      <div class="card">
        <form id="formProducto" class="mb-3">
          <input type="text" id="nombreProducto" class="form-control mb-2" placeholder="Nombre del producto" required>
          <input type="number" id="cantidadProducto" class="form-control mb-2" placeholder="Cantidad" required>
          <input type="number" id="precioProducto" class="form-control mb-2" placeholder="Precio" required>
          <input type="text" id="descripcionProducto" class="form-control mb-2" placeholder="Descripción (opcional)">
          <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
        </form>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Cantidad</th>
              <th>Precio</th>
              <th>Descripción</th>
            </tr>
          </thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </div>
    </div>

    <!-- 🔹 Facturas -->
    <div id="facturas" class="section">
      <h2>Facturas</h2>
      <div class="search-bar">
        <input type="text" id="buscarProducto" placeholder="Buscar por nombre de producto">
        <button id="btnBuscar">Buscar</button>
      </div>
      <div class="card">
        <form id="formFactura" class="mb-3">
          <input type="text" id="fechaFactura" class="form-control mb-2" placeholder="Fecha (dd/mm/aaaa)" required>
          <input type="text" id="proveedorFactura" class="form-control mb-2" placeholder="Proveedor" required>
          <input type="text" id="productoFactura" class="form-control mb-2" placeholder="Producto" required>
          <input type="number" id="montoFactura" class="form-control mb-2" placeholder="Monto" required>
          <select id="tipoFactura" class="form-select mb-2" required>
            <option value="" disabled selected>Tipo</option>
            <option value="FACTURA">Factura</option>
            <option value="BOLETA">Boleta</option>
          </select>
          <button type="submit" class="btn btn-primary w-100">Guardar Factura</button>
        </form>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>ID</th>
              <th>Fecha</th>
              <th>Proveedor</th>
              <th>Producto</th>
              <th>Monto</th>
              <th>Tipo</th>
            </tr>
          </thead>
          <tbody id="tablaFacturas"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
