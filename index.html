<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets | Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="card p-4 shadow" style="width: 350px;">
  <!-- LOGIN -->
  <div id="loginDiv">
    <h3 class="text-center mb-3">Inicia sesión</h3>
    <form id="loginForm">
      <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Contraseña" required>
      <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
    </form>
    <p class="text-center mt-2">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
    <p id="loginMsg" class="text-danger text-center"></p>
  </div>

  <!-- REGISTRO -->
  <div id="registerDiv" style="display:none;">
    <h3 class="text-center mb-3">Regístrate</h3>
    <form id="registerForm">
      <input type="text" id="registerName" class="form-control mb-2" placeholder="Nombre completo" required>
      <input type="email" id="registerEmail" class="form-control mb-2" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" class="form-control mb-2" placeholder="Contraseña" required>
      <button class="btn btn-success w-100" type="submit">Registrarse</button>
    </form>
    <p class="text-center mt-2">¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
    <p id="registerMsg" class="text-danger text-center"></p>
  </div>
</div>
