<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <div class="login-container">
    <div id="login-section" class="auth-section">
      <h2 class="text-center mb-4">Iniciar Sesión</h2>
      <form id="loginForm">
        <div class="mb-3">
          <input type="email" id="loginEmail" class="form-control" placeholder="Correo electrónico" required>
        </div>
        <div class="mb-3">
          <input type="password" id="loginPassword" class="form-control" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
      </form>
      <p class="text-center mt-3">
        ¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a>
      </p>
    </div>

    <div id="register-section" class="auth-section d-none">
      <h2 class="text-center mb-4">Registrarse</h2>
      <form id="registerForm">
        <div class="mb-3">
          <input type="text" id="registerName" class="form-control" placeholder="Nombre completo" required>
        </div>
        <div class="mb-3">
          <input type="email" id="registerEmail" class="form-control" placeholder="Correo electrónico" required>
        </div>
        <div class="mb-3">
          <input type="password" id="registerPassword" class="form-control" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Registrarse</button>
      </form>
      <p class="text-center mt-3">
        ¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a>
      </p>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
