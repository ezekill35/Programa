<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Discovery Pets · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    body {
      display: flex;
      height: 100vh;
      background: #fff;
      overflow: hidden;
      color: #111827;
    }
    .left {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.06);
      padding: 2rem;
      animation: fadeIn .6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-weight: 700;
      font-size: 26px;
      margin-bottom: 4px;
      color: #1e293b;
    }
    p.subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fafafa;
      outline: none;
      transition: all 0.2s;
      font-size: 15px;
    }
    input:focus {
      border-color: #6366f1;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }
    .actions a {
      color: #4f46e5;
      text-decoration: none;
    }
    .actions a:hover { text-decoration: underline; }
    .btn-login {
      background: linear-gradient(90deg, #10bcd4, #38bdf8);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(16,188,212,0.25);
    }

    /* --- Fondo derecho decorativo --- */
    .right {
      flex: 1;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.7;
    }
    .s1 { background: #10bcd4; width: 280px; height: 280px; top: 10%; left: 12%; }
    .s2 { background: #7dd3fc; width: 240px; height: 240px; bottom: 15%; right: 15%; }
    .s3 { background: #c084fc; width: 200px; height: 200px; top: 55%; left: 55%; }
    .quote {
      z-index: 2;
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      color: #0f172a;
      max-width: 360px;
      line-height: 1.4;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      color: #10bcd4;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="left">
    <div class="login-card">
      <div class="logo">🐾</div>
      <h1>Discovery Pets</h1>
      <p class="subtitle">Panel administrativo</p>

      <input type="email" id="email" placeholder="Correo electrónico" required>
      <input type="password" id="password" placeholder="Contraseña" required>

      <div class="actions">
        <label><input type="checkbox" id="keepLogged"> Mantener sesión</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn-login" id="btnLogin">Iniciar sesión</button>
    </div>
  </div>

  <div class="right">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <p class="quote">Cuidamos a quienes más amas 💙<br>Descubre el poder de Discovery Pets</p>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const btnLogin = document.getElementById("btnLogin");

    btnLogin.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) return alert("Ingrese correo y contraseña");
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        alert("Error al iniciar sesión: " + err.message);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user && !window.location.pathname.includes("dashboard.html")) {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
