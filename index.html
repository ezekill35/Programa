<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">🐶 Discovery Pets</h1>
      <p class="login-subtitle">Bienvenido al sistema de gestión 🐾</p>

      <form id="login-form" onsubmit="event.preventDefault(); login();">
        <div class="form-group">
          <input type="email" id="login-username" placeholder="Correo electrónico" required>
        </div>
        <div class="form-group password-container">
          <input type="password" id="login-password" placeholder="Contraseña" required>
          <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
        </div>
        <p class="error-message" id="login-error"></p>
        <button class="primary-btn" type="submit">Entrar</button>
      </form>

      <hr class="divider">

      <p class="register-text">¿No tienes cuenta? <span onclick="showRegisterForm()" class="register-link">Crear cuenta</span></p>

      <form id="register-form" onsubmit="event.preventDefault(); register();" style="display:none;">
        <div class="form-group">
          <input type="email" id="reg-username" placeholder="Correo electrónico" required>
        </div>
        <div class="form-group password-container">
          <input type="password" id="reg-password" placeholder="Contraseña" required>
          <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('reg-password', this)"></i>
        </div>
        <p class="error-message" id="register-error"></p>
        <p class="success-message" id="register-success"></p>
        <button class="primary-btn" type="submit">Registrar</button>
        <p class="register-text">¿Ya tienes cuenta? <span onclick="showLoginForm()" class="register-link">Iniciar sesión</span></p>
      </form>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="script.js"></script>
</body>
</html>
