<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🐶 Discovery Pets</h1>
    <p class="subtitle">Bienvenido al sistema de gestión 🐾</p>

    <!-- LOGIN -->
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Contraseña">
      <button type="button" id="btnLogin">Iniciar Sesión</button>
      <p id="mensajeLogin"></p>
      <a href="#" id="showRegister">¿No tienes cuenta? Regístrate</a>
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="hidden">
      <input type="email" id="registerEmail" placeholder="Email">
      <input type="password" id="registerPassword" placeholder="Contraseña">
      <button type="button" id="btnRegister">Registrarse</button>
      <p id="mensajeRegister"></p>
      <a href="#" id="showLogin">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>

  <!-- Firebase CDN -->
  <script type="module">
    // Importar Firebase desde CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCIo7CBX5jzAGlDFBu0mMb6BFfUsecaf7I",
      authDomain: "discovery-pets.firebaseapp.com",
      projectId: "discovery-pets",
      storageBucket: "discovery-pets.firebasestorage.app",
      messagingSenderId: "481355972999",
      appId: "1:481355972999:web:a073cc5af230b32f4c5322",
      measurementId: "G-W5RGYVTW3V"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Formularios
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const mensajeLogin = document.getElementById("mensajeLogin");
    const mensajeRegister = document.getElementById("mensajeRegister");

    // Alternar login / registro
    document.getElementById("showRegister").addEventListener("click", () => {
      loginForm.classList.add("hidden");
      registerForm.classList.remove("hidden");
    });
    document.getElementById("showLogin").addEventListener("click", () => {
      registerForm.classList.add("hidden");
      loginForm.classList.remove("hidden");
    });

    // Registro
    document.getElementById("btnRegister").addEventListener("click", async () => {
      const email = document.getElementById("registerEmail").value;
      const password = document.getElementById("registerPassword").value;
      mensajeRegister.textContent = "";
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        mensajeRegister.textContent = "✅ Registro exitoso. Ahora inicia sesión.";
        mensajeRegister.style.color = "#27ae60";
        registerForm.classList.add("hidden");
        loginForm.classList.remove("hidden");
      } catch (error) {
        mensajeRegister.textContent = "❌ Error: " + error.message;
        mensajeRegister.style.color = "#e74c3c";
      }
    });

    // Login
    document.getElementById("btnLogin").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      mensajeLogin.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, email, password);
        mensajeLogin.textContent = "🎉 Sesión iniciada correctamente.";
        mensajeLogin.style.color = "#27ae60";
        setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
      } catch (error) {
        mensajeLogin.textContent = "❌ Error: " + error.message;
        mensajeLogin.style.color = "#e74c3c";
      }
    });
  </script>
</body>
</html>
