<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐶 Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-box">
      <h1>🐶 Discovery Pets</h1>
      <p>Bienvenido al sistema de gestión 🐾</p>

      <!-- Login -->
      <div id="login-form">
        <input type="email" id="login-email" placeholder="Correo electrónico">
        <input type="password" id="login-password" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
        <p>¿No tienes cuenta? 
          <span class="link" onclick="toggleForms('register')">Crear una Cuenta</span>
        </p>
        <div id="login-error" class="error"></div>
      </div>

      <!-- Registro -->
      <div id="register-form" style="display:none;">
        <input type="email" id="reg-email" placeholder="Correo electrónico">
        <input type="password" id="reg-password" placeholder="Contraseña">
        <button onclick="register()">Registrar</button>
        <p>¿Ya tienes cuenta? 
          <span class="link" onclick="toggleForms('login')">Entrar</span>
        </p>
        <div id="register-error" class="error"></div>
        <div id="register-success" class="success"></div>
      </div>
    </div>
  </div>

  <script src="firebase.js"></script>
  <script src="script.js"></script>
</body>
</html>
