<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🐾 Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo">
      <div class="emoji">🐾</div>
      <h1>Discovery Pets</h1>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="auth-form">
      <h2>Iniciar sesión</h2>
      <input id="loginEmail" type="email" placeholder="Correo electrónico" required>
      <input id="loginPassword" type="password" placeholder="Contraseña" required>
      <button id="btnLogin" type="button" class="btn btn-primary">Iniciar sesión</button>
      <p id="mensajeLogin" class="msg"></p>
      <p class="muted">¿No tienes cuenta? <a id="showRegister" href="#">Regístrate</a></p>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="auth-form d-none">
      <h2>Crear cuenta</h2>
      <input id="registerEmail" type="email" placeholder="Correo electrónico" required>
      <input id="registerPassword" type="password" placeholder="Contraseña (min 6)" required>
      <button id="btnRegister" type="button" class="btn btn-secondary">Registrarse</button>
      <p id="mensajeRegister" class="msg"></p>
      <p class="muted">¿Ya tienes cuenta? <a id="showLogin" href="#">Inicia sesión</a></p>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
