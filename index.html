<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets | Login</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width: 350px;">
  <div id="loginDiv">
    <h3 class="text-center mb-3">Inicia sesión</h3>
    <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Correo electrónico">
    <input type="password" id="loginPass" class="form-control mb-2" placeholder="Contraseña">
    <button id="loginBtn" class="btn btn-primary btn-block mb-2">Iniciar sesión</button>
    <p class="text-center">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
  </div>

  <div id="registerDiv" style="display:none;">
    <h3 class="text-center mb-3">Regístrate</h3>
    <input type="text" id="regName" class="form-control mb-2" placeholder="Nombre completo">
    <input type="email" id="regEmail" class="form-control mb-2" placeholder="Correo electrónico">
    <input type="password" id="regPass" class="form-control mb-2" placeholder="Contraseña">
    <button id="registerBtn" class="btn btn-success btn-block mb-2">Registrarse</button>
    <p class="text-center">¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
  </div>
</div>

<script src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
