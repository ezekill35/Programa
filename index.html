<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets 🐾</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <!-- Login -->
  <div id="containerLogin" class="card shadow p-4 login-card" style="display:block;">
    <div class="text-center mb-4">
      <h2 class="text-primary">🐾 Discovery Pets</h2>
      <p>Inicia sesión</p>
    </div>
    <form id="loginForm" class="d-flex flex-column gap-3">
      <input type="email" id="loginEmail" class="form-control" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" class="form-control" placeholder="Contraseña" required>
      <button type="submit" class="btn btn-primary btn-login">Ingresar</button>
    </form>
    <p class="text-center mt-3">
      ¿No tienes cuenta? <a href="#" id="goRegister">Regístrate</a>
    </p>
    <p id="msgLogin" class="text-danger text-center"></p>
  </div>

  <!-- Registro -->
  <div id="containerRegister" class="card shadow p-4 login-card" style="display:none;">
    <div class="text-center mb-4">
      <h2 class="text-success">🐾 Discovery Pets</h2>
      <p>Regístrate</p>
    </div>
    <form id="registerForm" class="d-flex flex-column gap-3">
      <input type="text" id="registerName" class="form-control" placeholder="Nombre completo" required>
      <input type="email" id="registerEmail" class="form-control" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" class="form-control" placeholder="Contraseña" required>
      <button type="submit" class="btn btn-success btn-login">Registrarse</button>
    </form>
    <p class="text-center mt-3">
      ¿Ya tienes cuenta? <a href="#" id="goLogin">Inicia sesión</a>
    </p>
    <p id="msgRegister" class="text-danger text-center"></p>
  </div>

  <!-- Firebase CDN compat -->
  <script src="https://www.gstatic.com/firebasejs/10.2.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.2.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.2.0/firebase-firestore-compat.js"></script>

  <script src="firebase.js"></script>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
