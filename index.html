<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body { 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  min-height:100vh; 
  background: linear-gradient(135deg, #ffe0f0, #ffb3d9); 
  font-family: 'Poppins', sans-serif; 
  margin:0;
}
.container { 
  background:#fff; 
  padding:40px 30px; 
  border-radius:20px; 
  width:360px; 
  box-shadow:0 20px 40px rgba(0,0,0,0.2); 
  text-align:center; 
  animation:fadeIn 0.8s ease;
}
@keyframes fadeIn { from {opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);} }

.container img { 
  width:120px; 
  margin-bottom:20px; 
  border-radius:50%;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.container h1 { 
  color:#ff3399; 
  margin-bottom:25px; 
  font-size:26px;
}

.container input { 
  width:100%; 
  padding:12px; 
  margin:10px 0; 
  border-radius:10px; 
  border:1px solid #ccc; 
  transition:0.3s;
}
.container input:focus { 
  border-color:#ff3399; 
  box-shadow:0 0 10px rgba(255,51,153,0.3);
}

.container button { 
  width:100%; 
  padding:14px; 
  background:#ff3399; 
  color:#fff; 
  border:none; 
  border-radius:10px; 
  cursor:pointer; 
  font-weight:600; 
  font-size:16px;
  transition:0.3s;
}
.container button:hover { 
  background:#ff66cc; 
  transform:scale(1.03);
}

#mensaje { 
  margin-top:15px; 
  font-size:14px; 
  color:red;
  min-height:20px;
}
</style>
</head>
<body>
<div class="container">
    <img src="https://static.wixstatic.com/media/ba54dd_7c82d35c6b0142b48d51bf0641564791~mv2.png/v1/fit/w_2500,h_1330,al_c/ba54dd_7c82d35c6b0142b48d51bf0641564791~mv2.png" alt="Logo Discovery Pets">
    <h1>Discovery Pets</h1>

    <input id="emailLogin" type="email" placeholder="Correo" required>
    <input id="passLogin" type="password" placeholder="Contraseña" required>
    <button id="btnLogin">Iniciar sesión</button>
    <p id="mensaje"></p>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
