<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Login</title>
<link rel="icon" href="https://www.discovery-pets.com/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background: linear-gradient(135deg, #ffb3cc, #66ccff);
    font-family: 'Poppins', sans-serif;
    perspective: 1000px;
}
.container {
    background: #fff;
    padding: 40px 30px;
    border-radius: 20px;
    width: 360px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    transform: rotateY(10deg);
    animation: entry 0.8s ease forwards;
}
@keyframes entry {
    0% { opacity:0; transform: rotateY(45deg) translateY(-50px); }
    100% { opacity:1; transform: rotateY(0deg) translateY(0); }
}
h1 {
    text-align:center;
    color:#ff3399;
    margin-bottom:25px;
}
input {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ccc;
    transition:0.3s;
}
input:focus {
    border-color:#ff3399;
    box-shadow: 0 0 8px rgba(255,51,153,0.4);
    outline:none;
}
button {
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#ff3399;
    color:#fff;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}
button:hover {
    background:#ff66cc;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255,51,153,0.4);
}
.switch {
    margin-top:12px;
    text-align:center;
    cursor:pointer;
    color:#666;
    font-size:14px;
}
#mensaje {
    margin-top:12px;
    text-align:center;
    font-weight:500;
}
</style>
</head>
<body>
<div class="container">
    <h1>🐾 Discovery Pets</h1>

    <div id="formLogin">
        <input id="emailLogin" type="email" placeholder="Correo" required>
        <input id="passLogin" type="password" placeholder="Contraseña" required>
        <button id="btnLogin">Iniciar sesión</button>
        <p class="switch" id="toRegister">¿No tienes cuenta? Regístrate</p>
    </div>

    <div id="formRegister" style="display:none">
        <input id="emailReg" type="email" placeholder="Correo" required>
        <input id="passReg" type="password" placeholder="Contraseña" required>
        <button id="btnRegister">Registrarse</button>
        <p class="switch" id="toLogin">¿Ya tienes cuenta? Inicia sesión</p>
    </div>

    <p id="mensaje"></p>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
