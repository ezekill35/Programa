<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐶 Discovery Pets - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="card shadow-lg p-4 rounded-4">
      <div class="text-center mb-3">
        <h1>🐶 Discovery Pets</h1>
        <p>Bienvenido al sistema de gestión 🐾</p>
      </div>
      <div>
        <input type="email" id="login-email" placeholder="Correo electrónico" class="form-control mb-2">
        <div class="password-container mb-2">
          <input type="password" id="login-password" placeholder="Contraseña" class="form-control">
        </div>
        <p class="text-danger" id="login-error"></p>
        <button class="btn btn-primary w-100 mb-2" onclick="login()">Entrar</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>

  <script src="firebase.js"></script>
  <script src="script.js"></script>
</body>
</html>
