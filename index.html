<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <div class="login-container">
    <h1 class="login-title">🐾 Discovery Pets</h1>

    <!-- Login -->
    <form id="loginForm" class="form active">
      <h2>Iniciar Sesión</h2>
      <input type="email" id="loginEmail" placeholder="Correo electrónico">
      <input type="password" id="loginPassword" placeholder="Contraseña">
      <button type="button" id="btnLogin">Ingresar</button>
      <p id="mensajeLogin" class="msg"></p>
      <p>¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
    </form>

    <!-- Registro -->
    <form id="registerForm" class="form">
      <h2>Crear Cuenta</h2>
      <input type="email" id="registerEmail" placeholder="Correo electrónico">
      <input type="password" id="registerPassword" placeholder="Contraseña">
      <button type="button" id="btnRegister">Registrarse</button>
      <p id="mensajeRegister" class="msg"></p>
      <p>¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
