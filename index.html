<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐾 Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Fondo degradado animado */
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffb6d9, #ffe6f7, #ffd6eb);
      background-size: 300% 300%;
      animation: gradientMove 10s ease infinite;
      font-family: 'Poppins', sans-serif;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Tarjeta principal */
    .login-container {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      padding: 40px 50px;
      text-align: center;
      width: 380px;
      transition: all 0.3s ease;
    }

    .login-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(255, 51, 153, 0.3);
    }

    h1 {
      font-size: 2em;
      color: #ff3399;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 30px;
      font-size: 0.95em;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ffcce0;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    input:focus {
      border-color: #ff66b2;
      box-shadow: 0 0 6px rgba(255, 102, 178, 0.4);
      outline: none;
    }

    button {
      background: linear-gradient(135deg, #ff3399, #ff66cc);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(255, 51, 153, 0.4);
    }

    a {
      color: #ff3399;
      text-decoration: none;
      font-size: 0.9em;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #e60073;
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    #mensajeLogin,
    #mensajeRegister {
      min-height: 18px;
      font-size: 0.85em;
      font-weight: 600;
    }

    /* Animaciones de entrada */
    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-container fade-in">
    <h1>🐾 Discovery Pets</h1>
    <p class="subtitle">Bienvenido al sistema de gestión</p>

    <!-- LOGIN -->
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required />
      <input type="password" id="loginPassword" placeholder="Contraseña" required />
      <button type="button" id="btnLogin">Iniciar sesión</button>
      <p id="mensajeLogin"></p>
      <a href="#" id="showRegister">¿No tienes cuenta? Regístrate</a>
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="hidden">
      <input type="email" id="registerEmail" placeholder="Correo electrónico" required />
      <input type="password" id="registerPassword" placeholder="Contraseña (min 6)" required />
      <button type="button" id="btnRegister">Registrarse</button>
      <p id="mensajeRegister"></p>
      <a href="#" id="showLogin">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>

  <!-- Scripts -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
