<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Login</title>
<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="min-height:100vh; background: linear-gradient(145deg, #ff6fcf, #ff87d6); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display:flex; justify-content:center; align-items:center;">

<div style="width:350px; background:white; padding:30px; border-radius:15px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); text-align:center;">

    <h1 style="color:#b60fa0; margin-bottom:20px;">🐾 Discovery Pets</h1>

    <!-- LOGIN FORM -->
    <form id="form-login">
        <input id="emailLogin" class="form-control mb-2" type="email" placeholder="Correo electrónico" required>
        <input id="passLogin" class="form-control mb-2" type="password" placeholder="Contraseña" required>
        <button id="btnLogin" class="btn btn-primary w-100 mb-2">Iniciar sesión</button>
        <span id="showRegister" style="cursor:pointer; color:#b60fa0;">¿No tienes cuenta? Regístrate</span>
    </form>

    <!-- REGISTER FORM -->
    <form id="form-register" style="display:none;">
        <input id="emailReg" class="form-control mb-2" type="email" placeholder="Correo electrónico" required>
        <input id="passReg" class="form-control mb-2" type="password" placeholder="Contraseña" required>
        <button id="btnRegister" class="btn btn-success w-100 mb-2">Registrarse</button>
        <span id="showLogin" style="cursor:pointer; color:#b60fa0;">¿Ya tienes cuenta? Inicia sesión</span>
    </form>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
