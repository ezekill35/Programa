<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets | Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

<div class="container py-5">
  <div id="loginDiv" class="card mx-auto p-4 shadow" style="max-width: 400px;">
    <h3 class="mb-3 text-center">Inicia sesión</h3>
    <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Correo electrónico">
    <input type="password" id="loginPass" class="form-control mb-2" placeholder="Contraseña">
    <button id="btnLogin" class="btn btn-primary w-100 mb-2">Ingresar</button>
    <p class="text-center">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
  </div>

  <div id="registerDiv" class="card mx-auto p-4 shadow" style="max-width: 400px; display:none;">
    <h3 class="mb-3 text-center">Regístrate</h3>
    <input type="text" id="registerName" class="form-control mb-2" placeholder="Nombre completo">
    <input type="email" id="registerEmail" class="form-control mb-2" placeholder="Correo electrónico">
    <input type="password" id="registerPass" class="form-control mb-2" placeholder="Contraseña">
    <button id="btnRegister" class="btn btn-success w-100 mb-2">Registrar</button>
    <p class="text-center">¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-firestore.js"></script>
<script src="script.js"></script>
</body>
</html>
