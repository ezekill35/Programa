<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discovery Pets · Acceso</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body, html { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#f5f8fa; }
  .login-wrapper { width:90%; max-width:1000px; background:#fff; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,0.09); display:flex; min-height:520px; overflow:hidden; }
  .login-form { flex:1; padding:48px; display:flex; flex-direction:column; justify-content:center; gap:12px; }
  .logo { font-size:36px; font-weight:800; color:#10bcd4; text-align:center; margin-bottom:8px; }
  h2 { font-size:26px; color:#111827; text-align:center; margin-bottom:6px; }
  .subtitle { color:#6b7280; font-size:14px; text-align:center; margin-bottom:22px; }
  .input-group { position:relative; width:100%; }
  input { width:100%; padding:14px 16px; border:1px solid #e6e9ee; border-radius:12px; font-size:15px; background:#fafafa; transition:border-color .15s, box-shadow .15s; }
  input:focus { outline:none; border-color:#10bcd4; box-shadow:0 0 0 6px rgba(16,188,212,0.08); background:#fff; }
  .toggle-password { position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:16px; color:#6b7280; }
  .toggle-password:hover { color:#10bcd4; }
  .actions { display:flex; align-items:center; justify-content:space-between; font-size:13px; color:#6b7280; margin:6px 0 12px; }
  .btn-login { padding:14px; border:none; border-radius:12px; background:linear-gradient(90deg,#10bcd4,#38bdf8); color:white; font-size:15px; font-weight:600; cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .btn-login:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(16,188,212,0.18); }
  .helper { margin-top:14px; font-size:13px; color:#6b7280; text-align:center; }
  .login-image { flex:1; position:relative; background:url('https://images.pexels.com/photos/416160/pexels-photo-416160.jpeg') center/cover no-repeat; }
  .login-image::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.05) 100%); }
  .login-image .text-overlay { position:absolute; bottom:36px; left:36px; color:white; font-size:24px; font-weight:700; line-height:1.2; z-index:2; max-width:420px; text-shadow:0 6px 18px rgba(0,0,0,0.25); }
  @media (max-width:840px){ .login-wrapper { flex-direction:column; max-width:720px; } .login-image { height:220px; } .login-form { padding:28px; } }
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-form" role="main" aria-labelledby="login-title">
    <div class="logo">🐾 DP</div>
    <h2 id="login-title">Bienvenido a Discovery Pets</h2>
    <div class="subtitle">Accede al panel administrativo</div>
    <input id="email" type="email" placeholder="Correo electrónico" autocomplete="username" required>
    <div class="input-group">
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <span id="togglePassword" class="toggle-password">👁️</span>
    </div>
    <div class="actions">
      <label style="display:flex;align-items:center;gap:8px;">
        <input id="keepLogged" type="checkbox"> Mantener sesión
      </label>
    </div>
    <button id="btnLogin" class="btn-login">Iniciar sesión</button>
    <p class="helper">Si no tienes acceso, contacta al administrador del sistema.</p>
  </div>
  <div class="login-image" role="presentation">
    <div class="text-overlay"></div>
  </div>
</div>

<script type="module">
  import { auth } from "./firebase.js";
  import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const btnLogin = document.getElementById("btnLogin");
  const togglePassword = document.getElementById("togglePassword");
  const passwordInput = document.getElementById("password");

  // Mostrar / ocultar contraseña
  togglePassword.addEventListener("click", () => {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
    togglePassword.textContent = isHidden ? "🙈" : "👁️";
  });

  // Redirección si ya está logueado
  onAuthStateChanged(auth, (user) => {
    if(user) window.location.href = "dashboard.html";
  });

  btnLogin.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value.trim();
    const keepLogged = document.getElementById("keepLogged").checked;
    if (!email || !password) return alert("Por favor completa correo y contraseña.");
    try {
      await signInWithEmailAndPassword(auth, email, password);
      if(keepLogged) localStorage.setItem("keepLogged","true");
      else localStorage.removeItem("keepLogged");
      window.location.href = "dashboard.html";
    } catch(err) { alert("Error al iniciar sesión: " + err.message); }
  });
</script>
</body>
</html>
