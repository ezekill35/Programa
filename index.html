<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #ffccf2, #ffe6f5);
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-container {
      background: #fff0f7;
      padding: 35px 45px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 360px;
      position: relative;
    }
    h1 { color: #ff1a75; margin-bottom: 5px; font-size: 1.9em; }
    .subtitle { color: #555; margin-bottom: 25px; font-size: 1em; }
    form { display: flex; flex-direction: column; gap: 14px; }
    input {
      padding: 12px; border-radius: 10px; border: 1px solid #ff99cc;
      font-size: 14px; transition: 0.3s;
    }
    input:focus { border-color: #ff3399; outline: none; }
    button {
      padding: 12px; background: #ff3399; color: #fff; border: none;
      border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px;
    }
    button:hover { background: #e60073; transform: translateY(-2px); }
    .hidden { display: none; }
    #mensajeLogin, #mensajeRegister { font-size: 0.85em; min-height: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🐾 Discovery Pets</h1>
    <p class="subtitle">Bienvenido al sistema de gestión</p>

    <!-- LOGIN -->
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button type="button" id="btnLogin">Iniciar Sesión</button>
      <p id="mensajeLogin"></p>
      <a href="#" id="showRegister">¿No tienes cuenta? Regístrate</a>
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="hidden">
      <input type="email" id="registerEmail" placeholder="Email" required>
      <input type="password" id="registerPassword" placeholder="Contraseña" required>
      <button type="button" id="btnRegister">Registrarse</button>
      <p id="mensajeRegister"></p>
      <a href="#" id="showLogin">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
