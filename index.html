<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discovery Pets - Ingreso</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-box" id="loginBox">
      <h1>Discovery Pets</h1>
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required />
      <input type="password" id="loginPassword" placeholder="Contraseña" required />
      <button id="loginBtn">Iniciar Sesión</button>
      <span class="switch-link" id="showRegister">¿No tienes cuenta? Regístrate</span>
    </div>

    <div class="login-box" id="registerBox" style="display:none;">
      <h1>Registro</h1>
      <input type="email" id="registerEmail" placeholder="Correo electrónico" required />
      <input type="password" id="registerPassword" placeholder="Contraseña" required />
      <button id="registerBtn">Registrarse</button>
      <span class="switch-link" id="showLogin">¿Ya tienes cuenta? Inicia sesión</span>
    </div>
  </div>
</body>
</html>
