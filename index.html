<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets 🐾</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow p-4 login-card">
    <div class="text-center mb-4">
      <h2 class="text-primary">🐾 Discovery Pets</h2>
      <p id="formTitle">Inicia sesión</p>
    </div>

    <!-- Login -->
    <form id="loginForm" class="d-flex flex-column gap-3">
      <input type="email" id="loginEmail" class="form-control" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" class="form-control" placeholder="Contraseña" required>
      <button type="submit" class="btn btn-primary btn-login">Ingresar</button>
      <p class="text-center mt-2">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
      <p id="msgLogin" class="text-danger text-center"></p>
    </form>

    <!-- Registro -->
    <form id="registerForm" class="d-flex flex-column gap-3" style="display: none;">
      <input type="text" id="registerName" class="form-control" placeholder="Nombre completo" required>
      <input type="email" id="registerEmail" class="form-control" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" class="form-control" placeholder="Contraseña" required>
      <button type="submit" class="btn btn-success btn-login">Registrarse</button>
      <p class="text-center mt-2">¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
      <p id="msgRegister" class="text-danger text-center"></p>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
