<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Login</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

<div class="login-container">
    <form id="loginForm">
        <h2>Iniciar Sesión</h2>
        <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
        <input type="password" id="loginPassword" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
        <p>¿No tienes cuenta? <span id="showRegister">Regístrate</span></p>
    </form>

    <form id="registerForm" class="hidden">
        <h2>Registro</h2>
        <input type="text" id="regNombre" placeholder="Nombre completo" required>
        <input type="email" id="regEmail" placeholder="Correo electrónico" required>
        <input type="password" id="regPassword" placeholder="Contraseña" required>
        <button type="submit">Registrar</button>
        <p>¿Ya tienes cuenta? <span id="showLogin">Inicia sesión</span></p>
    </form>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
