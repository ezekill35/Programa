<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Login</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="login-body">

  <div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card login-card p-4 shadow-lg">
      
      <!-- LOGIN -->
      <div id="login-form">
        <h1 class="text-center text-warning">🐶 Discovery Pets</h1>
        <p class="text-center text-secondary mb-4">Bienvenido al sistema de gestión 🐾</p>

        <div class="mb-3">
          <input type="text" class="form-control" id="login-username" placeholder="Correo electrónico">
        </div>

        <div class="mb-3 position-relative">
          <input type="password" class="form-control" id="login-password" placeholder="Contraseña">
          <i class="fas fa-eye-slash toggle-password position-absolute top-50 end-0 translate-middle-y pe-3" 
             onclick="togglePasswordVisibility('login-password', this)" style="cursor:pointer;"></i>
        </div>

        <p class="text-danger" id="login-error"></p>

        <button class="btn btn-warning w-100 mb-2" onclick="login()">Entrar</button>
        <button class="btn btn-outline-secondary w-100" onclick="showRegister()">Crear una Cuenta</button>
      </div>

      <!-- REGISTRO -->
      <div id="register-form" style="display:none;">
        <h1 class="text-center text-warning">🐶 Discovery Pets</h1>
        <p class="text-center text-secondary mb-4">Registro de usuario</p>

        <div class="mb-3">
          <input type="text" class="form-control" id="reg-username" placeholder="Correo electrónico">
        </div>

        <div class="mb-3 position-relative">
          <input type="password" class="form-control" id="reg-password" placeholder="Contraseña">
          <i class="fas fa-eye-slash toggle-password position-absolute top-50 end-0 translate-middle-y pe-3" 
             onclick="togglePasswordVisibility('reg-password', this)" style="cursor:pointer;"></i>
        </div>

        <p class="text-danger" id="register-error"></p>
        <p class="text-success" id="register-success"></p>

        <button class="btn btn-warning w-100 mb-2" onclick="register()">Registrar</button>
        <button class="btn btn-outline-secondary w-100" onclick="showLogin()">Volver al Login</button>
      </div>

    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>

  <!-- Scripts propios -->
  <script src="firebase.js"></script>
  <script src="script.js"></script>

</body>
</html>
