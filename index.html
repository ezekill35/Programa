<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-bg d-flex justify-content-center align-items-center vh-100">
  <div class="login-card shadow-lg p-4 rounded-4 text-center">
    <h1 class="mb-3">🐾 Discovery Pets</h1>
    <p class="text-muted mb-4">Sistema de gestión de veterinaria</p>

    <!-- LOGIN -->
    <form id="loginForm" class="fade-in">
      <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Contraseña" required>
      <button type="button" id="btnLogin" class="btn btn-pink w-100">Iniciar Sesión</button>
      <p id="mensajeLogin" class="mt-2"></p>
      <a href="#" id="showRegister" class="text-pink d-block mt-3">¿No tienes cuenta? Regístrate</a>
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="fade-in d-none">
      <input type="email" id="registerEmail" class="form-control mb-3" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" class="form-control mb-3" placeholder="Contraseña" required>
      <button type="button" id="btnRegister" class="btn btn-purple w-100">Registrarse</button>
      <p id="mensajeRegister" class="mt-2"></p>
      <a href="#" id="showLogin" class="text-pink d-block mt-3">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
