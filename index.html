<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 🔹 Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffccf2, #ffe6f5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: #fff0f7;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 340px;
      position: relative;
      overflow: hidden;
    }

    /* Patitas decorativas */
    .login-container::before {
      content: "🐾🐾";
      font-size: 3em;
      position: absolute;
      top: -20px;
      right: -20px;
      opacity: 0.2;
    }

    .login-container::after {
      content: "🐾🐾";
      font-size: 3em;
      position: absolute;
      bottom: -20px;
      left: -20px;
      opacity: 0.2;
    }

    .login-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 15px;
      object-fit: cover;
      border: 3px solid #ff3399;
      transition: transform 0.3s;
    }

    .login-img:hover {
      transform: scale(1.1);
    }

    h1 {
      color: #ff1a75;
      margin-bottom: 5px;
      font-size: 1.8em;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 20px;
      font-size: 0.95em;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      padding: 8px 10px;    /* 🔹 más compacto */
      border-radius: 8px;
      border: 1px solid #ff99cc;
      font-size: 13px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #ff3399;
      outline: none;
      box-shadow: 0 0 5px rgba(255,51,153,0.5);
    }

    button {
      padding: 10px;
      background: #ff3399;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    button:hover {
      background: #e60073;
      transform: translateY(-2px);
    }

    p, a {
      font-size: 0.85em;
      color: #333;
      margin-top: 5px;
    }

    a {
      color: #ff3399;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    #mensajeLogin, #mensajeRegister {
      font-size: 0.8em;
      min-height: 18px;
      color: #e60073;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-container">
    
    <h1>🐾 Discovery Pets</h1>
    <p class="subtitle">Bienvenido al sistema de gestión</p>

    <!-- LOGIN -->
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button type="button" id="btnLogin">Iniciar Sesión</button>
      <p id="mensajeLogin"></p>
      <a href="#" id="showRegister">¿No tienes cuenta? Regístrate</a>
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="hidden">
      <input type="email" id="registerEmail" placeholder="Email" required>
      <input type="password" id="registerPassword" placeholder="Contraseña" required>
      <button type="button" id="btnRegister">Registrarse</button>
      <p id="mensajeRegister"></p>
      <a href="#" id="showLogin">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
