<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Pets - Login</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Bootstrap v4.6 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="login-body">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">

            <!-- Card Login -->
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">🐾 Discovery Pets</h2>

                    <!-- Login Form -->
                    <form id="loginForm" class="form-group">
                        <h4>Iniciar Sesión</h4>
                        <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Correo electrónico" required>
                        <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Contraseña" required>
                        <button type="submit" class="btn btn-primary btn-block mb-2">Ingresar</button>
                        <p class="text-center">¿No tienes cuenta? <span id="showRegister" class="text-primary" style="cursor:pointer;">Regístrate</span></p>
                    </form>

                    <!-- Register Form -->
                    <form id="registerForm" class="form-group" style="display:none;">
                        <h4>Registro</h4>
                        <input type="text" id="regNombre" class="form-control mb-2" placeholder="Nombre completo" required>
                        <input type="email" id="regEmail" class="form-control mb-2" placeholder="Correo electrónico" required>
                        <input type="password" id="regPassword" class="form-control mb-2" placeholder="Contraseña" required>
                        <button type="submit" class="btn btn-success btn-block mb-2">Registrar</button>
                        <p class="text-center">¿Ya tienes cuenta? <span id="showLogin" class="text-primary" style="cursor:pointer;">Inicia sesión</span></p>
                    </form>

                </div>
            </div>

        </div>
    </div>

    <!-- Firebase SDK v7.20.0 -->
    <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-firestore.js"></script>

    <!-- Firebase config -->
    <script src="firebase.js"></script>

    <!-- Script -->
    <script src="script.js"></script>

    <script>
        // Toggle between Login and Register
        const showRegister = document.getElementById("showRegister");
        const showLogin = document.getElementById("showLogin");
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");

        showRegister.addEventListener("click", () => {
            loginForm.style.display = "none";
            registerForm.style.display = "block";
        });

        showLogin.addEventListener("click", () => {
            registerForm.style.display = "none";
            loginForm.style.display = "block";
        });
    </script>
</body>
</html>
