<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐶 Discovery Pets - Login</title>
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome para íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="login-card shadow-lg p-5 rounded-4">
      <div class="text-center mb-4">
        <h1 class="text-warning">🐶 Discovery Pets</h1>
        <p class="text-secondary">Bienvenido al sistema de gestión 🐾</p>
      </div>

      <form id="login-form" onsubmit="event.preventDefault(); login();">
        <div class="mb-3">
          <label for="login-username" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="login-username" placeholder="usuario@correo.com" required>
        </div>

        <div class="mb-3 position-relative">
          <label for="login-password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="login-password" placeholder="Contraseña" required>
          <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
        </div>

        <p class="error-message text-danger" id="login-error"></p>
        
        <button type="submit" class="btn btn-warning w-100 mb-3">Entrar</button>
        
        <div class="text-center">
          <small class="text-muted">¿No tienes cuenta? Contacta al administrador</small>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>

  <!-- Scripts propios -->
  <script src="firebase.js"></script>
  <script src="script.js"></script>

</body>
</html>
