<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🐶 Discovery Pets</h1>
    <p class="subtitle">Bienvenido al sistema de gestión 🐾</p>

    <!-- Formulario Login -->
    <form id="loginForm" class="card">
      <h2>Iniciar Sesión</h2>
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button type="submit">Entrar</button>
      <p class="switch">¿No tienes cuenta? <a href="#" id="showRegister">Crear una Cuenta</a></p>
    </form>

    <!-- Formulario Registro -->
    <form id="registerForm" class="card hidden">
      <h2>Registro</h2>
      <input type="email" id="registerEmail" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" placeholder="Contraseña" required>
      <button type="submit">Registrar</button>
      <p class="switch">¿Ya tienes cuenta? <a href="#" id="showLogin">Entrar</a></p>
    </form>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
