<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets | Login</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="login-body">
  <div class="container mt-5">

    <!-- LOGIN -->
    <div id="loginDiv" class="card p-4 mx-auto" style="max-width: 400px;">
      <h3 class="text-center mb-3">Inicia sesión</h3>
      <form id="loginForm">
        <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Correo electrónico" required>
        <input type="password" id="loginPass" class="form-control mb-2" placeholder="Contraseña" required>
        <button type="submit" class="btn btn-success btn-block">Iniciar sesión</button>
      </form>
      <p class="mt-2 text-center">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
    </div>

    <!-- REGISTRO -->
    <div id="registerDiv" class="card p-4 mx-auto" style="max-width: 400px; display:none;">
      <h3 class="text-center mb-3">Regístrate</h3>
      <form id="registerForm">
        <input type="text" id="regName" class="form-control mb-2" placeholder="Nombre completo" required>
        <input type="email" id="regEmail" class="form-control mb-2" placeholder="Correo electrónico" required>
        <input type="password" id="regPass" class="form-control mb-2" placeholder="Contraseña" required>
        <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
      </form>
      <p class="mt-2 text-center">¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
    </div>

  </div>

  <!-- Firebase 7.20.0 -->
  <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-firestore.js"></script>
  <script src="firebase.js"></script>
  <script src="script.js"></script>
</body>
</html>
