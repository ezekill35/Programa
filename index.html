<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Discovery Pets</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div id="auth-section">
    <div class="auth-container">
      <!-- LOGIN -->
      <div id="login-form">
        <h2>Iniciar Sesión 🐾</h2>
        <input type="text" id="login-username" placeholder="Correo">
        <div class="password-container">
          <input type="password" id="login-password" placeholder="Contraseña">
          <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
        </div>
        <p class="error-message" id="login-error"></p>
        <button class="primary-btn" onclick="login()">Entrar</button>
        <button class="secondary-btn" onclick="toggleAuthForm()">Crear una Cuenta</button>
      </div>

      <!-- REGISTRO -->
      <div id="register-form" style="display:none;">
        <h2>Crear Cuenta</h2>
        <input type="text" id="reg-username" placeholder="Correo">
        <div class="password-container">
          <input type="password" id="reg-password" placeholder="Contraseña">
          <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('reg-password', this)"></i>
        </div>
        <p class="error-message" id="register-error"></p>
        <p class="success-message" id="register-success"></p>
        <button class="primary-btn" onclick="register()">Registrar</button>
        <button class="secondary-btn" onclick="toggleAuthForm()">Ya tengo cuenta</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>

  <!-- Archivos propios -->
  <script src="firebase.js"></script>
  <script src="script.js"></script>
</body>
</html>
