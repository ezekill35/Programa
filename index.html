<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets | Login</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-container">

  <!-- LOGIN -->
  <div id="login-section" class="auth-section active">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button type="submit">Iniciar Sesión</button>
    </form>
    <p>¿No tienes cuenta? <span id="showRegister">Regístrate</span></p>
  </div>

  <!-- REGISTRO -->
  <div id="register-section" class="auth-section">
    <h2>Registro</h2>
    <form id="registerForm">
      <input type="text" id="registerName" placeholder="Nombre completo" required>
      <input type="email" id="registerEmail" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" placeholder="Contraseña" required>
      <button type="submit">Registrarse</button>
    </form>
    <p>¿Ya tienes cuenta? <span id="showLogin">Inicia sesión</span></p>
  </div>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
