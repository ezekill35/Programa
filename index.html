<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <div class="login-container shadow-lg p-5 rounded-4">
    <h1 class="fw-bold mb-2 text-pink text-center">🐾 Discovery Pets</h1>
    <p class="text-secondary text-center mb-4">Gestión integral de tu negocio</p>

    <!-- LOGIN -->
    <form id="loginForm" class="form-section">
      <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Contraseña" required>
      <button type="button" id="btnLogin" class="btn btn-pink w-100 mb-2">Iniciar Sesión</button>
      <p id="mensajeLogin" class="text-center small"></p>
      <p class="text-center"><a href="#" id="showRegister">¿No tienes cuenta? Regístrate</a></p>
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="form-section d-none">
      <input type="email" id="registerEmail" class="form-control mb-3" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" class="form-control mb-3" placeholder="Contraseña" required>
      <button type="button" id="btnRegister" class="btn btn-success w-100 mb-2">Registrarse</button>
      <p id="mensajeRegister" class="text-center small"></p>
      <p class="text-center"><a href="#" id="showLogin">¿Ya tienes cuenta? Inicia sesión</a></p>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
