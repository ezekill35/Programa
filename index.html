<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discovery Pets · Acceso</title>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/616/616408.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Inter', sans-serif; 
  }
  
  body, html { 
    width:100%; 
    height:100%; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    position: relative;
    overflow: hidden;
  }
  
  /* Elementos decorativos simples */
  .floating-element {
    position: absolute;
    font-size: 2rem;
    z-index: 0;
    opacity: 0.1;
    animation: floatElement 8s ease-in-out infinite;
  }
  
  .element-1 { top: 15%; left: 8%; animation-delay: 0s; }
  .element-2 { top: 25%; right: 10%; animation-delay: 2s; }
  .element-3 { bottom: 30%; left: 12%; animation-delay: 4s; }
  .element-4 { bottom: 15%; right: 8%; animation-delay: 6s; }
  
  @keyframes floatElement {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
  }
  
  .login-wrapper { 
    width:90%; 
    max-width:1000px; 
    background:#fff; 
    border-radius:20px; 
    box-shadow:0 15px 35px rgba(0,0,0,0.1); 
    display:flex; 
    min-height:520px; 
    overflow:hidden; 
    position: relative;
    z-index: 10;
  }
  
  .login-form { 
    flex:1; 
    padding:50px; 
    display:flex; 
    flex-direction:column; 
    justify-content:center; 
    gap:15px; 
  }
  
  .logo { 
    font-size:42px; 
    font-weight:800; 
    color:#10bcd4; 
    text-align:center; 
    margin-bottom:15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  
  h2 { 
    font-size:28px; 
    color:#111827; 
    text-align:center; 
    margin-bottom:8px; 
    font-weight: 700;
  }
  
  .subtitle { 
    color:#6b7280; 
    font-size:16px; 
    text-align:center; 
    margin-bottom:25px; 
    line-height: 1.5;
  }
  
  .input-group { 
    position:relative; 
    width:100%; 
    margin-bottom: 10px;
  }
  
  input { 
    width:100%; 
    padding:16px 18px; 
    border:2px solid #e6e9ee; 
    border-radius:14px; 
    font-size:15px; 
    background:#fafafa; 
    transition:all 0.3s ease; 
  }
  
  input:focus { 
    outline:none; 
    border-color:#10bcd4; 
    box-shadow:0 0 0 4px rgba(16, 188, 212, 0.1); 
    background:#fff; 
  }
  
  .toggle-password { 
    position:absolute; 
    right:18px; 
    top:50%; 
    transform:translateY(-50%); 
    cursor:pointer; 
    font-size:18px; 
    color:#6b7280; 
    transition: all 0.3s ease;
  }
  
  .toggle-password:hover { 
    color:#10bcd4; 
  }
  
  .actions { 
    display:flex; 
    align-items:center; 
    justify-content:space-between; 
    font-size:14px; 
    color:#6b7280; 
    margin:8px 0 20px; 
  }
  
  .checkbox-container {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  
  .checkbox-container input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #10bcd4;
  }
  
  .btn-login { 
    padding:16px; 
    border:none; 
    border-radius:14px; 
    background:linear-gradient(90deg, #10bcd4, #38bdf8); 
    color:white; 
    font-size:16px; 
    font-weight:600; 
    cursor:pointer; 
    transition:all 0.3s ease; 
  }
  
  .btn-login:hover { 
    transform:translateY(-2px); 
    box-shadow:0 8px 24px rgba(16, 188, 212, 0.18); 
  }
  
  .btn-login:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  
  .helper { 
    margin-top:20px; 
    font-size:14px; 
    color:#6b7280; 
    text-align:center; 
    line-height: 1.5;
  }
  
  .login-image { 
    flex:1; 
    position:relative; 
    background:url('https://images.pexels.com/photos/416160/pexels-photo-416160.jpeg') center/cover no-repeat; 
  }
  
  .login-image::after { 
    content:""; 
    position:absolute; 
    inset:0; 
    background:linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.05) 100%); 
  }
  
  .login-image .text-overlay { 
    position:absolute; 
    bottom:40px; 
    left:40px; 
    color:white; 
    font-size:26px; 
    font-weight:700; 
    line-height:1.3; 
    z-index:2; 
    max-width:400px; 
    text-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  
  /* Sistema de seguridad */
  .attempts-counter {
    text-align: center;
    font-size: 14px;
    color: #6b7280;
    margin: 8px 0;
    padding: 10px;
    background: rgba(255,255,255,0.7);
    border-radius: 10px;
    display: none;
  }
  
  .attempts-warning {
    color: #e74c3c;
    font-weight: 600;
  }
  
  /* Loading animation */
  .loading {
    display: none;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
    margin: 0 auto;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  /* Mensajes del sistema */
  .error-message {
    color: #e74c3c;
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
    display: none;
    padding: 12px;
    background: rgba(231, 76, 60, 0.1);
    border-radius: 10px;
    border-left: 4px solid #e74c3c;
  }
  
  .success-message {
    color: #2ecc71;
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
    display: none;
    padding: 12px;
    background: rgba(46, 204, 113, 0.1);
    border-radius: 10px;
    border-left: 4px solid #2ecc71;
  }
  
  .lockout-message {
    color: #e67e22;
    font-size: 14px;
    text-align: center;
    margin-top: 12px;
    display: none;
    padding: 15px;
    background: rgba(230, 126, 34, 0.1);
    border-radius: 10px;
    border-left: 4px solid #e67e22;
    line-height: 1.5;
  }
  
  .countdown {
    font-weight: 700;
    font-size: 16px;
    color: #e74c3c;
  }
  
  /* Responsive */
  @media (max-width: 900px){ 
    .login-wrapper { 
      flex-direction:column; 
      max-width:600px; 
      min-height: auto;
    } 
    
    .login-image { 
      height:200px; 
    } 
    
    .login-form { 
      padding:40px 30px; 
    } 
    
    .logo { 
      font-size:36px; 
    }
    
    h2 {
      font-size: 24px;
    }
    
    .floating-element {
      display: none;
    }
  }
  
  @media (max-width: 480px) {
    .login-form {
      padding: 30px 20px;
    }
    
    .logo {
      font-size: 32px;
    }
    
    h2 {
      font-size: 22px;
    }
    
    .subtitle {
      font-size: 14px;
    }
  }
</style>
</head>
<body>
  <!-- Elementos decorativos -->
  <div class="floating-element element-1">🐶</div>
  <div class="floating-element element-2">🐱</div>
  <div class="floating-element element-3">🐾</div>
  <div class="floating-element element-4">🐕</div>

  <div class="login-wrapper">
    <div class="login-form" role="main" aria-labelledby="login-title">
      <div class="logo">🐾 DP</div>
      <h2 id="login-title">Bienvenido a Discovery Pets</h2>
      <div class="subtitle">Accede al panel administrativo</div>
      
      <input id="email" type="email" placeholder="Correo electrónico" autocomplete="username" required>
      
      <div class="input-group">
        <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
        <span id="togglePassword" class="toggle-password">👁️</span>
      </div>
      
      <div id="attemptsCounter" class="attempts-counter"></div>
      
      <div class="actions">
        <label class="checkbox-container">
          <input id="keepLogged" type="checkbox"> 
          <span>Mantener sesión activa</span>
        </label>
      </div>
      
      <button id="btnLogin" class="btn-login">
        <span id="btnText">Iniciar sesión</span>
        <div id="btnLoading" class="loading"></div>
      </button>
      
      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>
      <div id="lockoutMessage" class="lockout-message"></div>
      
      <p class="helper">Si no tienes acceso, contacta al administrador del sistema.</p>
    </div>
    
    <div class="login-image" role="presentation">
      <div class="text-overlay">Tu tienda de confianza para mascotas</div>
    </div>
  </div>

<script type="module">
  // Configuración de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCIo7CBX5jzAGlDFBu0mMb6BFfUsecaf7I",
    authDomain: "discovery-pets.firebaseapp.com",
    databaseURL: "https://discovery-pets-default-rtdb.firebaseio.com",
    projectId: "discovery-pets",
    storageBucket: "discovery-pets.appspot.com",
    messagingSenderId: "481355972999",
    appId: "1:481355972999:web:5f5fa07f75b3fc9f4c5322"
  };

  // Importar Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Inicializar Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Elementos del DOM
  const btnLogin = document.getElementById("btnLogin");
  const togglePassword = document.getElementById("togglePassword");
  const passwordInput = document.getElementById("password");
  const btnText = document.getElementById("btnText");
  const btnLoading = document.getElementById("btnLoading");
  const errorMessage = document.getElementById("errorMessage");
  const successMessage = document.getElementById("successMessage");
  const lockoutMessage = document.getElementById("lockoutMessage");
  const attemptsCounter = document.getElementById("attemptsCounter");

  // Configuración de seguridad
  const MAX_ATTEMPTS = 4;
  const LOCKOUT_DURATION = 5 * 60 * 1000; // 5 minutos
  let failedAttempts = 0;
  let lockoutUntil = null;
  let isRedirecting = false;

  // Inicializar sistema de seguridad
  function initializeSecurity() {
    const savedAttempts = localStorage.getItem('failedAttempts');
    const savedLockout = localStorage.getItem('lockoutUntil');
    
    if (savedAttempts) {
      failedAttempts = parseInt(savedAttempts);
    }
    
    if (savedLockout) {
      lockoutUntil = parseInt(savedLockout);
      checkLockoutStatus();
    }
    
    updateAttemptsDisplay();
  }

  // Verificar estado de bloqueo
  function checkLockoutStatus() {
    if (lockoutUntil && Date.now() < lockoutUntil) {
      enableLockoutMode();
      startCountdown();
    } else if (lockoutUntil && Date.now() >= lockoutUntil) {
      resetSecurity();
    }
  }

  // Activar modo de bloqueo
  function enableLockoutMode() {
    btnLogin.disabled = true;
    document.getElementById('email').disabled = true;
    document.getElementById('password').disabled = true;
    hideMessage(errorMessage);
    hideMessage(successMessage);
    
    const remainingTime = Math.ceil((lockoutUntil - Date.now()) / 1000 / 60);
    showMessage(lockoutMessage, `🔒 Demasiados intentos fallidos. Por seguridad, tu cuenta ha sido bloqueada temporalmente. <br>Podrás intentar nuevamente en <span class="countdown">${remainingTime}</span> minutos.`);
  }

  // Iniciar cuenta regresiva
  function startCountdown() {
    const countdownElement = lockoutMessage.querySelector('.countdown');
    const countdownInterval = setInterval(() => {
      const remainingSeconds = Math.ceil((lockoutUntil - Date.now()) / 1000);
      
      if (remainingSeconds <= 0) {
        clearInterval(countdownInterval);
        resetSecurity();
        return;
      }
      
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      countdownElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }, 1000);
  }

  // Reiniciar medidas de seguridad
  function resetSecurity() {
    failedAttempts = 0;
    lockoutUntil = null;
    localStorage.removeItem('failedAttempts');
    localStorage.removeItem('lockoutUntil');
    
    btnLogin.disabled = false;
    document.getElementById('email').disabled = false;
    document.getElementById('password').disabled = false;
    
    hideMessage(lockoutMessage);
    updateAttemptsDisplay();
  }

  // Actualizar contador de intentos
  function updateAttemptsDisplay() {
    if (failedAttempts > 0) {
      const remainingAttempts = MAX_ATTEMPTS - failedAttempts;
      if (remainingAttempts > 0) {
        attemptsCounter.innerHTML = `Intentos fallidos: <span class="attempts-warning">${failedAttempts}/${MAX_ATTEMPTS}</span> (${remainingAttempts} ${remainingAttempts === 1 ? 'intento' : 'intentos'} restantes)`;
      } else {
        attemptsCounter.innerHTML = `Intentos fallidos: <span class="attempts-warning">${failedAttempts}/${MAX_ATTEMPTS}</span>`;
      }
      attemptsCounter.style.display = 'block';
    } else {
      attemptsCounter.style.display = 'none';
    }
  }

  // Mostrar/ocultar contraseña
  togglePassword.addEventListener("click", () => {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
    togglePassword.textContent = isHidden ? "🙈" : "👁️";
  });

  // Redirección si ya está logueado - VERSIÓN CORREGIDA
  onAuthStateChanged(auth, (user) => {
    if (user && !isRedirecting) {
      isRedirecting = true;
      console.log('Usuario autenticado, redirigiendo...');
      
      resetSecurity();
      showMessage(successMessage, "Redirigiendo al dashboard...");
      
      // Redirección simple y confiable
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);
    }
  });

  // Función de login
  btnLogin.addEventListener("click", async () => {
    if (isRedirecting) return;
    
    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value.trim();
    const keepLogged = document.getElementById("keepLogged").checked;
    
    // Verificar si está bloqueado
    if (lockoutUntil && Date.now() < lockoutUntil) {
      showMessage(errorMessage, "Cuenta temporalmente bloqueada. Por favor espera.");
      return;
    }
    
    if (!email || !password) {
      showMessage(errorMessage, "Por favor completa correo y contraseña.");
      return;
    }
    
    // Mostrar estado de carga
    btnText.style.display = "none";
    btnLoading.style.display = "block";
    btnLogin.disabled = true;
    hideMessage(errorMessage);
    hideMessage(successMessage);
    
    try {
      await signInWithEmailAndPassword(auth, email, password);
      
      // Reiniciar seguridad en login exitoso
      resetSecurity();
      
      if(keepLogged) localStorage.setItem("keepLogged","true");
      else localStorage.removeItem("keepLogged");
      
      showMessage(successMessage, "¡Inicio de sesión exitoso! Redirigiendo...");
      
    } catch(err) { 
      // Incrementar intentos fallidos
      failedAttempts++;
      localStorage.setItem('failedAttempts', failedAttempts.toString());
      
      // Verificar si se alcanzó el máximo de intentos
      if (failedAttempts >= MAX_ATTEMPTS) {
        lockoutUntil = Date.now() + LOCKOUT_DURATION;
        localStorage.setItem('lockoutUntil', lockoutUntil.toString());
        enableLockoutMode();
        startCountdown();
      }
      
      updateAttemptsDisplay();
      showMessage(errorMessage, "Error al iniciar sesión: " + getErrorMessage(err.code));
    } finally {
      // Reiniciar estado del botón (a menos que esté bloqueado)
      if (!lockoutUntil || Date.now() >= lockoutUntil) {
        btnText.style.display = "block";
        btnLoading.style.display = "none";
        btnLogin.disabled = false;
      }
    }
  });

  // Funciones auxiliares
  function showMessage(element, message) {
    element.innerHTML = message;
    element.style.display = "block";
  }
  
  function hideMessage(element) {
    element.style.display = "none";
  }
  
  function getErrorMessage(errorCode) {
    const errorMessages = {
      "auth/invalid-email": "El formato del correo electrónico no es válido.",
      "auth/user-disabled": "Esta cuenta ha sido deshabilitada.",
      "auth/user-not-found": "No existe una cuenta con este correo electrónico.",
      "auth/wrong-password": "La contraseña es incorrecta.",
      "auth/too-many-requests": "Demasiados intentos fallidos. Intenta más tarde."
    };
    
    return errorMessages[errorCode] || "Error desconocido. Intenta nuevamente.";
  }

  // Permitir envío del formulario con Enter
  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      btnLogin.click();
    }
  });

  // Inicializar sistema de seguridad
  initializeSecurity();
</script>
</body>
</html>
</body>
</html>
