<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #ffccf2, #ffe6f5);
      display: flex; 
      justify-content: center; 
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-container {
      background: #fff0f7;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      width: 380px;
      transition: all 0.3s;
    }
    .login-container:hover {
      transform: scale(1.02);
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }
    h1 { color: #ff1a75; margin-bottom: 10px; font-size: 2em; }
    .subtitle { color: #555; margin-bottom: 30px; }
    input {
      padding: 12px; 
      border-radius: 12px; 
      border: 1px solid #ff99cc;
      font-size: 14px; 
      width: 100%;
      margin-bottom: 15px;
      transition: 0.3s;
    }
    input:focus { 
      border-color: #ff3399; 
      outline: none; 
      box-shadow: 0 0 8px rgba(255,51,153,0.4);
    }
    button {
      padding: 12px; 
      background: #ff3399; 
      color: #fff; 
      border: none;
      border-radius: 12px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 15px;
      width: 100%;
      transition: 0.3s;
    }
    button:hover { 
      background: #e60073; 
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255,0,100,0.3);
    }
    a { color: #ff3399; text-decoration: none; }
    a:hover { text-decoration: underline; }
    #mensajeLogin, #mensajeRegister { font-size: 0.9em; color: #ff3399; min-height: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="login-container shadow-lg">
    <h1>🐾 Discovery Pets</h1>
    <p class="subtitle">Bienvenido al sistema de gestión</p>

    <!-- LOGIN -->
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button type="button" id="btnLogin">Iniciar Sesión</button>
      <p id="mensajeLogin"></p>
      <a href="#" id="showRegister">¿No tienes cuenta? Regístrate</a>
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="d-none">
      <input type="email" id="registerEmail" placeholder="Email" required>
      <input type="password" id="registerPassword" placeholder="Contraseña" required>
      <button type="button" id="btnRegister">Registrarse</button>
      <p id="mensajeRegister"></p>
      <a href="#" id="showLogin">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
