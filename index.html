<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets | Login</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container" id="login-container">
    <h2>Inicia sesión</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
      <input type="password" id="loginPass" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>
    <span class="link" id="showRegister">¿No tienes cuenta? Regístrate</span>
  </div>

  <div class="container" id="register-container" style="display:none;">
    <h2>Registro</h2>
    <form id="registerForm">
      <input type="text" id="registerName" placeholder="Nombre completo" required>
      <input type="email" id="registerEmail" placeholder="Correo electrónico" required>
      <input type="password" id="registerPass" placeholder="Contraseña" required>
      <button type="submit">Registrar</button>
    </form>
    <span class="link" id="showLogin">¿Ya tienes cuenta? Inicia sesión</span>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
