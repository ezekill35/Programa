<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Pets - Login</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
</head>
<body class="login-body">

    <div class="container">

        <!-- -------------------- LOGIN -------------------- -->
        <section id="login-section" class="auth-section active">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm" class="formulario">
                <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
                <input type="password" id="loginPassword" placeholder="Contraseña" required>
                <button type="submit">Ingresar</button>
            </form>
            <p>¿No tienes cuenta? <span id="showRegister">Regístrate aquí</span></p>
        </section>

        <!-- -------------------- REGISTRO -------------------- -->
        <section id="register-section" class="auth-section">
            <h2>Registro</h2>
            <form id="registerForm" class="formulario">
                <input type="text" id="regNombre" placeholder="Nombre completo" required>
                <input type="email" id="regEmail" placeholder="Correo electrónico" required>
                <input type="password" id="regPassword" placeholder="Contraseña" required>
                <button type="submit">Registrarse</button>
            </form>
            <p>¿Ya tienes cuenta? <span id="showLogin">Inicia sesión aquí</span></p>
        </section>

    </div>

    <script>
        // Toggle entre login y registro
        const loginSection = document.getElementById("login-section");
        const registerSection = document.getElementById("register-section");
        const showRegister = document.getElementById("showRegister");
        const showLogin = document.getElementById("showLogin");

        showRegister.addEventListener("click", () => {
            loginSection.classList.remove("active");
            registerSection.classList.add("active");
        });

        showLogin.addEventListener("click", () => {
            registerSection.classList.remove("active");
            loginSection.classList.add("active");
        });
    </script>

</body>
</html>
