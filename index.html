<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <div class="login-container">
    <h1>🐾 Discovery Pets</h1>

    <!-- Login -->
    <form id="loginForm" class="form active">
      <h2>Iniciar Sesión</h2>
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button type="button" id="btnLogin">Ingresar</button>
      <p id="mensajeLogin" class="mensaje"></p>
      <p>¿No tienes cuenta? <span id="showRegister">Regístrate aquí</span></p>
    </form>

    <!-- Registro -->
    <form id="registerForm" class="form">
      <h2>Registro de Usuario</h2>
      <input type="email" id="registerEmail" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" placeholder="Contraseña" required>
      <button type="button" id="btnRegister">Registrar</button>
      <p id="mensajeRegister" class="mensaje"></p>
      <p>¿Ya tienes cuenta? <span id="showLogin">Inicia sesión</span></p>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
