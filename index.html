<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🐶 Discovery Pets</h1>
    <p class="subtitle">Bienvenido al sistema de gestión 🐾</p>

    <!-- LOGIN -->
    <form id="loginForm" class="form-card">
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Contraseña">
      <button type="button" id="btnLogin">Iniciar Sesión</button>
      <p id="mensajeLogin" class="mensaje"></p>
      <a href="#" id="showRegister">¿No tienes cuenta? Regístrate</a>
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="form-card hidden">
      <input type="email" id="registerEmail" placeholder="Email">
      <input type="password" id="registerPassword" placeholder="Contraseña">
      <button type="button" id="btnRegister">Registrarse</button>
      <p id="mensajeRegister" class="mensaje"></p>
      <a href="#" id="showLogin">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
