<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://kit.fontawesome.com/a2e0e6ad59.js" crossorigin="anonymous"></script>
</head>
<body class="login-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="card-inner" id="card">

        <!-- Login -->
        <div class="card-face card-front">
          <div class="auth-header">
            <h1>🐶 Discovery Pets</h1>
            <p>Bienvenido al sistema de gestión 🐾</p>
            <h2>Iniciar Sesión</h2>
          </div>
          <input type="email" id="login-username" placeholder="Correo electrónico">
          <div class="password-container">
            <input type="password" id="login-password" placeholder="Contraseña">
            <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
          </div>
          <p class="error-message" id="login-error"></p>
          <button class="primary-btn" onclick="login()">Entrar</button>
          <button class="secondary-btn" onclick="flipCard()">Crear una Cuenta</button>
        </div>

        <!-- Registro -->
        <div class="card-face card-back">
          <div class="auth-header">
            <h1>🐶 Discovery Pets</h1>
            <p>Registro de usuario</p>
            <h2>Crear Cuenta</h2>
          </div>
          <input type="email" id="reg-username" placeholder="Correo electrónico">
          <div class="password-container">
            <input type="password" id="reg-password" placeholder="Contraseña">
            <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('reg-password', this)"></i>
          </div>
          <p class="error-message" id="register-error"></p>
          <p class="success-message" id="register-success"></p>
          <button class="primary-btn" onclick="register()">Registrar</button>
          <button class="secondary-btn" onclick="flipCard()">Volver</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>

  <!-- Configuración Firebase -->
  <script>
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "discovery-pets.firebaseapp.com",
      projectId: "discovery-pets",
      storageBucket: "discovery-pets.appspot.com",
      messagingSenderId: "481355972999",
      appId: "1:481355972999:web:a073cc5af230b32f4c5322",
      measurementId: "G-W5RGYVTW3V"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <!-- Script propio -->
  <script src="script.js"></script>
</body>
</html>
