<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Pets | Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="login-body">

<div class="container">
    <div id="loginDiv" class="auth-box">
        <h2>Inicia sesión</h2>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Correo electrónico" required class="form-control mb-2">
            <input type="password" id="loginPassword" placeholder="Contraseña" required class="form-control mb-2">
            <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
        </form>
        <p class="mt-2">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
    </div>

    <div id="registerDiv" class="auth-box" style="display:none;">
        <h2>Regístrate</h2>
        <form id="registerForm">
            <input type="text" id="registerName" placeholder="Nombre completo" required class="form-control mb-2">
            <input type="email" id="registerEmail" placeholder="Correo electrónico" required class="form-control mb-2">
            <input type="password" id="registerPassword" placeholder="Contraseña" required class="form-control mb-2">
            <button type="submit" class="btn btn-success btn-block">Registrarse</button>
        </form>
        <p class="mt-2">¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
