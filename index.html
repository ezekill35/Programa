<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐾 Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="login-container shadow-lg p-5 rounded-4 text-center">
    <h1 class="text-pink mb-3">🐾 Discovery Pets</h1>
    <p class="subtitle mb-4">Bienvenido al sistema de gestión</p>

    <!-- LOGIN -->
    <form id="loginForm">
      <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Email" required>
      <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Contraseña" required>
      <button type="button" id="btnLogin" class="btn btn-pink w-100 mb-2">Iniciar Sesión</button>
      <p id="mensajeLogin" class="fw-bold"></p>
      <a href="#" id="showRegister">¿No tienes cuenta? Regístrate</a>
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="d-none">
      <input type="email" id="registerEmail" class="form-control mb-3" placeholder="Email" required>
      <input type="password" id="registerPassword" class="form-control mb-3" placeholder="Contraseña" required>
      <button type="button" id="btnRegister" class="btn btn-pink w-100 mb-2">Registrarse</button>
      <p id="mensajeRegister" class="fw-bold"></p>
      <a href="#" id="showLogin">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
