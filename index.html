<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets | Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow login-card">
    <!-- Login -->
    <div id="loginSection">
      <h2 class="text-center mb-3">Inicia sesión</h2>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Correo electrónico" class="form-control mb-2" required>
        <input type="password" id="loginPass" placeholder="Contraseña" class="form-control mb-2" required>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
      <p class="mt-2 text-center">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></p>
    </div>

    <!-- Registro -->
    <div id="registerSection" style="display:none;">
      <h2 class="text-center mb-3">Regístrate</h2>
      <form id="registerForm">
        <input type="text" id="regName" placeholder="Nombre completo" class="form-control mb-2" required>
        <input type="email" id="regEmail" placeholder="Correo electrónico" class="form-control mb-2" required>
        <input type="password" id="regPass" placeholder="Contraseña" class="form-control mb-2" required>
        <button type="submit" class="btn btn-success w-100">Registrarse</button>
      </form>
      <p class="mt-2 text-center">¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></p>
    </div>
  </div>
</div>

<!-- Firebase 7.20.0 -->
<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
