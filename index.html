<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Login</title>
<style>
body { 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  min-height:100vh; 
  background: linear-gradient(135deg, #ffe0f0, #ffb3d9); 
  font-family: 'Poppins', sans-serif; 
  margin:0;
}
.container { 
  background:#fff; 
  padding:30px; 
  border-radius:20px; 
  width:350px; 
  box-shadow:10px 10px 30px rgba(0,0,0,0.2); 
  text-align:center; 
  animation:fadeIn 0.8s ease;
}
@keyframes fadeIn { from {opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);} }

.container img { 
  width:120px; 
  margin-bottom:15px; 
}

.container h1 { 
  color:#ff3399; 
  margin-bottom:20px; 
}

.container input { 
  width:100%; 
  padding:10px; 
  margin:8px 0; 
  border-radius:8px; 
  border:1px solid #ccc; 
  transition:0.3s;
}
.container input:focus { 
  border-color:#ff3399; 
  box-shadow:0 0 10px rgba(255,51,153,0.3);
}

.container button { 
  width:100%; 
  padding:12px; 
  background:#ff3399; 
  color:#fff; 
  border:none; 
  border-radius:8px; 
  cursor:pointer; 
  font-weight:600; 
  transition:0.3s;
}
.container button:hover { 
  background:#ff66cc; 
  transform:scale(1.03);
}

#mensaje { 
  margin-top:10px; 
}
</style>
</head>
<body>
<div class="container">
    <img src="https://static.wixstatic.com/media/ba54dd_7c82d35c6b0142b48d51bf0641564791~mv2.png/v1/fit/w_2500,h_1330,al_c/ba54dd_7c82d35c6b0142b48d51bf0641564791~mv2.png" alt="Logo Discovery Pets" style="width:120px; display:block; margin:0 auto 10px auto;">
    <h1>Discovery Pets</h1>

    <div id="formLogin">
        <input id="emailLogin" type="email" placeholder="Correo" required>
        <input id="passLogin" type="password" placeholder="Contraseña" required>
        <button id="btnLogin">Iniciar sesión</button>
    </div>

    <p id="mensaje" style="color:red;"></p>
</div>
<script type="module" src="script.js"></script>
</body>
</html>
