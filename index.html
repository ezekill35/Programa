<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Acceso</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fuente y estilo -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #ffe6ff, #cc99ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
    }
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 400px;
      text-align: center;
      animation: pop 0.6s ease-in-out;
    }
    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .btn-primary {
      background: linear-gradient(90deg, #cc33ff, #9933ff);
      border: none;
      transition: 0.3s;
    }
    .btn-primary:hover {
      transform: scale(1.05);
      background: linear-gradient(90deg, #9933ff, #6600cc);
    }
    .toggle-link {
      color: #9933ff;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2 class="mb-4">🐾 Discovery Pets</h2>

    <!-- Formulario de Login -->
    <form id="loginForm">
      <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Contraseña" required>
      <button type="button" id="btnLogin" class="btn btn-primary w-100 mb-2">Iniciar sesión</button>
      <p id="mensajeLogin" class="text-danger"></p>
      <p>¿No tienes cuenta? <span id="showRegister" class="toggle-link">Regístrate aquí</span></p>
    </form>

    <!-- Formulario de Registro -->
    <form id="registerForm" class="d-none">
      <input type="email" id="registerEmail" class="form-control mb-3" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" class="form-control mb-3" placeholder="Contraseña" required>
      <button type="button" id="btnRegister" class="btn btn-primary w-100 mb-2">Registrarse</button>
      <p id="mensajeRegister" class="text-danger"></p>
      <p>¿Ya tienes cuenta? <span id="showLogin" class="toggle-link">Inicia sesión</span></p>
    </form>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
