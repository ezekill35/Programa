<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="auth-card p-5 shadow-lg rounded-4 bg-white" style="width: 380px; perspective:1000px;">
    <div class="card-inner position-relative" id="auth-card-inner" style="transition: transform 0.8s; transform-style: preserve-3d;">
      
      <!-- LOGIN -->
      <div class="card-face card-front position-absolute w-100 h-100 backface-hidden">
        <h2 class="text-center mb-4 text-warning">🐶 Discovery Pets</h2>
        <input type="text" id="login-username" class="form-control mb-3" placeholder="Correo electrónico">
        <div class="password-container mb-3">
          <input type="password" id="login-password" class="form-control" placeholder="Contraseña">
          <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
        </div>
        <p class="text-danger" id="login-error"></p>
        <button class="btn btn-warning w-100 mb-2" onclick="login()">Entrar</button>
        <button class="btn btn-outline-secondary w-100" onclick="flipCard()">Crear Cuenta</button>
      </div>

      <!-- REGISTRO -->
      <div class="card-face card-back position-absolute w-100 h-100 backface-hidden" style="transform: rotateY(180deg);">
        <h2 class="text-center mb-4 text-warning">Crear Cuenta</h2>
        <input type="text" id="reg-username" class="form-control mb-3" placeholder="Correo electrónico">
        <div class="password-container mb-3">
          <input type="password" id="reg-password" class="form-control" placeholder="Contraseña">
          <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('reg-password', this)"></i>
        </div>
        <p class="text-danger" id="register-error"></p>
        <p class="text-success" id="register-success"></p>
        <button class="btn btn-warning w-100 mb-2" onclick="register()">Registrar</button>
        <button class="btn btn-outline-secondary w-100" onclick="flipCard()">Ya tengo cuenta</button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="script.js"></script>
<script>
  function flipCard() {
    document.getElementById("auth-card-inner").classList.toggle("is-flipped");
  }
</script>
</body>
</html>
