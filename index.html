<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐶 Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🐶 Discovery Pets</h1>
    <p class="subtitle">Bienvenido al sistema de gestión 🐾</p>

    <!-- Login -->
    <div class="form-card" id="loginForm">
      <h2>Iniciar Sesión</h2>
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button id="btnLogin">Entrar</button>
      <p class="mensaje" id="mensajeLogin"></p>
      <p>¿No tienes cuenta? <a href="#" id="showRegister">Crear una Cuenta</a></p>
    </div>

    <!-- Registro -->
    <div class="form-card hidden" id="registerForm">
      <h2>Registro</h2>
      <input type="email" id="registerEmail" placeholder="Correo electrónico" required>
      <input type="password" id="registerPassword" placeholder="Contraseña" required>
      <button id="btnRegister">Registrar</button>
      <p class="mensaje" id="mensajeRegister"></p>
      <p>¿Ya tienes cuenta? <a href="#" id="showLogin">Entrar</a></p>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
