<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Discovery Pets · Acceso</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #10bcd4;
      --accent-dark: #0aa2bb;
      --bg: linear-gradient(135deg, #eaf9ff 0%, #f8fdff 100%);
      --glass: rgba(255,255,255,0.85);
      --shadow-lg: 0 12px 28px rgba(16,188,212,0.25);
      --shadow-md: 0 6px 18px rgba(16,188,212,0.12);
      --text-dark: #0f172a;
      --text-muted: #6b7280;
    }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; margin:0; padding:0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
    }
    .container {
      width: 400px;
      padding: 36px 32px;
      border-radius: 24px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-lg);
      text-align: center;
      animation: floatIn 0.6s ease;
      position: relative;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(40px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), #55d1e2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: white;
      box-shadow: var(--shadow-lg);
    }
    h1 {
      font-weight: 800;
      font-size: 26px;
      color: var(--text-dark);
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: var(--shadow-md);
      font-size: 14px;
      transition: all 0.2s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(16,188,212,0.15);
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(16,188,212,0.25);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      background: var(--accent-dark);
      box-shadow: 0 8px 26px rgba(16,188,212,0.35);
    }
    .helper-text {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 12px;
    }
    .paw-icon {
      position: absolute;
      top: -20px;
      right: -20px;
      font-size: 48px;
      color: rgba(16,188,212,0.15);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="paw-icon">🐾</div>
    <div class="logo">DP</div>
    <h1>Discovery Pets</h1>
    <p class="subtitle">Panel administrativo</p>

    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button id="btnLogin">Iniciar sesión</button>
      <p class="helper-text">Ingresa tus credenciales para acceder</p>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const btnLogin = document.getElementById("btnLogin");

    btnLogin.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      if (!email || !password) return alert("Ingrese correo y contraseña");
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        alert("Error al iniciar sesión: " + err.message);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user && window.location.pathname.indexOf("dashboard.html") === -1) {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
