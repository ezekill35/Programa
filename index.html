<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🐶 Discovery Pets - Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ================== RESET ================== */
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ffe6f0; /* fucsia claro */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* ================== LOGIN BOX ================== */
    .login-container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      text-align: center;
      width: 360px;
    }

    .login-container img {
      width: 120px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .login-container h1 {
      font-size: 28px;
      color: #ff00ff;
      margin-bottom: 5px;
    }

    .login-container .subtitle {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .login-container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      border:none;
      border-radius:6px;
      background:#ff00ff;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .login-container button:hover { background:#cc00cc; }

    .login-container p { margin-top:10px; font-size:14px; color:#555; }
    .login-container a { color:#ff00ff; text-decoration:none; }
    .login-container a:hover { text-decoration:underline; }

    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="https://cdn.pixabay.com/photo/2017/09/25/13/12/cat-2784220_1280.jpg" alt="Gato">
    <h1>🐾 Discovery Pets</h1>
    <p class="subtitle">Bienvenido al sistema de gestión</p>

    <!-- LOGIN -->
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Contraseña">
      <button type="button" id="btnLogin">Iniciar Sesión</button>
      <p id="mensajeLogin"></p>
      <a href="#" id="showRegister">¿No tienes cuenta? Regístrate</a>
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="hidden">
      <input type="email" id="registerEmail" placeholder="Email">
      <input type="password" id="registerPassword" placeholder="Contraseña">
      <button type="button" id="btnRegister">Registrarse</button>
      <p id="mensajeRegister"></p>
      <a href="#" id="showLogin">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>

  <!-- Firebase -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
