<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery Pets | Login</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-5">
        <!-- Login -->
        <div id="loginBox" class="card p-4 shadow">
          <h3 class="text-center mb-4">Inicia Sesión</h3>
          <form id="formLogin">
            <input type="email" id="emailLogin" class="form-control mb-3" placeholder="Correo electrónico" required>
            <input type="password" id="passwordLogin" class="form-control mb-3" placeholder="Contraseña" required>
            <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
          </form>
          <p class="text-center mt-3">
            ¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a>
          </p>
        </div>

        <!-- Register -->
        <div id="registerBox" class="card p-4 shadow d-none">
          <h3 class="text-center mb-4">Registrarse</h3>
          <form id="formRegister">
            <input type="text" id="nombreRegister" class="form-control mb-3" placeholder="Nombre completo" required>
            <input type="email" id="emailRegister" class="form-control mb-3" placeholder="Correo electrónico" required>
            <input type="password" id="passwordRegister" class="form-control mb-3" placeholder="Contraseña" required>
            <button type="submit" class="btn btn-success btn-block">Registrar</button>
          </form>
          <p class="text-center mt-3">
            ¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase v7.20.0 -->
  <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.20.0/firebase-firestore.js"></script>
  <script src="firebase.js"></script>
  <script src="script.js"></script>
</body>
</html>
