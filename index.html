<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discovery Pets - Login</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background:#ff00ff; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0;}
.container { background:#fff; padding:30px; border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.2); width:350px; text-align:center;}
.container h1 { color:#1abc9c; margin-bottom:20px;}
.container input { width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #ccc;}
.container button { width:100%; padding:12px; border:none; border-radius:6px; background:#1abc9c; color:#fff; font-size:16px; cursor:pointer; margin:5px 0;}
.container button:hover{background:#16a085;}
.switch { font-size:13px; color:#666; cursor:pointer; margin-top:10px; display:block;}
</style>
</head>
<body>

<div class="container">
    <h1>🐾 Discovery Pets</h1>

    <!-- LOGIN -->
    <form id="form-login">
        <input id="emailLogin" type="email" placeholder="Correo">
        <input id="passLogin" type="password" placeholder="Contraseña">
        <button id="btnLogin" type="submit">Iniciar Sesión</button>
        <span id="showRegister" class="switch">¿No tienes cuenta? Regístrate</span>
    </form>

    <!-- REGISTER -->
    <form id="form-register" style="display:none;">
        <input id="emailReg" type="email" placeholder="Correo">
        <input id="passReg" type="password" placeholder="Contraseña">
        <button id="btnRegister" type="submit">Registrar</button>
        <span id="showLogin" class="switch">¿Ya tienes cuenta? Inicia sesión</span>
    </form>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
