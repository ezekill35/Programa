<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discovery Pets · Acceso</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  /* Cache busting for CSS */
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body, html { 
    width:100%; 
    height:100%; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    background:#f5f8fa;
    overflow: hidden;
  }
  
  .login-wrapper { 
    width:90%; 
    max-width:1000px; 
    background:#fff; 
    border-radius:16px; 
    box-shadow:0 8px 32px rgba(0,0,0,0.09); 
    display:flex; 
    min-height:520px; 
    overflow:hidden; 
  }
  
  .login-form { 
    flex:1; 
    padding:48px; 
    display:flex; 
    flex-direction:column; 
    justify-content:center; 
    gap:12px; 
  }
  
  .logo { 
    font-size:36px; 
    font-weight:800; 
    background: linear-gradient(90deg, #FF9E7D, #FF6B95);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align:center; 
    margin-bottom:8px; 
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  
  .logo::before {
    content: '🐾';
    font-size: 32px;
  }
  
  .logo::after {
    content: '🐾';
    font-size: 32px;
  }
  
  h2 { font-size:26px; color:#111827; text-align:center; margin-bottom:6px; }
  .subtitle { color:#6b7280; font-size:14px; text-align:center; margin-bottom:22px; }
  .input-group { position:relative; width:100%; }
  
  input { 
    width:100%; 
    padding:14px 16px; 
    border:2px solid #e6e9ee; 
    border-radius:12px; 
    font-size:15px; 
    background:#fafafa; 
    transition:all 0.3s ease; 
  }
  
  input:focus { 
    outline:none; 
    border-color:#FF6B95; 
    box-shadow:0 0 0 4px rgba(255, 107, 149, 0.1); 
    background:#fff; 
  }
  
  .toggle-password { 
    position:absolute; 
    right:14px; 
    top:50%; 
    transform:translateY(-50%); 
    cursor:pointer; 
    font-size:16px; 
    color:#6b7280; 
    transition: all 0.3s ease;
    background: rgba(255,255,255,0.8);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .toggle-password:hover { 
    color:#FF6B95; 
    transform: translateY(-50%) scale(1.1);
  }
  
  .actions { display:flex; align-items:center; justify-content:space-between; font-size:13px; color:#6b7280; margin:6px 0 12px; }
  
  .btn-login { 
    padding:14px; 
    border:none; 
    border-radius:12px; 
    background:linear-gradient(135deg, #FF9E7D 0%, #FF6B95 100%); 
    color:white; 
    font-size:15px; 
    font-weight:600; 
    cursor:pointer; 
    transition:all 0.3s ease; 
    position: relative;
    overflow: hidden;
  }
  
  .btn-login::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
  }
  
  .btn-login:hover::before {
    left: 100%;
  }
  
  .btn-login:hover { 
    transform:translateY(-2px); 
    box-shadow:0 8px 24px rgba(255, 107, 149, 0.18); 
  }
  
  .btn-login:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  
  .helper { margin-top:14px; font-size:13px; color:#6b7280; text-align:center; }
  
  .login-image { 
    flex:1; 
    position:relative; 
    background: 
      radial-gradient(circle at 30% 70%, rgba(255,158,125,0.2) 0%, transparent 50%),
      radial-gradient(circle at 70% 30%, rgba(79,209,197,0.2) 0%, transparent 50%),
      url('https://images.pexels.com/photos/416160/pexels-photo-416160.jpeg') center/cover no-repeat; 
  }
  
  .login-image::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255, 158, 125, 0.1) 0%, rgba(255, 107, 149, 0.1) 100%);
    z-index: 1;
  }
  
  .login-image::after { 
    content:""; 
    position:absolute; 
    inset:0; 
    background:linear-gradient(135deg, rgba(16, 188, 212, 0.3) 0%, rgba(56, 189, 248, 0.3) 100%); 
    z-index: 1;
  }
  
  .login-image .text-overlay { 
    position:absolute; 
    bottom:36px; 
    left:36px; 
    color:white; 
    font-size:24px; 
    font-weight:700; 
    line-height:1.2; 
    z-index:2; 
    max-width:420px; 
    text-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  
  .attempts-counter {
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin: 5px 0;
    padding: 8px;
    background: rgba(255,255,255,0.7);
    border-radius: 8px;
    display: none;
  }
  
  .attempts-warning {
    color: #e74c3c;
    font-weight: 600;
  }
  
  .loading {
    display: none;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
    margin: 0 auto;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .error-message {
    color: #e74c3c;
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
    display: none;
    padding: 10px;
    background: rgba(231, 76, 60, 0.1);
    border-radius: 8px;
    border-left: 3px solid #e74c3c;
  }
  
  .success-message {
    color: #2ecc71;
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
    display: none;
    padding: 10px;
    background: rgba(46, 204, 113, 0.1);
    border-radius: 8px;
    border-left: 3px solid #2ecc71;
  }
  
  .lockout-message {
    color: #e67e22;
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
    display: none;
    padding: 12px;
    background: rgba(230, 126, 34, 0.1);
    border-radius: 8px;
    border-left: 3px solid #e67e22;
    line-height: 1.5;
  }
  
  .countdown {
    font-weight: 700;
    font-size: 14px;
    color: #e74c3c;
  }
  
  @media (max-width:840px){ 
    .login-wrapper { flex-direction:column; max-width:720px; } 
    .login-image { height:220px; } 
    .login-form { padding:28px; } 
  }
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-form" role="main" aria-labelledby="login-title">
    <div class="logo">DP</div>
    <h2 id="login-title">Bienvenido a Discovery Pets</h2>
    <div class="subtitle">Accede al panel administrativo</div>
    
    <input id="email" type="email" placeholder="Correo electrónico" autocomplete="username" required>
    
    <div class="input-group">
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <span id="togglePassword" class="toggle-password">👁️</span>
    </div>
    
    <div id="attemptsCounter" class="attempts-counter"></div>
    
    <div class="actions">
      <label style="display:flex;align-items:center;gap:8px;">
        <input id="keepLogged" type="checkbox"> Mantener sesión
      </label>
    </div>
    
    <button id="btnLogin" class="btn-login">
      <span id="btnText">Iniciar sesión</span>
      <div id="btnLoading" class="loading"></div>
    </button>
    
    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>
    <div id="lockoutMessage" class="lockout-message"></div>
    
    <p class="helper">Si no tienes acceso, contacta al administrador del sistema.</p>
  </div>
  
  <div class="login-image" role="presentation">
    <div class="text-overlay"></div>
  </div>
</div>

<script>
  // AGGRESSIVE CACHE CLEARING
  console.log('=== CACHE BUSTING ACTIVATED ===');
  
  // Clear all storage
  try {
    localStorage.clear();
    sessionStorage.clear();
    
    // Clear cookies
    document.cookie.split(";").forEach(function(c) {
      document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
    });
    
    console.log('All storage cleared successfully');
  } catch (e) {
    console.log('Storage clearing failed:', e);
  }
  
  // Force reload without cache if coming from redirect loop
  if (performance.navigation.type === 2 || performance.getEntriesByType("navigation")[0]?.type === 'back_forward') {
    console.log('Detected back/forward navigation, forcing cache clear');
    window.location.reload(true);
  }
</script>

<script type="module">
  console.log('=== FIREBASE AUTH INITIALIZATION ===');
  
  // Import Firebase with cache busting
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    onAuthStateChanged,
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCIo7CBX5jzAGlDFBu0mMb6BFfUsecaf7I",
    authDomain: "discovery-pets.firebaseapp.com",
    databaseURL: "https://discovery-pets-default-rtdb.firebaseio.com",
    projectId: "discovery-pets",
    storageBucket: "discovery-pets.appspot.com",
    messagingSenderId: "481355972999",
    appId: "1:481355972999:web:5f5fa07f75b3fc9f4c5322"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig, 'DiscoveryPetsLogin-' + Date.now());
  const auth = getAuth(app);

  const btnLogin = document.getElementById("btnLogin");
  const togglePassword = document.getElementById("togglePassword");
  const passwordInput = document.getElementById("password");
  const btnText = document.getElementById("btnText");
  const btnLoading = document.getElementById("btnLoading");
  const errorMessage = document.getElementById("errorMessage");
  const successMessage = document.getElementById("successMessage");
  const lockoutMessage = document.getElementById("lockoutMessage");
  const attemptsCounter = document.getElementById("attemptsCounter");

  // Security configuration
  const MAX_ATTEMPTS = 4;
  const LOCKOUT_DURATION = 5 * 60 * 1000;
  let failedAttempts = 0;
  let lockoutUntil = null;
  let redirectInProgress = false;
  let authChecked = false;

  // Initialize from localStorage
  function initializeSecurity() {
    const savedAttempts = localStorage.getItem('failedAttempts');
    const savedLockout = localStorage.getItem('lockoutUntil');
    
    if (savedAttempts) {
      failedAttempts = parseInt(savedAttempts);
    }
    
    if (savedLockout) {
      lockoutUntil = parseInt(savedLockout);
      checkLockoutStatus();
    }
    
    updateAttemptsDisplay();
  }

  // Check if user is currently locked out
  function checkLockoutStatus() {
    if (lockoutUntil && Date.now() < lockoutUntil) {
      enableLockoutMode();
      startCountdown();
    } else if (lockoutUntil && Date.now() >= lockoutUntil) {
      resetSecurity();
    }
  }

  // Enable lockout mode
  function enableLockoutMode() {
    btnLogin.disabled = true;
    document.getElementById('email').disabled = true;
    document.getElementById('password').disabled = true;
    hideMessage(errorMessage);
    hideMessage(successMessage);
    
    const remainingTime = Math.ceil((lockoutUntil - Date.now()) / 1000 / 60);
    showMessage(lockoutMessage, `🔒 Demasiados intentos fallidos. Por seguridad, tu cuenta ha sido bloqueada temporalmente. <br>Podrás intentar nuevamente en <span class="countdown">${remainingTime}</span> minutos.`);
  }

  // Start countdown timer
  function startCountdown() {
    const countdownElement = lockoutMessage.querySelector('.countdown');
    const countdownInterval = setInterval(() => {
      const remainingSeconds = Math.ceil((lockoutUntil - Date.now()) / 1000);
      
      if (remainingSeconds <= 0) {
        clearInterval(countdownInterval);
        resetSecurity();
        return;
      }
      
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      countdownElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }, 1000);
  }

  // Reset security measures
  function resetSecurity() {
    failedAttempts = 0;
    lockoutUntil = null;
    localStorage.removeItem('failedAttempts');
    localStorage.removeItem('lockoutUntil');
    
    btnLogin.disabled = false;
    document.getElementById('email').disabled = false;
    document.getElementById('password').disabled = false;
    
    hideMessage(lockoutMessage);
    updateAttemptsDisplay();
  }

  // Update attempts counter display
  function updateAttemptsDisplay() {
    if (failedAttempts > 0) {
      const remainingAttempts = MAX_ATTEMPTS - failedAttempts;
      if (remainingAttempts > 0) {
        attemptsCounter.innerHTML = `Intentos fallidos: <span class="attempts-warning">${failedAttempts}/${MAX_ATTEMPTS}</span> (${remainingAttempts} ${remainingAttempts === 1 ? 'intento' : 'intentos'} restantes)`;
      } else {
        attemptsCounter.innerHTML = `Intentos fallidos: <span class="attempts-warning">${failedAttempts}/${MAX_ATTEMPTS}</span>`;
      }
      attemptsCounter.style.display = 'block';
    } else {
      attemptsCounter.style.display = 'none';
    }
  }

  // Mostrar / ocultar contraseña
  togglePassword.addEventListener("click", () => {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
    togglePassword.textContent = isHidden ? "🙈" : "👁️";
  });

  // FIXED AUTH STATE HANDLER - PREVENTS LOOPS
  onAuthStateChanged(auth, (user) => {
    console.log('Auth state changed - User:', user ? 'YES' : 'NO', 'Redirect in progress:', redirectInProgress);
    
    if (user && !redirectInProgress && !authChecked) {
      authChecked = true;
      redirectInProgress = true;
      
      console.log('🔄 Valid user detected, starting redirect process...');
      
      resetSecurity();
      showMessage(successMessage, "✅ Redirigiendo al dashboard...");
      
      // Use multiple redirect methods for reliability
      const redirectToDashboard = () => {
        console.log('🚀 Executing redirect to dashboard...');
        
        // Method 1: Standard redirect
        window.location.href = "dashboard.html";
        
        // Method 2: Backup with replace (after delay)
        setTimeout(() => {
          if (window.location.href.includes('index.html')) {
            console.log('🔄 Backup redirect triggered');
            window.location.replace("dashboard.html");
          }
        }, 2000);
        
        // Method 3: Force redirect (last resort)
        setTimeout(() => {
          if (window.location.href.includes('index.html')) {
            console.log('🔧 Force redirect triggered');
            window.location.href = "dashboard.html?force=" + Date.now();
          }
        }, 4000);
      };
      
      // Small delay to show success message
      setTimeout(redirectToDashboard, 500);
    } else if (!user) {
      authChecked = true;
      console.log('👤 No user logged in, showing login form');
    }
  });

  // Login function
  btnLogin.addEventListener("click", async () => {
    if (redirectInProgress) {
      console.log('⏳ Redirect in progress, ignoring login attempt');
      return;
    }
    
    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value.trim();
    const keepLogged = document.getElementById("keepLogged").checked;
    
    // Check if user is locked out
    if (lockoutUntil && Date.now() < lockoutUntil) {
      showMessage(errorMessage, "Cuenta temporalmente bloqueada. Por favor espera.");
      return;
    }
    
    if (!email || !password) {
      showMessage(errorMessage, "Por favor completa correo y contraseña.");
      return;
    }
    
    // Show loading state
    btnText.style.display = "none";
    btnLoading.style.display = "block";
    btnLogin.disabled = true;
    hideMessage(errorMessage);
    hideMessage(successMessage);
    
    try {
      console.log('🔐 Attempting login for:', email);
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      console.log('✅ Login successful:', userCredential.user.email);
      
      // Reset security on successful login
      resetSecurity();
      
      if(keepLogged) {
        localStorage.setItem("keepLogged","true");
      } else {
        localStorage.removeItem("keepLogged");
      }
      
      showMessage(successMessage, "✅ ¡Inicio de sesión exitoso! Redirigiendo...");
      
    } catch(err) { 
      console.error('❌ Login error:', err);
      
      // Increment failed attempts
      failedAttempts++;
      localStorage.setItem('failedAttempts', failedAttempts.toString());
      
      // Check if max attempts reached
      if (failedAttempts >= MAX_ATTEMPTS) {
        lockoutUntil = Date.now() + LOCKOUT_DURATION;
        localStorage.setItem('lockoutUntil', lockoutUntil.toString());
        enableLockoutMode();
        startCountdown();
      }
      
      updateAttemptsDisplay();
      showMessage(errorMessage, "❌ Error al iniciar sesión: " + getErrorMessage(err.code));
    } finally {
      // Reset button state (unless locked out)
      if (!lockoutUntil || Date.now() >= lockoutUntil) {
        btnText.style.display = "block";
        btnLoading.style.display = "none";
        btnLogin.disabled = false;
      }
    }
  });

  // Helper functions
  function showMessage(element, message) {
    element.innerHTML = message;
    element.style.display = "block";
  }
  
  function hideMessage(element) {
    element.style.display = "none";
  }
  
  function getErrorMessage(errorCode) {
    const errorMessages = {
      "auth/invalid-email": "El formato del correo electrónico no es válido.",
      "auth/user-disabled": "Esta cuenta ha sido deshabilitada.",
      "auth/user-not-found": "No existe una cuenta con este correo electrónico.",
      "auth/wrong-password": "La contraseña es incorrecta.",
      "auth/too-many-requests": "Demasiados intentos fallidos. Intenta más tarde."
    };
    
    return errorMessages[errorCode] || "Error desconocido. Intenta nuevamente.";
  }

  // Allow form submission with Enter key
  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      btnLogin.click();
    }
  });

  // Initialize security system
  initializeSecurity();
  
  // Final safety check - if user is logged in but stuck, force redirect
  setTimeout(() => {
    auth.currentUser.then(user => {
      if (user && window.location.href.includes('index.html') && !redirectInProgress) {
        console.log('🔧 Safety redirect triggered');
        redirectInProgress = true;
        window.location.href = "dashboard.html?safety=" + Date.now();
      }
    }).catch(err => {
      console.log('Safety check error:', err);
    });
  }, 3000);

  console.log('✅ Login page initialized successfully');
</script>
</body>
</html>
