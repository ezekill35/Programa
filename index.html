<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discovery Pets · Acceso</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body, html {
      width: 100%; height: 100%;
      background: #f5f8fa;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrapper {
      width: 90%;
      max-width: 900px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      min-height: 500px;
    }
    .login-form {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-form .logo {
      font-size: 36px;
      font-weight: 800;
      color: #10bcd4;
      text-align: center;
      margin-bottom: 24px;
    }
    .login-form h2 {
      font-size: 24px;
      color: #1f2937;
      margin-bottom: 16px;
      text-align: center;
    }
    .login-form p.subtitle {
      color: #6b7280;
      font-size: 14px;
      text-align: center;
      margin-bottom: 32px;
    }
    .login-form input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-form input:focus {
      border-color: #10bcd4;
      box-shadow: 0 0 0 4px rgba(16,188,212,0.15);
      outline: none;
    }
    .login-form button {
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #10bcd4, #38bdf8);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .login-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16,188,212,0.25);
    }
    .login-form .helper {
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }
    .login-form .helper a {
      color: #10bcd4;
      text-decoration: none;
    }
    .login-form .helper a:hover {
      text-decoration: underline;
    }
    .login-image {
      flex: 1;
      position: relative;
      background: url('https://images.pexels.com/photos/416160/pexels-photo-416160.jpeg') center center / cover no-repeat;
      /* puedes cambiar por una imagen propia o ilustración */
    }
    .login-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.2);
    }
    .login-image .text-overlay {
      position: absolute;
      bottom: 32px;
      left: 32px;
      color: white;
      font-size: 24px;
      font-weight: 600;
      z-index: 2;
      line-height: 1.3;
    }
    @media (max-width: 768px) {
      .login-wrapper {
        flex-direction: column;
      }
      .login-image {
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-form">
      <div class="logo">🐾 DP</div>
      <h2>Bienvenido</h2>
      <p class="subtitle">Ingresa para continuar al panel</p>
      <input type="email" id="email" placeholder="Correo electrónico" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button id="btnLogin">Iniciar sesión</button>
      <p class="helper"><a href="#">¿Olvidaste tu contraseña?</a></p>
    </div>
    <div class="login-image">
      <div class="text-overlay"> <br></div>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const btnLogin = document.getElementById("btnLogin");

    btnLogin.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) {
        alert("Ingrese correo y contraseña");
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        alert("Error al iniciar sesión: " + err.message);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user && !window.location.pathname.includes("dashboard.html")) {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
