name: Deploy Static Site

# Se ejecuta cada vez que hay un push a main
on:
  push:
    branches:
      - main

# ⚠️ Permisos necesarios para evitar el error
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Clona el repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Subir todo el contenido como artefacto de Pages
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .  # Todo el repo se considera sitio estático

      # Desplegar a GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

